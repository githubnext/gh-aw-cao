name: Dependabot
description: Durable repository-scoped Dependabot update planning with human-consumption evidence.
min-version: v0.89.17
experimental: true
includes:
  - ../aw.yml
  - .github/workflows/dependabot.md
  - .github/workflows/dependabot-update-planner.md
resources:
  - source: cao.json
    destination: .github/aw/dependabot/cao.json
  - source: dashboard.json
    destination: .github/aw/dashboards/dependabot.json
  - source: .github/graders/dependabot-update-planner-operational-value.sh
    destination: .github/aw/dependabot/graders/dependabot-update-planner-operational-value.sh