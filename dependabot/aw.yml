name: Dependabot
description: Immutable workflow for manifest-aware, risk-ranked dependency release-train updates.
min-version: v0.89.6
experimental: true
includes:
  - .github/workflows/dependabot.md
  - .github/workflows/dependabot-release-train-updater.md
resources:
  - source: dashboard.json
    destination: .github/aw/dashboards/dependabot.json
  - source: .github/graders/dependabot-release-train-updater-operational-value.sh
    destination: .github/aw/dependabot/graders/dependabot-release-train-updater-operational-value.sh