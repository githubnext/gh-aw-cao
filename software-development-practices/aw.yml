    destination: .github/aw/software-development-practices/software-development-guidance-operational-value-runtime.bash
  - source: .github/graders/software-development-practices-github-well-architected-operational-value.sh
    destination: .github/aw/software-development-practices/graders/software-development-practices-github-well-architected-operational-value.sh
  - source: .github/graders/software-development-practices-nist-ssdf-operational-value.sh
    destination: .github/aw/software-development-practices/graders/software-development-practices-nist-ssdf-operational-value.sh
