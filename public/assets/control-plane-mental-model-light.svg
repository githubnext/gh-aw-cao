<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title description" data-visual-kind="diagram" data-visual-id="control-plane-mental-model">
  <title id="title">Central Agentic Ops mental model</title>
  <desc id="description">A catalog release enters a private control repository, where an orchestrator selects and dispatches work to a worker that emits declared safe outputs in review or live mode.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0L10 4L0 8Z" fill="#0969da"/>
    </marker>
  </defs>

  <rect width="1200" height="560" fill="#f2f5f3"/>
  <text x="600" y="52" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="24" font-weight="700" fill="#101411">From catalog release to bounded operation</text>
  <text x="600" y="82" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="16" fill="#232925">The central repository owns selection, execution, and rollout policy.</text>

  <g data-node="catalog-release">
    <rect x="40" y="196" width="210" height="128" rx="12" fill="#ffffff" stroke="#b6bfb8" stroke-width="2"/>
    <text x="145" y="242" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="18" font-weight="700" fill="#101411">Catalog release</text>
    <text x="145" y="273" text-anchor="middle" font-family="Mona Sans Mono, ui-monospace, monospace" font-size="16" fill="#232925">pinned package</text>
    <text x="145" y="299" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="16" fill="#232925">versioned source</text>
  </g>

  <path d="M250 260H302" fill="none" stroke="#0969da" stroke-width="3" marker-end="url(#arrow)"/>

  <g data-node="private-control-repository">
    <text x="352" y="158" font-family="Mona Sans, system-ui, sans-serif" font-size="18" font-weight="700" fill="#08872b">PRIVATE CONTROL REPOSITORY</text>
    <text x="352" y="185" font-family="Mona Sans, system-ui, sans-serif" font-size="16" fill="#232925">Policy, credentials, and workflow definitions stay central</text>
  </g>

  <g data-node="orchestrator">
    <rect x="352" y="224" width="218" height="144" rx="12" fill="#f2f5f3" stroke="#b6bfb8" stroke-width="2"/>
    <circle cx="388" cy="260" r="16" fill="#08872b"/>
    <text x="388" y="266" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">1</text>
    <text x="416" y="266" font-family="Mona Sans, system-ui, sans-serif" font-size="18" font-weight="700" fill="#101411">Orchestrator</text>
    <text x="376" y="307" font-family="Mona Sans, system-ui, sans-serif" font-size="16" fill="#232925">Select and rank</text>
    <text x="376" y="334" font-family="Mona Sans, system-ui, sans-serif" font-size="16" fill="#232925">Limit and dispatch</text>
  </g>

  <path d="M570 296H616" fill="none" stroke="#0969da" stroke-width="3" marker-end="url(#arrow)"/>

  <g data-node="worker">
    <rect x="634" y="224" width="214" height="144" rx="12" fill="#f2f5f3" stroke="#b6bfb8" stroke-width="2"/>
    <circle cx="670" cy="260" r="16" fill="#08872b"/>
    <text x="670" y="266" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">2</text>
    <text x="698" y="266" font-family="Mona Sans, system-ui, sans-serif" font-size="18" font-weight="700" fill="#101411">Worker</text>
    <text x="658" y="307" font-family="Mona Sans, system-ui, sans-serif" font-size="16" fill="#232925">Inspect one target</text>
    <text x="658" y="334" font-family="Mona Sans, system-ui, sans-serif" font-size="16" fill="#232925">Emit safe outputs</text>
  </g>

  <path d="M880 296H922" fill="none" stroke="#0969da" stroke-width="3" marker-end="url(#arrow)"/>

  <g data-node="rollout-modes">
    <text x="1050" y="200" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="18" font-weight="700" fill="#101411">Declared outputs</text>
    <rect x="972" y="254" width="156" height="44" rx="8" fill="#e4ebe6" stroke="#909692"/>
    <text x="1050" y="282" text-anchor="middle" font-family="Mona Sans Mono, ui-monospace, monospace" font-size="16" fill="#101411">review</text>
    <rect x="972" y="324" width="156" height="44" rx="8" fill="#e4ebe6" stroke="#909692"/>
    <text x="1050" y="352" text-anchor="middle" font-family="Mona Sans Mono, ui-monospace, monospace" font-size="16" fill="#101411">live</text>
  </g>

  <text x="600" y="500" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="16" fill="#232925">Each worker stays bounded to one target and the rollout mode selected by the control plane.</text>
</svg>