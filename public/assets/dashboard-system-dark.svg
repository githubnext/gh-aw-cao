<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title description" data-visual-kind="diagram" data-visual-id="dashboard-system">
  <title id="title">How Actions activity becomes a view</title>
  <desc id="description">Evidence from Actions runs enters the data model, Language queries the model, and the results populate reusable components inside a view.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="1200" height="650" fill="#0d1117"/>
  <text x="60" y="64" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="32" font-weight="700">From Actions to a view</text>
  <text x="60" y="98" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">Shared data, declarative queries, reusable components</text>

  <g data-node="published-evidence">
    <rect x="60" y="180" width="220" height="300" rx="12" fill="#2d2408" stroke="#e3b341" stroke-width="3"/>
    <rect x="94" y="220" width="142" height="178" rx="6" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
    <path d="M 194 220 L 236 262 L 194 262 z" fill="#3d2f05" stroke="#e3b341" stroke-width="2"/>
    <rect x="116" y="286" width="92" height="10" rx="5" fill="#d29922"/>
    <rect x="116" y="316" width="74" height="10" rx="5" fill="#d29922"/>
    <rect x="116" y="346" width="88" height="10" rx="5" fill="#d29922"/>
    <text x="170" y="430" text-anchor="middle" fill="#f2cc60" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">Actions runs</text>
    <text x="170" y="456" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">Workflow evidence</text>
  </g>

  <path d="M 294 330 H 350" fill="none" stroke="#8b949e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="322" y="310" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">loads</text>

  <g data-node="data-model">
    <ellipse cx="450" cy="225" rx="82" ry="28" fill="#121d2f" stroke="#58a6ff" stroke-width="3"/>
    <rect x="368" y="225" width="164" height="190" fill="#121d2f" stroke="#58a6ff" stroke-width="3"/>
    <ellipse cx="450" cy="415" rx="82" ry="28" fill="#1c3657" stroke="#58a6ff" stroke-width="3"/>
    <ellipse cx="450" cy="225" rx="82" ry="28" fill="#121d2f" stroke="#58a6ff" stroke-width="3"/>
    <path d="M 388 282 C 420 300 480 300 512 282" fill="none" stroke="#388bfd" stroke-width="2"/>
    <path d="M 388 336 C 420 354 480 354 512 336" fill="none" stroke="#388bfd" stroke-width="2"/>
    <text x="450" y="470" text-anchor="middle" fill="#79c0ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">Data model</text>
    <text x="450" y="496" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">Normalized records</text>
  </g>

  <path d="M 548 330 H 602" fill="none" stroke="#8b949e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="575" y="310" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">queries</text>

  <g data-node="dashboard-language">
    <rect x="620" y="180" width="220" height="300" rx="12" fill="#271c36" stroke="#a371f7" stroke-width="3"/>
    <text x="730" y="222" text-anchor="middle" fill="#d2a8ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">Language</text>
    <rect x="650" y="255" width="160" height="48" rx="6" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
    <text x="672" y="286" fill="#d2a8ff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="16">source: records</text>
    <rect x="650" y="320" width="160" height="48" rx="6" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
    <text x="672" y="351" fill="#d2a8ff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="16">filter: condition</text>
    <rect x="650" y="385" width="160" height="48" rx="6" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
    <text x="672" y="416" fill="#d2a8ff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="16">shape: result</text>
    <text x="730" y="510" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">Declarative query</text>
  </g>

  <path d="M 854 330 H 894" fill="none" stroke="#8b949e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="874" y="310" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">results</text>

  <g data-node="dashboard-view">
    <rect x="910" y="155" width="230" height="350" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="3"/>
    <rect x="910" y="155" width="230" height="42" rx="12" fill="#0f2d1c"/>
    <circle cx="934" cy="176" r="6" fill="#f85149"/>
    <circle cx="954" cy="176" r="6" fill="#d29922"/>
    <circle cx="974" cy="176" r="6" fill="#3fb950"/>
    <rect x="930" y="220" width="190" height="72" rx="6" fill="#0f2d1c" stroke="#3fb950" stroke-width="2"/>
    <text x="948" y="250" fill="#7ee787" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700">Header</text>
    <text x="948" y="275" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">Summary</text>
    <rect x="930" y="310" width="190" height="64" rx="6" fill="#2d2408" stroke="#e3b341" stroke-width="2"/>
    <text x="948" y="348" fill="#f2cc60" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700">Chart</text>
    <rect x="930" y="392" width="88" height="80" rx="6" fill="#121d2f" stroke="#58a6ff" stroke-width="2"/>
    <rect x="1032" y="392" width="88" height="80" rx="6" fill="#321820" stroke="#f85149" stroke-width="2"/>
    <text x="974" y="425" text-anchor="middle" fill="#79c0ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700">Metric</text>
    <text x="974" y="454" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700">42</text>
    <text x="1076" y="425" text-anchor="middle" fill="#ff7b72" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700">List</text>
    <text x="1076" y="454" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700">•••</text>
    <text x="1025" y="540" text-anchor="middle" fill="#7ee787" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">View</text>
    <text x="1025" y="566" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">Reusable components</text>
  </g>

  <text x="600" y="610" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17">New evidence refreshes the model; active views receive fresh query results.</text>
</svg>