<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title description" data-visual-kind="diagram" data-visual-id="dashboard-view-system">
  <title id="title">How dashboard views use data</title>
  <desc id="description">Language queries the shared data model and supplies results to reusable components in the selected view inside the dashboard shell and its view navigation.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#59636e"/></marker></defs>
  <rect width="1200" height="540" fill="#f6f8fa"/>
  <text x="60" y="62" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="32" font-weight="700">From shared data to a view</text>
  <text x="60" y="96" fill="#59636e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">Language shapes model records for the selected view inside the dashboard</text>
  <g data-node="model"><ellipse cx="235" cy="190" rx="95" ry="30" fill="#ddf4ff" stroke="#0969da" stroke-width="3"/><path d="M140 190v170c0 17 43 30 95 30s95-13 95-30V190" fill="#ddf4ff" stroke="#0969da" stroke-width="3"/><ellipse cx="235" cy="360" rx="95" ry="30" fill="#b6e3ff" stroke="#0969da" stroke-width="3"/><ellipse cx="235" cy="190" rx="95" ry="30" fill="#ddf4ff" stroke="#0969da" stroke-width="3"/><rect x="157" y="405" width="156" height="42" rx="6" fill="#24292f"/><text x="235" y="433" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="700">Data model</text></g>
  <path d="M345 280h110" stroke="#59636e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <g data-node="language"><rect x="475" y="150" width="240" height="260" rx="10" fill="#fbefff" stroke="#8250df" stroke-width="3"/><rect x="510" y="195" width="170" height="44" rx="6" fill="#ffffff" stroke="#a475f9" stroke-width="2"/><rect x="510" y="258" width="170" height="44" rx="6" fill="#ffffff" stroke="#a475f9" stroke-width="2"/><rect x="510" y="321" width="170" height="44" rx="6" fill="#ffffff" stroke="#a475f9" stroke-width="2"/><text x="530" y="223" fill="#6639ba" font-family="ui-monospace, SFMono-Regular, monospace" font-size="16">query model</text><text x="530" y="286" fill="#6639ba" font-family="ui-monospace, SFMono-Regular, monospace" font-size="16">shape result</text><text x="530" y="349" fill="#6639ba" font-family="ui-monospace, SFMono-Regular, monospace" font-size="16">declare view</text><rect x="520" y="420" width="150" height="42" rx="6" fill="#24292f"/><text x="595" y="448" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="700">Language</text></g>
  <path d="M730 280h90" stroke="#59636e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <g data-node="dashboard"><rect x="840" y="125" width="300" height="320" rx="12" fill="#ffffff" stroke="#59636e" stroke-width="3"/><rect x="840" y="125" width="300" height="44" rx="12" fill="#f6f8fa"/><circle cx="866" cy="147" r="6" fill="#cf222e"/><circle cx="886" cy="147" r="6" fill="#bf8700"/><circle cx="906" cy="147" r="6" fill="#1a7f37"/><g data-node="view-navigation"><rect x="858" y="188" width="68" height="232" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/><text x="892" y="218" text-anchor="middle" fill="#59636e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700">Views</text><rect x="872" y="240" width="40" height="8" rx="4" fill="#8c959f"/><rect x="872" y="266" width="32" height="8" rx="4" fill="#8c959f"/><rect x="872" y="292" width="40" height="8" rx="4" fill="#8c959f"/></g><g data-node="view"><rect x="942" y="188" width="180" height="178" rx="7" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/><rect x="957" y="203" width="150" height="40" rx="5" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/><text x="972" y="228" fill="#116329" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700">Header</text><rect x="957" y="255" width="150" height="40" rx="5" fill="#fff8c5" stroke="#9a6700" stroke-width="2"/><text x="972" y="280" fill="#7d4e00" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700">Chart</text><rect x="957" y="307" width="68" height="40" rx="5" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/><rect x="1039" y="307" width="68" height="40" rx="5" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/><text x="991" y="332" text-anchor="middle" fill="#0550ae" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700">Metric</text><text x="1073" y="332" text-anchor="middle" fill="#a40e26" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700">List</text><rect x="977" y="377" width="110" height="34" rx="6" fill="#24292f"/><text x="1032" y="400" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700">View</text></g><rect x="912" y="457" width="156" height="42" rx="6" fill="#24292f"/><text x="990" y="485" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="700">Dashboard</text></g>
