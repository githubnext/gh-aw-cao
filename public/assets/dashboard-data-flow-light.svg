<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description" data-visual-kind="diagram" data-visual-id="dashboard-data-flow">
  <title id="title">Dashboard data flow</title>
  <desc id="description">Agentic workflows produce Actions logs. The Activity workflow collects them into authoritative JSONL. Consumers apply the shared data model to build separate SQLite and IndexedDB projections.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#59636e"/></marker></defs>
  <rect width="1200" height="700" fill="#f6f8fa"/>
  <text x="60" y="62" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="32" font-weight="700">From workflow logs to usable data</text>
  <text x="60" y="96" fill="#59636e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">One authoritative input, one shared model, two rebuildable projections</text>

  <g data-node="workflows"><rect x="55" y="230" width="180" height="150" rx="10" fill="#fff8c5" stroke="#9a6700" stroke-width="3"/><rect x="82" y="258" width="126" height="68" rx="6" fill="#ffffff" stroke="#9a6700" stroke-width="2"/><path d="M102 278h84M102 300h60" stroke="#d4a72c" stroke-width="9" stroke-linecap="round"/><text x="145" y="350" text-anchor="middle" fill="#7d4e00" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700">Agentic workflows</text><text x="145" y="407" text-anchor="middle" fill="#59636e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">Actions logs</text></g>
  <path d="M245 305h52" stroke="#59636e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <g data-node="activity"><rect x="315" y="215" width="190" height="180" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="3"/><circle cx="410" cy="278" r="34" fill="#ffffff" stroke="#1a7f37" stroke-width="3"/><path d="M410 255v24l17 12" stroke="#1a7f37" stroke-width="5" stroke-linecap="round" fill="none"/><text x="410" y="340" text-anchor="middle" fill="#116329" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="700">Activity workflow</text><text x="410" y="370" text-anchor="middle" fill="#59636e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">Runs gh aw logs</text></g>
  <path d="M515 305h52" stroke="#59636e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <g data-node="jsonl"><path d="M585 200h190v210H585z" fill="#ffffff" stroke="#59636e" stroke-width="3"/><path d="M725 200l50 50h-50z" fill="#f6f8fa" stroke="#59636e" stroke-width="3"/><path d="M615 278h126M615 310h100M615 342h118" stroke="#8c959f" stroke-width="10" stroke-linecap="round"/><text x="680" y="445" text-anchor="middle" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">JSONL snapshot</text><text x="680" y="473" text-anchor="middle" fill="#59636e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">Authoritative input</text></g>

  <path d="M785 305h35" stroke="#59636e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <g data-node="data-model"><rect x="835" y="235" width="140" height="140" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="3"/><circle cx="870" cy="275" r="13" fill="#54aeff"/><circle cx="940" cy="275" r="13" fill="#54aeff"/><circle cx="905" cy="330" r="13" fill="#54aeff"/><path d="M881 282l14 35M929 282l-14 35M883 275h44" stroke="#0969da" stroke-width="3" fill="none"/><text x="905" y="410" text-anchor="middle" fill="#0550ae" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">Data model</text><text x="905" y="438" text-anchor="middle" fill="#59636e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">Shared schema</text></g>
  <path d="M975 305h20v-115h15" stroke="#59636e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M975 305h20v175h15" stroke="#59636e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <g data-node="sqlite"><ellipse cx="1080" cy="160" rx="70" ry="24" fill="#fbefff" stroke="#8250df" stroke-width="3"/><path d="M1010 160v95c0 14 31 25 70 25s70-11 70-25v-95" fill="#fbefff" stroke="#8250df" stroke-width="3"/><ellipse cx="1080" cy="255" rx="70" ry="25" fill="#eedcff" stroke="#8250df" stroke-width="3"/><text x="1080" y="315" text-anchor="middle" fill="#6639ba" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="700">SQLite</text><text x="1080" y="342" text-anchor="middle" fill="#59636e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">Agents and CLI</text></g>

  <g data-node="indexeddb"><ellipse cx="1080" cy="450" rx="70" ry="24" fill="#ffebe9" stroke="#cf222e" stroke-width="3"/><path d="M1010 450v95c0 14 31 25 70 25s70-11 70-25v-95" fill="#ffebe9" stroke="#cf222e" stroke-width="3"/><ellipse cx="1080" cy="545" rx="70" ry="25" fill="#ffd8d3" stroke="#cf222e" stroke-width="3"/><text x="1080" y="605" text-anchor="middle" fill="#a40e26" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="700">IndexedDB</text><text x="1080" y="632" text-anchor="middle" fill="#59636e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">Dashboard views</text></g>

  <text x="600" y="665" text-anchor="middle" fill="#59636e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">SQLite and IndexedDB can both be rebuilt from the published JSONL snapshot.</text>
</svg>