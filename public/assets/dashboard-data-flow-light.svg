<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description" data-visual-kind="diagram" data-visual-id="dashboard-data-flow">
  <title id="title">Dashboard data flow</title>
  <desc id="description">Agentic workflows produce Actions logs. The Activity workflow collects them into authoritative JSONL. Consumers apply the shared data model to build separate SQLite and IndexedDB projections.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#59636e"/></marker></defs>
  <rect width="1200" height="700" fill="#f6f8fa"/>
  <g data-node="workflows"><rect x="55" y="260" width="200" height="120" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="3"/><text x="155" y="312" text-anchor="middle" fill="#7d4e00" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">Workflow logs</text><text x="155" y="344" text-anchor="middle" fill="#59636e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">GitHub Actions</text></g>
  <path d="M255 320h65" stroke="#59636e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <g data-node="activity"><rect x="335" y="260" width="200" height="120" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="3"/><text x="435" y="312" text-anchor="middle" fill="#116329" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">Activity</text><text x="435" y="344" text-anchor="middle" fill="#59636e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">Collects a snapshot</text></g>
  <path d="M535 320h65" stroke="#59636e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <g data-node="jsonl"><rect x="615" y="260" width="200" height="120" rx="8" fill="#ffffff" stroke="#59636e" stroke-width="3"/><text x="715" y="312" text-anchor="middle" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">Published JSONL</text><text x="715" y="344" text-anchor="middle" fill="#59636e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">Authoritative input</text></g>
  <text x="890" y="248" text-anchor="middle" fill="#0550ae" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="600">shared data model</text>
  <path d="M815 320h55v-100h55" stroke="#59636e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M815 320h55v100h55" stroke="#59636e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <g data-node="indexeddb"><rect x="940" y="160" width="205" height="120" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="3"/><text x="1042" y="212" text-anchor="middle" fill="#0550ae" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">Dashboard</text><text x="1042" y="244" text-anchor="middle" fill="#59636e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">IndexedDB</text></g>
  <g data-node="sqlite"><rect x="940" y="360" width="205" height="120" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="3"/><text x="1042" y="412" text-anchor="middle" fill="#6639ba" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">CLI &amp; agents</text><text x="1042" y="444" text-anchor="middle" fill="#59636e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">SQLite</text></g>
</svg>