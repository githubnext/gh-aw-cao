<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title description" data-visual-kind="diagram" data-visual-id="dashboard-view-system">
  <title id="title">How a dashboard view queries data</title>
  <desc id="description">The selected view sends a Dashboard Language query to structured data, and the results flow back to the dashboard.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="1200" height="540" fill="#0d1117"/>
  <g transform="translate(755 0)">
    <g data-node="data">
      <rect x="165" y="165" width="170" height="190" rx="8" fill="#1c3657" stroke="#58a6ff" stroke-width="2"/>
      <rect x="145" y="185" width="180" height="195" rx="8" fill="#121d2f" stroke="#58a6ff" stroke-width="2"/>
      <rect x="125" y="205" width="190" height="195" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="3"/>
      <text x="148" y="240" fill="#79c0ff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="18" font-weight="700">repository</text>
      <path d="M148 254h138" stroke="#388bfd" stroke-width="6" stroke-linecap="round"/>
      <text x="148" y="292" fill="#79c0ff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="18" font-weight="700">workflow</text>
      <path d="M148 306h112" stroke="#388bfd" stroke-width="6" stroke-linecap="round"/>
      <text x="148" y="344" fill="#79c0ff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="18" font-weight="700">run</text>
      <path d="M148 358h126" stroke="#388bfd" stroke-width="6" stroke-linecap="round"/>
      <text x="235" y="445" text-anchor="middle" fill="#79c0ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700">Data</text>
    </g>
  </g>
  <g data-node="query">
    <text x="630" y="205" text-anchor="middle" fill="#d2a8ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="700">query &#xB7; Dashboard Language</text>
    <path d="M400 250C520 210 740 210 860 250" stroke="#a371f7" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M860 320C740 360 520 360 400 320" stroke="#58a6ff" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <text x="630" y="390" text-anchor="middle" fill="#79c0ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">results</text>
  </g>
  <g transform="translate(-755 0)">
    <g data-node="dashboard">
      <rect x="840" y="125" width="300" height="320" rx="12" fill="#161b22" stroke="#8b949e" stroke-width="3"/>
      <rect x="840" y="125" width="300" height="44" rx="12" fill="#30363d"/>
      <circle cx="866" cy="147" r="6" fill="#8b949e"/>
      <circle cx="886" cy="147" r="6" fill="#8b949e"/>
      <circle cx="906" cy="147" r="6" fill="#8b949e"/>
      <g data-node="view-navigation">
        <rect x="858" y="188" width="68" height="232" rx="6" fill="#21262d" stroke="#30363d" stroke-width="2"/>
        <text x="892" y="218" text-anchor="middle" fill="#b1bac4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700">Views</text>
        <rect x="872" y="240" width="40" height="8" rx="4" fill="#8b949e"/>
        <rect x="872" y="266" width="32" height="8" rx="4" fill="#8b949e"/>
        <rect x="872" y="292" width="40" height="8" rx="4" fill="#8b949e"/>
      </g>
      <g data-node="view">
        <rect x="942" y="188" width="180" height="178" rx="7" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
        <text x="1032" y="220" text-anchor="middle" fill="#7ee787" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700">UI components</text>
        <rect x="957" y="236" width="68" height="46" rx="5" fill="#0f2d1c" stroke="#3fb950" stroke-width="2"/>
        <rect x="1039" y="236" width="68" height="46" rx="5" fill="#0f2d1c" stroke="#3fb950" stroke-width="2"/>
        <rect x="957" y="296" width="68" height="46" rx="5" fill="#0f2d1c" stroke="#3fb950" stroke-width="2"/>
        <rect x="1039" y="296" width="68" height="46" rx="5" fill="#0f2d1c" stroke="#3fb950" stroke-width="2"/>
