<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description" data-visual-kind="diagram" data-visual-id="dashboard-data-flow">
  <title id="title">Dashboard data flow</title>
  <desc id="description">Agentic workflows produce Actions logs. The Activity workflow collects them into authoritative JSONL. Consumers apply the shared data model to build separate SQLite and IndexedDB projections.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker></defs>
  <rect width="1200" height="700" fill="#0d1117"/>
  <g data-node="workflows"><rect x="55" y="260" width="200" height="120" rx="8" fill="#2d2408" stroke="#e3b341" stroke-width="3"/><text x="155" y="312" text-anchor="middle" fill="#f2cc60" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">Workflow logs</text><text x="155" y="344" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">GitHub Actions</text></g>
  <path d="M255 320h65" stroke="#8b949e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <g data-node="activity"><rect x="335" y="260" width="200" height="120" rx="8" fill="#0f2d1c" stroke="#3fb950" stroke-width="3"/><text x="435" y="312" text-anchor="middle" fill="#7ee787" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">Activity</text><text x="435" y="344" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">Collects a snapshot</text></g>
  <path d="M535 320h65" stroke="#8b949e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <g data-node="jsonl"><rect x="615" y="260" width="200" height="120" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="3"/><text x="715" y="312" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">Published JSONL</text><text x="715" y="344" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">Authoritative input</text></g>
  <text x="890" y="248" text-anchor="middle" fill="#79c0ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="600">shared data model</text>
  <path d="M815 320h55v-100h55" stroke="#8b949e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M815 320h55v100h55" stroke="#8b949e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <g data-node="indexeddb"><rect x="940" y="160" width="205" height="120" rx="8" fill="#121d2f" stroke="#58a6ff" stroke-width="3"/><text x="1042" y="212" text-anchor="middle" fill="#79c0ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">Dashboard</text><text x="1042" y="244" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">IndexedDB</text></g>
  <g data-node="sqlite"><rect x="940" y="360" width="205" height="120" rx="8" fill="#271c36" stroke="#a371f7" stroke-width="3"/><text x="1042" y="412" text-anchor="middle" fill="#d2a8ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">CLI &amp; agents</text><text x="1042" y="444" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">SQLite</text></g>
</svg>