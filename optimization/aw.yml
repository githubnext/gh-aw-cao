name: AW Optimization
description: Organization-wide workflows for optimizing GitHub Agentic Workflow AI credit usage, cost, and ambient context.
min-version: v0.89.9
experimental: true
includes:
  - .github/workflows/optimization-agents-md-curator.md
  - .github/workflows/optimization-ai-credit-auditor.md
  - .github/workflows/optimization-ai-credit-optimizer.md
  - .github/workflows/optimization-skills-curator.md
  - .github/workflows/optimization.md
resources:
  - source: dashboard.json
    destination: .github/aw/dashboards/optimization.json
  - source: .github/graders/optimization-agents-md-curator-operational-value.sh
    destination: .github/aw/optimization/graders/optimization-agents-md-curator-operational-value.sh
  - source: .github/graders/optimization-ai-credit-auditor-operational-value.sh
    destination: .github/aw/optimization/graders/optimization-ai-credit-auditor-operational-value.sh
  - source: .github/graders/optimization-ai-credit-optimizer-operational-value.sh
    destination: .github/aw/optimization/graders/optimization-ai-credit-optimizer-operational-value.sh