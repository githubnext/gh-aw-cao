spec: cbm/v0.1

project:
  name: central-agentic-ops
  purpose: >
    Public CAO campaign catalog and source-managed control plane for bounded,
    policy-governed agentic operations across an explicitly enrolled repository fleet.
  stack:
    - GitHub Actions
    - gh-aw
    - Node.js 24
    - ECMAScript modules
    - JSONL
    - SQLite
    - IndexedDB
    - Redis
    - PostgreSQL
    - Go
    - Dashboard Language
    - Astro/Starlight

structure:
  architecture_document: ARCHITECTURE.md
  codebase_model: CODEBASE.yml
  agent_instructions: AGENTS.md
  catalog_manifest: aw.yml
  operations: <operation>/aw.yml
  activity: activity/
  dashboard: dashboard/
  dashboard_data: dashboard/site/src/data/
  dashboard_go_server: server/
  dashboard_server_contract: server/spec/
  dashboard_coolify_profile: server/coolify/
  dashboard_upstash_profile: server/internal/server/hosted.go
  dashboard_container: server/Dockerfile
  workflow_sources: .github/workflows/*.md
  workflow_artifacts: .github/workflows/*.lock.yml
  workflow_shared: .github/workflows/shared/
  rollout_policy: .github/workflows/cao.json
  deployment_profiles: .github/workflows/cao.<deployment>.json
  campaign_runtime: <campaign>/
  agent_instruction_resources: .github/aw/
  campaign_records: .github/aw/campaigns/
  workflow_agent_skills: .github/skills/
  portable_agent_skills: skills/
  specifications: specs/
  documentation: docs/
  decisions: adr/
  tests: tests/
  utilities: scripts/
  runtime_package: runtime/package.json
  runtime_builder: scripts/build-cao-runtime.mjs
  runtime_distribution: .github/workflows/cao-runtime.yml

architecture:
  style: policy-governed central control plane with catalog campaigns and bounded workers
  roles:
    catalog: publishes versioned operation campaigns
    control_repository: owns rollout policy, credentials, installed workflows, and workflow runs
    review_repository: receives declared safe outputs in review mode
    target_repository: supplies source data and receives only declared safe outputs
    gh_aw: compiles workflows and controls execution capabilities, limits, authentication, and safe outputs
  authority: >
    A run's authority is the intersection of reviewed policy, dispatch request,
    worker ceilings, credential reach, and gh-aw-compiled capabilities.
  concepts:
    reviewed_workflow_revision: workflow revision from which policy is resolved
    credentials: GitHub Actions secrets resolved only inside a run
    resolved_policy: effective CAO authority and rollout envelope
    target_repository_mutation: direct target repository modification by an orchestrator
    targets_outside_resolved_policy: repositories not admitted by the effective envelope
    dispatched_target: single repository identity carried by a worker envelope
    declared_safe_output_capabilities: compiled gh-aw repository-write capabilities
    additional_target_discovery: worker discovery beyond its dispatched target
    further_work_dispatch: worker dispatch of additional work
    mode_widening: promotion beyond the envelope or worker mode ceiling
    control_plane_authority: authority to authorize control-plane execution
    bounded_worker_query_payloads: bounded query results sent from the data worker
    source_data_queries: direct source-data queries from UI code
    business_relationship_reconstruction: UI derivation of source-data relationships
    canonical_evidence: source-neutral records with stable identities, relationships, quality, and provenance
    bounded_computation_results: partitioned, versioned measures and actionable insights with bounded evidence references
    computation_authority: authority inferred from a derived computation result
    activity_collection_scope: exact repositories whose workflow evidence Activity may collect, independently narrowed within global rollout scope
    outcome_inference_from_runtime: treating runtime success as verification, accepted outcome, an operational-grader result, or operational value
    request_scoped_computation_results: bounded measure results evaluated for a selected partition and version against canonical evidence
    dashboard_entity_storage: current hosted dashboard entity rows, quality metadata, diagnostics, and revision state
    dashboard_query_execution: Dashboard Language evaluation over current hosted dashboard data
    operational_state_storage: sessions, rate limits, queues, deduplication, coordination, quota state, revocation retries, and bounded caches

components:
  policy_resolution:
    path: .github/workflows/shared/control.md
    responsibility: load policy at the workflow revision and resolve the effective run envelope
  orchestrator:
    path: .github/workflows/<operation>.md
    responsibility: discover, filter, rank, select, and dispatch targets within the resolved policy
  worker:
    path: .github/workflows/<operation>-<worker>.md
    responsibility: revalidate a dispatch or manual-debug envelope, analyze one target, and emit declared safe outputs
  activity:
    path: activity/
    responsibility: collect bounded evidence, ingest JSONL, create SQLite projections, and provide the cao CLI
  control_plane_setup:
    path: activity/setup.mjs
    responsibility: resolve exact repository scope, review intended authority, verify Pages source and public-visibility consent, connect credentials, and atomically save bare control-plane policy
  control_plane_quickstart:
    path: activity/quickstart.mjs
    responsibility: guide first success through separate install, run, collect, and read-only dashboard stages; install commits bounded review-only policy and pauses Repo Assist, run and collect return without remote waits, dashboard verifies data-bearing publication and a successful Pages deployment job, and explicit --wait retains the end-to-end flow
  setup_prompts:
    path: activity/setup-prompt.mjs
    responsibility: dependency-free keyboard-driven terminal presentation and plain-terminal fallback without owning authority decisions
  dashboard:
    path: dashboard/
    responsibility: publish evidence and provide a static operational dashboard
  dashboard_data:
    path: dashboard/site/src/data/
    responsibility: normalize, persist, and declaratively query canonical browser data in a Web Worker, including separately keyed run-linked experiment assignments, grader observations, and eval observations
  marketplace_registry_policy:
    path: .github/workflows/cao.json
    responsibility: define ordered campaign package registries, resolver cache policy, and secret references without secret values
  marketplace_static_resolver:
    path: activity/marketplace.mjs
    responsibility: resolve registry refs and gh-aw package manifests during Activity precomputation into safe normalized marketplace package records
  marketplace_hosted_resolver:
    path: server/
    responsibility: resolve the same registry contract at runtime and cache safe normalized results through the operational cache contract
  marketplace_ui:
    path: dashboard/site/dashboard-fragments/operations.json
    responsibility: render declarative package list and detail views with copy-only canonical CAO add commands
  gh_aw_logs:
    external: true
    responsibility: authoritative execution-log source for Activity collection
  activity_jsonl_shards:
    path: activity/
    responsibility: bounded, authoritative Activity evidence snapshots
  activity_run_information_shards:
    path: activity/
    responsibility: compact immutable run identity and aggregate payloads loaded before run-linked records
  activity_record_shards:
    path: activity/
    responsibility: detailed domain, tool, audit, and issue payloads with direct canonical run identity
  sqlite_projection:
    path: activity/
    responsibility: rebuildable local query projection for the cao CLI and agents
  dashboard_publisher:
    path: dashboard/
    responsibility: publish inventory, SQLite, and compacted normalized run and record shards without raw Activity JSONL
  browser_data_worker:
    path: dashboard/site/src/data/
    responsibility: download, normalize, persist, and query browser data off the main thread
  indexeddb_projection:
    path: dashboard/site/src/data/
    responsibility: rebuildable per-browser data projection
  postgres_entity_store:
    path: server/internal/postgresx/
    responsibility: initialize a fresh TypeSpec-generated schema and transactionally replace and read fifteen query-minimal native entity tables, entity-owned relational child values, quality metadata, diagnostics, and revision state; preserve missing versus null with compact presence bits; compile and execute bounded Dashboard Language plans as SQL in a repeatable-read snapshot without persisted documents, duplicate scalar representations, or compatibility migrations
  redis_operational_store:
    path: server/internal/redisx/
    responsibility: support operational caches, queues, and sessions, not dashboard entity storage or query execution
  operational_contracts:
    path: server/internal/operational/
    responsibility: define typed narrow cache, OAuth, limiter, quota, collection, coordination and diagnostic services with immutable per-feature scope and restart-persistence capabilities, mandatory atomicity and CAS, central fail-closed requirement validation, and application-owned maintenance lifecycle
  memory_operational_store:
    path: server/internal/operational/memory/
    responsibility: implement bounded process-scoped volatile operational services shared by OAuth, HTTP admission, quota, collection, projection and backfill in one owning process, with restart-invalidated sessions and login state and explicit incomplete recovery
  postgres_operational_store:
    path: server/internal/operational/postgres/
    responsibility: implement default durable deployment-scoped typed operational services in separate cao_operational tables, with namespace-row transactional serialization, database-time expiry, replica-consistent protected and cache budgets, atomic session revocation capacity, bounded maintenance, and read-only existing-state diagnostics; never store canonical entities or execute dashboard queries
  dashboard_query_result_cache:
    path: server/internal/redisx/query_cache.go and server/internal/server/query_cache.go
    responsibility: cache expensive compact HTTP and MCP query results by SHA-256 query identity for five minutes through the operational contract, with atomic expiry, Redis allocator or memory accounting limits and bounded eviction
  dashboard_https_server:
    path: server/
    responsibility: independently resolve compiled app-target and operational-backend modules from non-secret cao.json, default to durable PostgreSQL operational storage without Redis while preserving explicit Redis and bounded single-process volatile memory alternatives, ingest deployed artifacts into Postgres, execute hosted Dashboard Language plans through the PostgreSQL SQL engine with registered runtime sources, and serve bounded query results
  dashboard_http_contract:
    path: server/spec/
    responsibility: specify public HTTP/SSE and fresh Postgres storage contracts in TypeSpec; generate checked OpenAPI, wire JSON Schemas, standalone SQL DDL, and Go entity bindings; enforce query-field coverage and column minimization
  dashboard_external_host:
    path: server/hosting/
    responsibility: expose the complete hosted CAO handler and cancellation-aware application startup to a separately owned HTTP listener without exporting Redis or authentication internals
  dashboard_coolify_deployment:
    path: server/coolify/
    responsibility: let a repository-scoped Coolify GitHub App watch protected main, build a lean admission-only dashboard target plus private collector and backfill targets from the checked-out source commit, package a deterministic source-bound control-plane inventory with the minimal shared policy resolver, retain collection evidence in a persistent volume, and keep one external read-only activity artifact available only for snapshot-profile rollback
  dashboard_observability:
    path: server/internal/telemetry/, server/internal/server/, dashboard/site/src/remote-data-backend.js
    responsibility: export vendor-neutral OTLP traces and metrics plus explicitly enabled DEBUG-selected logs, correlate bounded server errors and browser failures through matching W3C trace/span identifiers, and keep exporter credentials and internal failure details outside responses and logs
  dashboard_server_package:
    path: .github/workflows/cao-package.yml
    responsibility: validate protected source authority, test and independently scan, and seal the deployment-neutral multi-role CAO server image without package-write authority
  dashboard_server_package_publisher:
    path: .github/workflows/cao-package-publish.yml
    responsibility: execute from protected main, revalidate caller and package authority, verify sealed metadata and OCI labels, and immutably publish and attest the CAO server image
  dashboard_upstash_deployment:
    path: server/internal/server/hosted.go
    responsibility: run one hosted replica over one fail-closed serialized Upstash TCP session with a fresh process namespace and artifact-only ingestion
  dashboard_canonical_api:
    path: server/internal/server/
    responsibility: expose canonical repositories, workflows, and runs without exposing Redis keys or representations
  dashboard_github_auth:
    path: server/internal/server/oauth.go
    responsibility: authenticate hosted users through GitHub and enforce explicit organization or team authorization with server-side sessions; explicitly opted-in loopback TLS development authorizes one configured developer without organization scopes or membership reads
  dashboard_webhook_reconciliation:
    path: server/internal/server/operations.go
    responsibility: verify and deduplicate GitHub deliveries and reconcile the disposable projection from authoritative inputs
  dashboard_server_collection:
    path: server/internal/collect/
    responsibility: optional alternative ingestion profile that discovers paginated historical workflow runs into durable resumable run tasks, resolves reviewed policy over exact operational enrollment, enriches source-bound campaign inventory with short-lived installation authority, and retains repository and inventory evidence in a snapshot-compatible lake loaded through the existing ingestion pipeline
  dashboard_collection_health:
    path: server/internal/server/collecting.go
    responsibility: persist allowlisted Redis-backed ingestion counters and expose a read-only health API and admin-authorized collection-health runtime source through the query boundary
  dashboard_collection_credentials:
    path: server/internal/githubapp/
    responsibility: mint short-lived installation tokens and govern per-installation GitHub rate-limit budget
  github_quota_service:
    path: server/internal/githubquota/
    responsibility: coordinate GitHub API quota across replicas for buckets keyed by app, installation, and resource through authoritative observations, expiring atomic operational reservations, parking, a credential-free provider registry, headroom-based bucket selection, and a bounded 24-hour usage history exposed to administrators through a REST API and the github-quota-usage runtime source
  dashboard_rebuild_control:
    path: server/internal/server/operations.go
    responsibility: coordinate multi-replica rebuilds, validate and transactionally replace current Postgres sources, and report operational status
  dashboard_server_diagnostics:
    path: server/internal/doctor/
    responsibility: run a read-only systematic check-up of runtime configuration, selected operational guarantees and capacity, Postgres canonical state and integrity, query definitions, and optional collection health, rendered as text or versioned structured JSON
  dashboard_language_queries:
    path: dashboard/site/src/data/ and server/internal/query/
    responsibility: execute declarative canonical-data queries in the browser worker and registered bounded runtime-source queries at the server boundary
  computations:
    path: specs/computations.md
    responsibility: define deterministic partitioned measures that transform canonical evidence into bounded actionable insights
  package_operational_value:
    path: <operation>/operational-value.mjs
    responsibility: compute timestamped repository-scoped metrics for installed packages through the cao operational-value command
  package_problem_clustering:
    path: <operation>/problem-clustering.mjs
    responsibility: compute bounded package problem rows from a private Activity SQLite snapshot through the cao cluster-problems command
  computation_reference_runtime:
    path: research/computations/
    responsibility: experimentally evaluate proposed versioned measures over selected and ordered partitions without implying dashboard production integration
  computation_research_notebooks:
    path: research/
    responsibility: validate computation contracts against local canonical evidence and present explainable drill-downs
  dashboard_ui:
    path: dashboard/site/
    responsibility: render bounded Dashboard Language query payloads
  local_dashboard_server:
    path: dashboard/local-server.mjs
    responsibility: expose capability-protected declared CLI actions only in local admin or trusted canvas sessions, preserving trusted approval
  local_cli_queue:
    path: dashboard/cli-action-queue.mjs
    responsibility: own durable single-owner FIFO operational SQLite commands independently of browser lifetimes, with bounded concurrency, deadlines, cancellation, ordered output, retry ancestry and terminal-only UTC weekly retention
  cli_command_storage:
    path: server/internal/operational/cli_commands.go
    responsibility: define focused CLICommandQueues and CLICommandQueue services separate from collection tasks and execution authority, with restart durability, fenced ownership, explicit uncertainty recovery, settlement-protected slots, bounded output cursors and UTC weekly retention
  postgres_cli_commands:
    path: server/internal/operational/postgres/
    responsibility: expose CLICommands through operational composition using namespace-isolated cao_operational_cli tables, database-time leases, monotonic fences, protected byte and entry budgets and bounded terminal-only maintenance; never enable hosted execution by themselves or replace the local SQLite executor
  hosted_cli:
    path: server/internal/hostedcli/
    responsibility: experimental opt-in (--experimental --hosted-cli-actions) admission of catalog-declared actions by step-up administrators and an execute-cli drain that rechecks live write permission, Go-plans only gh or gh-aw entrypoints, and runs commands in the digest-pinned gh-aw container with only the per-command workspace and a single-use repository-scoped GitHub App installation token; remove containers on cancellation and reject/revoke over-broad grants
  security_audit:
    path: server/internal/audit/
    responsibility: credential-free audit events for admin denials, hosted CLI admission and execution, and token lifecycle, stored in the hash-chained append-only cao_operational_audit_events table and mirrored as JSON lines (or, for local debugging only, a loopback-only SQLite file via --hosted-cli-sqlite and execute-cli --sqlite); privileged steps fail closed when storage fails; identify tokens only by GitHub's hashed_token digest; `cao-dashboard audit verify` checks the chain against external head anchors, `audit export` writes JSON Lines, and events are also OTLP logs correlated by trace ID
  cli_executor:
    path: dashboard/cli-actions.mjs
    responsibility: execute the existing validated CLI mechanism with bounded output and process-tree termination
  cli_quota_bridge:
    path: server/cmd/cao-cli-quota/
    responsibility: reuse GitHub quota tracking for the local queue against authoritative execution-credential observations, failing closed when evidence is unavailable
  cao_cli:
    path: activity/cao.mjs, activity/cli/, activity/commands/
    responsibility: preserve executable and public exports in cao.mjs, separate dispatch and implementation concerns in cli/, provide one handler per command in commands/, and query Activity SQLite projections and execute extensible computation commands for local tooling and agents; implementation modules depend on shared helpers, not the entry point

dependencies:
  - catalog -> control_repository
  - control_repository -> policy_resolution
  - policy_resolution -> orchestrator
  - orchestrator -> worker
  - worker -> review_repository
  - worker -> target_repository
  - gh_aw_logs -> activity_jsonl_shards
  - activity_jsonl_shards -> sqlite_projection
  - activity_jsonl_shards -> activity_run_information_shards
  - activity_jsonl_shards -> activity_record_shards
  - activity_run_information_shards -> dashboard_publisher
  - activity_record_shards -> dashboard_publisher
  - dashboard_publisher -> browser_data_worker
  - browser_data_worker -> indexeddb_projection
  - browser_data_worker -> dashboard_language_queries
  - browser_data_worker -> local_dashboard_server
  - local_dashboard_server -> local_cli_queue
  - local_cli_queue -> cli_executor
  - local_cli_queue -> cli_quota_bridge
  - cli_quota_bridge -> github_quota_service
  - dashboard_publisher -> dashboard_https_server
  - dashboard_https_server -> postgres_entity_store
  - postgres_entity_store -> dashboard_https_server
  - dashboard_https_server -> operational_contracts
  - redis_operational_store -> operational_contracts
  - memory_operational_store -> operational_contracts
  - postgres_operational_store -> operational_contracts
  - dashboard_https_server -> dashboard_query_result_cache
  - dashboard_query_result_cache -> operational_contracts
  - dashboard_https_server -> dashboard_language_queries
  - dashboard_https_server -> dashboard_canonical_api
  - dashboard_https_server -> dashboard_http_contract
  - dashboard_external_host -> dashboard_https_server
  - dashboard_coolify_deployment -> dashboard_https_server
  - dashboard_server_package -> dashboard_server_package_publisher
  - dashboard_server_package_publisher -> dashboard_https_server
  - dashboard_upstash_deployment -> dashboard_https_server
  - dashboard_upstash_deployment -> redis_operational_store
  - dashboard_github_auth -> dashboard_https_server
  - dashboard_webhook_reconciliation -> dashboard_rebuild_control
  - dashboard_rebuild_control -> postgres_entity_store
  - dashboard_rebuild_control -> operational_contracts
  - sqlite_projection -> computations
  - indexeddb_projection -> computations
  - computations -> computation_reference_runtime
  - computation_reference_runtime -> computation_research_notebooks
  - computations -> dashboard_language_queries
  - dashboard_language_queries -> dashboard_ui
  - computations -> cao_cli
  - package_operational_value -> cao_cli
  - package_operational_value -> activity_jsonl_shards
  - sqlite_projection -> package_problem_clustering
  - package_problem_clustering -> cao_cli
  - activity_jsonl_shards -> indexeddb_projection
  - marketplace_registry_policy -> marketplace_static_resolver
  - marketplace_registry_policy -> marketplace_hosted_resolver
  - marketplace_static_resolver -> browser_data_worker
  - marketplace_hosted_resolver -> redis_operational_store
  - marketplace_static_resolver -> marketplace_ui
  - marketplace_hosted_resolver -> marketplace_ui

boundaries:
  - subject: policy_resolution
    may_depend_on:
      - reviewed_workflow_revision
    must_not_depend_on:
      - credentials
  - subject: orchestrator
    may_depend_on:
      - resolved_policy
    must_not_depend_on:
      - target_repository_mutation
      - targets_outside_resolved_policy
  - subject: worker
    may_depend_on:
      - dispatched_target
      - declared_safe_output_capabilities
    must_not_depend_on:
      - additional_target_discovery
      - further_work_dispatch
      - mode_widening
  - subject: dashboard_ui
    may_depend_on:
      - bounded_worker_query_payloads
    must_not_depend_on:
      - source_data_queries
      - business_relationship_reconstruction
      - registry_credentials
      - direct_registry_fetches
  - subject: computations
    may_depend_on:
      - canonical_evidence
    must_not_depend_on:
      - computation_authority
      - outcome_inference_from_runtime
  - subject: postgres_entity_store
    may_depend_on:
      - canonical_evidence
      - dashboard_entity_storage
      - dashboard_query_execution
    must_not_depend_on:
      - operational_state_storage
  - subject: redis_operational_store
    may_depend_on:
      - operational_state_storage
    must_not_depend_on:
      - dashboard_entity_storage
      - dashboard_query_execution
  - subject: memory_operational_store
    may_depend_on:
      - operational_contracts
      - operational_state_storage
    must_not_depend_on:
      - dashboard_entity_storage
      - dashboard_query_execution
      - postgres_entity_store
  - subject: postgres_operational_store
    may_depend_on:
      - operational_contracts
      - operational_state_storage
    must_not_depend_on:
      - dashboard_entity_storage
      - dashboard_query_execution
      - postgres_entity_store

invariants:
  - "Hosted CLI actions MUST stay disabled unless serve-hosted receives both --experimental and --hosted-cli-actions; admission MUST require administrator step-up and requester repository permission; shared PostgreSQL queue state, a fenced single-executor lease, durable claims, deadlines, and blocked crash recovery MUST prevent automatic redispatch of uncertain commands across replicas. The Go planner MUST reject cao.sh and arbitrary commands; execute only gh/gh-aw in the digest-pinned gh-aw container with no server secret mounts and remove the container on cancellation. See specs/server-hosted-cli.md."
  - "Every hosted administrator operation MUST require a fresh (CAO_ADMIN_REAUTH_MAX_AGE), assured (explicit 2FA or attested SSO) interactive OAuth authentication; refresh MUST NOT extend it."
  - "Local CLI commands MUST use one server-owned operational SQLite queue and the existing executor, never browser IndexedDB or the disposable dashboard projection. Browser detachment MUST NOT cancel approved work; active work MUST NOT expire."
  - "Unclean CLI queue recovery MUST pause starts while subprocess termination is unverified. Interrupted entries MUST fail without automatic retry; only explicit local operator acknowledgement after reconciliation may resume queued work."
  - "CLI queue admission MUST preserve declared-action validation, trusted approval and credential-scoped authoritative GitHub quota checks. Published dashboards MUST initialize no queue, issue no queue requests and gain no execution authority."
  - "Quickstart installation does not explicitly dispatch Activity, but normal Activity push/schedule triggers remain active and may publish a baseline independently. Dashboard readiness requires an actual successful Pages deployment job; successful workflows with skipped deployments are insufficient."
  - "CAO controls whether and where operations run; gh-aw controls how admitted workflows run."
  - "No authority input can widen another."
  - "Review mode is the default; live mode requires explicit campaign, worker, scope, and target authority."
  - "Debug is request-only for one human workflow_dispatch worker with current control-repository write access; preserve exact-SHA policy, scope, enablement, and limits, require matching target/output repositories, reject dispatcher-envelope inputs, and record the actor with empty dispatcher correlation. Shared control MUST force gh-aw safe-output staging and suppress automatic activation/failure issues. Debug MUST NOT grant live authority, enter persistent policy, or be selected by an orchestrator. GitHub cannot attest local CLI origin; repository-memory staging remains gh-aw-owned."
  - "Credentials remain GitHub Actions secrets and are resolved only inside a run."
  - "Missing policy, authority, credentials, access, or required evidence MUST fail closed."
  - "GitHub tools available to agents are read-only; repository changes use only workflow-declared safe outputs."
  - "Target repository files MUST NOT grant, narrow, or revoke control-plane authority."
  - "Workers process exactly one admitted target and MUST NOT discover targets, dispatch work, or widen mode."
  - "Dispatch envelopes include identity, mode, review destination, and provenance; they MUST NOT include credentials."
  - "Activity evidence MUST NOT determine rollout, outcomes, or operational value."
  - "JSONL snapshots are authoritative; caches, SQLite, and IndexedDB are disposable projections."
  - "Postgres is the exclusive hosted dashboard entity and query store: it holds native typed entity and inventory tables, quality metadata, diagnostics, and revision state; replacement is transactional and does not create generations or persistent derived projections."
  - "The hosted query plan executor MUST bind values and namespace and enforce pre-filter input and resource bounds; all hosted row operations execute in SQL without Go evaluator fallback."
  - "TypeSpec owns the fresh Postgres physical schema; entities MUST NOT be duplicated in generic source storage or persisted as JSON/JSONB/serialized documents. Startup MUST NOT migrate or import old database layouts."
  - "Dashboard ingestion MUST load every run-information shard before record shards; every domain, tool, audit, and issue MUST identify its owning run."
  - "The deployed dashboard artifact MUST NOT contain or manifest raw Activity JSONL; browser ingestion MUST consume compacted normalized run and record JSONL and fail closed when run-information shards are absent."
  - "Normalized Activity shards MUST be JSONL and browser consumers MUST stream bounded record batches without buffering a complete shard."
  - "Missing, stale, partial, and zero evidence are distinct states."
  - "Dashboard data operations MUST be declared in Dashboard Language and execute outside the browser main thread: in the data Web Worker for static deployment or in the Go HTTP(S) server over current Postgres sources."
  - "Redis is operational-only: it stores sessions, rate limits, queues, deduplication, coordination, quota state, revocation retries, and bounded caches; it MUST NOT store dashboard entity rows, canonical source documents, query indexes, persistent query projections, or execute dashboard data queries."
  - "The hosted server MUST NOT fall back from Postgres to Redis for dashboard data; Postgres unavailability makes dashboard data unavailable even when Redis is healthy."
  - "Hosted Redis stores operational caches, queues, and sessions; it MUST NOT store or query dashboard entity sources."
  - "Hosted query-result cache identities MUST include definitions, parameters, pagination, schema and current authorization class, not ingestion revisions; entries retain their original evidence revision and evaluation time for a fixed five-minute lifetime without ingestion invalidation or renewal on data egress, and atomic expiry and oldest-first eviction MUST bound result/index memory and entry count; the Redis adapter MUST NOT change global Redis eviction policy."
  - "All Redis server profiles MUST apply a configurable Redis cache-pressure budget (default 200,000,000 bytes, capped at 80% of provider-reported maxmemory). Scripted memory introspection gates atomic admission and outgoing-allocation reservations; unsupported providers MUST explicitly disable disposable-cache admission and serving while retaining protected storage. Provider-compatible startup/30-second maintenance MUST use one namespace cursor pass, fresh final pressure evidence, and only current-namespace disposable-cache reclamation. Preserve sessions, queues, quota state, revocation retries and other namespaces; report unattainable protected-state pressure; never change Redis configuration or imply a cluster-wide, process-RSS or persistence-disk cap."
  - "Operational consumers MUST receive narrow typed service contracts, never raw commands, physical keys, scripts, concrete adapter assertions, or backend-name branches. Capability snapshots describe per-feature process/deployment scope and volatile/restart persistence; atomicity, CAS, ownership and isolation are mandatory. Composition MUST reject missing or typed-nil enabled services and stop owned work before closing storage."
  - "PostgreSQL is the default operational adapter for selector-free reviewed hosts and local serve; Coolify explicitly selects PostgreSQL without Redis credentials. Explicit Redis configuration remains supported and credentials alone MUST NOT override reviewed selection. Memory MUST require OAuth, HTTPS, explicit single-process and volatile-state acknowledgements, and one instance shared by HTTP, quota, workers, projector and backfill; it MUST reject platform listeners, admission-only topology, separate worker/backfill processes and multiple replicas. PostgreSQL operational storage MUST remain independent of canonical entities, generated schema and query execution; there is no automatic migration, failover or dual write."
  - "The PostgreSQL operational adapter MUST serialize atomic transitions and accounting per namespace, use database-time expiry, require identical replica capacity settings, reserve atomic session revocation capacity, bound disposable caches separately from protected state, release transactions between cancellation-aware queue polling, and run application-owned bounded expiry maintenance. Doctor MUST inspect existing state without initializing it."
  - "Memory budgets MUST bound protected accounting bytes/entries separately from disposable caches without claiming RSS equivalence. Cache pressure MUST NOT evict accepted work; active limiter buckets MUST NOT be evicted to reset limits, and session admission MUST preserve capacity for atomic revocation staging."
  - "Memory restart MUST invalidate CAO sessions and pending login state but does not expire or revoke GitHub tokens; pending revocations and acknowledged unfinished work may be lost by explicit acceptance. Complete fresh GitHub scope enumeration MUST gate admission/workers and serialize with withdrawals; partial scope MUST NOT justify erasure or ignored out-of-scope responses. Recovery reuses retained evidence and existing projection/backfill, requires fresh quota observations, and reports incomplete history/capacity rather than successful truncation. The protected rebuild action reruns backfill even with a populated lake."
  - "The local Redis profile MUST bind to loopback, use HTTP by default for localhost debugging, enable HTTPS only with operator-supplied certificate files, and MUST NOT expose Redis endpoints or credentials to browser code."
  - "The ordinary hosted Redis profile MUST use GitHub OAuth with explicit organization or team authorization, explicit rebuild administrators, server-side secrets and sessions, and an explicit account-selection flow for switching GitHub identities."
  - "CAO_GITHUB_LOCAL_USER development OAuth MUST authorize exactly one configured login with a valid numeric GitHub ID, request classic read:user without read:org, and preserve GitHub App offline_access. It MUST require process-owned loopback TLS, one matching allowed host, exact callback authority/path and loopback peers; reject proxy trust, external/platform hosting, CORS and mixed org/team/SSO policy; bind sessions to the mode and developer; preserve admin allowlisting, recent OAuth assurance, CSRF, explicit classic repo consent and live target writer checks. Operators MUST NOT expose the development listener through tunnels or proxies."
  - "Hosted Redis MUST use TLS by default and Azure Functions MUST always require TLS; private plaintext Redis is allowed only through an explicit opt-in and only for a private IP or single-label service hostname."
  - "A hosted non-loopback listener MUST terminate TLS or explicitly trust only private proxy CIDRs; forwarded headers are authoritative only from a direct peer in those CIDRs, with an exact allowed host and HTTPS protocol."
  - "An externally owned host MUST use an explicit generic OAuth target with listener external, preserve the entire CAO security handler, require direct HTTPS or a trusted private proxy boundary, and fail closed before service startup and after cancellation."
  - "Generic OAuth host target policy MUST NOT disable HTTPS; local platform simulation is an explicit separate profile."
  - "External HTTP hosts MUST drain active requests before stopping CAO background tasks and MUST preserve unbounded event-stream flushing without removing finite request limits from non-streaming endpoints."
  - "cao.json MUST remain the only rollout policy; cao.<deployment>.json profiles MAY extend only control-plane.web.host and MUST reject traversal, cycles, duplicate keys, and any authority or campaign override."
  - "The CAO server package MUST require stable release identities in exact vX.Y.Z form on protected main history; admit manual branch dispatch only for original and rerun actors with maintain or admin permission when the executing workflow is current protected main and the requested source branch is at its current head; keep manual dispatch identities separate from main and release identities; run lint, test, and image build/scanning as separate jobs; test exact sources; gate Dockerfile and workflow security with Hadolint, actionlint, and zizmor; preserve raw static-check outputs in a short-lived artifact even on failure; independently gate high/critical CVEs with Trivy and Grype; check container hardening with Dockle; generate an SPDX SBOM with Syft; keep lint, test, build, and scanner execution outside the package-write security domain; pass only a checksummed candidate and exact metadata to the protected-main reusable publisher; revalidate caller, source, checksum, metadata, and OCI labels before publication; publish only immutable commit or exact stable release identities; attest provenance and SBOM for the exact OCI digest; expose the multi-role server for downstream Docker Compose command selection; emit privacy-safe core.info milestones for JavaScript control checks; and never publish mutable channel tags."
  - "Package and delivery step summaries MUST use non-nested details sections and disclose only check scope, policy, and outcome; they MUST NOT reproduce vulnerability records, SBOM contents, image inventory, credentials, endpoints, payloads, registry responses, or adapter responses."
  - "Coolify production delivery MUST use a repository-scoped Coolify GitHub App and automatic deployments from protected main; build server/Dockerfile through server/coolify/compose.yml from the selected source commit; embed SOURCE_COMMIT; bake the base and Coolify policy profiles into the image; package a deterministic control-plane inventory from that exact source plus only the shared runtime policy resolver; run the public dashboard in admission-only mode without the collection private key; run unexposed collector and idempotent backfill roles with a checksum-verified policy-pinned gh-aw toolchain and shared persistent evidence volume; resolve reviewed deployment policy, overlay exact operational enrollment, and use a short-lived control-repository installation token for live inventory enrichment; fail the first canonical ingestion without valid campaign inventory and retain only a previously valid inventory on later transient refresh failure; leave CAO_SOURCE_DIRECTORY unset in the collection profile; retain one authoritative activity artifact as an external read-only recovery volume for snapshot-profile rollback; require no GitHub deployment workflow, Coolify API token, public Coolify API endpoint, runner tailnet access, registry credentials, or mutable registry tag; and treat package-workflow scans, hardening checks, SBOMs, and attestations as guarantees for published packages rather than admission evidence for the source-built production image."
  - "Hosted server telemetry MUST use standard OTEL runtime configuration; exporter endpoints and headers MUST remain deployment secrets and MUST NOT enter policy, browser state, or logs. When tracing is active, API error bodies, response headers, browser request IDs, and bounded server error logs MUST carry matching W3C trace identifiers without exposing internal exceptions, query payloads, source rows, or storage credentials."
  - "Observability backends are diagnostic infrastructure only and MUST NOT become dashboard data stores, policy authorities, rollout authorities, or sources of operational evidence."
  - "Hosted logout and account switching MUST remove active session authority before remote token revocation; failed GitHub revocations MUST retain encrypted credentials in the selected operational pending-revocation queue for bounded maintenance retries through credential expiry; Redis and PostgreSQL retries survive restart, while the explicitly acknowledged memory exception is process-lifetime only."
  - "Hosted session encryption MUST identify the active key and support one explicitly configured previous key during controlled rotation; the previous key MUST remain available until sessions and revocation records using it drain."
  - "OAuth refresh MUST atomically compare-and-swap the encrypted session record; a refresh superseded by logout or another refresh MUST revoke or stage its newly issued credentials under the selected persistence guarantee and MUST NOT restore session authority."
  - "GitHub webhook deliveries MUST be signature-verified and deduplicated before reconciliation; collection delivery deduplication and task admission MUST commit atomically under the selected persistence guarantee. Verified issue lifecycle deliveries for enrolled repositories enqueue collection rather than directly mutating stored issue entities."
  - "Redis and PostgreSQL server collection MUST remain at-least-once across restart; memory applies only within one process lifetime: retry, deferral, blocked requeue, malformed-entry, and dead-letter transitions MUST append durable replacement state before ACK in one operational transition; worker crashes and ambiguous ACK failures MAY repeat safe collection."
  - "Delivery recovery MUST persist pagination progress separately from its processed-delivery boundary, resume bounded scans before advancing that boundary, and MUST NOT advance past a failed redelivery request."
  - "Scope withdrawal MUST serialize with enrollment changes and durably enqueue erasure for the exact membership snapshot before removing enrollment; workers MUST serialize erasure with collection under repository leases and recheck current ownership before collecting or erasing."
  - "Workers MUST persist future retries outside the ready stream, promote them only when due, count scheduled work toward queue capacity/depth, preserve leased work on shutdown, and never block ready work while waiting."
  - "The collection task stream MUST apply admission backpressure at its configured capacity and MUST NOT trim undelivered or pending work; completed entries are ACKed and deleted atomically."
  - "Published-snapshot ingestion and server collection are mutually exclusive profiles; configuring both MUST fail at startup, and the published-snapshot profile MUST remain the default with unchanged behavior when collection is unconfigured."
  - "Server collection MUST write repository and inventory evidence in the published snapshot layout and project it through the same ingestion pipeline, so a retained evidence lake with valid inventory repopulates a database on cold start without GitHub requests; an empty lake MUST produce valid campaign inventory before its first projection."
  - "Server collection scope MUST derive from GitHub App installations; a delivery for an unenrolled repository MUST be dropped rather than collected, and GitHub budget MUST be reserved per installation before each collection."
  - "The local ingestion simulator MUST use the production webhook admission and collection subprocess path, strict seeded JSON scenarios, synthetic repositories, bounded event/repository/concurrency limits, and MUST NOT be treated as a complete GitHub API emulator or production-capacity guarantee. Enrolled repository lifecycle events MUST queue independently and retain archived/deleted evidence until retention or explicit scope withdrawal."
  - "Server diagnostics MUST be read-only, use stable check identifiers, produce equivalent human-readable and versioned structured reports, redact secrets, bound each dependency check, and require explicit deep mode before reading every active source."
  - "Hosted rebuilds MUST use an owner-checked lock in the selected coordination scope, validate input, and atomically replace current Postgres sources and state; a failed replacement MUST leave the previously committed data intact."
  - "An empty Postgres store is not ready and MUST report that ingestion is required."
  - "Browsers and external clients MUST NOT receive Redis or Postgres endpoints, credentials, keys, or storage-specific representations."
  - "Computations MUST consume canonical evidence, preserve evidence quality and provenance, and emit bounded, versioned results."
  - "Computation results MUST NOT grant authority or turn runtime success into verification, accepted outcomes, or operational value."
  - "Successful-Run value computations MUST report produced outputs, native operational-grader measurements, and efficiency as separate axes; operational value is reserved for package-defined repository campaign metrics, output creation MUST NOT imply acceptance or value, and no composite score may be invented."
  - "Overview counters MUST use IndexedDB-native counts or request-scoped declarative queries; no daily aggregate or computation-result projection is persisted. Clustering and audit diagnosis execute in bounded selected-partition queries."
  - "Materialized computation results MUST remain generation-scoped disposable state; runtime facts and failure scopes are precomputed, while detailed audit causes and actions are cached only for selected or prioritized partitions."
  - "Runtime computation partitions MUST be target-aware for workers: form Campaign, Workflow, and target Repository evaluation partitions before evaluating success boundaries so one target's success cannot mask another target's failures."
  - "Runtime computations MUST evaluate Campaign orchestrators before enumerating worker-target partitions; a failing, unknown, or unobserved orchestrator gates worker evaluation without converting skipped workers into healthy, failed, or not-observed results."
  - "The cao computation namespace exposes production measures; runtime-health selection, joins, and ordering execute through Dashboard Language queries before versioned measure evaluation."
  - "Failure of a downstream computation MUST NOT invalidate a compatible upstream result."
  - "Package problem clustering MUST use bounded, timed, cancelable subprocesses over a private Activity snapshot; require each emitted problem to include an actionable fix prompt; atomically replace only the producer's cao_problems rows; retain prior rows when that producer fails; and remove rows for uninstalled producers."
  - "Dashboard UI effects and components MUST NOT query source data or reconstruct business relationships."
  - "ADRs are durable decision history; current requirements and conformance rules live in specs/ or specification-style documentation."
  - "Generated workflow lock files MUST NOT be edited directly."
  - "The trusted CAO materializer MUST replace bounded campaign-owned destinations with executable resources at the same top-level paths used by their catalog sources; .github/aw MUST remain exclusively gh-aw-owned and MUST NOT become a parallel CAO runtime tree."
  - "CAO runtime materialization MUST use a full immutable resolvedCommit SHA, MUST fail closed for tag-only or missing provenance, and MUST preserve exact focused Activity or Dashboard package ownership when root materialization runs."
  - "Activity and Dashboard artifacts MUST use producer-side npm pack with lifecycle scripts disabled and runtime/package.json files selection, bundle compatible libraries with esbuild and license notices, retain filesystem-relative CLI, worker and build paths, and exclude development resources; packing MUST NOT publish, install dependencies or replace consumer-owned root package metadata."
  - "Quickstart MUST recompile installed workflow sources with --schedule-seed githubnext/gh-aw-cao before committing, matching deterministic lock validation. Validation MUST report a manually paused orchestrator with active workers as a pause note rather than recommending scheduled re-enablement."
  - "Normal root, Activity and Dashboard materialization MUST consume an exact-SHA prebuilt archive from stable release assets or successful unexpired Actions artifacts, wait at most five minutes for an already queued or running exact-SHA build, verify catalog and signer identity plus source and signer SHA through GitHub signed provenance on GitHub-hosted runners before extraction, then validate the inventory, checksums, ownership and required resources before any replacement; failed, missing, expired, timed-out or unverifiable artifacts MUST fail without latest-release or source/npm fallback."
  - "The runtime pipeline MUST build/test with read-only permission on main pushes and attest in a source-free job. The Release workflow MUST create a draft stable tag at an exact main SHA, wait for that SHA's successful cao-runtime.yml push run, verify its checksum and GitHub-hosted signed provenance, attach exactly the runtime archive and checksum to the draft, and fail closed without publication for missing, failed, mismatched, self-hosted, incomplete, or unverifiable evidence. A maintainer publishes only the reviewed, successful draft; immutable release tags and assets MUST NOT be mutated or overwritten after publication. Main artifacts have 90-day retention. Normal installation requires Node.js and authenticated GitHub CLI artifact and attestation access, not npm; explicit developer source materialization may use npm, and dashboard builds retain production dependency installation."
  - "The setup prompt adapter MUST use Node terminal primitives without third-party UI dependencies; producer and explicit developer source packing MUST preserve it as portable source without consumer node_modules."
  - "Onboarding MUST check tools, Node.js 24+, sign-in and checkout-root readiness before installation; private repository creation requires explicit --create-repo OWNER/NAME and MUST NOT overwrite existing clone directories. After those checks and before repository creation or file installation, implicit --quickstart MUST resolve and pin the latest stable CAO vX.Y.Z release, install or refresh owned CAO resources at that release, fail without mutation or main fallback when release resolution is unavailable or non-stable, and preserve any explicit @main, tag, SHA, or local source; bare installation and setup retain their existing unversioned source behavior. Bare installation prints the setup next step without a handoff prompt; streamed children use null stdin except explicitly requested --setup and interactive --quickstart on the controlling terminal. ACCESSIBLE, NO_COLOR, and terminals without styling support disable animated presentation. Without a terminal or when CI is set, installation with --setup MUST apply only the exact public-repository workflow-token profile with plain output; explicit --quickstart MAY instead use a clean current default-branch checkout with plain progress. Incompatible prerequisites MUST still fail."
  - "Setup presentation MUST remain separate from authority decisions, show Repositories, Connections and Review/apply with default-No confirmation, verify Pages source without changing visibility, require separate default-No public-dashboard consent before credentials, and save policy atomically only after both succeed. Declining/cancelling public consent removes only a newly created site where possible; existing sites remain with restriction/unpublication guidance. Failures MUST disclose partial external changes. Setup MUST NOT install campaigns, dispatch, commit or push; --json retains structured stdout. Non-interactive setup, including CI, MUST require a public control repository with empty campaigns and absent or exact self-only scope, verify public Actions-backed Pages, select repository workflow-token authentication, set self-only Activity scope, preserve unrelated policy fields, and write policy last; private/internal repositories or incompatible policy MUST fail before external mutation."
  - "Explicit quickstart MUST work interactively or headlessly from a clean public/private/internal control checkout on its default branch, preserve existing commits, use the installer's stable release or an explicit selected catalog source, and disclose public Pages and ordinary Repo Assist budgets. Never suggest or infer owners, control-repository names, targets, or generated fallback coordinates. Outside a connected checkout require --create-repo OWNER/NAME or manual interactive owner/name entry without defaults; blank input selects nothing. Reject occupied coordinates/clone paths and lookup failures without mutation, renaming, reuse, or overwrite. In-place connection checks remote-name availability without rejecting its working directory. Installation and --wait require explicit public --target OWNER/REPO before mutation; later stages reuse the sole committed policy target. Never create/copy/modify/substitute a target. Install repo-assist at the same catalog revision without reimporting root. Use normal dispatch inputs and only existing maintenance at review, explicitly disabling other workers. No onboarding-only worker, snapshot helper, execution profile, or readiness assessment. Preserve normal checkout/base SHA, duplicate checks, implementation, focused validation and review bundles. Produce one optional validated proposal or honest no-op; unavailable evidence is incomplete. No tests/CI/instruction/adoption gate; admission depends on policy/access. Ordinary budgets are 250 orchestration + 600 maintenance + 400 output checking by default; output checking is configurable, so disclose the 1,250-credit default total without claiming measured/expected consumption or a 100-credit cap. Default install commits bounded configuration, pauses Repo Assist, and returns without dispatching or waiting. Separate --step run revalidates installed policy without widening scope, enables one dispatch, and pauses the orchestrator immediately afterward including on dispatch failure; disabling does not cancel requested work. --step collect dispatches Activity after the operator inspects the outcome; run and collect return Actions links without remote waits and repeating them requests new work. Read-only --step dashboard verifies data-bearing Activity plus a subsequent successful deployment, returning pending without polling otherwise; it is safe to repeat. No local checkpoint grants authority. Explicit --wait retains end-to-end installation and remote waits immediately after bare installation, not resume/status behavior. Surface pause failures; explicit re-enablement also resumes schedule. Preserve terminal/plain progress without Node experimental-runtime diagnostics, require public Actions-backed Pages, refuse pre-staged/unrelated changes, commit/push only .github, activity, dashboard, repo-assist, cao.sh, .gitattributes and .vscode/settings.json, dispatch at most one maintenance worker per requested run, and preserve blocked/incomplete/failed/no-op outcomes. Ordinary install/setup MUST NOT inherit these effects. Runtime success is not proof of a proposal, applied change or operational value."
  - "control-plane.activity.repositories MUST be a nonempty exact subset of globally allowed repositories; Activity authentication uses it as the declared evidence-collection scope when present and otherwise preserves fail-closed global-scope behavior. It MUST NOT grant campaign rollout authority or credential reach."
  - "The Agent Plugin is distributed separately; the installer MUST add the repository-root aw.yml package, which MUST explicitly compose only Activity, dashboard, validation, five shared control-plane resources, seven portable control-repository skills including the Agentic Workflows router, one Agentic Workflows agent and gh-aw project settings. The portable router MUST load the current canonical upstream Agentic Workflows skill from main instead of copying its routing table, fail explicitly when that guidance cannot be loaded, and constrain version-sensitive behavior through the control repository's policy-pinned gh aw CLI; the custom agent MUST delegate to the installed router rather than maintain a second routing table. CAO skills MUST delegate parsing, mutation, compilation, querying and verification to deterministic gh aw, cao and repository validation commands. The nonempty agents declaration MUST list only .github/agents/agentic-workflows.md so agent auto-discovery cannot install repository-only agents. Because gh-aw v0.91.5 auto-scans root skills/ after resolving explicit declarations, that directory MUST contain only the seven declared portable control-repository skills. The installer MUST NOT install plugin manifests, Copilot extensions, bundled specifications or repository-only dashboard authoring skills, and MUST preserve pre-existing plugin resources outside owned runtime destinations. Additional package manifests MUST live only in campaign or component directories."
  - "Operational campaign manifests MUST contain only campaign-owned workflows and catalog resources and MUST NOT import the root catalog package; cao add is the supported lifecycle boundary after control-plane installation and MUST materialize the selected canonical campaign runtime without reinstalling control-plane or Agent Plugin resources."
  - "Activity and Dashboard manifests are root-package components; direct component installation is incomplete because gh-aw cannot invoke canonical runtime materialization."
  - "Installed campaign records MUST be updated through gh-aw campaign commands."
  - "The repository-layout and installation specification defines canonical runtime ownership, immutable materialization, and fail-closed installation lifecycle requirements."
  - "Policy and workflow changes MUST be committed together."
  - "Upstash mode MUST run exactly one application replica, serialize every Redis operation through one TCP session, fail closed after transport loss, isolate every process start in a fresh namespace except for its stable encrypted pending-revocation queue, and use artifact ingestion rather than server-side collection."
  - "Every server host integration MUST select a validated provider-agnostic capability profile covering authentication, listener ownership, HTTPS and proxy trust, operational scope and persistence, namespace isolation, replica constraints, and collection support; startup MUST reject incompatible services. Redis session/client details remain construction-time provider constraints."
  - "control-plane.web.host MUST compose one app server target with a selected operational backend (Redis by default); Redis selection MUST resolve one declarative provider module; it MAY name environment variables for generic Redis and TLS inputs but MUST NOT contain secrets or add provider-specific request handling."
  - "Marketplace registry order defines precedence; the official registry is removable configuration rather than hard-coded resolver behavior."
  - "Marketplace registry authentication MUST reference secrets, remain registry-scoped in trusted Activity or hosted resolvers, and MUST NOT enter manifests, canonical package records, IndexedDB, query payloads, or UI state."
  - "Static and hosted marketplace resolvers MUST produce the same normalized package contract; failure of one registry MUST NOT make other registries unavailable."
  - "Marketplace UI access MUST cross the existing data-worker query boundary and package actions MUST be copy-only canonical CAO add commands; the dashboard MUST NOT install packages."

