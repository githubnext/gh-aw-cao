name: Enterprise review stress

on:
  workflow_dispatch:
    inputs:
      bundle:
        description: Campaign orchestrator to exercise
        required: true
        type: choice
        options: [uk-ai-advisory, dependabot, optimization]
      target_repo:
        description: Dedicated OWNER/REPO canary target
        required: true
        type: string
      safe_output_repo:
        description: Dedicated private review repository
        required: true
        type: string
      runs:
        description: Concurrent review runs
        required: true
        default: "3"
        type: choice
        options: [2, 3, 5]
      confirmation:
        description: STRESS OWNER/REPO REVIEW OWNER/REPO RUNS
        required: true
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: enterprise-stress-${{ inputs.bundle }}-${{ inputs.target_repo }}
  cancel-in-progress: false

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: central-agentic-ops-${{ 'stress' }} # zizmor: ignore[obfuscation] - Keep the protected-environment expression aligned with the canary workflow contract.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run bounded review stress canary
        env:
          BUNDLE: ${{ inputs.bundle }}
          CONFIRMATION: ${{ inputs.confirmation }}
          CONTROL_REF: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GH_AW_E2E_TOKEN || github.token }}
          RUNS: ${{ inputs.runs }}
          SAFE_OUTPUT_REPO: ${{ inputs.safe_output_repo }}
          TARGET_REPO: ${{ inputs.target_repo }}
        run: |
          bash tests/e2e/run-stress.sh