name: Go Extension CI

on:
  pull_request:
    paths:
      - .github/workflows/go-extension.yml
      - .github/workflows/cao.json
      - .github/actions/setup-gh-aw/**
      - .golangci.yml
      - cmd/**
      - internal/**
      - go.mod
      - go.sum
      - Makefile
      - scripts/build-release.sh
      - tests/unit/build-release.test.mjs
      - activity/**
      - dashboard/site/src/agent/**
      - dashboard/site/dashboard.json
      - dashboard/site/dashboard-fragments/**
      - dashboard/report/bundle-dashboards.mjs
  push:
    branches: [main]
    paths:
      - .github/workflows/go-extension.yml
      - .github/workflows/cao.json
      - .github/actions/setup-gh-aw/**
      - .golangci.yml
      - cmd/**
      - internal/**
      - go.mod
      - go.sum
      - Makefile
      - scripts/build-release.sh
      - tests/unit/build-release.test.mjs
      - activity/**
      - dashboard/site/src/agent/**
      - dashboard/site/dashboard.json
      - dashboard/site/dashboard-fragments/**
      - dashboard/report/bundle-dashboards.mjs

permissions:
  contents: read

concurrency:
  group: go-extension-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  extension-quality:
    name: Format, lint, vet, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - name: Check formatting
        shell: bash
        run: |
          golangci-lint fmt --diff ./cmd/... ./internal/... | tee "$RUNNER_TEMP/go-extension-fmt.diff"
          test ! -s "$RUNNER_TEMP/go-extension-fmt.diff"
      - name: Lint
        run: golangci-lint run ./cmd/... ./internal/...
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Check extension
        run: make check
      - name: Check foreground terminal inheritance
        env:
          CAO_REQUIRE_TTY_TEST: "1"
        run: |
          go test -c -o "$RUNNER_TEMP/cao-runtimecli.test" ./internal/runtimecli
          cd "$RUNNER_TEMP"
          # Keep stdin open while the foreground reader consumes the fixture.
          { printf 'terminal-input\n'; sleep 1; } | script --quiet --return --command \
            './cao-runtimecli.test -test.run "^TestForegroundTerminal$" -test.count=1 -test.v' /dev/null
      - name: Smoke test extension
        run: |
          ./gh-cao --help
          ./gh-cao version
          ./gh-cao doctor --help
          ./gh-cao quickstart --help
          ./gh-cao setup-auth token --help
          ./gh-cao pages --json > /dev/null

  extension-authtests:
    name: Doctor authenticated integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install policy-pinned gh-aw
        uses: ./.github/actions/setup-gh-aw # zizmor: ignore[self-repository] - Local actions use the syntax accepted by GitHub Actions and actionlint.
      - name: Run authenticated doctor integration tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: make authtests
