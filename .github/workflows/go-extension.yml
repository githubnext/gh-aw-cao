name: Go Extension CI

on:
  pull_request:
    paths:
      - .github/workflows/go-extension.yml
      - .github/workflows/cao.json
      - .github/actions/setup-gh-aw/**
      - .golangci.yml
      - cmd/**
      - internal/**
      - dashboard/catalog.go
      - go.mod
      - go.sum
      - package.json
      - package-lock.json
      - Makefile
      - scripts/build-release.sh
      - tests/unit/build-release.test.mjs
      - activity/**
      - dashboard/site/src/agent/**
      - dashboard/site/src/data/**
      - dashboard/site/src/semantic-view-prompt.js
      - dashboard/site/dashboard.json
      - dashboard/site/dashboard-fragments/**
      - dashboard/report/bundle-dashboards.mjs
  push:
    branches: [main]
    paths:
      - .github/workflows/go-extension.yml
      - .github/workflows/cao.json
      - .github/actions/setup-gh-aw/**
      - .golangci.yml
      - cmd/**
      - internal/**
      - dashboard/catalog.go
      - go.mod
      - go.sum
      - package.json
      - package-lock.json
      - Makefile
      - scripts/build-release.sh
      - tests/unit/build-release.test.mjs
      - activity/**
      - dashboard/site/src/agent/**
      - dashboard/site/src/data/**
      - dashboard/site/src/semantic-view-prompt.js
      - dashboard/site/dashboard.json
      - dashboard/site/dashboard-fragments/**
      - dashboard/report/bundle-dashboards.mjs

permissions:
  contents: read

concurrency:
  group: go-extension-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  extension-quality:
    name: Format, lint, vet, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - name: Check formatting
        shell: bash
        run: |
          golangci-lint fmt --diff ./cmd/... ./internal/... ./dashboard | tee "$RUNNER_TEMP/go-extension-fmt.diff"
          test ! -s "$RUNNER_TEMP/go-extension-fmt.diff"
      - name: Lint
        run: golangci-lint run ./cmd/... ./internal/... ./dashboard
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install JavaScript parity-oracle dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check extension
        run: make check
      - name: Check standalone execution without Node.js
        run: |
          binary="$PWD/gh-cao"
          cd "$RUNNER_TEMP"
          PATH="" "$binary" version
          PATH="" "$binary" pages --json > /dev/null
          PATH="" "$binary" queries --json > /dev/null
          PATH="" "$binary" query-info campaign-runs --json > /dev/null
          PATH="" "$binary" query --database explicit.sqlite --collection runs
      - name: Smoke test extension
        run: |
          ./gh-cao --help
          ./gh-cao version
          ./gh-cao doctor --help
          ./gh-cao quickstart --help
          ./gh-cao setup --help
          ./gh-cao setup auth --help
          ./gh-cao setup auth github-app --help
          ./gh-cao setup auth enterprise-app --help
          ./gh-cao setup auth token --help
          ./gh-cao pages --json > /dev/null

  extension-authtests:
    name: Doctor authenticated integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install policy-pinned gh-aw
        uses: ./.github/actions/setup-gh-aw # zizmor: ignore[self-repository] - Local actions use the syntax accepted by GitHub Actions and actionlint.
      - name: Run authenticated doctor integration tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: make authtests
