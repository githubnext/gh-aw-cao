name: CAO Activity

run-name: CAO Activity / ${{ inputs.request-id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      request-id:
        description: Correlation identifier supplied by a dispatching workflow.
        required: false
        type: string
  push:
    paths:
      - .github/workflows/cao.json
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: central-agentic-ops-activity
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout trusted activity source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Resolve activity cache key
        id: activity-cache-key
        run: echo "value=cao-activity-v3-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token for activity
        id: activity-app-token
        env:
          GH_AW_IGNORE_IF_MISSING_PRIVATE_KEY: ${{ secrets.GH_AW_GITHUB_READ_APP_PRIVATE_KEY }}
        if: ${{ vars.GH_AW_GITHUB_READ_APP_ID != '' && env.GH_AW_IGNORE_IF_MISSING_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_AW_GITHUB_READ_APP_ID }}
          private-key: ${{ secrets.GH_AW_GITHUB_READ_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          github-api-url: ${{ github.api_url }}
          permission-actions: read
          permission-contents: read

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Resolve CAO control source
        id: cao-control-source
        shell: bash
        run: |
          set -euo pipefail
          node <<'EOF'
          const fs = require("node:fs");
          const path = require("node:path");
          const recordsDirectory = ".github/aw/packages";
          const record = (fs.existsSync(recordsDirectory) ? fs.readdirSync(recordsDirectory) : [])
            .filter((name) => name.endsWith(".json"))
            .map((name) => JSON.parse(fs.readFileSync(path.join(recordsDirectory, name), "utf8")))
            .find((candidate) => candidate.files?.some((file) =>
              file.destination === ".github/workflows/activity.yml"));
          if (!record) {
            const runtime = path.join(process.env.GITHUB_WORKSPACE,
              ".github/workflows/shared/control.mjs");
            if (!fs.existsSync(runtime)) throw new Error("CAO control runtime is unavailable");
            fs.appendFileSync(process.env.GITHUB_OUTPUT,
              `external=false\nruntime=${runtime}\n`);
            process.exit(0);
          }
          const match = record?.source?.match(/^([A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+)(?:\/[A-Za-z0-9_./-]+)?@([0-9a-fA-F]{40,64})$/);
          if (!match) throw new Error("cannot resolve immutable CAO source from package ownership");
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            `external=true\nrepository=${match[1]}\nref=${match[2]}\n` +
            `runtime=${process.env.GITHUB_WORKSPACE}/.cao-runtime/.github/workflows/shared/control.mjs\n`);
          EOF

      - name: Checkout installed CAO control source
        if: ${{ steps.cao-control-source.outputs.external == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.cao-control-source.outputs.repository }}
          ref: ${{ steps.cao-control-source.outputs.ref }}
          path: .cao-runtime
          sparse-checkout: .github/workflows/shared
          sparse-checkout-cone-mode: true
          fetch-depth: 1
          persist-credentials: false
          token: ${{ github.token }}

      - name: Resolve gh-aw compiler version
        id: compiler
        run: |
          version="$(node "${{ steps.cao-control-source.outputs.runtime }}" compiler-version .github/workflows/cao.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install gh-aw CLI
        continue-on-error: true
        uses: github/gh-aw-actions/setup-cli@74929b772fd7d9dddf663dc49e01f470d8458310 # v0.89.9
        with:
          version: ${{ steps.compiler.outputs.version }}

      - name: Restore activity cache
        id: activity-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cao-activity/gh-aw-logs.jsonl
            ${{ runner.temp }}/cao-activity/gh-aw-logs.sqlite
            ${{ runner.temp }}/cao-activity/control-settings.json
            ${{ runner.temp }}/cao-activity/inventory-sources.json
            ${{ runner.temp }}/cao-gh-aw-logs/drain3_weights.json
          key: ${{ steps.activity-cache-key.outputs.value }}
          restore-keys: |
            cao-activity-v3-

      - name: Collect dashboard inventory
        env:
          REPORT_CONTROL_SETTINGS: ${{ runner.temp }}/cao-activity/control-settings.json
          REPORT_INVENTORY: ${{ runner.temp }}/cao-activity/control-plane-inventory.json
          REPORT_INVENTORY_SOURCES: ${{ runner.temp }}/cao-activity/inventory-sources.json
        run: |
          rm -f "$REPORT_CONTROL_SETTINGS" "$REPORT_INVENTORY" "$REPORT_INVENTORY_SOURCES"
          if [[ -f activity/inventory-sources.mjs ]]; then
            activity_root=activity
          elif [[ -f .github/aw/activity/inventory-sources.mjs ]]; then
            activity_root=.github/aw/activity
          else
            echo "Activity inventory collector is unavailable" >&2
            exit 1
          fi
          control_runtime="${{ steps.cao-control-source.outputs.runtime }}"
          if [[ ! -f "$control_runtime" ]]; then
            echo "CAO control runtime is unavailable" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/cao-activity"
          node "$activity_root/control-settings.mjs" \
            "$control_runtime" \
            .github/workflows/cao.json \
            "$REPORT_CONTROL_SETTINGS"
          node "$activity_root/inventory.mjs"
          node "$activity_root/inventory-sources.mjs"

      - name: Download agentic workflow logs
        env:
          GH_TOKEN: ${{ steps.activity-app-token.outputs.token || github.token }}
          REPORT_AIC_CACHE: ${{ runner.temp }}/cao-gh-aw-logs
          REPORT_GH_AW_LOGS: ${{ runner.temp }}/cao-activity/gh-aw-logs.jsonl
          REPORT_RUN_WINDOW_DAYS: "30"
        run: |
          mkdir -p "$(dirname "$REPORT_GH_AW_LOGS")"
          touch "$REPORT_GH_AW_LOGS"
          drain3_args=()
          if [[ -f "$REPORT_AIC_CACHE/drain3_weights.json" ]]; then
            drain3_args+=(--drain3-weights "$REPORT_AIC_CACHE/drain3_weights.json")
          fi
          targets=()
          for workflow in .github/workflows/*.lock.yml; do
            [[ -f "$workflow" ]] || continue
            targets+=("${GITHUB_REPOSITORY}/${workflow}")
          done
          gh aw logs --audit \
            --output "$REPORT_AIC_CACHE" \
            --summary-file "" \
            --cached-jsonl "$REPORT_GH_AW_LOGS" \
            --artifacts usage \
            --start-date "-${REPORT_RUN_WINDOW_DAYS}d" \
            --cache-before "-${REPORT_RUN_WINDOW_DAYS}d" \
            --count 1000 \
            --timeout 15 \
            --max-github-api-rate-limit -2000 \
            --max-storage 1200 \
            --prune-older-runs \
            "${drain3_args[@]}" \
            "${targets[@]}"

      - name: Ingest activity database
        env:
          ACTIVITY_DATABASE: ${{ runner.temp }}/cao-activity/gh-aw-logs.sqlite
          REPORT_GH_AW_LOGS: ${{ runner.temp }}/cao-activity/gh-aw-logs.jsonl
        run: |
          if [[ -f activity/cao.mjs ]]; then
            ingestion_script=activity/cao.mjs
          elif [[ -f .github/aw/activity/cao.mjs ]]; then
            ingestion_script=.github/aw/activity/cao.mjs
          else
            echo "Activity SQLite ingestion pipeline is unavailable" >&2
            exit 1
          fi
          node "$ingestion_script" ingest-jsonl \
            --database "$ACTIVITY_DATABASE" \
            --input "$REPORT_GH_AW_LOGS" \
            --run-retention-days all
          node "$ingestion_script" doctor \
            --database "$ACTIVITY_DATABASE" \
            --run-ttl-days all

      - name: Save activity cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cao-activity/gh-aw-logs.jsonl
            ${{ runner.temp }}/cao-activity/gh-aw-logs.sqlite
            ${{ runner.temp }}/cao-activity/control-settings.json
            ${{ runner.temp }}/cao-activity/inventory-sources.json
            ${{ runner.temp }}/cao-gh-aw-logs/drain3_weights.json
          key: ${{ steps.activity-cache-key.outputs.value }}
