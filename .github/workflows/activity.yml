name: CAO Activity

run-name: CAO Activity / ${{ inputs.request-id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      request-id:
        description: Correlation identifier supplied by a dispatching workflow.
        required: false
        type: string
  push:
    paths:
      - .github/workflows/cao.json
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: central-agentic-ops-activity
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout trusted activity source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Resolve activity cache key
        id: activity-cache-key
        run: echo "value=cao-activity-v3-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Resolve dashboard control settings
        id: activity-settings
        env:
          REPORT_CONTROL_SETTINGS: ${{ runner.temp }}/cao-activity/control-settings.json
        run: |
          mkdir -p "$RUNNER_TEMP/cao-activity"
          if [[ -f activity/control-settings.mjs ]]; then
            activity_root=activity
          elif [[ -f .github/aw/activity/control-settings.mjs ]]; then
            activity_root=.github/aw/activity
          else
            echo "Activity control settings resolver is unavailable" >&2
            exit 1
          fi
          node "$activity_root/control-settings.mjs" \
            .github/cao/src/control.mjs \
            .github/workflows/cao.json \
            "$REPORT_CONTROL_SETTINGS"
          {
            echo "repositories<<EOF"
            jq -r --arg owner "${GITHUB_REPOSITORY_OWNER,,}" --arg control "$GITHUB_REPOSITORY" \
              'if (.allowed_repositories | length) > 0 then
                ([.allowed_repositories[] | select((split("/")[0] | ascii_downcase) == $owner) | split("/")[1]]
                  + [($control | split("/")[1])]) | unique[]
               else empty end' \
              "$REPORT_CONTROL_SETTINGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token for activity
        id: activity-app-token
        env:
          GH_AW_IGNORE_IF_MISSING_PRIVATE_KEY: ${{ secrets.GH_AW_GITHUB_READ_APP_PRIVATE_KEY }}
        if: ${{ vars.GH_AW_GITHUB_READ_APP_ID != '' && env.GH_AW_IGNORE_IF_MISSING_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_AW_GITHUB_READ_APP_ID }}
          private-key: ${{ secrets.GH_AW_GITHUB_READ_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.activity-settings.outputs.repositories }}
          github-api-url: ${{ github.api_url }}
          permission-actions: read
          permission-contents: read

      - name: Install gh-aw CLI
        continue-on-error: true
        uses: ./.github/actions/setup-gh-aw
        env:
          GH_TOKEN: ${{ steps.activity-app-token.outputs.token || github.token }}

      - name: Restore activity cache
        id: activity-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cao-activity/gh-aw-logs.jsonl
            ${{ runner.temp }}/cao-activity/gh-aw-logs.sqlite
            ${{ runner.temp }}/cao-activity/control-settings.json
            ${{ runner.temp }}/cao-activity/inventory-sources.json
            ${{ runner.temp }}/cao-gh-aw-logs/drain3_weights.json
          key: ${{ steps.activity-cache-key.outputs.value }}
          restore-keys: |
            cao-activity-v3-

      - name: Collect dashboard inventory
        env:
          GH_TOKEN: ${{ steps.activity-app-token.outputs.token || github.token }}
          REPORT_CONTROL_SETTINGS: ${{ runner.temp }}/cao-activity/control-settings.json
          REPORT_INVENTORY: ${{ runner.temp }}/cao-activity/control-plane-inventory.json
          REPORT_INVENTORY_SOURCES: ${{ runner.temp }}/cao-activity/inventory-sources.json
        run: |
          rm -f "$REPORT_INVENTORY" "$REPORT_INVENTORY_SOURCES"
          if [[ -f activity/inventory-sources.mjs ]]; then
            activity_root=activity
          elif [[ -f .github/aw/activity/inventory-sources.mjs ]]; then
            activity_root=.github/aw/activity
          else
            echo "Activity inventory collector is unavailable" >&2
            exit 1
          fi
          node "$activity_root/inventory.mjs"
          node "$activity_root/inventory-sources.mjs"

      - name: Download agentic workflow logs
        env:
          GH_TOKEN: ${{ steps.activity-app-token.outputs.token || github.token }}
          REPORT_AIC_CACHE: ${{ runner.temp }}/cao-gh-aw-logs
          REPORT_GH_AW_LOGS: ${{ runner.temp }}/cao-activity/gh-aw-logs.jsonl
          REPORT_RUN_WINDOW_DAYS: "30"
        run: |
          mkdir -p "$(dirname "$REPORT_GH_AW_LOGS")"
          touch "$REPORT_GH_AW_LOGS"
          drain3_args=()
          if [[ -f "$REPORT_AIC_CACHE/drain3_weights.json" ]]; then
            drain3_args+=(--drain3-weights "$REPORT_AIC_CACHE/drain3_weights.json")
          fi
          targets=()
          for workflow in .github/workflows/*.lock.yml; do
            [[ -f "$workflow" ]] || continue
            targets+=("${GITHUB_REPOSITORY}/${workflow}")
          done
          gh aw logs --audit \
            --output "$REPORT_AIC_CACHE" \
            --summary-file "" \
            --cached-jsonl "$REPORT_GH_AW_LOGS" \
            --artifacts usage \
            --start-date "-${REPORT_RUN_WINDOW_DAYS}d" \
            --cache-before "-${REPORT_RUN_WINDOW_DAYS}d" \
            --count 1000 \
            --timeout 15 \
            --max-github-api-rate-limit -2000 \
            --max-storage 1200 \
            --prune-older-runs \
            "${drain3_args[@]}" \
            "${targets[@]}"

      - name: Ingest activity database
        env:
          ACTIVITY_DATABASE: ${{ runner.temp }}/cao-activity/gh-aw-logs.sqlite
          REPORT_GH_AW_LOGS: ${{ runner.temp }}/cao-activity/gh-aw-logs.jsonl
        run: |
          if [[ -f activity/cao.mjs ]]; then
            ingestion_script=activity/cao.mjs
          elif [[ -f .github/aw/activity/cao.mjs ]]; then
            ingestion_script=.github/aw/activity/cao.mjs
          else
            echo "Activity SQLite ingestion pipeline is unavailable" >&2
            exit 1
          fi
          node "$ingestion_script" ingest-jsonl \
            --database "$ACTIVITY_DATABASE" \
            --input "$REPORT_GH_AW_LOGS" \
            --run-retention-days all
          node "$ingestion_script" doctor \
            --database "$ACTIVITY_DATABASE" \
            --run-ttl-days all

      - name: Save activity cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cao-activity/gh-aw-logs.jsonl
            ${{ runner.temp }}/cao-activity/gh-aw-logs.sqlite
            ${{ runner.temp }}/cao-activity/control-settings.json
            ${{ runner.temp }}/cao-activity/inventory-sources.json
            ${{ runner.temp }}/cao-gh-aw-logs/drain3_weights.json
          key: ${{ steps.activity-cache-key.outputs.value }}
