name: CAO Activity

run-name: CAO Activity / ${{ inputs.request-id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      request-id:
        description: Correlation identifier supplied by a dispatching workflow.
        required: false
        type: string
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: central-agentic-ops-activity
  cancel-in-progress: true

jobs:
  index:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout trusted activity source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Resolve activity cache key
        id: activity-cache-key
        run: echo "value=cao-activity-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token for activity
        id: activity-app-token
        env:
          GH_AW_IGNORE_IF_MISSING_PRIVATE_KEY: ${{ secrets.GH_AW_GITHUB_READ_APP_PRIVATE_KEY }}
        if: ${{ vars.GH_AW_GITHUB_READ_APP_ID != '' && env.GH_AW_IGNORE_IF_MISSING_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_AW_GITHUB_READ_APP_ID }}
          private-key: ${{ secrets.GH_AW_GITHUB_READ_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          github-api-url: ${{ github.api_url }}
          permission-actions: read
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read

      - name: Restore activity cache
        id: activity-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cao-activity
          key: ${{ steps.activity-cache-key.outputs.value }}
          restore-keys: |
            cao-activity-

      - name: Resolve activity indexer
        run: |
          if [[ -f .github/aw/activity/index.mjs ]]; then
            echo "ACTIVITY_INDEXER=.github/aw/activity/index.mjs" >> "$GITHUB_ENV"
            echo "GITHUB_TELEMETRY=.github/aw/activity/github-telemetry.mjs" >> "$GITHUB_ENV"
          elif [[ -f activity/index.mjs ]]; then
            echo "ACTIVITY_INDEXER=activity/index.mjs" >> "$GITHUB_ENV"
            echo "GITHUB_TELEMETRY=activity/github-telemetry.mjs" >> "$GITHUB_ENV"
          else
            echo "Activity indexer is unavailable" >&2
            exit 1
          fi

      - name: Restore recent GitHub API telemetry
        run: node "$GITHUB_TELEMETRY" prepare "$RUNNER_TEMP/cao-activity/cao-gh.jsonl"

      - name: Resolve dashboard collectors
        run: |
          if [[ -f .github/aw/dashboard/report/records.mjs ]]; then
            echo "DASHBOARD_REPORT_ROOT=.github/aw/dashboard/report" >> "$GITHUB_ENV"
          elif [[ -f dashboard/report/records.mjs ]]; then
            echo "DASHBOARD_REPORT_ROOT=dashboard/report" >> "$GITHUB_ENV"
          else
            echo "DASHBOARD_COLLECTION=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "DASHBOARD_COLLECTION=true" >> "$GITHUB_ENV"

      - name: Resolve authoritative control policy
        if: env.DASHBOARD_COLLECTION == 'true'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node "$DASHBOARD_REPORT_ROOT/control-settings.mjs" \
            .github/cao/src/control.mjs \
            .github/workflows/cao.json \
            "$RUNNER_TEMP/cao-activity/control-settings.json"

      - name: Extract control-plane inventory
        if: env.DASHBOARD_COLLECTION == 'true'
        env:
          REPORT_INVENTORY: ${{ runner.temp }}/cao-activity/control-plane-inventory.json
        run: node "$DASHBOARD_REPORT_ROOT/inventory.mjs"

      - name: Refresh activity index
        id: refresh-activity
        env:
          GITHUB_TOKEN: ${{ steps.activity-app-token.outputs.token || github.token }}
          CAO_GITHUB_TOKEN_TYPE: ${{ steps.activity-app-token.outputs.token != '' && 'app' || 'builtin' }}
          CAO_ACTIVITY_CACHE_KEY: ${{ steps.activity-cache-key.outputs.value }}
          CAO_ACTIVITY_CACHE_MATCHED_KEY: ${{ steps.activity-cache.outputs.cache-matched-key }}
          REPORT_CONTROL_POLICY: .github/workflows/cao.json
          REPORT_DEPLOYED_WORKFLOWS: ${{ runner.temp }}/cao-activity/deployed-workflows.json
          REPORT_RUN_WINDOW_HOURS: "720"
        run: |
          node "$GITHUB_TELEMETRY" before refresh-activity || true
          node "$ACTIVITY_INDEXER"

      - name: Record activity refresh GitHub API state
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.activity-app-token.outputs.token || github.token }}
          CAO_GITHUB_TOKEN_TYPE: ${{ steps.activity-app-token.outputs.token != '' && 'app' || 'builtin' }}
          CAO_ACTIVITY_CACHE_KEY: ${{ steps.activity-cache-key.outputs.value }}
          CAO_ACTIVITY_CACHE_MATCHED_KEY: ${{ steps.activity-cache.outputs.cache-matched-key }}
          CAO_OPERATION_OUTCOME: ${{ steps.refresh-activity.outcome }}
        run: node "$GITHUB_TELEMETRY" after refresh-activity

      - name: Install gh-aw CLI
        if: env.DASHBOARD_COLLECTION == 'true'
        uses: github/gh-aw-actions/setup-cli@23e16337f3568b3c18bb04a976793f282a016755 # v0.88.4
        env:
          GH_TOKEN: ${{ steps.activity-app-token.outputs.token || github.token }}
        with:
          version: v0.88.4

      - name: Restore operational-value observation cache
        if: env.DASHBOARD_COLLECTION == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/dashboard-operational-values
          key: ${{ runner.os }}-dashboard-operational-values-${{ github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-dashboard-operational-values-${{ github.repository }}-

      - name: Collect AI Credit usage
        id: collect-aic-usage
        if: env.DASHBOARD_COLLECTION == 'true'
        env:
          GH_TOKEN: ${{ steps.activity-app-token.outputs.token || github.token }}
          CAO_GITHUB_TOKEN_TYPE: ${{ steps.activity-app-token.outputs.token != '' && 'app' || 'builtin' }}
          CAO_ACTIVITY_CACHE_KEY: ${{ steps.activity-cache-key.outputs.value }}
          CAO_ACTIVITY_CACHE_MATCHED_KEY: ${{ steps.activity-cache.outputs.cache-matched-key }}
          REPORT_AIC_USAGE: ${{ runner.temp }}/cao-activity/aic-usage.json
          REPORT_AIC_CACHE: ${{ runner.temp }}/cao-activity/aic-logs
          REPORT_DEPLOYED_WORKFLOWS: ${{ runner.temp }}/cao-activity/deployed-workflows.json
        run: |
          node "$GITHUB_TELEMETRY" before collect-aic-usage || true
          node "$DASHBOARD_REPORT_ROOT/aic-usage.mjs"

      - name: Record AI Credit collection GitHub API state
        if: always() && env.DASHBOARD_COLLECTION == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.activity-app-token.outputs.token || github.token }}
          CAO_GITHUB_TOKEN_TYPE: ${{ steps.activity-app-token.outputs.token != '' && 'app' || 'builtin' }}
          CAO_OPERATION_OUTCOME: ${{ steps.collect-aic-usage.outcome }}
          CAO_ACTIVITY_CACHE_KEY: ${{ steps.activity-cache-key.outputs.value }}
          CAO_ACTIVITY_CACHE_MATCHED_KEY: ${{ steps.activity-cache.outputs.cache-matched-key }}
        run: node "$GITHUB_TELEMETRY" after collect-aic-usage

      - name: Collect operational-value observations
        id: collect-operational-values
        if: env.DASHBOARD_COLLECTION == 'true'
        env:
          GH_TOKEN: ${{ steps.activity-app-token.outputs.token || github.token }}
          CAO_GITHUB_TOKEN_TYPE: ${{ steps.activity-app-token.outputs.token != '' && 'app' || 'builtin' }}
          CAO_ACTIVITY_CACHE_KEY: ${{ steps.activity-cache-key.outputs.value }}
          CAO_ACTIVITY_CACHE_MATCHED_KEY: ${{ steps.activity-cache.outputs.cache-matched-key }}
          REPORT_DEPLOYED_WORKFLOWS: ${{ runner.temp }}/cao-activity/deployed-workflows.json
          REPORT_OPERATIONAL_VALUES: ${{ runner.temp }}/cao-activity/operational-values.json
          REPORT_VALUE_CACHE: .cache/dashboard-operational-values/observations.json
          REPORT_VALUE_CONCURRENCY: "3"
          REPORT_VALUE_REPLAY_CACHE: .cache/dashboard-operational-values/replay
        run: |
          node "$GITHUB_TELEMETRY" before collect-operational-values || true
          node "$DASHBOARD_REPORT_ROOT/operational-values.mjs"

      - name: Record operational-value collection GitHub API state
        if: always() && env.DASHBOARD_COLLECTION == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.activity-app-token.outputs.token || github.token }}
          CAO_GITHUB_TOKEN_TYPE: ${{ steps.activity-app-token.outputs.token != '' && 'app' || 'builtin' }}
          CAO_OPERATION_OUTCOME: ${{ steps.collect-operational-values.outcome }}
          CAO_ACTIVITY_CACHE_KEY: ${{ steps.activity-cache-key.outputs.value }}
          CAO_ACTIVITY_CACHE_MATCHED_KEY: ${{ steps.activity-cache.outputs.cache-matched-key }}
        run: node "$GITHUB_TELEMETRY" after collect-operational-values

      - name: Save operational-value observation cache
        if: always() && env.DASHBOARD_COLLECTION == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/dashboard-operational-values
          key: ${{ runner.os }}-dashboard-operational-values-${{ github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Collect durable dashboard records
        id: collect-dashboard-records
        if: env.DASHBOARD_COLLECTION == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.activity-app-token.outputs.token || github.token }}
          CAO_GITHUB_TOKEN_TYPE: ${{ steps.activity-app-token.outputs.token != '' && 'app' || 'builtin' }}
          CAO_ACTIVITY_CACHE_KEY: ${{ steps.activity-cache-key.outputs.value }}
          CAO_ACTIVITY_CACHE_MATCHED_KEY: ${{ steps.activity-cache.outputs.cache-matched-key }}
          REPORT_CONTROL_SETTINGS: ${{ runner.temp }}/cao-activity/control-settings.json
          REPORT_INVENTORY: ${{ runner.temp }}/cao-activity/control-plane-inventory.json
          REPORT_DEPLOYED_WORKFLOWS: ${{ runner.temp }}/cao-activity/deployed-workflows.json
          REPORT_RECORDS: ${{ runner.temp }}/cao-activity/dashboard-records.json
        run: |
          node "$GITHUB_TELEMETRY" before collect-dashboard-records || true
          node "$DASHBOARD_REPORT_ROOT/records.mjs"

      - name: Record dashboard record collection GitHub API state
        if: always() && env.DASHBOARD_COLLECTION == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.activity-app-token.outputs.token || github.token }}
          CAO_GITHUB_TOKEN_TYPE: ${{ steps.activity-app-token.outputs.token != '' && 'app' || 'builtin' }}
          CAO_OPERATION_OUTCOME: ${{ steps.collect-dashboard-records.outcome }}
          CAO_ACTIVITY_CACHE_KEY: ${{ steps.activity-cache-key.outputs.value }}
          CAO_ACTIVITY_CACHE_MATCHED_KEY: ${{ steps.activity-cache.outputs.cache-matched-key }}
        run: node "$GITHUB_TELEMETRY" after collect-dashboard-records

      - name: Add GitHub API telemetry to activity snapshot
        if: always()
        continue-on-error: true
        run: cp "$RUNNER_TEMP/cao-gh/cao-gh.jsonl" "$RUNNER_TEMP/cao-activity/cao-gh.jsonl"

      - name: Upload GitHub API telemetry
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cao-gh
          path: ${{ runner.temp }}/cao-gh/cao-gh.jsonl
          if-no-files-found: warn
          retention-days: 30

      - name: Save activity cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cao-activity
          key: ${{ steps.activity-cache-key.outputs.value }}
