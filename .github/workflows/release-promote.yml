name: Promote prerelease to latest

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable prerelease tag (vX.Y.Z) to promote
        required: true
        type: string

permissions:
  contents: read

# GitHub.com enforces read-only cache tokens, including for candidate validation.
cache-mode: read

concurrency:
  group: release-latest-promotion
  cancel-in-progress: false

jobs:
  preflight:
    name: Bind prerelease and release evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: read
    outputs:
      revision: ${{ steps.inspect.outputs.revision }}
      snapshot: ${{ steps.inspect.outputs.snapshot }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: inspect
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        with:
          script: |
            const { collectPromotionEvidence } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release-promotion.mjs`);
            const identity = {
              repository: process.env.GITHUB_REPOSITORY, eventName: context.eventName,
              sha: context.sha, ref: context.ref, actor: context.actor,
              triggeringActor: process.env.GITHUB_TRIGGERING_ACTOR,
              runId: context.runId, runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            };
            const snapshot = await collectPromotionEvidence(github.request, identity, process.env.RELEASE_TAG);
            core.setOutput('revision', snapshot.revision);
            core.setOutput('snapshot', JSON.stringify(snapshot));

  contracts:
    name: Validate release contracts
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preflight.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci && npm ci --prefix dashboard/site && npm ci --prefix server/spec
      - uses: ./.github/actions/setup-gh-aw # zizmor: ignore[self-repository] - Local actions use the syntax accepted by GitHub Actions and actionlint.
      - run: npm run check

  dashboard:
    name: Validate release dashboard
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard/site
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preflight.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test && npm run build

  server:
    name: Validate release server
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preflight.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: 1.27.3
          cache: false
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - run: npm run dashboard:server:lint && go -C server test ./...

  evidence:
    name: Record promotion evidence for review
    needs: [preflight, contracts, dashboard, server]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record exact candidate and successful validation
        env:
          SNAPSHOT: ${{ needs.preflight.outputs.snapshot }}
          VALIDATION: ${{ toJSON(needs) }}
        run: |
          mkdir -p "$RUNNER_TEMP/promotion"
          printf '%s\n' "$SNAPSHOT" > "$RUNNER_TEMP/promotion/candidate.json"
          printf '%s\n' "$VALIDATION" > "$RUNNER_TEMP/promotion/validation.json"
          {
            echo "## Prerelease-to-latest approval"
            echo 'Review the exact candidate, notes digest, immutable asset digests, and CodeQL analysis IDs:'
            echo '```json'
            jq . "$RUNNER_TEMP/promotion/candidate.json"
            echo '```'
            echo 'Contracts, dashboard, and server validation succeeded on this exact candidate SHA.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-promotion-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/promotion/
          if-no-files-found: error
          retention-days: 90

  promote:
    name: Approve prerelease to latest
    needs: [preflight, contracts, dashboard, server, evidence]
    environment: release-latest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      security-events: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Revalidate approval and evidence, then promote
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SNAPSHOT: ${{ needs.preflight.outputs.snapshot }}
          VALIDATION: ${{ toJSON(needs) }}
        with:
          script: |
            const { promoteRelease } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release-promotion.mjs`);
            const identity = {
              repository: process.env.GITHUB_REPOSITORY, eventName: context.eventName,
              sha: context.sha, ref: context.ref, actor: context.actor,
              triggeringActor: process.env.GITHUB_TRIGGERING_ACTOR,
              runId: context.runId, runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            };
            const receipt = await promoteRelease(github.request, identity, JSON.parse(process.env.SNAPSHOT), JSON.parse(process.env.VALIDATION));
            core.summary.addHeading('Promoted immutable prerelease to latest')
              .addCodeBlock(JSON.stringify(receipt, null, 2), 'json');
            await core.summary.write();
