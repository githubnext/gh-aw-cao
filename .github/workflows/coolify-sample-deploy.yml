name: Deploy sample dashboard to Coolify

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coolify-sample
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize sample deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - id: authorization
        name: Require maintainer or administrator
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ORIGINAL_ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            core.info('Starting sample deployment authorization');
            if (`${context.repo.owner}/${context.repo.repo}` !== 'githubnext/gh-aw-cao') {
              throw new Error('Sample deployment is restricted to githubnext/gh-aw-cao');
            }
            core.info('Repository identity check passed');
            core.info('Checking original and rerun actor permissions');
            for (const actor of new Set([
              process.env.ORIGINAL_ACTOR,
              process.env.TRIGGERING_ACTOR,
            ])) {
              const { data: access } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: actor,
              });
              if (!['admin', 'maintain'].includes(access.role_name)) {
                throw new Error('Sample deployment requires maintain or admin repository permission');
              }
            }
            core.info('Required repository permissions verified');
            core.info('Resolving the current default branch head');
            const { data: repository } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const { data: branch } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: repository.default_branch,
            });
            if (process.env.WORKFLOW_REF !== `refs/heads/${repository.default_branch}` ||
                process.env.WORKFLOW_SHA !== branch.commit.sha) {
              throw new Error('Sample deployment source is not the current default-branch commit');
            }
            core.info('Sample deployment source matches the current default branch head');
            core.info('Sample deployment authorization completed');
      - name: Summarize sample authorization
        if: always()
        env:
          AUTHORIZATION_STATUS: ${{ steps.authorization.outcome }}
        run: |
          {
            echo "## Sample authorization checks"
            echo
            echo "<details>"
            echo "<summary>Maintainer and protected-main authorization: ${AUTHORIZATION_STATUS}</summary>"
            echo
            echo "- Data exposure: outcome only; actor identities and permission responses are omitted"
            echo "</details>"
          } >> "${GITHUB_STEP_SUMMARY}"

  package:
    name: Resolve official sample package
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: coolify-sample-publish
    permissions:
      attestations: read
      contents: read
      packages: read
    outputs:
      image: ${{ steps.package.outputs.image }}
    steps:
      - id: authorization
        name: Reauthorize maintainer or administrator
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ORIGINAL_ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            core.info('Starting package-stage reauthorization');
            if (`${context.repo.owner}/${context.repo.repo}` !== 'githubnext/gh-aw-cao') {
              throw new Error('Sample deployment is restricted to githubnext/gh-aw-cao');
            }
            core.info('Repository identity check passed');
            core.info('Rechecking original and rerun actor permissions');
            for (const actor of new Set([
              process.env.ORIGINAL_ACTOR,
              process.env.TRIGGERING_ACTOR,
            ])) {
              const { data: access } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: actor,
              });
              if (!['admin', 'maintain'].includes(access.role_name)) {
                throw new Error('Sample deployment requires maintain or admin repository permission');
              }
            }
            core.info('Required repository permissions verified');
            core.info('Resolving the current default branch head');
            const { data: branch } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: context.payload.repository.default_branch,
            });
            if (process.env.WORKFLOW_REF !== `refs/heads/${context.payload.repository.default_branch}` ||
                process.env.WORKFLOW_SHA !== branch.commit.sha) {
              throw new Error('Sample deployment source is not the current default-branch commit');
            }
            core.info('Package source matches the current default branch head');
            core.info('Package-stage reauthorization completed');
      - name: Log in to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: package
        name: Resolve immutable main package
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          repository="ghcr.io/githubnext/gh-aw-cao/cao-server"
          canonical="${repository}:sha-${REVISION}"
          manifest="$(docker buildx imagetools inspect "${canonical}" --format '{{json .Manifest}}')"
          digest="$(jq -r '.digest // empty' <<<"${manifest}")"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "official sample package did not resolve to an immutable digest" >&2
            exit 1
          fi
          image="${repository}@${digest}"
          docker pull "${image}" >/dev/null
          package_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${image}")"
          package_version="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "${image}")"
          expected_version="0.0.0-main.${REVISION:0:12}"
          if [[ "${package_revision}" != "${REVISION}" || "${package_version}" != "${expected_version}" ]]; then
            echo "official sample package metadata does not match the current main commit" >&2
            exit 1
          fi
          GH_TOKEN="${GITHUB_TOKEN}" gh attestation verify "oci://${image}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/cao-package-publish.yml" \
            --source-digest "${REVISION}" >/dev/null
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
      - name: Summarize sample package admission
        if: always()
        env:
          AUTHORIZATION_STATUS: ${{ steps.authorization.outcome }}
          PACKAGE_STATUS: ${{ steps.package.outcome }}
        run: |
          {
            echo "## Sample package checks"
            echo
            echo "<details><summary>Maintainer and protected-main reauthorization: ${AUTHORIZATION_STATUS}</summary>"
            echo
            echo "- Data exposure: outcome only"
            echo "</details>"
            echo
            echo "<details><summary>Immutable digest and OCI labels</summary>"
            echo
            echo "- Check: current protected-main source"
            echo "</details>"
            echo
            echo "<details><summary>GitHub artifact attestation</summary>"
            echo
            echo "- Check: expected signer workflow and source digest"
            echo "</details>"
            echo
            echo "<details><summary>Official package admission: ${PACKAGE_STATUS}</summary>"
            echo
            echo "- Data exposure: outcomes only; package and attestation contents are omitted"
            echo "</details>"
          } >> "${GITHUB_STEP_SUMMARY}"
  deploy:
    name: Deploy sample
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: coolify-sample-deployment
      cancel-in-progress: false
    environment:
      name: coolify-sample
    permissions:
      contents: read
    steps:
      - id: authorization
        name: Reauthorize maintainer or administrator
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ORIGINAL_ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            core.info('Starting deployment-stage reauthorization');
            if (`${context.repo.owner}/${context.repo.repo}` !== 'githubnext/gh-aw-cao') {
              throw new Error('Sample deployment is restricted to githubnext/gh-aw-cao');
            }
            core.info('Repository identity check passed');
            core.info('Rechecking original and rerun actor permissions');
            for (const actor of new Set([
              process.env.ORIGINAL_ACTOR,
              process.env.TRIGGERING_ACTOR,
            ])) {
              const { data: access } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: actor,
              });
              if (!['admin', 'maintain'].includes(access.role_name)) {
                throw new Error('Sample deployment requires maintain or admin repository permission');
              }
            }
            core.info('Required repository permissions verified');
            core.info('Resolving the current default branch head');
            const { data: branch } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: context.payload.repository.default_branch,
            });
            if (process.env.WORKFLOW_REF !== `refs/heads/${context.payload.repository.default_branch}` ||
                process.env.WORKFLOW_SHA !== branch.commit.sha) {
              throw new Error('Sample deployment source is not the current default-branch commit');
            }
            core.info('Deployment source matches the current default branch head');
            core.info('Deployment-stage reauthorization completed');
      - name: Checkout deployment client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - id: deployment
        name: Deploy sample image
        env:
          COOLIFY_BASE_URL: ${{ vars.COOLIFY_BASE_URL }}
          COOLIFY_APPLICATION_UUID: ${{ vars.COOLIFY_APPLICATION_UUID }}
          COOLIFY_READINESS_URL: ${{ vars.COOLIFY_READINESS_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          CAO_IMAGE: ${{ needs.package.outputs.image }}
        run: node scripts/deploy-coolify.mjs
      - name: Summarize sample deployment
        if: always()
        env:
          AUTHORIZATION_STATUS: ${{ steps.authorization.outcome }}
          DEPLOYMENT_STATUS: ${{ steps.deployment.outcome }}
        run: |
          {
            echo "## Sample deployment checks"
            echo
            echo "<details><summary>Maintainer and protected-main reauthorization: ${AUTHORIZATION_STATUS}</summary>"
            echo
            echo "- Data exposure: outcome only"
            echo "</details>"
            echo
            echo "<details><summary>Exact digest deployment and readiness: ${DEPLOYMENT_STATUS}</summary>"
            echo
            echo "- Data exposure: outcome only; endpoint, credentials, image identity, and response details are omitted"
            echo "</details>"
          } >> "${GITHUB_STEP_SUMMARY}"
