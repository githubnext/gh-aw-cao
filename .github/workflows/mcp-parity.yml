name: MCP parity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/mcp-parity.yml
      - activity/agent-catalog.mjs
      - activity/mcp-server.mjs
      - dashboard/site/dashboard.json
      - dashboard/site/dashboard-fragments/**
      - dashboard/site/src/agent/**
      - dashboard/site/src/data/queries/**
      - scripts/generate-agent-catalog.mjs
      - server/go.mod
      - server/go.sum
      - server/cmd/cao-dashboard/**
      - server/internal/query/**
      - server/internal/server/**
      - tests/e2e/dashboard-query-parity.mjs
      - tests/unit/cao-agent-catalog.test.mjs
      - tests/unit/cao-mcp-server.test.mjs
  push:
    branches: [main]
    paths:
      - .github/workflows/mcp-parity.yml
      - activity/agent-catalog.mjs
      - activity/mcp-server.mjs
      - dashboard/site/dashboard.json
      - dashboard/site/dashboard-fragments/**
      - dashboard/site/src/agent/**
      - dashboard/site/src/data/queries/**
      - scripts/generate-agent-catalog.mjs
      - server/go.mod
      - server/go.sum
      - server/cmd/cao-dashboard/**
      - server/internal/query/**
      - server/internal/server/**
      - tests/e2e/dashboard-query-parity.mjs
      - tests/unit/cao-agent-catalog.test.mjs
      - tests/unit/cao-mcp-server.test.mjs

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cao
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cao"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      REDIS_URL: redis://127.0.0.1:6379/0
      CAO_POSTGRES_URL: postgres://postgres@127.0.0.1:5432/cao?sslmode=disable
      DASHBOARD_SERVER_BINARY: ${{ github.workspace }}/.tmp/cao-dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: 1.27.1
          cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify generated contracts
        run: |
          npm run generate:agent-catalog
          git diff --exit-code -- dashboard/site/src/agent/catalog.generated.json dashboard/site/src/agent/queries.generated.json
      - name: Run contract tests
        run: |
          node --test tests/unit/cao-agent-catalog.test.mjs tests/unit/cao-mcp-server.test.mjs
          go -C server test ./internal/server ./cmd/cao-dashboard
      - name: Build Go server
        run: |
          mkdir -p .tmp
          go -C server build -o ../.tmp/cao-dashboard ./cmd/cao-dashboard
      - name: Cache Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('package-lock.json') }}-chromium
      - name: Install Chromium
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps chromium
      - name: Compare MCP contracts and behavior
        run: npm run test:e2e:dashboard-query-parity
      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-parity
          path: test-results/dashboard-query-parity/report.json
          if-no-files-found: error
          retention-days: 14
