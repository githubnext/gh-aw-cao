name: CAO Activity

run-name: CAO Activity / ${{ inputs.request-id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      request-id:
        description: Correlation identifier supplied by a dispatching workflow.
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - .github/workflows/cao.json
      - .github/workflows/cao-activity.yml
      - "activity/**"
      - "*/operational-value.mjs"
      - "*/operational-value/**"
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read
  security-events: read

concurrency:
  group: central-agentic-ops-activity
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      cache-key: ${{ steps.activity-cache-key.outputs.value }}
    permissions:
      contents: read
    steps:
      - name: Checkout trusted activity source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Set up CAO activity runtime
        uses: ./.github/actions/setup-cao-runtime # zizmor: ignore[self-repository] - local action is checked out at github.workflow_sha.
        with:
          bundle: activity

      - name: Resolve dashboard control settings
        env:
          REPORT_CONTROL_SETTINGS: ${{ runner.temp }}/cao-activity/control-settings.json
        run: |
          mkdir -p "$RUNNER_TEMP/cao-activity"
          node activity/control-settings.mjs \
            .github/workflows/shared/control.mjs \
            .github/workflows/cao.json \
            "$REPORT_CONTROL_SETTINGS"

      - name: Resolve activity collection plan
        id: plan
        env:
          ACTIVITY_AUTH_MODE: ${{ vars.GH_AW_GITHUB_AUTH_MODE }}
          ACTIVITY_PAT_REPOSITORIES: ${{ vars.GH_AW_GITHUB_READ_PAT_REPOSITORIES }}
          REPORT_CONTROL_SETTINGS: ${{ runner.temp }}/cao-activity/control-settings.json
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from "node:fs";
          import { activityCollectionPlan } from "./activity/authentication.mjs";
          const settings = JSON.parse(readFileSync(process.env.REPORT_CONTROL_SETTINGS, "utf8"));
          const include = activityCollectionPlan(settings, {
            authMode: process.env.ACTIVITY_AUTH_MODE,
            controlRepository: process.env.GITHUB_REPOSITORY,
            patRepositoryMap: process.env.ACTIVITY_PAT_REPOSITORIES,
          });
          console.log(`Resolved ${include.length} independently authenticated Activity scopes`);
          process.stdout.write("");
          await import("node:fs/promises").then(({ appendFile }) =>
            appendFile(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`));
          EOF

      - name: Resolve activity cache key
        id: activity-cache-key
        run: echo "value=cao-activity-v5-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

  collect:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
      security-events: read
    steps:
      - name: Checkout trusted activity source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Set up CAO activity runtime
        uses: ./.github/actions/setup-cao-runtime # zizmor: ignore[self-repository] - local action is checked out at github.workflow_sha.
        with:
          bundle: activity

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Configure GitHub CLI host
        run: echo "GH_HOST=${GITHUB_SERVER_URL#*://}" >> "$GITHUB_ENV"

      - name: Restore activity cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cao-activity/gh-aw-logs.sqlite
            ${{ runner.temp }}/cao-activity/gh-aw-logs-shards
            ${{ runner.temp }}/cao-activity/drain3_weights.json
          key: ${{ needs.plan.outputs.cache-key }}
          restore-keys: |
            cao-activity-v5-

      - name: Generate owner-scoped GitHub App token
        id: activity-app-token
        if: ${{ vars.GH_AW_GITHUB_AUTH_MODE == 'app' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_AW_GITHUB_READ_APP_ID }}
          private-key: ${{ secrets.GH_AW_GITHUB_READ_APP_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
          repositories: ${{ join(matrix.repositories, ',') }}
          github-api-url: ${{ github.api_url }}
          permission-actions: read
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
          permission-security-events: read
          permission-vulnerability-alerts: read

      - name: Select independent activity credential
        id: activity-credential
        env:
          ACTIVITY_AUTH_MODE: ${{ vars.GH_AW_GITHUB_AUTH_MODE }}
          ACTIVITY_APP_TOKEN: ${{ steps.activity-app-token.outputs.token }}
          ACTIVITY_OWNER: ${{ matrix.owner }}
          ACTIVITY_PAT_TOKEN: ${{ vars.GH_AW_GITHUB_AUTH_MODE == 'pat' && secrets[fromJSON(vars.GH_AW_GITHUB_READ_PAT_REPOSITORIES || '{}')[matrix.credentialRepository]] || '' }} # zizmor: ignore[overprovisioned-secrets] - the validated repository map selects exactly one owner-scoped secret for this matrix group.
        run: |
          set -euo pipefail
          case "$ACTIVITY_AUTH_MODE" in
            app) token="$ACTIVITY_APP_TOKEN" ;;
            pat) token="$ACTIVITY_PAT_TOKEN" ;;
            *) echo "GH_AW_GITHUB_AUTH_MODE must explicitly select app or pat" >&2; exit 1 ;;
          esac
          if [[ -z "$token" ]]; then
            echo "The selected $ACTIVITY_AUTH_MODE credential is unavailable for $ACTIVITY_OWNER" >&2
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "GH_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Resolve owner-scoped control settings
        env:
          ACTIVITY_OWNER: ${{ matrix.owner }}
          ACTIVITY_REPOSITORIES_JSON: ${{ toJSON(matrix.repositories) }}
          REPORT_CONTROL_SETTINGS: ${{ runner.temp }}/cao-activity-partial/${{ matrix.artifact }}/control-settings.json
        run: |
          mkdir -p "$(dirname "$REPORT_CONTROL_SETTINGS")"
          node activity/control-settings.mjs \
            .github/workflows/shared/control.mjs \
            .github/workflows/cao.json \
            "$RUNNER_TEMP/cao-activity-control-settings.json"
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from "node:fs";
          const settings = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/cao-activity-control-settings.json`, "utf8"));
          const repositories = JSON.parse(process.env.ACTIVITY_REPOSITORIES_JSON);
          settings.allowed_owners = [process.env.ACTIVITY_OWNER];
          settings.allowed_repositories = repositories;
          writeFileSync(process.env.REPORT_CONTROL_SETTINGS, `${JSON.stringify(settings, null, 2)}\n`);
          EOF

      - name: Resolve gh-aw compiler version
        id: gh-aw-compiler
        run: |
          version="$(node .github/workflows/shared/control.mjs compiler-version .github/workflows/cao.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install gh-aw CLI
        uses: github/gh-aw-actions/setup-cli@2fbab69bfca02bebd76cd0fc43f2d12acfed994f # v0.89.22
        with:
          version: ${{ steps.gh-aw-compiler.outputs.version }}

      - name: Collect owner-scoped dashboard inventory
        env:
          ACTIVITY_CREDENTIAL_OWNER: ${{ matrix.owner }}
          REPORT_CONTROL_SETTINGS: ${{ runner.temp }}/cao-activity-partial/${{ matrix.artifact }}/control-settings.json
          REPORT_INVENTORY: ${{ runner.temp }}/cao-activity-partial/${{ matrix.artifact }}/control-plane-inventory.json
          REPORT_INVENTORY_SOURCES: ${{ runner.temp }}/cao-activity-partial/${{ matrix.artifact }}/inventory-sources.json
        run: |
          node activity/cao.mjs discover-workflows \
            --control-settings "$REPORT_CONTROL_SETTINGS" \
            --inventory "$REPORT_INVENTORY" \
            --output "$REPORT_INVENTORY_SOURCES" \
            --repo "$GITHUB_REPOSITORY"

      - name: Validate repository visibility boundary
        if: ${{ matrix.repositories[0] != '' }}
        env:
          ACTIVITY_VISIBILITY_REPOSITORY: ${{ matrix.repositories[0] }}
          REPORT_CONTROL_SETTINGS: ${{ runner.temp }}/cao-activity-partial/${{ matrix.artifact }}/control-settings.json
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.activity-credential.outputs.token }}
          script: |
            const path = require('path')
            const { pathToFileURL } = require('url')
            const visibility = await import(pathToFileURL(path.resolve('activity/repository-visibility.mjs')).href)
            await visibility.main({ core, github, context, exec, io, getOctokit }, [process.env.REPORT_CONTROL_SETTINGS])

      - name: Download owner-scoped agentic workflow logs
        env:
          REPORT_AIC_CACHE: ${{ runner.temp }}/cao-gh-aw-logs
          REPORT_ACTIVITY_DATABASE: ${{ runner.temp }}/cao-activity/gh-aw-logs.sqlite
          REPORT_CONTROL_SETTINGS: ${{ runner.temp }}/cao-activity-partial/${{ matrix.artifact }}/control-settings.json
          REPORT_DRAIN3_WEIGHTS: ${{ runner.temp }}/cao-activity/drain3_weights.json
          REPORT_GH_AW_LOGS_EXIT_CODE: ${{ runner.temp }}/cao-activity-partial/${{ matrix.artifact }}/gh-aw-logs-exit-code
          REPORT_GH_AW_LOGS_SEED_SHARDS: ${{ runner.temp }}/cao-activity/gh-aw-logs-shards
          REPORT_GH_AW_LOGS_SHARDS: ${{ runner.temp }}/cao-activity-partial/${{ matrix.artifact }}/gh-aw-logs-shards
          REPORT_INCLUDE_CONTROL_REPOSITORY: "0"
          REPORT_INVENTORY_SOURCES: ${{ runner.temp }}/cao-activity-partial/${{ matrix.artifact }}/inventory-sources.json
          REPORT_TARGET_OWNER: ${{ matrix.owner }}
          REPORT_TARGET_REPOSITORIES_JSON: ${{ toJSON(matrix.repositories) }}
          REPORT_DEFER_ISSUE_STATUS: "1"
          REPORT_LOG_TIMEOUT: "15"
          REPORT_MAX_GITHUB_API_RATE_LIMIT: "-4000"
          REPORT_MAX_STORAGE: "1200"
          REPORT_RUN_LIMIT: "10000"
          REPORT_RUN_WINDOW_DAYS: "30"
        run: |
          bash activity/collect-logs.sh
          collection_exit_code="$(cat "$REPORT_GH_AW_LOGS_EXIT_CODE")"
          if [[ "$collection_exit_code" -ne 0 ]]; then
            echo "Owner-scoped repository log collection failed" >&2
            exit "$collection_exit_code"
          fi

      - name: Enrich owner-scoped issue statuses
        env:
          ACTIVITY_DATABASE: ${{ runner.temp }}/cao-activity/gh-aw-logs.sqlite
          REPORT_GH_AW_LOGS_SHARDS: ${{ runner.temp }}/cao-activity-partial/${{ matrix.artifact }}/gh-aw-logs-shards
        run: |
          node activity/cao.mjs issue-status \
            --database "$ACTIVITY_DATABASE" \
            --input-dir "$REPORT_GH_AW_LOGS_SHARDS" \
            --graphql-cost-budget 25 \
            --graphql-min-remaining 500

      - name: Compute owner-scoped operational value
        env:
          ACTIVITY_ARTIFACT: ${{ matrix.artifact }}
          ACTIVITY_DATABASE: ${{ runner.temp }}/cao-activity/gh-aw-logs.sqlite
          ACTIVITY_OWNER: ${{ matrix.owner }}
          CAO_OPERATIONAL_VALUE_GH_TOKEN: ${{ steps.activity-credential.outputs.token }}
          REPORT_GH_AW_LOGS_SHARDS: ${{ runner.temp }}/cao-activity-partial/${{ matrix.artifact }}/gh-aw-logs-shards
          REPORT_INVENTORY_SOURCES: ${{ runner.temp }}/cao-activity-partial/${{ matrix.artifact }}/inventory-sources.json
        run: |
          repository_args=()
          while IFS= read -r target_repository; do
            repository_args+=(--repository "$target_repository")
          done < <(jq -r --arg owner "$ACTIVITY_OWNER" \
            '.repositories.rows[]
              | select((.organization | ascii_downcase) == ($owner | ascii_downcase))
              | "\(.organization)/\(.repository)"' \
            "$REPORT_INVENTORY_SOURCES")
          history_args=()
          if [[ -f optimization/operational-value.mjs ]]; then
            history_args=(--history-campaign optimization)
          fi
          if ! node activity/cao.mjs operational-value \
              --database "$ACTIVITY_DATABASE" \
              --root . \
              --output "$REPORT_GH_AW_LOGS_SHARDS/operational-values-$ACTIVITY_ARTIFACT.jsonl" \
              --retention-days 30 \
              "${repository_args[@]}" \
              "${history_args[@]}" \
              --max-github-api-rate-limit -2000; then
            echo "::warning::Operational value collection failed for $ACTIVITY_OWNER; continuing activity indexing."
          fi

      - name: Upload owner-scoped activity fragment
        env:
          ACTIVITY_FRAGMENT: ${{ runner.temp }}/cao-activity-partial/${{ matrix.artifact }}
        run: |
          if [[ -s "$RUNNER_TEMP/cao-activity/drain3_weights.json" ]]; then
            cp "$RUNNER_TEMP/cao-activity/drain3_weights.json" "$ACTIVITY_FRAGMENT/drain3_weights.json"
          fi

      - name: Publish owner-scoped activity fragment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cao-activity-${{ matrix.artifact }}
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true
          path: ${{ runner.temp }}/cao-activity-partial/${{ matrix.artifact }}

  index:
    needs: [plan, collect]
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ needs.plan.outputs.cache-key }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout trusted activity source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Set up CAO activity runtime
        uses: ./.github/actions/setup-cao-runtime # zizmor: ignore[self-repository] - local action is checked out at github.workflow_sha.
        with:
          bundle: activity

      - name: Restore activity cache
        id: activity-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cao-activity/gh-aw-logs.sqlite
            ${{ runner.temp }}/cao-activity/gh-aw-logs-shards
            ${{ runner.temp }}/cao-activity/gh-aw-logs-runs
            ${{ runner.temp }}/cao-activity/gh-aw-logs-records
            ${{ runner.temp }}/cao-activity/payload-hashes.json
            ${{ runner.temp }}/cao-activity/control-settings.json
            ${{ runner.temp }}/cao-activity/inventory-sources.json
            ${{ runner.temp }}/cao-activity/agent-summary.json
            ${{ runner.temp }}/cao-activity/drain3_weights.json
            ${{ runner.temp }}/cao-activity/memory
          key: ${{ needs.plan.outputs.cache-key }}
          restore-keys: |
            cao-activity-v5-

      - name: Restore legacy activity cache layout
        if: steps.activity-cache.outputs.cache-matched-key == ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cao-activity/gh-aw-logs.sqlite
            ${{ runner.temp }}/cao-activity/gh-aw-logs-shards
            ${{ runner.temp }}/cao-activity/gh-aw-logs-normalized
            ${{ runner.temp }}/cao-activity/payload-hashes.json
            ${{ runner.temp }}/cao-activity/control-settings.json
            ${{ runner.temp }}/cao-activity/inventory-sources.json
            ${{ runner.temp }}/cao-activity/agent-summary.json
            ${{ runner.temp }}/cao-activity/drain3_weights.json
          key: ${{ needs.plan.outputs.cache-key }}
          restore-keys: |
            cao-activity-v3-

      - name: Download owner-scoped activity fragments
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cao-activity-*
          path: ${{ runner.temp }}/cao-activity-fragments

      - name: Merge owner-scoped activity fragments
        run: |
          mkdir -p "$RUNNER_TEMP/cao-activity/gh-aw-logs-shards"
          find "$RUNNER_TEMP/cao-activity-fragments" -path '*/gh-aw-logs-shards/*.jsonl' \
            -exec cp {} "$RUNNER_TEMP/cao-activity/gh-aw-logs-shards/" \;
          first_weights="$(find "$RUNNER_TEMP/cao-activity-fragments" -name drain3_weights.json -print | sort | head -n 1)"
          if [[ -n "$first_weights" ]]; then
            cp "$first_weights" "$RUNNER_TEMP/cao-activity/drain3_weights.json"
          fi
          node --input-type=module <<'EOF'
          import { existsSync, readdirSync, readFileSync, writeFileSync } from "node:fs";
          import path from "node:path";
          import { mergeInventoryDashboardSources } from "./activity/inventory-sources.mjs";
          const root = `${process.env.RUNNER_TEMP}/cao-activity-fragments`;
          const directFragment = path.join(root, "inventory-sources.json");
          const fragmentFiles = existsSync(directFragment)
            ? [directFragment]
            : readdirSync(root, { withFileTypes: true })
              .filter((entry) => entry.isDirectory())
              .map((entry) => path.join(root, entry.name, "inventory-sources.json"))
              .filter((file) => existsSync(file));
          if (fragmentFiles.length === 0) {
            throw new Error("No owner-scoped inventory fragments were downloaded");
          }
          const fragments = fragmentFiles.map((file) => JSON.parse(readFileSync(file, "utf8")));
          const merged = mergeInventoryDashboardSources(fragments);
          writeFileSync(`${process.env.RUNNER_TEMP}/cao-activity/inventory-sources.json`, `${JSON.stringify(merged, null, 2)}\n`);
          EOF
          node activity/control-settings.mjs \
            .github/workflows/shared/control.mjs \
            .github/workflows/cao.json \
            "$RUNNER_TEMP/cao-activity/control-settings.json"

      - name: Generate bounded agent summary
        run: |
          node activity/agent-summary.mjs \
            "$RUNNER_TEMP/cao-activity/inventory-sources.json" \
            "$RUNNER_TEMP/cao-activity/agent-summary.json"

      - name: Fetch repository memory refs into a separate checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: cao-memory-source
          fetch-depth: 0
          persist-credentials: false
          token: ${{ github.token }}

      - name: Collect campaign repository memory
        env:
          REPORT_INVENTORY_SOURCES: ${{ runner.temp }}/cao-activity/inventory-sources.json
          REPORT_REPOSITORY_MEMORY: ${{ runner.temp }}/cao-activity/memory
        run: |
          node activity/repository-memory.mjs \
            "$GITHUB_WORKSPACE/cao-memory-source" \
            "$REPORT_INVENTORY_SOURCES" \
            "$REPORT_REPOSITORY_MEMORY"

      - name: Generate phased activity shards
        env:
          REPORT_GH_AW_LOGS_SHARDS: ${{ runner.temp }}/cao-activity/gh-aw-logs-shards
          REPORT_GH_AW_LOGS_RUNS: ${{ runner.temp }}/cao-activity/gh-aw-logs-runs
          REPORT_GH_AW_LOGS_RECORDS: ${{ runner.temp }}/cao-activity/gh-aw-logs-records
        run: |
          node activity/cao.mjs hash-payloads \
            --shard-dir "$REPORT_GH_AW_LOGS_SHARDS" \
            --runs-dir "$REPORT_GH_AW_LOGS_RUNS" \
            --records-dir "$REPORT_GH_AW_LOGS_RECORDS" \
            --inventory "$RUNNER_TEMP/cao-activity/inventory-sources.json"

      - name: Ingest activity database
        env:
          ACTIVITY_DATABASE: ${{ runner.temp }}/cao-activity/gh-aw-logs.sqlite
          REPORT_GH_AW_LOGS_RUNS: ${{ runner.temp }}/cao-activity/gh-aw-logs-runs
          REPORT_GH_AW_LOGS_RECORDS: ${{ runner.temp }}/cao-activity/gh-aw-logs-records
        run: |
          node activity/cao.mjs ingest-jsonl \
            --database "$ACTIVITY_DATABASE" \
            --runs-dir "$REPORT_GH_AW_LOGS_RUNS" \
            --records-dir "$REPORT_GH_AW_LOGS_RECORDS" \
            --retention-days 30 \
            --run-retention-days 30

      - name: Compute package problems
        env:
          ACTIVITY_DATABASE: ${{ runner.temp }}/cao-activity/gh-aw-logs.sqlite
        run: node activity/cao.mjs cluster-problems --database "$ACTIVITY_DATABASE" --root .

      - name: Validate activity database
        env:
          ACTIVITY_DATABASE: ${{ runner.temp }}/cao-activity/gh-aw-logs.sqlite
        run: node activity/cao.mjs doctor --database "$ACTIVITY_DATABASE" --ttl-days 30 --run-ttl-days 30

      - name: Hash activity payloads
        env:
          ACTIVITY_DATABASE: ${{ runner.temp }}/cao-activity/gh-aw-logs.sqlite
          REPORT_GH_AW_LOGS_SHARDS: ${{ runner.temp }}/cao-activity/gh-aw-logs-shards
          REPORT_GH_AW_LOGS_RUNS: ${{ runner.temp }}/cao-activity/gh-aw-logs-runs
          REPORT_GH_AW_LOGS_RECORDS: ${{ runner.temp }}/cao-activity/gh-aw-logs-records
        run: |
          node activity/cao.mjs hash-payloads \
            --database "$ACTIVITY_DATABASE" \
            --shard-dir "$REPORT_GH_AW_LOGS_SHARDS" \
            --runs-dir "$REPORT_GH_AW_LOGS_RUNS" \
            --records-dir "$REPORT_GH_AW_LOGS_RECORDS" \
            --inventory "$RUNNER_TEMP/cao-activity/inventory-sources.json" \
            --output "$RUNNER_TEMP/cao-activity/payload-hashes.json"

      - name: Upload activity snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cao-activity-index
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/cao-activity/gh-aw-logs.sqlite
            ${{ runner.temp }}/cao-activity/gh-aw-logs-shards
            ${{ runner.temp }}/cao-activity/gh-aw-logs-runs
            ${{ runner.temp }}/cao-activity/gh-aw-logs-records
            ${{ runner.temp }}/cao-activity/payload-hashes.json
            ${{ runner.temp }}/cao-activity/control-settings.json
            ${{ runner.temp }}/cao-activity/inventory-sources.json
            ${{ runner.temp }}/cao-activity/agent-summary.json
            ${{ runner.temp }}/cao-activity/drain3_weights.json
            ${{ runner.temp }}/cao-activity/memory

  reconcile-dispatch:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout trusted reconciliation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Reconcile CAO Evolution dispatches
        env:
          GH_TOKEN: ${{ github.token }}
        run: node activity/dispatch-reconciliation.mjs

  cache:
    needs: index
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: none
    steps:
      - name: Download activity snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cao-activity-index
          path: ${{ runner.temp }}/cao-activity

      - name: Verify activity snapshot
        run: |
          snapshot_root="$RUNNER_TEMP/cao-activity"
          mkdir -p "$snapshot_root/gh-aw-logs-shards" "$snapshot_root/gh-aw-logs-runs" "$snapshot_root/gh-aw-logs-records"
          missing=0
          for file in gh-aw-logs.sqlite payload-hashes.json control-settings.json inventory-sources.json agent-summary.json; do
            [[ -s "$snapshot_root/$file" ]] || { echo "Activity snapshot file is missing or empty: $file" >&2; missing=1; }
          done
          [[ -s "$snapshot_root/memory/manifest.json" ]] || { echo "Activity snapshot file is missing or empty: memory/manifest.json" >&2; missing=1; }
          if grep -qs '"kind":"record"' "$snapshot_root"/gh-aw-logs-runs/*.jsonl && [[ ! -s "$snapshot_root/drain3_weights.json" ]]; then
            echo "Activity snapshot file is missing or empty: drain3_weights.json" >&2
            missing=1
          fi
          for phase in shards runs records; do
            find "$snapshot_root/gh-aw-logs-$phase" -maxdepth 1 -type f -name '*.jsonl' -print -quit | grep -q . \
              || { echo "Activity snapshot contains no $phase shards" >&2; missing=1; }
          done
          [[ "$missing" -eq 0 ]] || { echo "Refusing to publish an incomplete activity cache" >&2; exit 1; }

      - name: Save activity cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cao-activity/gh-aw-logs.sqlite
            ${{ runner.temp }}/cao-activity/gh-aw-logs-shards
            ${{ runner.temp }}/cao-activity/gh-aw-logs-runs
            ${{ runner.temp }}/cao-activity/gh-aw-logs-records
            ${{ runner.temp }}/cao-activity/payload-hashes.json
            ${{ runner.temp }}/cao-activity/control-settings.json
            ${{ runner.temp }}/cao-activity/inventory-sources.json
            ${{ runner.temp }}/cao-activity/agent-summary.json
            ${{ runner.temp }}/cao-activity/drain3_weights.json
            ${{ runner.temp }}/cao-activity/memory
          key: ${{ needs.index.outputs.cache-key }}

  notify-failure:
    needs: [plan, collect, index, cache, reconcile-dispatch]
    if: ${{ always() && (needs.plan.result == 'failure' || needs.collect.result == 'failure' || needs.index.result == 'failure' || needs.cache.result == 'failure' || needs.reconcile-dispatch.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Notify current repository about CAO Activity failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = '[cao] CAO Activity workflow failure'
            const legacyTitle = 'CAO Activity workflow failure'
            const jobs = {
              CAO_ACTIVITY_PLAN_FAILED: ['${{ needs.plan.result }}', 'The activity authentication plan failed.'],
              CAO_ACTIVITY_COLLECTION_FAILED: ['${{ needs.collect.result }}', 'One or more independently authenticated collection jobs failed.'],
              CAO_ACTIVITY_INDEX_FAILED: ['${{ needs.index.result }}', 'The activity indexing job failed.'],
              CAO_ACTIVITY_CACHE_FAILED: ['${{ needs.cache.result }}', 'The activity cache publication job failed.'],
              CAO_DISPATCH_RECONCILIATION_FAILED: ['${{ needs.reconcile-dispatch.result }}', 'The last two CAO Evolution dispatch cycles were not verified against worker workflow_dispatch runs; inspect the reconcile-dispatch job for the affected workers and correlation IDs.'],
            }
            const failures = Object.entries(jobs)
              .filter(([, [result]]) => result === 'failure')
              .map(([code, [result, message]]) => ({ code, result, message }))
            if (failures.length === 0) return
            const serverUrl = process.env.GITHUB_SERVER_URL || 'https://github.com'
            const workflowSha = process.env.GITHUB_WORKFLOW_SHA
            const runUrl = `${serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const debugSkillUrl = `${serverUrl}/githubnext/gh-aw-cao/blob/main/skills/debug-cao/SKILL.md`
            const rows = failures.map(({ code, message, result }) => `| \`${code}\` | ${message} | ${result} |`).join('\n')
            const body = [
              'The CAO Activity workflow failed in this repository.',
              '', '## Failure codes', '', '| Code | Message | Job result |', '| --- | --- | --- |', rows,
              '', '## Suggested next step', '',
              'Assign this issue to an agent and ask it to fix the workflow failure using the failure code(s) above.',
              '', '---',
              `Ask an agent to follow the [\`debug-cao\` skill](${debugSkillUrl}) and diagnose workflow commit \`${workflowSha}\`.`,
              '', `> Generated by [CAO Activity](${runUrl})`,
            ].join('\n')
            const openIssues = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'open', per_page: 100 })
            const existingIssue = openIssues.find((issue) => !issue.pull_request && [title, legacyTitle].includes(issue.title))
            if (existingIssue) {
              if (existingIssue.title !== title) await github.rest.issues.update({ ...context.repo, issue_number: existingIssue.number, title })
              await github.rest.issues.createComment({ ...context.repo, issue_number: existingIssue.number, body })
              return
            }
            await github.rest.issues.create({ ...context.repo, title, body })
