name: CAO Activity

run-name: CAO Activity / ${{ inputs.request-id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      request-id:
        description: Correlation identifier supplied by a dispatching workflow.
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - .github/workflows/cao.json
      - .github/workflows/cao-activity.yml
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read
  security-events: read
  vulnerability-alerts: read

concurrency:
  group: central-agentic-ops-activity
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.activity-cache-key.outputs.value }}
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
      security-events: read
      vulnerability-alerts: read
    steps:
      - name: Checkout trusted activity source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Set up CAO activity runtime
        uses: ./.github/actions/setup-cao-runtime # zizmor: ignore[self-repository] - local action is checked out at github.workflow_sha.
        with:
          bundle: activity

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Resolve activity cache key
        id: activity-cache-key
        run: echo "value=cao-activity-v5-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Restore activity cache
        id: activity-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cao-activity/gh-aw-logs.sqlite
            ${{ runner.temp }}/cao-activity/gh-aw-logs-shards
            ${{ runner.temp }}/cao-activity/gh-aw-logs-runs
            ${{ runner.temp }}/cao-activity/gh-aw-logs-records
            ${{ runner.temp }}/cao-activity/payload-hashes.json
            ${{ runner.temp }}/cao-activity/control-settings.json
            ${{ runner.temp }}/cao-activity/inventory-sources.json
            ${{ runner.temp }}/cao-activity/drain3_weights.json
          key: ${{ steps.activity-cache-key.outputs.value }}
          restore-keys: |
            cao-activity-v5-

      - name: Restore legacy activity cache layout
        if: steps.activity-cache.outputs.cache-matched-key == ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cao-activity/gh-aw-logs.sqlite
            ${{ runner.temp }}/cao-activity/gh-aw-logs-shards
            ${{ runner.temp }}/cao-activity/gh-aw-logs-normalized
            ${{ runner.temp }}/cao-activity/payload-hashes.json
            ${{ runner.temp }}/cao-activity/control-settings.json
            ${{ runner.temp }}/cao-activity/inventory-sources.json
            ${{ runner.temp }}/cao-activity/drain3_weights.json
          key: ${{ steps.activity-cache-key.outputs.value }}
          restore-keys: |
            cao-activity-v3-

      - name: Resolve dashboard control settings
        id: activity-settings
        env:
          REPORT_CONTROL_SETTINGS: ${{ runner.temp }}/cao-activity/control-settings.json
        run: |
          mkdir -p "$RUNNER_TEMP/cao-activity"
          node activity/control-settings.mjs \
            .github/workflows/shared/control.mjs \
            .github/workflows/cao.json \
            "$REPORT_CONTROL_SETTINGS"
          {
            echo "repositories<<EOF"
            jq -r --arg owner "${GITHUB_REPOSITORY_OWNER,,}" --arg control "$GITHUB_REPOSITORY" \
              'if (.allowed_repositories | length) > 0 then
                ([.allowed_repositories[] | select((split("/")[0] | ascii_downcase) == $owner) | split("/")[1]]
                  + [($control | split("/")[1])]) | unique
                  | if length <= 500 then .[] else empty end
               else empty end' \
              "$REPORT_CONTROL_SETTINGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token for activity
        id: activity-app-token
        env:
          GH_AW_IGNORE_IF_MISSING_PRIVATE_KEY: ${{ secrets.GH_AW_GITHUB_READ_APP_PRIVATE_KEY }}
        if: ${{ vars.GH_AW_GITHUB_READ_APP_ID != '' && env.GH_AW_IGNORE_IF_MISSING_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_AW_GITHUB_READ_APP_ID }}
          private-key: ${{ secrets.GH_AW_GITHUB_READ_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.activity-settings.outputs.repositories }}
          github-api-url: ${{ github.api_url }}
          permission-actions: read
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
          permission-security-events: read
          permission-vulnerability-alerts: read

      - name: Resolve gh-aw compiler version
        id: gh-aw-compiler
        run: |
          version="$(node .github/workflows/shared/control.mjs compiler-version .github/workflows/cao.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install gh-aw CLI
        continue-on-error: true
        uses: github/gh-aw-actions/setup-cli@924af5fdc64061cfbf66fb584c8b07e2ac230c60 # v0.89.21
        env:
          GH_TOKEN: ${{ steps.activity-app-token.outputs.token || github.token }}
        with:
          version: ${{ steps.gh-aw-compiler.outputs.version }}

      - name: Collect dashboard inventory
        env:
          ACTIVITY_APP_TOKEN: ${{ steps.activity-app-token.outputs.token }}
          GH_TOKEN: ${{ steps.activity-app-token.outputs.token || github.token }}
          REPORT_CONTROL_SETTINGS: ${{ runner.temp }}/cao-activity/control-settings.json
          REPORT_INVENTORY: ${{ runner.temp }}/cao-activity/control-plane-inventory.json
          REPORT_INVENTORY_SOURCES: ${{ runner.temp }}/cao-activity/inventory-sources.json
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs')
            const path = require('path')
            const settings = JSON.parse(fs.readFileSync(process.env.REPORT_CONTROL_SETTINGS, 'utf8'))
            if (settings.allowed_repositories.length === 0 && !process.env.ACTIVITY_APP_TOKEN) {
              throw new Error('Owner-wide repository discovery requires the read-only GitHub App')
            }
            core.info('Workflow discovery started')
            const result = await exec.getExecOutput(process.execPath, [
              path.join('activity', 'cao.mjs'),
              'discover-workflows',
              '--control-settings', process.env.REPORT_CONTROL_SETTINGS,
              '--inventory', process.env.REPORT_INVENTORY,
              '--output', process.env.REPORT_INVENTORY_SOURCES,
              '--repo', process.env.GITHUB_REPOSITORY,
            ], { ignoreReturnCode: true, silent: true })
            if (result.stdout.trim()) core.info(result.stdout.trim())
            if (result.stderr.trim()) core.info(result.stderr.trim())
            if (result.exitCode !== 0) {
              throw new Error(`Workflow discovery failed with exit code ${result.exitCode}`)
            }
            core.info('Workflow discovery completed')

      - name: Download agentic workflow logs
        env:
          GH_TOKEN: ${{ steps.activity-app-token.outputs.token || github.token }}
          REPORT_AIC_CACHE: ${{ runner.temp }}/cao-gh-aw-logs
          REPORT_ACTIVITY_DATABASE: ${{ runner.temp }}/cao-activity/gh-aw-logs.sqlite
          REPORT_CONTROL_SETTINGS: ${{ runner.temp }}/cao-activity/control-settings.json
          REPORT_DRAIN3_WEIGHTS: ${{ runner.temp }}/cao-activity/drain3_weights.json
          REPORT_GH_AW_LOGS_EXIT_CODE: ${{ runner.temp }}/cao-activity/gh-aw-logs-exit-code
          REPORT_GH_AW_LOGS_SHARDS: ${{ runner.temp }}/cao-activity/gh-aw-logs-shards
          REPORT_LOG_TIMEOUT: "15"
          REPORT_MAX_GITHUB_API_RATE_LIMIT: "-4000"
          REPORT_ISSUE_STATUS_GRAPHQL_COST_BUDGET: "25"
          REPORT_ISSUE_STATUS_GRAPHQL_MIN_REMAINING: "500"
          REPORT_MAX_STORAGE: "1200"
          REPORT_RUN_LIMIT: "10000"
          REPORT_RUN_WINDOW_DAYS: "30"
        run: |
          bash activity/collect-logs.sh
          collection_exit_code="$(cat "$REPORT_GH_AW_LOGS_EXIT_CODE")"
          if [[ "$collection_exit_code" -ne 0 ]]; then
            echo "One or more repository log collections failed" >&2
            exit "$collection_exit_code"
          fi

      - name: Generate phased activity shards
        env:
          REPORT_GH_AW_LOGS_SHARDS: ${{ runner.temp }}/cao-activity/gh-aw-logs-shards
          REPORT_GH_AW_LOGS_RUNS: ${{ runner.temp }}/cao-activity/gh-aw-logs-runs
          REPORT_GH_AW_LOGS_RECORDS: ${{ runner.temp }}/cao-activity/gh-aw-logs-records
        run: |
          node activity/cao.mjs hash-payloads \
            --shard-dir "$REPORT_GH_AW_LOGS_SHARDS" \
            --runs-dir "$REPORT_GH_AW_LOGS_RUNS" \
            --records-dir "$REPORT_GH_AW_LOGS_RECORDS" \
            --inventory "$RUNNER_TEMP/cao-activity/inventory-sources.json"

      - name: Ingest activity database
        env:
          ACTIVITY_DATABASE: ${{ runner.temp }}/cao-activity/gh-aw-logs.sqlite
          REPORT_GH_AW_LOGS_RUNS: ${{ runner.temp }}/cao-activity/gh-aw-logs-runs
          REPORT_GH_AW_LOGS_RECORDS: ${{ runner.temp }}/cao-activity/gh-aw-logs-records
        run: |
          # Compact run information is injected before detailed event data so
          # clients and projections can expose run properties immediately.
          node activity/cao.mjs ingest-jsonl \
            --database "$ACTIVITY_DATABASE" \
            --runs-dir "$REPORT_GH_AW_LOGS_RUNS" \
            --records-dir "$REPORT_GH_AW_LOGS_RECORDS" \
            --retention-days 30 \
            --run-retention-days 30

      - name: Compute repository operational value
        env:
          ACTIVITY_DATABASE: ${{ runner.temp }}/cao-activity/gh-aw-logs.sqlite
          CAO_OPERATIONAL_VALUE_GH_TOKEN: ${{ steps.activity-app-token.outputs.token || github.token }}
          REPORT_GH_AW_LOGS_SHARDS: ${{ runner.temp }}/cao-activity/gh-aw-logs-shards
        run: |
          if ! node activity/cao.mjs operational-value \
              --database "$ACTIVITY_DATABASE" \
              --root . \
              --output "$REPORT_GH_AW_LOGS_SHARDS/operational-values.jsonl" \
              --retention-days 30 \
              --max-github-api-rate-limit -2000; then
            echo "::warning::Operational value collection failed; continuing activity indexing."
          fi

      - name: Generate operational value shards
        env:
          REPORT_GH_AW_LOGS_SHARDS: ${{ runner.temp }}/cao-activity/gh-aw-logs-shards
        run: |
          node activity/cao.mjs hash-payloads \
            --shard-dir "$REPORT_GH_AW_LOGS_SHARDS" \
            --runs-dir "$RUNNER_TEMP/cao-activity/gh-aw-logs-runs" \
            --records-dir "$RUNNER_TEMP/cao-activity/gh-aw-logs-records" \
            --inventory "$RUNNER_TEMP/cao-activity/inventory-sources.json"

      - name: Ingest operational value
        env:
          ACTIVITY_DATABASE: ${{ runner.temp }}/cao-activity/gh-aw-logs.sqlite
        run: |
          node activity/cao.mjs ingest-jsonl \
            --database "$ACTIVITY_DATABASE" \
            --runs-dir "$RUNNER_TEMP/cao-activity/gh-aw-logs-runs" \
            --records-dir "$RUNNER_TEMP/cao-activity/gh-aw-logs-records" \
            --retention-days 30 \
            --run-retention-days 30

      - name: Compute package problems
        env:
          ACTIVITY_DATABASE: ${{ runner.temp }}/cao-activity/gh-aw-logs.sqlite
        run: |
          node activity/cao.mjs cluster-problems \
            --database "$ACTIVITY_DATABASE" \
            --root .

      - name: Validate activity database
        env:
          ACTIVITY_DATABASE: ${{ runner.temp }}/cao-activity/gh-aw-logs.sqlite
        run: |
          node activity/cao.mjs doctor \
            --database "$ACTIVITY_DATABASE" \
            --ttl-days 30 \
            --run-ttl-days 30

      - name: Hash activity payloads
        env:
          ACTIVITY_DATABASE: ${{ runner.temp }}/cao-activity/gh-aw-logs.sqlite
          REPORT_GH_AW_LOGS_SHARDS: ${{ runner.temp }}/cao-activity/gh-aw-logs-shards
          REPORT_GH_AW_LOGS_RUNS: ${{ runner.temp }}/cao-activity/gh-aw-logs-runs
          REPORT_GH_AW_LOGS_RECORDS: ${{ runner.temp }}/cao-activity/gh-aw-logs-records
        run: |
          node activity/cao.mjs hash-payloads \
            --database "$ACTIVITY_DATABASE" \
            --shard-dir "$REPORT_GH_AW_LOGS_SHARDS" \
            --runs-dir "$REPORT_GH_AW_LOGS_RUNS" \
            --records-dir "$REPORT_GH_AW_LOGS_RECORDS" \
            --inventory "$RUNNER_TEMP/cao-activity/inventory-sources.json" \
            --output "$RUNNER_TEMP/cao-activity/payload-hashes.json"

      - name: Upload activity snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cao-activity-index
          retention-days: 1
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/cao-activity/gh-aw-logs.sqlite
            ${{ runner.temp }}/cao-activity/gh-aw-logs-shards
            ${{ runner.temp }}/cao-activity/gh-aw-logs-runs
            ${{ runner.temp }}/cao-activity/gh-aw-logs-records
            ${{ runner.temp }}/cao-activity/payload-hashes.json
            ${{ runner.temp }}/cao-activity/control-settings.json
            ${{ runner.temp }}/cao-activity/inventory-sources.json
            ${{ runner.temp }}/cao-activity/drain3_weights.json

  cache:
    needs: index
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: none
    steps:
      - name: Download activity snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cao-activity-index
          path: ${{ runner.temp }}/cao-activity

      - name: Verify activity snapshot
        run: |
          snapshot_root="$RUNNER_TEMP/cao-activity"
          mkdir -p "$snapshot_root/gh-aw-logs-shards"
          mkdir -p "$snapshot_root/gh-aw-logs-runs"
          mkdir -p "$snapshot_root/gh-aw-logs-records"
          missing=0
          for file in gh-aw-logs.sqlite payload-hashes.json control-settings.json inventory-sources.json drain3_weights.json; do
            if [[ ! -s "$snapshot_root/$file" ]]; then
              echo "Activity snapshot file is missing or empty: $file" >&2
              missing=1
            fi
          done
          if ! find "$snapshot_root/gh-aw-logs-shards" -maxdepth 1 -type f -name '*.jsonl' -print -quit | grep -q .; then
            echo "Activity snapshot contains no JSONL shards" >&2
            missing=1
          fi
          for phase in runs records; do
            if ! find "$snapshot_root/gh-aw-logs-$phase" -maxdepth 1 -type f -name '*.jsonl' -print -quit | grep -q .; then
              echo "Activity snapshot contains no $phase shards" >&2
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "Extracted activity snapshot contents:" >&2
            ls -l "$snapshot_root" >&2 || true
            echo "Refusing to publish an incomplete activity cache" >&2
            exit 1
          fi

      - name: Save activity cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cao-activity/gh-aw-logs.sqlite
            ${{ runner.temp }}/cao-activity/gh-aw-logs-shards
            ${{ runner.temp }}/cao-activity/gh-aw-logs-runs
            ${{ runner.temp }}/cao-activity/gh-aw-logs-records
            ${{ runner.temp }}/cao-activity/payload-hashes.json
            ${{ runner.temp }}/cao-activity/control-settings.json
            ${{ runner.temp }}/cao-activity/inventory-sources.json
            ${{ runner.temp }}/cao-activity/drain3_weights.json
          key: ${{ needs.index.outputs.cache-key }}

  notify-failure:
    needs: [index, cache]
    if: ${{ always() && (needs.index.result == 'failure' || needs.cache.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Notify current repository about CAO Activity failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = 'CAO Activity workflow failure'
            const failures = [
              {
                code: 'CAO_ACTIVITY_INDEX_FAILED',
                result: '${{ needs.index.result }}',
                message: 'The activity indexing job failed while collecting or validating CAO activity data.',
              },
              {
                code: 'CAO_ACTIVITY_CACHE_FAILED',
                result: '${{ needs.cache.result }}',
                message: 'The activity cache publication job failed while saving the validated activity snapshot.',
              },
            ].filter(({ result }) => result === 'failure')
            if (failures.length === 0) {
              core.info('No failed CAO Activity jobs to report')
              return
            }
            const serverUrl = process.env.GITHUB_SERVER_URL || 'https://github.com'
            const runUrl = `${serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const workflowSha = process.env.GITHUB_WORKFLOW_SHA
            const debugSkillUrl = `${serverUrl}/${context.repo.owner}/${context.repo.repo}/blob/${workflowSha}/.github/skills/debug-cao/SKILL.md`
            const rows = failures
              .map(({ code, message, result }) => `| \`${code}\` | ${message} | ${result} |`)
              .join('\n')
            const body = [
              'The CAO Activity workflow failed in this repository.',
              '',
              `Run: ${runUrl}`,
              '',
              '## Failure codes',
              '',
              '| Code | Message | Job result |',
              '| --- | --- | --- |',
              rows,
              '',
              '## Suggested next step',
              '',
              'Assign this issue to an agent and ask it to fix the workflow failure using the failure code(s) above.',
              '',
              '---',
              `For a version-pinned diagnosis, ask an agent to follow the [\`debug-cao\` skill](${debugSkillUrl}) from workflow commit \`${workflowSha}\`.`,
            ].join('\n')
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'open',
              per_page: 100,
            })
            const existingIssue = openIssues.find((issue) => !issue.pull_request && issue.title === title)
            if (existingIssue) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existingIssue.number,
                body,
              })
              core.info(`Commented on existing issue #${existingIssue.number}`)
              return
            }
            const { data: issue } = await github.rest.issues.create({
              ...context.repo,
              title,
              body,
            })
            core.info(`Created issue #${issue.number}`)
