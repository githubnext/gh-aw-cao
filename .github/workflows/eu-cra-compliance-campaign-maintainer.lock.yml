name: "EU CRA / Maintenance"
on:
  schedule:
    - cron: "24 18 * * *"  # Friendly format: daily (scattered)
  workflow_dispatch:
    inputs:
      aw_context:
        default: ""
        description: "Agent caller context (used internally by Agentic Workflows)."
        required: false
        type: string
      safe_output_mode:
        default: review
        options:
          - review
          - live
        type: choice

permissions: {}

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}

run-name: CRA campaign implementation-status maintenance · ${{ inputs.safe_output_mode || 'review' }}

env:
  OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.GH_AW_DEFAULT_OTLP_ENDPOINT || vars.GH_AW_DEFAULT_OTLP_ENDPOINT }}
  OTEL_SERVICE_NAME: gh-aw.eu-cra-compliance-campaign-maintainer
  OTEL_RESOURCE_ATTRIBUTES: 'gh-aw.workflow.name=EU%20CRA%20%2F%20Maintenance,gh-aw.repository=${{ github.repository }},gh-aw.run.id=${{ github.run_id }},github.run_id=${{ github.run_id }},gh-aw.engine.id=pi'
  OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.GH_AW_DEFAULT_OTLP_HEADERS }}
  GH_AW_OTLP_ENDPOINTS: '[{"url":"${{ secrets.GH_AW_DEFAULT_OTLP_ENDPOINT || vars.GH_AW_DEFAULT_OTLP_ENDPOINT }}","headers":"${{ secrets.GH_AW_DEFAULT_OTLP_HEADERS }}"}]'
  GH_AW_OTLP_IF_MISSING: ignore

