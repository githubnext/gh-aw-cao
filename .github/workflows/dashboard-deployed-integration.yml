name: Deployed dashboard integration

on:
  pull_request:
    paths:
      - .github/workflows/dashboard-deployed-integration.yml
      - dashboard/site/**
      - package.json
      - package-lock.json
      - tests/e2e/dashboard-deployed-refresh-helpers.mjs
      - tests/e2e/dashboard-query-performance-helpers.mjs
      - tests/e2e/dashboard-query-performance.spec.mjs
      - tests/e2e/dashboard-view-assessment.mjs
      - tests/helpers/dashboard-query-cost.mjs
      - tests/performance/dashboard-query-cost.test.mjs
      - tests/playwright/configs/dashboard-query-performance.config.mjs
  workflow_dispatch:
  schedule:
    - cron: "12,27,42,57 * * * *"

permissions:
  contents: read

concurrency:
  group: dashboard-deployed-integration-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name }}
  cancel-in-progress: false

jobs:
  integration:
    name: Test deployed dashboard
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Cache Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('package-lock.json') }}-chromium
      - name: Install Chromium
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps chromium
      - name: Test deployed dashboard
        id: test
        continue-on-error: true
        run: npm run test:e2e:dashboard-deployed
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-deployed-diagnostics
          path: test-results/dashboard-deployed/
          if-no-files-found: warn
          retention-days: 14
      - name: Fail when integration checks fail
        if: steps.test.outcome == 'failure'
        run: exit 1

  query-performance:
    name: Benchmark deployed dashboard queries (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Cache Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('package-lock.json') }}-chromium
      - name: Install Chromium
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps chromium
      - name: Benchmark queries
        env:
          DASHBOARD_QUERY_PERFORMANCE_SHARD: ${{ matrix.shard }}/3
        run: npm run test:performance:dashboard-queries
      - name: Upload query performance results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-query-performance-${{ matrix.shard }}
          path: test-results/dashboard-query-performance/
          if-no-files-found: warn
          retention-days: 14

  query-cost:
    name: Measure deployed query cost
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Download deployed snapshot
        run: npm run dashboard:data:download
      - name: Measure query cost
        run: npm run test:performance:dashboard-query-cost
      - name: Upload query cost report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-query-cost
          path: test-results/dashboard-query-cost/
          if-no-files-found: warn
          retention-days: 14

  query-performance-comment:
    name: Report query performance results
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.query-performance.result == 'success'
    needs: query-performance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Download query performance results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dashboard-query-performance-*
          path: query-performance-shards
      - name: Merge query performance shard results
        run: |
          node scripts/merge-dashboard-query-performance.mjs \
            query-performance-results \
            query-performance-shards/dashboard-query-performance-1 \
            query-performance-shards/dashboard-query-performance-2 \
            query-performance-shards/dashboard-query-performance-3
      - name: Comment with query performance results
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- dashboard-query-performance-results -->'
            const summaryPath = 'query-performance-results/summary.md'
            const summary = fs.readFileSync(summaryPath, 'utf8').trim()
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              marker,
              '### Dashboard query performance',
              '',
              '<details><summary><b>Query performance measurements</b></summary>',
              '',
              summary,
              '',
              '</details>',
              '',
              `[View the workflow run and performance artifact](${runUrl}).`,
            ].join('\n')
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            )
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              })
            }

  query-cost-comment:
    name: Report query cost results
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["success", "failure"]'), needs.query-cost.result)
    needs: query-cost
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download query cost results
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dashboard-query-cost
          path: query-cost-results
      - name: Comment with query cost results
        if: steps.download.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          QUERY_COST_RESULT: ${{ needs.query-cost.result }}
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- dashboard-query-cost-results -->'
            const summaryPath = 'query-cost-results/summary.md'
            if (!fs.existsSync(summaryPath)) {
              core.notice('No query cost summary was produced by the benchmark.')
              return
            }
            const maxSummaryLength = 60000
            let summary = fs.readFileSync(summaryPath, 'utf8').trim()
            if (summary.length > maxSummaryLength) {
              summary = `${summary.slice(0, maxSummaryLength)}\n\n_Report truncated; see the uploaded artifact for the full report._`
            }
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const outcome = process.env.QUERY_COST_RESULT === 'failure'
              ? 'Benchmark budgets were exceeded.'
              : 'All measured queries stayed within their budgets.'
            const body = [
              marker,
              '<details><summary><b>Dashboard query cost report</b></summary>',
              '',
              summary,
              '',
              '</details>',
              '',
              outcome,
              '',
              `[View the workflow run and query cost artifact](${runUrl}).`,
            ].join('\n')
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            )
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              })
            }

  report-failure:
    name: Report deployed dashboard failure
    if: always() && needs.integration.result == 'failure'
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: Create or update failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = 'Deployed CAO dashboard integration failure'
            const marker = '<!-- deployed-dashboard-integration-failure -->'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              marker,
              'The scheduled deployed dashboard integration check failed.',
              '',
              `Workflow run: ${runUrl}`,
              '',
              'Download the `dashboard-deployed-diagnostics` artifact for the bounded browser, database, and rendering report.',
            ].join('\n')
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'open',
              per_page: 100,
            })
            const existing = issues.find((issue) =>
              !issue.pull_request && issue.title === title && issue.body?.includes(marker)
            )
            if (existing) {
              await github.rest.issues.update({
                ...context.repo,
                issue_number: existing.number,
                body,
              })
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body,
                labels: ['bug'],
              })
            }
