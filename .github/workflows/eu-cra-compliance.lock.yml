        env:
          GH_AW_FILE_ROOT: "${{ runner.temp }}/gh-aw"
          GH_AW_FILE_CONFIG: "{\"files\":[{\"path\":\"safeoutputs/config.json\",\"content_env\":\"GH_AW_SAFE_OUTPUTS_CONFIG\"}]}"
          GH_AW_SAFE_OUTPUTS_CONFIG: "{\"create_report_incomplete_issue\":{},\"dispatch_workflow\":{\"allowed_refs\":[\"refs/heads/${{ github.event.repository.default_branch }}\"],\"aw_context_workflows\":[\"eu-cra-compliance-scope-classifier\",\"eu-cra-compliance-security-requirements-auditor\",\"eu-cra-compliance-supply-chain-sbom-auditor\",\"eu-cra-compliance-vulnerability-handling-auditor\",\"eu-cra-compliance-article-14-reporting-readiness\",\"eu-cra-compliance-conformity-release-evidence\"],\"max\":48,\"workflow_files\":{\"eu-cra-compliance-article-14-reporting-readiness\":\".lock.yml\",\"eu-cra-compliance-conformity-release-evidence\":\".lock.yml\",\"eu-cra-compliance-scope-classifier\":\".lock.yml\",\"eu-cra-compliance-security-requirements-auditor\":\".lock.yml\",\"eu-cra-compliance-supply-chain-sbom-auditor\":\".lock.yml\",\"eu-cra-compliance-vulnerability-handling-auditor\":\".lock.yml\"},\"workflows\":[\"eu-cra-compliance-scope-classifier\",\"eu-cra-compliance-security-requirements-auditor\",\"eu-cra-compliance-supply-chain-sbom-auditor\",\"eu-cra-compliance-vulnerability-handling-auditor\",\"eu-cra-compliance-article-14-reporting-readiness\",\"eu-cra-compliance-conformity-release-evidence\"]},\"missing_data\":{},\"missing_tool\":{},\"noop\":{\"max\":1,\"report-as-issue\":\"false\"},\"report_incomplete\":{}}"
        with:
