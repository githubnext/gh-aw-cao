name: "EU CRA"
on:
  # permissions: # Permissions applied to pre-activation job
  # actions: read
  # contents: read
  schedule:
    - cron: "45 */1 * * *"  # Friendly format: hourly (scattered)
  workflow_dispatch:
    inputs:
      aw_context:
        default: ""
        description: "Agent caller context (used internally by Agentic Workflows)."
        required: false
        type: string
      max_repos:
        default: 1
        type: number
      rollout_percent:
        default: 100
        type: number
      safe_output_mode:
        default: review
        options:
          - review
          - live
        type: choice
      safe_output_repo:
        type: string
      target_repo:
        type: string

permissions: {}

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}

run-name: ${{ github.event_name == 'schedule' && 'EU CRA · scheduled' || format('EU CRA · {0} · {1}', inputs.target_repo || 'discovery', inputs.safe_output_mode || 'review') }}

env:
  CAO_PACKAGE: eu-cra-compliance
  CAO_ROLE: orchestrator
  CAO_WORKER: __none__
  GH_AW_SAFE_OUTPUT_MODE: ${{ inputs.safe_output_mode || 'review' }}
  REVIEW_OUTPUT_REPO: ${{ inputs.safe_output_repo || github.repository }}
  SAFE_OUTPUT_REPO: ${{ (inputs.safe_output_mode || 'review') == 'review' && (inputs.safe_output_repo || github.repository) || '' }}
  TARGET_REPO: ${{ inputs.target_repo || '' }}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.GH_AW_DEFAULT_OTLP_ENDPOINT }}
  OTEL_SERVICE_NAME: gh-aw.eu-cra-compliance
  OTEL_RESOURCE_ATTRIBUTES: 'gh-aw.workflow.name=EU%20CRA,gh-aw.repository=${{ github.repository }},gh-aw.run.id=${{ github.run_id }},github.run_id=${{ github.run_id }},gh-aw.engine.id=pi'
  OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.GH_AW_DEFAULT_OTLP_HEADERS }}
  GH_AW_OTLP_ENDPOINTS: '[{"url":"${{ vars.GH_AW_DEFAULT_OTLP_ENDPOINT }}","headers":"${{ secrets.GH_AW_DEFAULT_OTLP_HEADERS }}"}]'
  GH_AW_OTLP_IF_MISSING: ignore

