          script: "const fs = require('fs');\nconst otlp = require('/tmp/gh-aw/actions/otlp.cjs');\n\nfunction readJson(file, fallback) {\n  try {\n    return JSON.parse(fs.readFileSync(file, 'utf8'));\n  } catch {\n    return fallback;\n  }\n}\n\nfunction count(value) {\n  const parsed = Number(value);\n  return Number.isSafeInteger(parsed) && parsed >= 0 ? parsed : 0;\n}\n\nconst precompute = readJson('/tmp/gh-aw/agent/control-precompute.json', {});\nconst output = readJson('/tmp/gh-aw/agent_output.json', { items: [] });\nconst items = Array.isArray(output.items) ? output.items : [];\nconst dispatches = items.filter(item => item?.type === 'dispatch_workflow');\nconst incompleteCount = items.filter(item => item?.type === 'report_incomplete').length;\nconst noopCount = items.filter(item => item?.type === 'noop').length;\nconst targetCount = new Set(dispatches.map(item => item?.inputs?.target_repo).filter(Boolean)).size;\nconst workflowCount = new Set(dispatches.map(item => item?.workflow_name).filter(Boolean)).size;\nconst dispatchModes = new Set(dispatches.map(item => item?.inputs?.safe_output_mode).filter(Boolean));\nconst effectiveMode = dispatchModes.size === 0\n  ? String(precompute.safe_output_mode || 'unknown')\n  : dispatchModes.size === 1\n    ? [...dispatchModes][0]\n    : 'mixed';\nconst status = incompleteCount > 0\n  ? 'incomplete'\n  : dispatches.length > 0\n    ? 'requested'\n    : noopCount > 0\n      ? 'noop'\n      : 'empty';\n\nawait otlp.logSpan('central-agentic-ops.orchestrator', {\n  'central_agentic_ops.orchestrator.package': String(precompute.package || precompute.bundle || 'unknown'),\n  'central_agentic_ops.orchestrator.status': status,\n  'central_agentic_ops.orchestrator.enabled': precompute.enabled === true,\n  'central_agentic_ops.orchestrator.safe_output_mode': effectiveMode,\n  'central_agentic_ops.orchestrator.candidate_count': Array.isArray(precompute.candidate_repositories) ? precompute.candidate_repositories.length : 0,\n  'central_agentic_ops.orchestrator.target_limit': count(precompute.effective_max_repos),\n  'central_agentic_ops.orchestrator.dispatch_requested_count': dispatches.length,\n  'central_agentic_ops.orchestrator.target_count': targetCount,\n  'central_agentic_ops.orchestrator.workflow_count': workflowCount,\n  'central_agentic_ops.orchestrator.incomplete_count': incompleteCount,\n}, {\n  isError: incompleteCount > 0,\n  errorMessage: incompleteCount > 0 ? 'orchestrator reported incomplete' : undefined,\n});\n"

      # Small dedicated copy of the agent output so safe-output processing
      # survives a failed or timed-out upload of the larger agent artifact
      - name: Upload agent output fallback artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-output-fallback
          path: |
            /tmp/gh-aw/agent_output.json
            /tmp/gh-aw/safeoutputs.jsonl
          if-no-files-found: ignore
      - name: Upload agent artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent
          path: |
            /tmp/gh-aw/aw-prompts/prompt.txt
            /tmp/gh-aw/pi-streaming.jsonl
            /tmp/gh-aw/redacted-urls.log
            /tmp/gh-aw/mcp-logs/
            /tmp/gh-aw/agent_usage.json
            /tmp/gh-aw/agent-stdio.log
            /tmp/gh-aw/pre-agent-audit.txt
            /tmp/gh-aw/agent/
            /tmp/gh-aw/github_rate_limits.jsonl
            /tmp/gh-aw/otel.jsonl
            /tmp/gh-aw/otlp-export-errors.jsonl
            /tmp/gh-aw/safeoutputs.jsonl
            /tmp/gh-aw/agent_output.json
            /tmp/gh-aw/awf-config.json
            /tmp/gh-aw/sandbox/firewall/logs/
            /tmp/gh-aw/sandbox/firewall/audit/
            /tmp/gh-aw/sandbox/firewall/awf-reflect.json
          if-no-files-found: ignore

  conclusion:
    needs:
      - activation
      - agent
      - safe_outputs
    if: >
      always() && (needs.agent.result != 'skipped' || needs.activation.outputs.lockdown_check_failed == 'true' ||
      needs.activation.outputs.oauth_token_check_failed == 'true' || needs.activation.outputs.stale_lock_file_failed == 'true')
    runs-on: ubuntu-slim
    environment: central-agentic-ops
    permissions:
      actions: write
      issues: write
    concurrency:
      group: "gh-aw-conclusion-eu-cra-compliance-${{ github.run_id }}"
      cancel-in-progress: false
      queue: max
    env:
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
    outputs:
      incomplete_count: ${{ steps.report_incomplete.outputs.incomplete_count }}
      noop_message: ${{ steps.noop.outputs.noop_message }}
      tools_reported: ${{ steps.missing_tool.outputs.tools_reported }}
      total_count: ${{ steps.missing_tool.outputs.total_count }}
    steps:
      - name: Setup Scripts
        id: setup
        uses: github/gh-aw-actions/setup@23e16337f3568b3c18bb04a976793f282a016755 # v0.88.4
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
          trace-id: ${{ needs.activation.outputs.setup-trace-id }}
          parent-span-id: ${{ needs.activation.outputs.setup-parent-span-id || needs.activation.outputs.setup-span-id }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "EU CRA"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/eu-cra-compliance.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "0.84.3"
          GH_AW_INFO_AWF_VERSION: "v0.28.13"
          GH_AW_INFO_ENGINE_ID: "pi"
      - name: Generate GitHub App token
        id: safe-outputs-app-token
        env:
          GH_AW_IGNORE_IF_MISSING_PRIVATE_KEY: ${{ secrets.GH_AW_GITHUB_WRITE_APP_PRIVATE_KEY }}
        if: ${{ vars.GH_AW_GITHUB_WRITE_APP_ID != '' && env.GH_AW_IGNORE_IF_MISSING_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_AW_GITHUB_WRITE_APP_ID }}
          private-key: ${{ secrets.GH_AW_GITHUB_WRITE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          github-api-url: ${{ github.api_url }}
          permission-actions: write
          permission-issues: write
      - name: Download agent output artifact
        id: download-agent-output
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{agent,agent-output-fallback}"
          merge-multiple: true
          path: /tmp/gh-aw/
      - name: Setup agent output environment variable
        id: setup-agent-output-env
        if: steps.download-agent-output.outcome == 'success'
        run: |
          mkdir -p /tmp/gh-aw/
          find "/tmp/gh-aw/" -type f -print
          if [ -f "/tmp/gh-aw/agent_output.json" ]; then
            echo "GH_AW_AGENT_OUTPUT=/tmp/gh-aw/agent_output.json" >> "$GITHUB_OUTPUT"
          fi
      - name: Download Safe Outputs Items Manifest
        id: download-safe-outputs-manifest
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: safe-outputs-items
          merge-multiple: true
          path: /tmp/gh-aw/
      - name: Collect usage artifact files
        if: always()
        continue-on-error: true
        run: bash "${RUNNER_TEMP}/gh-aw/actions/collect_usage_artifact_files.sh"
      - name: Upload usage artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: usage
          path: |
            /tmp/gh-aw/usage/aw_info.json
            /tmp/gh-aw/usage/aw-info.jsonl
            /tmp/gh-aw/usage/agent_usage.json
            /tmp/gh-aw/usage/agent_usage.jsonl
            /tmp/gh-aw/usage/detection_usage.jsonl
            /tmp/gh-aw/usage/evals.jsonl
            /tmp/gh-aw/usage/graders/grader_manifest.json
            /tmp/gh-aw/usage/graders/grader_results.json
            /tmp/gh-aw/usage/github_rate_limits.jsonl
            /tmp/gh-aw/usage/agent/token_usage.jsonl
            /tmp/gh-aw/usage/detection/token_usage.jsonl
            /tmp/gh-aw/usage/activity/summary.json
          if-no-files-found: ignore
      - name: Process no-op messages
        id: noop
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_AGENT_OUTPUT: ${{ steps.setup-agent-output-env.outputs.GH_AW_AGENT_OUTPUT }}
          GH_AW_NOOP_MAX: "1"
          GH_AW_WORKFLOW_NAME: "EU CRA"
          GH_AW_WORKFLOW_SOURCE_URL: "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/.github/workflows/eu-cra-compliance.md"
          GH_AW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_AW_AGENT_CONCLUSION: ${{ needs.agent.result }}
          GH_AW_NOOP_REPORT_AS_ISSUE: "false"
          GH_AW_AIC: ${{ needs.agent.outputs.aic }}
          GH_AW_AMBIENT_CONTEXT: ${{ needs.agent.outputs.ambient_context }}
          GH_AW_WORKFLOW_ID: "eu-cra-compliance"
        with:
          github-token: ${{ steps.safe-outputs-app-token.outputs.token || secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'handle_noop_message.cjs'));
            await main();
      - name: Record missing tool
        id: missing_tool
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_AGENT_OUTPUT: ${{ steps.setup-agent-output-env.outputs.GH_AW_AGENT_OUTPUT }}
          GH_AW_MISSING_TOOL_CREATE_ISSUE: "true"
          GH_AW_WORKFLOW_NAME: "EU CRA"
          GH_AW_WORKFLOW_SOURCE_URL: "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/.github/workflows/eu-cra-compliance.md"
        with:
          github-token: ${{ steps.safe-outputs-app-token.outputs.token || secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'missing_tool.cjs'));
            await main();
      - name: Record incomplete
        id: report_incomplete
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_AGENT_OUTPUT: ${{ steps.setup-agent-output-env.outputs.GH_AW_AGENT_OUTPUT }}
          GH_AW_REPORT_INCOMPLETE_CREATE_ISSUE: "true"
          GH_AW_WORKFLOW_NAME: "EU CRA"
          GH_AW_WORKFLOW_SOURCE_URL: "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/.github/workflows/eu-cra-compliance.md"
        with:
          github-token: ${{ steps.safe-outputs-app-token.outputs.token || secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'report_incomplete_handler.cjs'));
            await main();
      - name: Handle agent failure
        id: handle_agent_failure
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_AGENT_OUTPUT: ${{ steps.setup-agent-output-env.outputs.GH_AW_AGENT_OUTPUT }}
          GH_AW_WORKFLOW_NAME: "EU CRA"
          GH_AW_WORKFLOW_SOURCE_URL: "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/.github/workflows/eu-cra-compliance.md"
          GH_AW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_AW_AGENT_CONCLUSION: ${{ needs.agent.result }}
          GH_AW_WORKFLOW_ID: "eu-cra-compliance"
          GH_AW_ACTION_FAILURE_ISSUE_EXPIRES_HOURS: "168"
          GH_AW_ENGINE_ID: "pi"
          GH_AW_CHECKOUT_PR_SUCCESS: ${{ needs.agent.outputs.checkout_pr_success }}
          GH_AW_EFFECTIVE_TOKENS: ${{ needs.agent.outputs.effective_tokens || '' }}
          GH_AW_AI_CREDITS_RATE_LIMIT_ERROR: ${{ needs.agent.outputs.ai_credits_rate_limit_error || 'false' }}
          GH_AW_UNKNOWN_MODEL_AI_CREDITS: ${{ needs.agent.outputs.unknown_model_ai_credits || 'false' }}
          GH_AW_AIC: ${{ needs.agent.outputs.aic }}
          GH_AW_MAX_AI_CREDITS: "200"
          GH_AW_SAFE_OUTPUTS_APP_TOKEN_MINTING_FAILED: ${{ needs.safe_outputs.outputs.app_token_minting_failed }}
          GH_AW_CONCLUSION_APP_TOKEN_MINTING_FAILED: ${{ steps.safe-outputs-app-token.outcome == 'failure' }}
          GH_AW_ACTIVATION_APP_TOKEN_MINTING_FAILED: ${{ needs.activation.outputs.activation_app_token_minting_failed }}
          GH_AW_LOCKDOWN_CHECK_FAILED: ${{ needs.activation.outputs.lockdown_check_failed }}
          GH_AW_OAUTH_TOKEN_CHECK_FAILED: ${{ needs.activation.outputs.oauth_token_check_failed }}
          GH_AW_STALE_LOCK_FILE_FAILED: ${{ needs.activation.outputs.stale_lock_file_failed }}
          GH_AW_GROUP_REPORTS: "false"
          GH_AW_FAILURE_REPORT_AS_ISSUE: "true"
          GH_AW_MISSING_TOOL_REPORT_AS_FAILURE: "true"
          GH_AW_MISSING_DATA_REPORT_AS_FAILURE: "true"
          GH_AW_TIMEOUT_MINUTES: "15"
        with:
          github-token: ${{ steps.safe-outputs-app-token.outputs.token || secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'handle_agent_failure.cjs'));
            await main();
      - name: Report failed jobs
        id: report_failed_jobs
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_AGENT_OUTPUT: ${{ steps.setup-agent-output-env.outputs.GH_AW_AGENT_OUTPUT }}
          GH_AW_WORKFLOW_NAME: "EU CRA"
          GH_AW_WORKFLOW_SOURCE_URL: "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/.github/workflows/eu-cra-compliance.md"
          GH_AW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_AW_REPORT_FAILED_JOBS: "true"
        with:
          github-token: ${{ steps.safe-outputs-app-token.outputs.token || secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'report_failed_jobs.cjs'));
            await main();

  pre_activation:
    runs-on: ubuntu-slim
    environment: central-agentic-ops
    permissions:
      actions: read
      contents: read
    env:
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
    outputs:
      activated: ${{ steps.check_membership.outputs.is_team_member == 'true' }}
      cao_authorized: ${{ steps.cao_admission.outputs.authorized == 'true' && steps.cao_precompute.outputs.authorized != 'false' }}
      cao_reason: ${{ steps.cao_precompute.outputs.reason || steps.cao_admission.outputs.reason }}
      matched_command: ''
      setup-parent-span-id: ${{ steps.setup.outputs.parent-span-id || steps.setup.outputs.span-id }}
      setup-span-id: ${{ steps.setup.outputs.span-id }}
      setup-trace-id: ${{ steps.setup.outputs.trace-id }}
    steps:
      - name: Setup Scripts
        id: setup
        uses: github/gh-aw-actions/setup@23e16337f3568b3c18bb04a976793f282a016755 # v0.88.4
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "EU CRA"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/eu-cra-compliance.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "0.84.3"
          GH_AW_INFO_AWF_VERSION: "v0.28.13"
          GH_AW_INFO_ENGINE_ID: "pi"
      - name: Generate CAO pre-activation GitHub App token
        id: cao_pre_activation_app_token
        if: ${{ env.CAO_GITHUB_APP_ID != '' && env.CAO_GITHUB_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        env:
          CAO_GITHUB_APP_ID: ${{ vars.GH_AW_GITHUB_READ_APP_ID }}
          CAO_GITHUB_APP_PRIVATE_KEY: ${{ secrets.GH_AW_GITHUB_READ_APP_PRIVATE_KEY }}
        with:
          client-id: ${{ vars.GH_AW_GITHUB_READ_APP_ID }}
          github-api-url: ${{ github.api_url }}
          owner: ${{ github.repository_owner }}
          permission-actions: read
          permission-contents: read
          private-key: ${{ secrets.GH_AW_GITHUB_READ_APP_PRIVATE_KEY }}
      - name: Checkout CAO control modules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1.0
          path: .cao
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/cao/src
          sparse-checkout-cone-mode: true
          token: ${{ steps.cao_pre_activation_app_token.outputs.token || secrets.GH_AW_GITHUB_TOKEN || github.token }}
      - name: Evaluate Central Agentic Ops admission
        id: cao_admission
        run: |
          set -uo pipefail
          read_dispatch_input() {
            node -e 'const inputs = JSON.parse(process.env.CAO_WORKFLOW_DISPATCH_INPUTS || "{}"); const value = inputs[process.argv[1]]; process.stdout.write(value == null ? "" : String(value));' "$1"
          }
          export CAO_TARGET_REPOSITORY="$(read_dispatch_input target_repo)"
          export CAO_REQUESTED_MODE="$(read_dispatch_input safe_output_mode)"
          export CAO_REQUESTED_MAX_REPOSITORIES="$(read_dispatch_input max_repos)"
          export CAO_REQUESTED_ROLLOUT_PERCENT="$(read_dispatch_input rollout_percent)"
          cao_dir="${GITHUB_WORKSPACE:-.}/.cao/.github/cao/src"
          if node "$cao_dir/control.mjs" admit; then
            exit 0
          fi
          reason="cannot read or execute the CAO control modules at github.workflow_sha"
          {
            echo "authorized=false"
            echo "reason=$reason"
            echo "monthly_credit_budget=0"
          } >> "$GITHUB_OUTPUT"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          <details>
          <summary><h3>Central Agentic Ops admission</h3></summary>

          Skipped: $reason

          - ❌ Runtime revision — The control and policy modules could not be read or executed from the exact \`github.workflow_sha\` commit.
          - Policy and authorization checks — The remaining admission checks could not run because the authoritative control modules were unavailable.

          </details>
          EOF
        env:
          CAO_API_TOKEN: ${{ steps.cao_pre_activation_app_token.outputs.token || secrets.GH_AW_GITHUB_TOKEN || github.token }}
          CAO_PACKAGE: eu-cra-compliance
          CAO_ROLE: orchestrator
          CAO_WORKER: __none__
          CAO_WORKFLOW_DISPATCH_INPUTS: ${{ toJSON(github.event.inputs) }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
      - name: Ensure CAO admission record
        if: ${{ always() }}
        run: |
          set -euo pipefail
          record="${RUNNER_TEMP}/cao/admission.json"
          if [[ -f "$record" ]]; then
           exit 0
          fi
          mkdir -p "$(dirname "$record")"
          node - "$record" <<'EOF'
          const fs = require("node:fs");
          const checks = [
           "Runtime revision", "Policy document", "Control plane", "Workflow identity",
           "Package", "Worker", "Target input", "Mode input", "Run limits",
           "GitHub API capacity", "Runner disk capacity",
          ].map((check, index) => ({ check, status: index === 0 ? "failed" : "not-evaluated" }));
          fs.writeFileSync(process.argv[2], `${JSON.stringify({
           schema_version: 1,
           observed_at: new Date().toISOString(),
           repository: process.env.GITHUB_REPOSITORY || "",
           workflow: process.env.GITHUB_WORKFLOW || "",
           workflow_sha: process.env.GITHUB_WORKFLOW_SHA || "",
           run_id: process.env.GITHUB_RUN_ID || "",
           run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT || 1),
           package: process.env.CAO_PACKAGE || "",
           role: process.env.CAO_ROLE || "",
           worker: process.env.CAO_ROLE === "orchestrator" ? "" : process.env.CAO_WORKER || "",
           target_repository: "",
           authorized: process.env.CAO_ADMISSION_AUTHORIZED === "true",
           reason: process.env.CAO_ADMISSION_REASON || "cannot read or execute the CAO control modules at github.workflow_sha",
           failed_check: "Runtime revision",
           checks,
          }, null, 2)}\n`);
          EOF
        env:
          CAO_ADMISSION_AUTHORIZED: ${{ steps.cao_admission.outputs.authorized }}
          CAO_ADMISSION_REASON: ${{ steps.cao_admission.outputs.reason }}
          CAO_PACKAGE: eu-cra-compliance
          CAO_ROLE: orchestrator
          CAO_WORKER: __none__
      - name: Upload CAO admission artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: cao-admission
          path: ${{ runner.temp }}/cao/admission.json
          retention-days: 8.0
      - name: "CAO admission blocked: GitHub API limited until ${{ steps.cao_admission.outputs.github_api_reset_at }}"
        if: ${{ steps.cao_admission.outputs.reason == 'github-api-capacity-insufficient' }}
        run: |
          echo "::error title=CAO admission blocked by GitHub API capacity::${CAO_API_REMAINING} of ${CAO_API_LIMIT} core requests remain; ${CAO_API_REQUIRED} required. Retry after ${CAO_API_RESET_AT}. See the admission summary for next steps."
          exit 1
        env:
          CAO_API_LIMIT: ${{ steps.cao_admission.outputs.github_api_limit }}
          CAO_API_REMAINING: ${{ steps.cao_admission.outputs.github_api_remaining }}
          CAO_API_REQUIRED: ${{ steps.cao_admission.outputs.github_api_required }}
          CAO_API_RESET_AT: ${{ steps.cao_admission.outputs.github_api_reset_at }}
      - name: "CAO admission blocked: GitHub API capacity unavailable"
        if: ${{ steps.cao_admission.outputs.reason == 'github-api-capacity-unavailable' }}
        run: |
          echo "::error title=CAO admission could not verify GitHub API capacity::Check authentication and GitHub API status. See the admission summary for next steps."
          exit 1
      - name: "CAO admission blocked: runner disk space too low"
        if: ${{ steps.cao_admission.outputs.reason == 'runner-disk-capacity-insufficient' }}
        run: |
          echo "::error title=CAO admission blocked by runner disk capacity::${CAO_DISK_AVAILABLE} MB free on ${CAO_DISK_PATH}; ${CAO_DISK_REQUIRED} MB required. See the admission summary for next steps."
          exit 1
        env:
          CAO_DISK_AVAILABLE: ${{ steps.cao_admission.outputs.runner_disk_available_mb }}
          CAO_DISK_PATH: ${{ steps.cao_admission.outputs.runner_disk_path }}
          CAO_DISK_REQUIRED: ${{ steps.cao_admission.outputs.runner_disk_required_mb }}
      - name: "CAO admission blocked: runner disk capacity unavailable"
        if: ${{ steps.cao_admission.outputs.reason == 'runner-disk-capacity-unavailable' }}
        run: |
          echo "::error title=CAO admission could not verify runner disk capacity::Free disk space could not be read for ${CAO_DISK_PATH}. See the admission summary for next steps."
          exit 1
        env:
          CAO_DISK_PATH: ${{ steps.cao_admission.outputs.runner_disk_path }}
      - name: Install gh-aw CLI when monthly budget is enabled
        if: ${{ steps.cao_admission.outputs.authorized == 'true' && steps.cao_admission.outputs.monthly_credit_budget != '0' }}
        uses: github/gh-aw-actions/setup-cli@23e16337f3568b3c18bb04a976793f282a016755 # v0.88.4
        with:
          version: v0.88.4
      - name: Run CAO control precompute
        id: cao_precompute
        if: ${{ steps.cao_admission.outputs.authorized == 'true' }}
        run: |
          set -euo pipefail
          read_dispatch_input() {
            node -e 'const inputs = JSON.parse(process.env.CAO_WORKFLOW_DISPATCH_INPUTS || "{}"); const value = inputs[process.argv[1]]; process.stdout.write(value == null ? "" : String(value));' "$1"
          }
          target_repo="$(read_dispatch_input target_repo)"
          requested_mode="$(read_dispatch_input safe_output_mode)"
          requested_safe_output_repo="$(read_dispatch_input safe_output_repo)"
          export CAO_REQUESTED_MODE="$requested_mode"
          export CAO_REQUESTED_MAX_REPOSITORIES="$(read_dispatch_input max_repos)"
          export CAO_REQUESTED_ROLLOUT_PERCENT="$(read_dispatch_input rollout_percent)"
          export CAO_TARGET_REPOSITORY="$target_repo"
          if [[ "${requested_mode:-review}" == "review" ]]; then
            export CAO_SAFE_OUTPUT_REPOSITORY="${requested_safe_output_repo:-$GITHUB_REPOSITORY}"
          else
            export CAO_SAFE_OUTPUT_REPOSITORY="$target_repo"
          fi
          export CAO_CORRELATION_ID="$(read_dispatch_input correlation_id)"
          export CAO_CENTRAL_REPOSITORY="$(read_dispatch_input central_repo)"
          export CAO_CONTROL_PLANE_RUN_URL="$(read_dispatch_input control_plane_run_url)"
          node "${GITHUB_WORKSPACE:-.}/.cao/.github/cao/src/control.mjs" precompute
        env:
          CAO_DISPATCH_MAX: "48"
          CAO_ORCHESTRATOR_CREDITS: "200"
          CAO_PACKAGE: eu-cra-compliance
          CAO_ROLE: orchestrator
          CAO_WORKER: __none__
          CAO_WORKER_CREDITS_PER_TARGET: "600"
          CAO_WORKFLOW_DISPATCH_INPUTS: ${{ toJSON(github.event.inputs) }}
          GH_TOKEN: ${{ steps.cao_pre_activation_app_token.outputs.token || secrets.GH_AW_GITHUB_TOKEN || github.token }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
      - name: "CAO precompute blocked: GitHub API limited until ${{ steps.cao_precompute.outputs.github_api_reset_at }}"
        if: ${{ steps.cao_precompute.outputs.reason == 'github-api-capacity-insufficient' }}
        run: |
          echo "::warning title=CAO precompute blocked by GitHub API capacity::${CAO_API_REMAINING} of ${CAO_API_LIMIT} core requests remain; ${CAO_API_REQUIRED} required. Retry after ${CAO_API_RESET_AT}. See the admission summary for next steps."
        env:
          CAO_API_LIMIT: ${{ steps.cao_precompute.outputs.github_api_limit }}
          CAO_API_REMAINING: ${{ steps.cao_precompute.outputs.github_api_remaining }}
          CAO_API_REQUIRED: ${{ steps.cao_precompute.outputs.github_api_required }}
          CAO_API_RESET_AT: ${{ steps.cao_precompute.outputs.github_api_reset_at }}
      - name: "CAO precompute blocked: GitHub API capacity unavailable"
        if: ${{ steps.cao_precompute.outputs.reason == 'github-api-capacity-unavailable' }}
        run: |
          echo "::warning title=CAO precompute could not verify GitHub API capacity::Check authentication and GitHub API status. See the admission summary for next steps."
      - name: Validate CAO control precompute artifact
        if: ${{ steps.cao_admission.outputs.authorized == 'true' && steps.cao_precompute.outputs.authorized != 'false' }}
        run: |
          set -euo pipefail
          out=/tmp/gh-aw/agent/control-precompute.json
          expected_worker="$CAO_WORKER"
          [ "$CAO_ROLE" != "orchestrator" ] || expected_worker=""
          [ -f "$out" ]
          jq -e '.authorized == true' "$out" >/dev/null
          jq -e --arg package "$CAO_PACKAGE" '.package == $package and .bundle == $package' "$out" >/dev/null
          jq -e --arg role "$CAO_ROLE" '.control_role == $role' "$out" >/dev/null
          jq -e --arg worker "$expected_worker" '.worker == $worker' "$out" >/dev/null
          jq -e --arg repository "$CONTROL_REPOSITORY" --arg sha "$GITHUB_WORKFLOW_SHA" \
            '.policy_source == {repository:$repository,path:".github/workflows/cao.json",sha:$sha}' \
            "$out" >/dev/null
        env:
          CAO_PACKAGE: eu-cra-compliance
          CAO_ROLE: orchestrator
          CAO_WORKER: __none__
          CONTROL_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
      - name: Upload CAO control precompute artifact
        if: ${{ steps.cao_admission.outputs.authorized == 'true' && steps.cao_precompute.outputs.authorized != 'false' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: cao-control-precompute
          path: /tmp/gh-aw/agent/control-precompute.json
          retention-days: 1.0
      - name: Check team membership for workflow
        id: check_membership
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_REQUIRED_ROLES: "admin,maintainer,write"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'check_membership.cjs'));
            await main();

  safe_outputs:
    needs:
      - activation
      - agent
    if: (!cancelled()) && needs.agent.result != 'skipped'
    runs-on: ubuntu-slim
    environment: central-agentic-ops
    permissions:
      actions: write
      issues: write
    timeout-minutes: 45
    env:
      GH_AW_AGENT_AIC: ${{ needs.agent.outputs.aic }}
      GH_AW_AIC: ${{ needs.agent.outputs.aic }}
      GH_AW_AMBIENT_CONTEXT: ${{ needs.agent.outputs.ambient_context }}
      GH_AW_CALLER_WORKFLOW_ID: "${{ github.repository }}/eu-cra-compliance"
      GH_AW_EFFECTIVE_TOKENS: ${{ needs.agent.outputs.effective_tokens }}
      GH_AW_ENGINE_ID: "pi"
      GH_AW_ENGINE_MODEL: "copilot/gpt-5.4"
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
      GH_AW_WORKFLOW_ID: "eu-cra-compliance"
      GH_AW_WORKFLOW_NAME: "EU CRA"
      GH_AW_WORKFLOW_SOURCE_URL: "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/.github/workflows/eu-cra-compliance.md"
    outputs:
      app_token_minting_failed: ${{ steps.safe-outputs-app-token.outcome == 'failure' }}
      code_push_failure_count: ${{ steps.process_safe_outputs.outputs.code_push_failure_count }}
      code_push_failure_errors: ${{ steps.process_safe_outputs.outputs.code_push_failure_errors }}
      create_discussion_error_count: ${{ steps.process_safe_outputs.outputs.create_discussion_error_count }}
      create_discussion_errors: ${{ steps.process_safe_outputs.outputs.create_discussion_errors }}
      process_safe_outputs_items_applied: ${{ steps.process_safe_outputs.outputs.items_applied }}
      process_safe_outputs_items_cancelled: ${{ steps.process_safe_outputs.outputs.items_cancelled }}
      process_safe_outputs_items_deferred: ${{ steps.process_safe_outputs.outputs.items_deferred }}
      process_safe_outputs_items_failed: ${{ steps.process_safe_outputs.outputs.items_failed }}
      process_safe_outputs_items_skipped: ${{ steps.process_safe_outputs.outputs.items_skipped }}
      process_safe_outputs_items_succeeded: ${{ steps.process_safe_outputs.outputs.items_succeeded }}
      process_safe_outputs_items_warnings: ${{ steps.process_safe_outputs.outputs.items_warnings }}
      process_safe_outputs_processed_count: ${{ steps.process_safe_outputs.outputs.processed_count }}
      process_safe_outputs_status: ${{ steps.process_safe_outputs.outputs.status }}
      process_safe_outputs_temporary_id_map: ${{ steps.process_safe_outputs.outputs.temporary_id_map }}
    steps:
      - name: Setup Scripts
        id: setup
        uses: github/gh-aw-actions/setup@23e16337f3568b3c18bb04a976793f282a016755 # v0.88.4
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
          trace-id: ${{ needs.activation.outputs.setup-trace-id }}
          parent-span-id: ${{ needs.activation.outputs.setup-parent-span-id || needs.activation.outputs.setup-span-id }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "EU CRA"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/eu-cra-compliance.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "0.84.3"
          GH_AW_INFO_AWF_VERSION: "v0.28.13"
          GH_AW_INFO_ENGINE_ID: "pi"
      - name: Mask OTLP telemetry headers
        run: bash "${RUNNER_TEMP}/gh-aw/actions/mask_otlp_headers.sh"
      - name: Download agent output artifact
        id: download-agent-output
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{agent,agent-output-fallback}"
          merge-multiple: true
          path: /tmp/gh-aw/
      - name: Setup agent output environment variable
        id: setup-agent-output-env
        if: steps.download-agent-output.outcome == 'success'
        run: |
          mkdir -p /tmp/gh-aw/
          find "/tmp/gh-aw/" -type f -print
          if [ -f "/tmp/gh-aw/agent_output.json" ]; then
            echo "GH_AW_AGENT_OUTPUT=/tmp/gh-aw/agent_output.json" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate GitHub App token
        id: safe-outputs-app-token
        env:
          GH_AW_IGNORE_IF_MISSING_PRIVATE_KEY: ${{ secrets.GH_AW_GITHUB_WRITE_APP_PRIVATE_KEY }}
        if: ${{ vars.GH_AW_GITHUB_WRITE_APP_ID != '' && env.GH_AW_IGNORE_IF_MISSING_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_AW_GITHUB_WRITE_APP_ID }}
          private-key: ${{ secrets.GH_AW_GITHUB_WRITE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          github-api-url: ${{ github.api_url }}
          permission-actions: write
          permission-issues: write
      - name: Configure GH_HOST for enterprise compatibility
        id: ghes-host-config
        shell: bash
        run: | # zizmor: ignore[github-env] - GITHUB_SERVER_URL is set by GitHub Actions, not user input.
          # Derive GH_HOST from GITHUB_SERVER_URL so the gh CLI targets the correct
          # GitHub instance (GHES/GHEC). On github.com this is a harmless no-op.
          GH_HOST="${GITHUB_SERVER_URL#https://}"
          GH_HOST="${GH_HOST#http://}"
          echo "GH_HOST=${GH_HOST}" >> "$GITHUB_ENV"
      - name: Process Safe Outputs
        id: process_safe_outputs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_AGENT_OUTPUT: ${{ steps.setup-agent-output-env.outputs.GH_AW_AGENT_OUTPUT }}
          GH_AW_COMMENT_ID: ${{ needs.activation.outputs.comment_id }}
          GH_AW_ALLOWED_DOMAINS: "*.githubusercontent.com,api.snapcraft.io,archive.ubuntu.com,azure.archive.ubuntu.com,codeload.github.com,crl.geotrust.com,crl.globalsign.com,crl.identrust.com,crl.sectigo.com,crl.thawte.com,crl.usertrust.com,crl.verisign.com,crl3.digicert.com,crl4.digicert.com,crls.ssl.com,docs.github.com,github-cloud.githubusercontent.com,github-cloud.s3.amazonaws.com,github.blog,github.com,github.githubassets.com,json-schema.org,json.schemastore.org,keyserver.ubuntu.com,lfs.github.com,objects.githubusercontent.com,ocsp.digicert.com,ocsp.geotrust.com,ocsp.globalsign.com,ocsp.identrust.com,ocsp.sectigo.com,ocsp.ssl.com,ocsp.thawte.com,ocsp.usertrust.com,ocsp.verisign.com,packagecloud.io,packages.cloud.google.com,packages.microsoft.com,patch-diff.githubusercontent.com,patchdiff.githubusercontent.com,ppa.launchpad.net,raw.githubusercontent.com,s.symcb.com,s.symcd.com,security.ubuntu.com,ts-crl.ws.symantec.com,ts-ocsp.ws.symantec.com,www.googleapis.com"
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_API_URL: ${{ github.api_url }}
          GH_AW_SAFE_OUTPUTS_HANDLER_CONFIG: "{\"create_report_incomplete_issue\":{},\"dispatch_workflow\":{\"allowed_refs\":[\"refs/heads/${{ github.event.repository.default_branch }}\"],\"aw_context_workflows\":[\"eu-cra-compliance-scope-classifier\",\"eu-cra-compliance-security-requirements-auditor\",\"eu-cra-compliance-supply-chain-sbom-auditor\",\"eu-cra-compliance-vulnerability-handling-auditor\",\"eu-cra-compliance-article-14-reporting-readiness\",\"eu-cra-compliance-conformity-release-evidence\"],\"max\":48,\"workflow_files\":{\"eu-cra-compliance-article-14-reporting-readiness\":\".lock.yml\",\"eu-cra-compliance-conformity-release-evidence\":\".lock.yml\",\"eu-cra-compliance-scope-classifier\":\".lock.yml\",\"eu-cra-compliance-security-requirements-auditor\":\".lock.yml\",\"eu-cra-compliance-supply-chain-sbom-auditor\":\".lock.yml\",\"eu-cra-compliance-vulnerability-handling-auditor\":\".lock.yml\"},\"workflows\":[\"eu-cra-compliance-scope-classifier\",\"eu-cra-compliance-security-requirements-auditor\",\"eu-cra-compliance-supply-chain-sbom-auditor\",\"eu-cra-compliance-vulnerability-handling-auditor\",\"eu-cra-compliance-article-14-reporting-readiness\",\"eu-cra-compliance-conformity-release-evidence\"]},\"missing_data\":{},\"missing_tool\":{},\"noop\":{\"max\":1,\"report-as-issue\":\"false\"},\"report_incomplete\":{}}"
        with:
          github-token: ${{ steps.safe-outputs-app-token.outputs.token || secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'process_safe_outputs.cjs'));
            await main();
      - name: Upload Safe Outputs Items
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: safe-outputs-items
          path: |
            /tmp/gh-aw/safe-output-items.jsonl
            /tmp/gh-aw/temporary-id-map.json
            /tmp/gh-aw/safe-output-errors.json
          if-no-files-found: ignore
