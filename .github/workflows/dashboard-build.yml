name: CAO Dashboard Build

run-name: CAO Dashboard Build / ${{ inputs.request-id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      site-path:
        description: Relative path at which the dashboard will be mounted in the artifact.
        required: false
        type: string
        default: cao
      mode:
        description: Refresh activity data or use only the most recently cached snapshot.
        required: false
        type: choice
        options:
          - live
          - cache
        default: live
      request-id:
        description: Correlation identifier supplied by a dispatching workflow.
        required: false
        type: string

permissions:
  contents: read

jobs:
  activity:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      run-id: ${{ steps.dispatch.outputs.run-id }}
      run-attempt: ${{ steps.dispatch.outputs.run-attempt }}
      skipped: ${{ steps.dispatch.outputs.skipped }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout trusted dashboard source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Check for a cached activity snapshot
        if: inputs.mode == 'cache'
        id: cache-check
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cao-activity
          key: cao-activity-v2-lookup-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cao-activity-v2-
          lookup-only: true

      - name: Dispatch activity refresh
        id: dispatch
        if: inputs.mode == 'live' || steps.cache-check.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_WORKFLOW: activity.yml
          DISPATCH_REF: ${{ github.ref_name }}
          DISPATCH_RUN_NAME: CAO Activity / dashboard-build-${{ github.run_id }}-${{ github.run_attempt }}
          DISPATCH_INPUTS: '{"request-id":"dashboard-build-${{ github.run_id }}-${{ github.run_attempt }}"}'
        run: |
          if [[ -f .github/aw/dashboard/dispatch-workflow.mjs ]]; then
            node .github/aw/dashboard/dispatch-workflow.mjs
          else
            node dashboard/dispatch-workflow.mjs
          fi

  build:
    needs: activity
    if: always() && needs.activity.result == 'success' && needs.activity.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Validate dashboard site path
        env:
          DASHBOARD_SITE_PATH: ${{ inputs.site-path }}
          DASHBOARD_MODE: ${{ inputs.mode }}
        run: |
          if [[ "$DASHBOARD_MODE" != "live" && "$DASHBOARD_MODE" != "cache" ]]; then
            echo "mode must be 'live' or 'cache'" >&2
            exit 1
          fi
          if [[ "$DASHBOARD_SITE_PATH" != "." && ! "$DASHBOARD_SITE_PATH" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then
            echo "site-path must be '.' or a relative URL path" >&2
            exit 1
          fi
          if [[ "$DASHBOARD_SITE_PATH" == /* || "$DASHBOARD_SITE_PATH" == *..* || "$DASHBOARD_SITE_PATH" == */ || "$DASHBOARD_SITE_PATH" == *//* ]]; then
            echo "site-path must not be absolute, traverse directories, or end with '/'" >&2
            exit 1
          fi

      - name: Checkout trusted report source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Resolve dashboard source layout
        run: |
          if [[ -f .github/aw/dashboard/report/dashboard-language-sources.mjs && -f .github/aw/dashboard/site/index.html ]]; then
            echo "DASHBOARD_LAYOUT=installed" >> "$GITHUB_ENV"
            echo "DASHBOARD_REPORT_ROOT=.github/aw/dashboard/report" >> "$GITHUB_ENV"
          elif [[ -f dashboard/report/records.mjs && -f dashboard/site/scripts/build.mjs ]]; then
            echo "DASHBOARD_LAYOUT=source" >> "$GITHUB_ENV"
            echo "DASHBOARD_REPORT_ROOT=dashboard/report" >> "$GITHUB_ENV"
          else
            echo "Dashboard package sources are unavailable" >&2
            exit 1
          fi

      - name: Restore collected activity data
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cao-activity
          key: ${{ format('cao-activity-v2-{0}-{1}', needs.activity.outputs.run-id, needs.activity.outputs.run-attempt) }}
          restore-keys: |
            cao-activity-v2-

      - name: Require collected activity data
        env:
          ACTIVITY_DATA_ROOT: ${{ runner.temp }}/cao-activity
        run: |
          for file in control-settings.json control-plane-inventory.json deployed-workflows.json aic-usage.json operational-values.json dashboard-records.json gh-aw-logs.json; do
            if [[ ! -f "$ACTIVITY_DATA_ROOT/$file" ]]; then
              echo "Collected activity data is unavailable: $file" >&2
              exit 1
            fi
          done

      - name: Refresh authoritative control policy
        run: |
          node "$DASHBOARD_REPORT_ROOT/control-settings.mjs" \
            .github/cao/src/control.mjs \
            .github/workflows/cao.json \
            "$RUNNER_TEMP/cao-activity/control-settings.json"

      - name: Assemble Dashboard Language site
        env:
          REPORT_OUTPUT: ${{ runner.temp }}/central-agentic-ops-dashboard/${{ inputs.site-path }}
        run: |
          if [[ "$DASHBOARD_LAYOUT" == "source" ]]; then
            node dashboard/site/scripts/build.mjs \
              "$REPORT_OUTPUT" \
              "$RUNNER_TEMP/cao-activity/control-settings.json"
          else
            mkdir -p "$REPORT_OUTPUT"
            cp -R .github/aw/dashboard/site/. "$REPORT_OUTPUT/"
            node "$DASHBOARD_REPORT_ROOT/configure-site.mjs" \
              "$REPORT_OUTPUT/index.html" \
              "$RUNNER_TEMP/cao-activity/control-settings.json"
            node "$DASHBOARD_REPORT_ROOT/bundle-dashboards.mjs" \
              "$REPORT_OUTPUT/dashboard.json" \
              .github/aw/dashboards
          fi
          cp "$RUNNER_TEMP/cao-activity/gh-aw-logs.json" "$REPORT_OUTPUT/gh-aw-logs.json"

      - name: Build Dashboard Language sources
        env:
          REPORT_AIC_USAGE: ${{ runner.temp }}/cao-activity/aic-usage.json
          REPORT_CONTROL_SETTINGS: ${{ runner.temp }}/cao-activity/control-settings.json
          REPORT_DASHBOARD_SOURCES: ${{ runner.temp }}/central-agentic-ops-dashboard/${{ inputs.site-path }}/sources.json
          REPORT_DEPLOYED_WORKFLOWS: ${{ runner.temp }}/cao-activity/deployed-workflows.json
          REPORT_INVENTORY: ${{ runner.temp }}/cao-activity/control-plane-inventory.json
          REPORT_GITHUB_TELEMETRY: ${{ runner.temp }}/cao-activity/cao-gh.jsonl
          REPORT_OPERATIONAL_VALUES: ${{ runner.temp }}/cao-activity/operational-values.json
          REPORT_RECORDS: ${{ runner.temp }}/cao-activity/dashboard-records.json
        run: node "$DASHBOARD_REPORT_ROOT/dashboard-language-sources.mjs"

      - name: Cache dashboard artifact for the dispatching workflow
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/central-agentic-ops-dashboard
          key: cao-dashboard-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload dashboard data artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: central-agentic-ops-dashboard-data
          path: ${{ runner.temp }}/central-agentic-ops-dashboard/${{ inputs.site-path }}/sources.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: central-agentic-ops-dashboard
          path: ${{ runner.temp }}/central-agentic-ops-dashboard
          if-no-files-found: error
          retention-days: 1