name: CAO validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/cao-validate.yml"
      - ".github/workflows/cao*.json"
      - ".github/workflows/*.md"
      - ".github/workflows/*.lock.yml"
      - ".github/workflows/shared/**"
      - ".github/aw/**"
      - "activity/cao.mjs"
      - "activity/commands/**"
      - "activity/validation.mjs"
      - "cao.sh"
      - "aw.yml"
      - "*/aw.yml"
      - "*/cao.json"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/cao-validate.yml"
      - ".github/workflows/cao*.json"
      - ".github/workflows/*.md"
      - ".github/workflows/*.lock.yml"
      - ".github/workflows/shared/**"
      - ".github/aw/**"
      - "activity/cao.mjs"
      - "activity/commands/**"
      - "activity/validation.mjs"
      - "cao.sh"
      - "aw.yml"
      - "*/aw.yml"
      - "*/cao.json"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: cao-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      api_available: ${{ steps.rate_limit.outputs.available }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install policy-pinned gh-aw
        uses: ./.github/actions/setup-gh-aw # zizmor: ignore[self-repository] - Local actions use the syntax accepted by GitHub Actions and actionlint.
      - name: Check GitHub API capacity
        id: rate_limit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remaining="$(gh api rate_limit --jq '.resources.core.remaining')"
          if [[ ! "$remaining" =~ ^[0-9]+$ ]]; then
            echo "::error::GitHub API returned an invalid core rate limit"
            exit 1
          fi
          if (( remaining == 0 )); then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping CAO validation because the GitHub API core rate limit is exhausted"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate CAO
        id: validation
        if: steps.rate_limit.outputs.available == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          ./cao.sh validate --json > "$RUNNER_TEMP/cao-validation.json"
          status=$?
          echo "exit-code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Upload validation report
        if: always() && steps.rate_limit.outputs.available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cao-validation
          path: ${{ runner.temp }}/cao-validation.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve validation result
        if: always() && steps.validation.outputs.exit-code != '0'
        env:
          EXIT_CODE: ${{ steps.validation.outputs.exit-code }}
        run: exit "${EXIT_CODE:-2}"

  report:
    needs: validate
    if: >-
      always() &&
      needs.validate.result != 'cancelled' &&
      needs.validate.outputs.api_available == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: Download validation report
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cao-validation
          path: validation
      - name: Report validation findings
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- cao-validation -->'
            const title = '[cao] CAO validation findings'
            const legacyTitle = 'CAO validation findings'
            const reportPath = 'validation/cao-validation.json'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const escape = (value) => String(value ?? '')
              .replaceAll('@', '@\u200b')
              .replaceAll('#', '#\u200b')
              .slice(0, 2000)
            const ignoreForbidden = async (operation, callback) => {
              try {
                return await callback()
              } catch (error) {
                if (error.status !== 403) throw error
                core.warning(`Skipping validation issue ${operation}: GitHub API returned 403`)
                return undefined
              }
            }
            let report
            if (process.env.DOWNLOAD_OUTCOME === 'success' && fs.existsSync(reportPath)) {
              const stats = fs.statSync(reportPath)
              if (stats.size > 1024 * 1024) throw new Error('Validation artifact exceeds 1 MiB')
              try {
                report = JSON.parse(fs.readFileSync(reportPath, 'utf8'))
              } catch (error) {
                core.warning(`Validation artifact is not valid JSON: ${error.message}`)
              }
            }
            if (!report) {
              report = {
                validatorVersion: 'unknown',
                summary: { errors: 1, warnings: 0 },
                findings: [{
                  id: 'validation-artifact-missing',
                  severity: 'error',
                  title: 'Validation did not produce a structured report',
                  expected: './cao.sh validate --json produces cao-validation.json',
                  observed: 'The validation artifact was unavailable',
                  files: [],
                  remediation: './cao.sh validate',
                }],
              }
            }
            if (!report || !Array.isArray(report.findings) || !report.summary ||
                !Number.isInteger(report.summary.errors) || !Number.isInteger(report.summary.warnings) ||
                report.findings.length > 200 ||
                report.findings.some((finding) =>
                  !finding || typeof finding !== 'object' ||
                  typeof finding.id !== 'string' || finding.id.length > 100 ||
                  !['error', 'warning', 'note'].includes(finding.severity) ||
                  typeof finding.title !== 'string' || finding.title.length > 500 ||
                  !Array.isArray(finding.files) || finding.files.length > 50 ||
                  finding.files.some((file) => typeof file !== 'string' || file.length > 500))) {
              throw new Error('Invalid CAO validation artifact schema')
            }
            const openIssues = await ignoreForbidden('search', () =>
              github.paginate(github.rest.issues.listForRepo, {
                ...context.repo, state: 'open', per_page: 100,
              }))
            if (!openIssues) return
            const existing = openIssues.find((issue) =>
              !issue.pull_request && [title, legacyTitle].includes(issue.title) && issue.body?.includes(marker)
            )
            if (report.summary.errors === 0 && report.summary.warnings === 0) {
              if (existing) {
                await ignoreForbidden('publication', () =>
                  github.rest.issues.update({
                    ...context.repo,
                    issue_number: existing.number,
                    state: 'closed',
                    state_reason: 'completed',
                  }))
              }
              return
            }
            const sections = report.findings.slice(0, 50).map((finding) => [
              `### ${escape(finding.id)}: ${escape(finding.title)}`,
              '',
              `**What failed:** ${escape(finding.title)}`,
              `**Why it matters:** ${escape(finding.category || 'CAO control-plane integrity')}`,
              `**Expected state:** ${escape(finding.expected || 'Validation passes')}`,
              `**Observed state:** ${escape(finding.observed || 'A validation finding was emitted')}`,
              `**Affected files/workflows:** ${(finding.files || []).map((file) => `\`${escape(file)}\``).join(', ') || 'Not identified'}`,
              `**Suggested remediation:** \`${escape(finding.remediation || './cao.sh validate')}\``,
              `**Local reproduction:** \`${escape(finding.validate || './cao.sh validate')}\``,
            ].join('\n'))
            const footer = `> Generated by [CAO validation](${runUrl})`
            const maxBodyPrefixLength = 60000 - footer.length - 2
            const bodyParts = [
              marker,
              `CAO validation found ${report.summary.errors} error(s) and ${report.summary.warnings} warning(s).`,
              '**Action:** Assign this issue to the repository’s configured coding agent, apply the suggested remediation, and rerun validation.',
              ...sections,
              [
                '### Validate',
                '',
                '```bash',
                './cao.sh validate',
                './cao.sh validate --json',
                '```',
              ].join('\n'),
            ]
            while (bodyParts.join('\n\n').length > maxBodyPrefixLength && bodyParts.length > 4) {
              bodyParts.splice(bodyParts.length - 2, 1)
            }
            const body = [
              bodyParts.join('\n\n'),
              footer,
            ].join('\n\n')
            if (existing) {
              await ignoreForbidden('publication', () =>
                github.rest.issues.update({
                  ...context.repo,
                  issue_number: existing.number,
                  title,
                  body,
                }))
            } else {
              await ignoreForbidden('publication', () =>
                github.rest.issues.create({
                  ...context.repo,
                  title,
                  body,
                }))
            }
