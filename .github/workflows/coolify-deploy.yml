name: Coolify dashboard delivery

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Deployment channel
        required: true
        type: choice
        options:
          - alpha
          - stable
  push:
    branches: [main]
    paths:
      - .github/workflows/cao-package.yml
      - .github/workflows/cao-package-publish.yml
      - .github/workflows/coolify-deploy.yml
      - .dockerignore
      - dashboard/site/**
      - server/**
      - server/coolify/**
      - tests/unit/coolify-deployment-contract.test.mjs
  release:
    types: [released]

permissions:
  contents: read

concurrency:
  group: coolify-delivery-${{ github.event_name }}-${{ inputs.channel || github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize delivery trigger
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - id: authorization
        name: Require trusted manual or rerun authority
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EVENT_NAME: ${{ github.event_name }}
          ORIGINAL_ACTOR: ${{ github.actor }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            core.info('Starting delivery trigger authorization');
            if (context.payload.repository.fork) {
              throw new Error('Coolify delivery is refused for a fork repository payload');
            }
            core.info('Repository origin check passed');
            const requiresActorAuthorization =
              process.env.EVENT_NAME === 'workflow_dispatch' ||
              Number(process.env.RUN_ATTEMPT) > 1;
            if (requiresActorAuthorization) {
              core.info('Checking original and rerun actor permissions');
              for (const actor of new Set([
                process.env.ORIGINAL_ACTOR,
                process.env.TRIGGERING_ACTOR,
              ])) {
                core.info('Checking one delivery actor');
                const { data: access } = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  username: actor,
                });
                if (!['admin', 'maintain'].includes(access.role_name)) {
                  throw new Error('Manual and rerun delivery requires maintain or admin repository permission');
                }
              }
              core.info('Required repository permissions verified');
            } else {
              core.info('Automatic first-attempt trigger does not require actor elevation');
            }
            if (process.env.EVENT_NAME === 'workflow_dispatch') {
              core.info('Resolving the current default branch for manual delivery');
              const { data: repository } = await github.rest.repos.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              const { data: branch } = await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: repository.default_branch,
              });
              if (process.env.WORKFLOW_REF !== `refs/heads/${repository.default_branch}` ||
                  process.env.WORKFLOW_SHA !== branch.commit.sha) {
                throw new Error('Manual delivery must use the current default-branch workflow');
              }
              core.info('Current default-branch workflow verified');
            } else {
              core.info('Manual workflow-source validation is not required for this event');
            }
            core.info('Delivery trigger authorization completed');
      - name: Summarize delivery authorization
        if: always()
        env:
          AUTHORIZATION_STATUS: ${{ steps.authorization.outcome }}
        run: |
          {
            echo "## Coolify delivery authorization"
            echo
            echo "<details><summary>Trigger authority: ${AUTHORIZATION_STATUS}</summary>"
            echo
            echo "- Check: repository origin, manual/rerun actor permissions, and trusted workflow source"
            echo "- Data exposure: outcome only; actor and repository details are omitted"
            echo "</details>"
          } >> "${GITHUB_STEP_SUMMARY}"

  classify:
    name: Select explicit deployment tier
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.classify.outputs.eligible }}
      environment: ${{ steps.classify.outputs.environment }}
      tier: ${{ steps.classify.outputs.tier }}
      version: ${{ steps.classify.outputs.version }}
      identity: ${{ steps.classify.outputs.identity }}
      expected_sha: ${{ steps.classify.outputs.expected_sha }}
    steps:
      - id: classify
        name: Resolve immutable deployment source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CHANNEL: ${{ inputs.channel }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SHA: ${{ github.sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            core.info('Starting immutable deployment source classification');
            if (context.payload.repository.fork) {
              throw new Error('Coolify delivery is refused for a fork repository payload');
            }
            core.info('Repository origin check passed');

            const stableTag = /^v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)$/;

            async function peelTag(tag) {
              core.info('Resolving a stable release tag to its commit');
              let { data: ref } = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
              let object = ref.object;
              for (let depth = 0; object.type === 'tag' && depth < 10; depth += 1) {
                core.info('Resolving an annotated release tag layer');
                const { data: annotated } = await github.rest.git.getTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_sha: object.sha,
                });
                object = annotated.object;
              }
              if (object.type !== 'commit' || !/^[0-9a-f]{40}$/.test(object.sha)) {
                throw new Error('Deployment release tag does not resolve to an immutable commit SHA');
              }
              core.info('Stable release tag resolved to an immutable commit');
              return object.sha;
            }

            async function latestRelease() {
              core.info('Querying published releases for the latest stable vX.Y.Z version');
              const releases = await github.paginate(github.rest.repos.listReleases, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              });
              const release = releases
                .filter((candidate) =>
                  !candidate.draft &&
                  !candidate.prerelease &&
                  candidate.published_at &&
                  stableTag.test(candidate.tag_name))
                .sort((left, right) =>
                  Date.parse(right.published_at) - Date.parse(left.published_at) ||
                  right.id - left.id)[0];
              if (!release) {
                throw new Error('No published eligible stable vX.Y.Z release exists');
              }
              core.info('Latest eligible stable release selected');
              return release;
            }

            let tier;
            let environment;
            let version;
            let identity;
            let expectedSha;

            if (process.env.EVENT_NAME === 'push') {
              core.info('Classifying a protected main push');
              if (process.env.REF !== 'refs/heads/main' || !/^[0-9a-f]{40}$/.test(process.env.SHA)) {
                throw new Error('Alpha delivery requires an exact main commit');
              }
              tier = 'alpha';
              environment = 'coolify-alpha';
              version = `0.0.0-main.${process.env.SHA.slice(0, 12)}`;
              identity = `sha-${process.env.SHA}`;
              expectedSha = process.env.SHA;
            } else if (process.env.EVENT_NAME === 'release') {
              core.info('Classifying a stable release event');
              const tag = process.env.RELEASE_TAG;
              if (!stableTag.test(tag) || context.payload.release.prerelease) {
                throw new Error('Published release tag must be an exact stable version vX.Y.Z');
              }
              tier = 'stable';
              environment = 'coolify-stable';
              version = tag;
              identity = tag;
              expectedSha = await peelTag(tag);
            } else if (process.env.EVENT_NAME === 'workflow_dispatch') {
              core.info('Classifying a manually selected deployment channel');
              if (process.env.REF !== 'refs/heads/main') {
                throw new Error('Manual delivery must select the current main branch');
              }
              tier = process.env.CHANNEL;
              if (!['alpha', 'stable'].includes(tier)) {
                throw new Error('Manual deployment channel is invalid');
              }
              environment = `coolify-${tier}`;
              if (tier === 'alpha') {
                core.info('Resolving the current protected main source');
                if (process.env.REF !== 'refs/heads/main') {
                  throw new Error('Manual alpha delivery must select main');
                }
                const { data: branch } = await github.rest.repos.getBranch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  branch: 'main',
                });
                expectedSha = branch.commit.sha;
                if (process.env.SHA !== expectedSha) {
                  throw new Error('Manual alpha source is not the current main commit');
                }
                core.info('Manual alpha source matches the current main commit');
                version = `0.0.0-main.${expectedSha.slice(0, 12)}`;
                identity = `sha-${expectedSha}`;
              } else {
                core.info('Resolving the latest stable release source');
                const release = await latestRelease();
                identity = release.tag_name;
                version = release.tag_name;
                expectedSha = await peelTag(release.tag_name);
              }
            } else {
              throw new Error('Unsupported Coolify delivery event');
            }

            core.setOutput('eligible', 'true');
            core.setOutput('environment', environment);
            core.setOutput('tier', tier);
            core.setOutput('version', version);
            core.setOutput('identity', identity);
            core.setOutput('expected_sha', expectedSha);
            core.info('Immutable deployment source classification completed');
      - name: Summarize deployment classification
        if: always()
        env:
          CLASSIFICATION_STATUS: ${{ steps.classify.outcome }}
        run: |
          {
            echo "## Coolify delivery checks"
            echo
            echo "<details>"
            echo "<summary>Deployment classification: ${CLASSIFICATION_STATUS}</summary>"
            echo
            echo "- Check: trusted event, explicit tier, immutable package identity, and exact source"
            echo "- Data exposure: outcome only; repository payloads and release metadata are omitted"
            echo "</details>"
          } >> "${GITHUB_STEP_SUMMARY}"

  package:
    name: Resolve official CAO server package
    if: needs.classify.outputs.eligible == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      attestations: read
      contents: read
      packages: read
    outputs:
      image: ${{ steps.package.outputs.image }}
      digest: ${{ steps.package.outputs.digest }}
      source_sha: ${{ needs.classify.outputs.expected_sha }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: package
        name: Resolve and verify immutable package
        env:
          EVENT_NAME: ${{ github.event_name }}
          IDENTITY: ${{ needs.classify.outputs.identity }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ needs.classify.outputs.expected_sha }}
          VERSION: ${{ needs.classify.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repository="ghcr.io/${REPOSITORY,,}/cao-server"
          canonical="${repository}:${IDENTITY}"
          attempts=1
          if [[ "${EVENT_NAME}" == "push" || "${EVENT_NAME}" == "release" ]]; then
            attempts=120
          fi

          manifest=
          for ((attempt = 1; attempt <= attempts; attempt += 1)); do
            if manifest="$(docker buildx imagetools inspect "${canonical}" --format '{{json .Manifest}}' 2>/dev/null)"; then
              break
            fi
            if (( attempt == attempts )); then
              echo "official CAO server package is unavailable for ${IDENTITY}" >&2
              exit 1
            fi
            sleep 15
          done

          digest="$(jq -r '.digest // empty' <<<"${manifest}")"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "official CAO server package did not resolve to one immutable digest" >&2
            exit 1
          fi
          image="${repository}@${digest}"
          docker pull "${image}" >/dev/null
          package_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${image}")"
          package_version="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "${image}")"
          if [[ "${package_revision}" != "${REVISION}" || "${package_version}" != "${VERSION}" ]]; then
            echo "official CAO server package metadata does not match the classified source" >&2
            exit 1
          fi
          GH_TOKEN="${GITHUB_TOKEN}" gh attestation verify "oci://${image}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/cao-package-publish.yml" \
            --source-digest "${REVISION}" >/dev/null
          {
            echo "image=${image}"
            echo "digest=${digest}"
          } >> "${GITHUB_OUTPUT}"
      - name: Summarize package admission
        if: always()
        env:
          PACKAGE_STATUS: ${{ steps.package.outcome }}
        run: |
          {
            echo "## Official package admission"
            echo
            echo "<details><summary>Digest and OCI labels</summary>"
            echo
            echo "- Check: one immutable digest with expected version and source revision"
            echo "</details>"
            echo
            echo "<details><summary>GitHub artifact attestation</summary>"
            echo
            echo "- Check: signer workflow and source digest"
            echo "</details>"
            echo
            echo "<details><summary>Package admission outcome: ${PACKAGE_STATUS}</summary>"
            echo
            echo "- Data exposure: outcome and check classes only; package metadata and attestation bodies are omitted"
            echo "</details>"
          } >> "${GITHUB_STEP_SUMMARY}"

  deploy:
    name: Deploy exact digest to Coolify
    if: needs.classify.outputs.eligible == 'true' && (github.event_name != 'push' || vars.COOLIFY_DEPLOY_ENABLED == 'true')
    needs: [classify, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: coolify-${{ needs.classify.outputs.environment }}
      cancel-in-progress: false
    environment:
      name: ${{ needs.classify.outputs.environment }}
    permissions:
      contents: read
    steps:
      - id: adapter
        name: Verify deployment adapter configuration
        env:
          COOLIFY_DEPLOY_ENDPOINT: ${{ secrets.COOLIFY_DEPLOY_ENDPOINT }}
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${COOLIFY_DEPLOY_ENDPOINT}" || -z "${COOLIFY_DEPLOY_TOKEN}" ]]; then
            echo "deployment adapter configuration is incomplete" >&2
            exit 1
          fi
          echo "configured=true" >> "${GITHUB_OUTPUT}"
      - id: freshness
        name: Reject stale deployment source
        if: steps.adapter.outputs.configured == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXPECTED_SHA: ${{ needs.classify.outputs.expected_sha }}
          RELEASE_TAG: ${{ needs.classify.outputs.identity }}
          TIER: ${{ needs.classify.outputs.tier }}
        with:
          github-token: ${{ github.token }}
          script: |
            core.info('Starting deployment source freshness validation');
            const expected = process.env.EXPECTED_SHA;
            const tier = process.env.TIER;
            if (!/^[0-9a-f]{40}$/.test(expected)) {
              throw new Error('Deployment source is not an immutable commit SHA');
            }
            core.info('Immutable source shape verified');
            if (tier === 'alpha') {
              core.info('Rechecking the protected main branch head');
              const { data: branch } = await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: 'main',
              });
              if (branch.commit.sha !== expected) {
                throw new Error('Alpha source is no longer the main branch HEAD');
              }
              core.info('Alpha source remains current');
              core.info('Deployment source freshness validation completed');
              return;
            }

            if (tier !== 'stable') {
              throw new Error(`Unknown deployment tier: ${tier}`);
            }
            core.info('Rechecking the latest stable vX.Y.Z release');
            const stableTag = /^v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)$/;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const latest = releases
              .filter((release) =>
                !release.draft &&
                !release.prerelease &&
                release.published_at &&
                stableTag.test(release.tag_name))
              .sort((left, right) =>
                Date.parse(right.published_at) - Date.parse(left.published_at) ||
                right.id - left.id)[0];
            if (!latest || latest.tag_name !== process.env.RELEASE_TAG) {
              throw new Error('stable source is no longer the latest published vX.Y.Z release');
            }
            core.info('Stable release remains the latest eligible version');

            core.info('Re-resolving the stable release tag object');
            let { data: ref } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `tags/${process.env.RELEASE_TAG}`,
            });
            let object = ref.object;
            for (let depth = 0; object.type === 'tag' && depth < 10; depth += 1) {
              core.info('Resolving an annotated release tag layer');
              const { data: tag } = await github.rest.git.getTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_sha: object.sha,
              });
              object = tag.object;
            }
            if (object.type !== 'commit' || object.sha !== expected) {
              throw new Error('Published release tag no longer peels to its classified commit SHA');
            }
            core.info('Stable release tag still resolves to the classified source');
            core.info('Deployment source freshness validation completed');
      - id: deployment
        name: Request digest deployment
        if: steps.adapter.outputs.configured == 'true'
        env:
          COOLIFY_DEPLOY_ENDPOINT: ${{ secrets.COOLIFY_DEPLOY_ENDPOINT }}
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
          IMAGE: ${{ needs.package.outputs.image }}
          DIGEST: ${{ needs.package.outputs.digest }}
          SOURCE_SHA: ${{ needs.package.outputs.source_sha }}
          TIER: ${{ needs.classify.outputs.tier }}
        run: |
          set -euo pipefail
          case "${COOLIFY_DEPLOY_ENDPOINT}" in
            https://*) ;;
            *) echo "deployment adapter URL must use HTTPS" >&2; exit 1 ;;
          esac
          if [[ "${IMAGE}" != *"@${DIGEST}" || ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "refusing a mutable deployment reference" >&2
            exit 1
          fi
          if [[ ! "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "deployment source is not an immutable commit SHA" >&2
            exit 1
          fi
          payload="$(jq -cn \
            --arg image "${IMAGE}" \
            --arg digest "${DIGEST}" \
            --arg source_sha "${SOURCE_SHA}" \
            --arg tier "${TIER}" \
            '{image: $image, digest: $digest, source_sha: $source_sha, tier: $tier}')"
          response_file="${RUNNER_TEMP}/coolify-response-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          rm -f -- "${response_file}"
          (umask 077 && : > "${response_file}")
          trap 'rm -f -- "${response_file}"' EXIT
          if ! curl_metrics="$(curl --fail --silent \
              --connect-timeout 10 \
              --max-time 300 \
              --max-filesize 65536 \
              --request POST \
              --oauth2-bearer "${COOLIFY_DEPLOY_TOKEN}" \
              --header "Content-Type: application/json" \
              --data "${payload}" \
              --output "${response_file}" \
              --write-out '%{http_code} %{time_total}' \
              "${COOLIFY_DEPLOY_ENDPOINT}")"; then
            echo "deployment adapter request failed" >&2
            exit 1
          fi
          read -r http_status request_seconds <<<"${curl_metrics}"
          if [[ ! "${http_status}" =~ ^2[0-9][0-9]$ ||
                ! "${request_seconds}" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            echo "deployment adapter returned invalid request metrics" >&2
            exit 1
          fi
          if ! jq -e \
            --arg image "${IMAGE}" \
            --arg digest "${DIGEST}" \
            'type == "object" and
             .status == "ready" and
             .image == $image and
             .digest == $digest' \
            "${response_file}" >/dev/null; then
            echo "deployment adapter did not confirm the requested ready digest" >&2
            exit 1
          fi
      - name: Summarize protected deployment checks
        if: always()
        env:
          ADAPTER_STATUS: ${{ steps.adapter.outcome }}
          DEPLOYMENT_STATUS: ${{ steps.deployment.outcome }}
          FRESHNESS_STATUS: ${{ steps.freshness.outcome }}
        run: |
          {
            echo "## Protected Coolify deployment"
            echo
            for check in \
              "Protected adapter configuration|${ADAPTER_STATUS}" \
              "Channel freshness revalidation|${FRESHNESS_STATUS}" \
              "Exact digest readiness confirmation|${DEPLOYMENT_STATUS}"; do
              name="${check%%|*}"
              status="${check#*|}"
              echo "<details><summary>${name}: ${status}</summary>"
              echo
              echo "- Data exposure: check name and outcome only"
              echo "</details>"
              echo
            done
            echo "Deployment endpoint, token, payload, response body, image identity, and source metadata are omitted."
          } >> "${GITHUB_STEP_SUMMARY}"
