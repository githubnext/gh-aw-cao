name: Coolify dashboard image

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/coolify-deploy.yml
      - .dockerignore
      - dashboard/site/**
      - server/**
      - tests/unit/coolify-deployment-contract.test.mjs
  push:
    branches: [main]
    paths:
      - .github/workflows/coolify-deploy.yml
      - .dockerignore
      - dashboard/site/**
      - server/**
      - tests/unit/coolify-deployment-contract.test.mjs
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: coolify-delivery-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  classify:
    name: Select explicit deployment tier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.tier.outputs.eligible }}
      environment: ${{ steps.tier.outputs.environment }}
      tier: ${{ steps.tier.outputs.tier }}
      version: ${{ steps.tier.outputs.version }}
      identity: ${{ steps.tier.outputs.identity }}
      source_ref: ${{ steps.tier.outputs.source_ref }}
      expected_sha: ${{ steps.tier.outputs.expected_sha }}
      pr_number: ${{ steps.tier.outputs.pr_number }}
    steps:
      - id: release-source
        name: Resolve published release tag
        if: github.event_name == 'release'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            let { data: ref } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `tags/${context.payload.release.tag_name}`,
            });
            let object = ref.object;
            for (let depth = 0; object.type === 'tag' && depth < 10; depth += 1) {
              const { data: tag } = await github.rest.git.getTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_sha: object.sha,
              });
              object = tag.object;
            }
            if (object.type !== 'commit' || !/^[0-9a-f]{40}$/.test(object.sha)) {
              throw new Error('Published release tag does not resolve to an immutable commit SHA');
            }
            core.setOutput('sha', object.sha);
      - id: tier
        name: Classify event without promotion
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_SOURCE_SHA: ${{ steps.release-source.outputs.sha }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          stable_tag_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          prerelease_identifier='(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
          prerelease_tag_re="^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)-${prerelease_identifier}(\\.${prerelease_identifier})*$"
          eligible=false
          environment=
          tier=
          version=
          identity=
          source_ref=
          expected_sha=
          pr_number=
          case "${EVENT_NAME}" in
            release)
              if [[ "${EVENT_ACTION}" != "published" ]]; then exit 1; fi
              if (( ${#RELEASE_TAG} > 128 )); then
                echo "release tag is too long for an exact image identity" >&2
                exit 1
              fi
              if [[ ! "${RELEASE_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
                echo "published release tag must resolve to an immutable commit SHA" >&2
                exit 1
              fi
              version="${RELEASE_TAG}"
              if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then
                if [[ ! "${RELEASE_TAG}" =~ ${prerelease_tag_re} ]]; then
                  echo "published prerelease tag must be vX.Y.Z-prerelease SemVer without build metadata" >&2
                  exit 1
                fi
                tier=beta
                environment=coolify-beta
              elif [[ "${RELEASE_PRERELEASE}" == "false" ]]; then
                if [[ ! "${RELEASE_TAG}" =~ ${stable_tag_re} ]]; then
                  echo "published stable tag must be exactly vX.Y.Z SemVer" >&2
                  exit 1
                fi
                tier=stable
                environment=coolify-stable
              else
                echo "release prerelease classification is missing" >&2
                exit 1
              fi
              identity="${RELEASE_TAG}"
              source_ref="${RELEASE_SOURCE_SHA}"
              expected_sha="${RELEASE_SOURCE_SHA}"
              eligible=true
              ;;
            push)
              if [[ "${REF}" != "refs/heads/main" || ! "${SHA}" =~ ^[0-9a-f]{40}$ ]]; then
                echo "alpha requires an exact main commit" >&2
                exit 1
              fi
              tier=alpha
              environment=coolify-alpha
              version="0.0.0-alpha.${SHA:0:12}"
              identity="sha-${SHA}"
              source_ref="${SHA}"
              expected_sha="${SHA}"
              eligible=true
              ;;
            pull_request_target)
              if [[ "${PR_DRAFT}" != "true" && "${PR_HEAD_REPOSITORY}" == "${REPOSITORY}" ]]; then
                if [[ ! "${PR_NUMBER}" =~ ^[1-9][0-9]*$ || ! "${PR_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
                  echo "preview requires an exact pull request head commit" >&2
                  exit 1
                fi
                tier=preview
                environment=coolify-preview
                version="0.0.0-preview.${PR_NUMBER}.${PR_HEAD_SHA:0:12}"
                identity="pr-${PR_NUMBER}-sha-${PR_HEAD_SHA}"
                source_ref="${PR_HEAD_SHA}"
                expected_sha="${PR_HEAD_SHA}"
                pr_number="${PR_NUMBER}"
                eligible=true
              fi
              ;;
          esac
          {
            echo "eligible=${eligible}"
            echo "environment=${environment}"
            echo "tier=${tier}"
            echo "version=${version}"
            echo "identity=${identity}"
            echo "source_ref=${source_ref}"
            echo "expected_sha=${expected_sha}"
            echo "pr_number=${pr_number}"
          } >> "${GITHUB_OUTPUT}"

  test:
    name: Test image inputs
    if: needs.classify.outputs.eligible == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.classify.outputs.source_ref }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact test source
        env:
          EXPECTED_SHA: ${{ needs.classify.outputs.expected_sha }}
          RELEASE_TAG: ${{ needs.classify.outputs.identity }}
          TIER: ${{ needs.classify.outputs.tier }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse --verify 'HEAD^{commit}')"
          if [[ "${source_sha}" != "${EXPECTED_SHA}" || ! "${source_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "test checkout does not match the classified source commit" >&2
            exit 1
          fi
          if [[ "${TIER}" == "stable" || "${TIER}" == "beta" ]]; then
            git fetch --force --no-tags origin \
              "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            tag_sha="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
            if [[ "${tag_sha}" != "${EXPECTED_SHA}" ]]; then
              echo "published release tag no longer matches its event target" >&2
              exit 1
            fi
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: 1.27.1
          cache: false
      - name: Install Node dependencies
        run: npm ci
      - name: Deployment contract tests
        run: node --test tests/unit/coolify-deployment-contract.test.mjs
      - name: Go tests
        run: go -C server test ./...
      - name: Dashboard production build
        run: |
          npm --prefix dashboard/site ci
          npm run dashboard:server:build

  image:
    name: Build and scan candidate image
    if: needs.classify.outputs.eligible == 'true'
    needs: [classify, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: coolify-image-${{ needs.classify.outputs.identity }}
      cancel-in-progress: false
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.classify.outputs.source_ref }}
          fetch-depth: 1
          persist-credentials: false
      - id: source
        name: Resolve and verify exact source commit
        env:
          TIER: ${{ needs.classify.outputs.tier }}
          RELEASE_TAG: ${{ needs.classify.outputs.identity }}
          EXPECTED_SHA: ${{ needs.classify.outputs.expected_sha }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse --verify 'HEAD^{commit}')"
          if [[ ! "${source_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "checkout did not resolve to a full commit SHA" >&2
            exit 1
          fi
          case "${TIER}" in
            stable|beta)
              if [[ "${source_sha}" != "${EXPECTED_SHA}" ]]; then
                echo "release checkout does not match the event target commit" >&2
                exit 1
              fi
              git fetch --force --no-tags origin \
                "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
              tag_sha="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
              if [[ "${tag_sha}" != "${EXPECTED_SHA}" ]]; then
                echo "published release tag no longer matches its event target" >&2
                exit 1
              fi
              ;;
            alpha|preview)
              if [[ "${source_sha}" != "${EXPECTED_SHA}" ]]; then
                echo "checkout does not match the event source commit" >&2
                exit 1
              fi
              ;;
            *)
              echo "unknown deployment tier" >&2
              exit 1
              ;;
          esac
          echo "sha=${source_sha}" >> "${GITHUB_OUTPUT}"
      - name: Build local image
        env:
          VERSION: ${{ needs.classify.outputs.version }}
          REVISION: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          created="$(git show -s --format=%cI "${REVISION}")"
          docker build \
            --file server/Dockerfile \
            --build-arg "VERSION=${VERSION}" \
            --build-arg "REVISION=${REVISION}" \
            --build-arg "CREATED=${created}" \
            --tag "cao-dashboard:${REVISION}" \
            .
      - name: Scan local image
        uses: aquasecurity/trivy-action@57a97c7060a3f8bc153738150e71b7be9592aadd # v0.35.0
        with:
          image-ref: cao-dashboard:${{ steps.source.outputs.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Save scanned candidate image
        env:
          REVISION: ${{ steps.source.outputs.sha }}
        run: docker image save --output "${RUNNER_TEMP}/cao-dashboard.tar" "cao-dashboard:${REVISION}"
      - name: Upload scanned candidate image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cao-dashboard-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cao-dashboard.tar
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish candidate and bind canonical identity
    if: needs.classify.outputs.eligible == 'true'
    needs: [classify, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: coolify-image-${{ needs.classify.outputs.identity }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
      digest: ${{ steps.publish.outputs.digest }}
      source_sha: ${{ needs.image.outputs.source_sha }}
    steps:
      - name: Download scanned candidate image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cao-dashboard-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate
      - name: Load scanned candidate image
        run: docker image load --input "${RUNNER_TEMP}/candidate/cao-dashboard.tar"
      - name: Log in to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: publish
        name: Publish unique candidate and bind canonical identity
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ needs.image.outputs.source_sha }}
          VERSION: ${{ needs.classify.outputs.version }}
          IDENTITY: ${{ needs.classify.outputs.identity }}
          TIER: ${{ needs.classify.outputs.tier }}
          PR_NUMBER: ${{ needs.classify.outputs.pr_number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          repository="ghcr.io/${REPOSITORY,,}/cao-dashboard"
          candidate_identity="candidate-${RUN_ID}-${RUN_ATTEMPT}"
          candidate_reference="${repository}:${candidate_identity}"
          canonical_reference="${repository}:${IDENTITY}"

          case "${TIER}" in
            stable)
              [[ "${IDENTITY}" == "${VERSION}" && "${IDENTITY}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
              ;;
            beta)
              [[ "${IDENTITY}" == "${VERSION}" && "${IDENTITY}" == v*-* ]]
              ;;
            alpha)
              [[ "${IDENTITY}" == "sha-${REVISION}" ]]
              ;;
            preview)
              [[ "${IDENTITY}" == "pr-${PR_NUMBER}-sha-${REVISION}" ]]
              ;;
            *)
              exit 1
              ;;
          esac

          if [[ ! "${candidate_identity}" =~ ^candidate-[1-9][0-9]*-[1-9][0-9]*$ ||
                "${candidate_identity}" =~ ^(stable|beta|alpha|preview|latest)$ ]]; then
            echo "candidate identity is not unique or is a channel alias" >&2
            exit 1
          fi

          local_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "cao-dashboard:${REVISION}")"
          local_version="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "cao-dashboard:${REVISION}")"
          if [[ "${local_revision}" != "${REVISION}" || "${local_version}" != "${VERSION}" ]]; then
            echo "downloaded candidate metadata does not match the classified source" >&2
            exit 1
          fi

          docker tag "cao-dashboard:${REVISION}" "${candidate_reference}"
          docker push "${candidate_reference}" >/dev/null
          candidate_json="$(docker buildx imagetools inspect \
            "${candidate_reference}" --format '{{json .Manifest}}')"
          candidate_digest="$(jq -r '.digest // empty' <<<"${candidate_json}")"
          if [[ ! "${candidate_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "candidate did not resolve to one immutable digest" >&2
            exit 1
          fi

          inspect_output=
          if inspect_output="$(docker buildx imagetools inspect \
            "${canonical_reference}" --format '{{json .Manifest}}' 2>&1)"; then
            canonical_digest="$(jq -r '.digest // empty' <<<"${inspect_output}")"
            if [[ ! "${canonical_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "existing identity did not resolve to one immutable digest" >&2
              exit 1
            fi
            if [[ "${canonical_digest}" != "${candidate_digest}" ]]; then
              echo "refusing to redefine an existing immutable source identity" >&2
              exit 1
            fi
          else
            if ! printf '%s\n' "${inspect_output}" | grep -Eqi '(manifest unknown|not found)'; then
              echo "unable to verify whether the immutable source identity exists" >&2
              exit 1
            fi
            docker buildx imagetools create \
              --prefer-index=false \
              --tag "${canonical_reference}" \
              "${repository}@${candidate_digest}" >/dev/null
          fi

          canonical_json="$(docker buildx imagetools inspect \
            "${canonical_reference}" --format '{{json .Manifest}}')"
          canonical_digest="$(jq -r '.digest // empty' <<<"${canonical_json}")"
          if [[ "${canonical_digest}" != "${candidate_digest}" ]]; then
            echo "canonical identity does not equal the scanned candidate digest" >&2
            exit 1
          fi
          {
            echo "digest=${candidate_digest}"
            echo "image=${repository}@${candidate_digest}"
          } >> "${GITHUB_OUTPUT}"

  deploy:
    name: Deploy exact digest to Coolify
    if: needs.classify.outputs.eligible == 'true'
    needs: [classify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: coolify-${{ needs.classify.outputs.environment }}
      cancel-in-progress: false
    environment:
      name: ${{ needs.classify.outputs.environment }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Reject stale deployment source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXPECTED_SHA: ${{ needs.classify.outputs.expected_sha }}
          RELEASE_TAG: ${{ needs.classify.outputs.identity }}
          PR_NUMBER: ${{ needs.classify.outputs.pr_number }}
          TIER: ${{ needs.classify.outputs.tier }}
        with:
          github-token: ${{ github.token }}
          script: |
            const expected = process.env.EXPECTED_SHA;
            const tier = process.env.TIER;
            if (!/^[0-9a-f]{40}$/.test(expected)) {
              throw new Error('Deployment source is not an immutable commit SHA');
            }

            if (tier === 'alpha') {
              const { data: branch } = await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: 'main',
              });
              if (branch.commit.sha !== expected) {
                throw new Error('Alpha source is no longer the main branch HEAD');
              }
              return;
            }

            if (tier === 'preview') {
              const number = Number(process.env.PR_NUMBER);
              if (!Number.isSafeInteger(number) || number < 1) {
                throw new Error('Preview pull request number is invalid');
              }
              const { data: pull } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: number,
              });
              if (pull.state !== 'open' || pull.draft ||
                  pull.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                  pull.head.sha !== expected) {
                throw new Error('Preview source is no longer the open pull request HEAD');
              }
              return;
            }

            if (tier !== 'stable' && tier !== 'beta') {
              throw new Error(`Unknown deployment tier: ${tier}`);
            }
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const prerelease = tier === 'beta';
            const stableTag = /^v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)$/;
            const prereleaseIdentifier = '(?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)';
            const prereleaseTag = new RegExp(
              `^v(?:0|[1-9][0-9]*)\\.(?:0|[1-9][0-9]*)\\.(?:0|[1-9][0-9]*)-${prereleaseIdentifier}(?:\\.${prereleaseIdentifier})*$`,
            );
            const latest = releases
              .filter((release) => !release.draft &&
                release.prerelease === prerelease &&
                release.published_at &&
                (prerelease ? prereleaseTag : stableTag).test(release.tag_name))
              .sort((left, right) =>
                Date.parse(right.published_at) - Date.parse(left.published_at) ||
                right.id - left.id)[0];
            if (!latest || latest.tag_name !== process.env.RELEASE_TAG) {
              throw new Error(`${tier} source is no longer the latest published release for its channel`);
            }

            let { data: ref } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `tags/${process.env.RELEASE_TAG}`,
            });
            let object = ref.object;
            for (let depth = 0; object.type === 'tag' && depth < 10; depth += 1) {
              const { data: tag } = await github.rest.git.getTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_sha: object.sha,
              });
              object = tag.object;
            }
            if (object.type !== 'commit' || object.sha !== expected) {
              throw new Error('Published release tag no longer peels to its event target SHA');
            }
      - name: Request digest deployment
        env:
          COOLIFY_DEPLOY_ENDPOINT: ${{ secrets.COOLIFY_DEPLOY_ENDPOINT }}
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          SOURCE_SHA: ${{ needs.publish.outputs.source_sha }}
          TIER: ${{ needs.classify.outputs.tier }}
        run: |
          set -euo pipefail
          case "${COOLIFY_DEPLOY_ENDPOINT}" in
            https://*) ;;
            *) echo "COOLIFY_DEPLOY_ENDPOINT must use HTTPS" >&2; exit 1 ;;
          esac
          if [[ "${IMAGE}" != *"@${DIGEST}" || ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "refusing a mutable deployment reference" >&2
            exit 1
          fi
          payload="$(jq -cn \
            --arg image "${IMAGE}" \
            --arg digest "${DIGEST}" \
            --arg source_sha "${SOURCE_SHA}" \
            --arg tier "${TIER}" \
            '{image: $image, digest: $digest, source_sha: $source_sha, tier: $tier}')"
          response_file="${RUNNER_TEMP}/coolify-response-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          rm -f -- "${response_file}"
          (umask 077 && : > "${response_file}")
          trap 'rm -f -- "${response_file}"' EXIT
          curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 300 \
            --max-filesize 65536 \
            --request POST \
            --oauth2-bearer "${COOLIFY_DEPLOY_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "${payload}" \
            --output "${response_file}" \
            "${COOLIFY_DEPLOY_ENDPOINT}"
          if ! jq -e \
            --arg image "${IMAGE}" \
            --arg digest "${DIGEST}" \
            'type == "object" and
             .status == "ready" and
             .image == $image and
             .digest == $digest' \
            "${response_file}" >/dev/null; then
            echo "deployment adapter did not confirm the requested ready digest" >&2
            exit 1
          fi
