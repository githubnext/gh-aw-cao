      - name: Render detection log
        if: always() && steps.detection_guard.outputs.run_detection == 'true'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'render_detection_log.cjs'));
            await main();
      - name: Copy detection firewall logs
        if: always() && steps.detection_guard.outputs.run_detection == 'true'
        continue-on-error: true
        run: |
          mkdir -p /tmp/gh-aw/threat-detection/sandbox/firewall
          if [ -d /tmp/gh-aw/sandbox/firewall/logs ]; then mkdir -p /tmp/gh-aw/threat-detection/sandbox/firewall/logs && cp -r /tmp/gh-aw/sandbox/firewall/logs/. /tmp/gh-aw/threat-detection/sandbox/firewall/logs/; fi
          if [ -d /tmp/gh-aw/sandbox/firewall/audit ]; then mkdir -p /tmp/gh-aw/threat-detection/sandbox/firewall/audit && cp -r /tmp/gh-aw/sandbox/firewall/audit/. /tmp/gh-aw/threat-detection/sandbox/firewall/audit/; fi
      - name: Upload threat detection artifact
        if: always() && steps.detection_guard.outputs.run_detection == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: detection
          path: |
            /tmp/gh-aw/threat-detection/detection_result.json
            /tmp/gh-aw/threat-detection/sandbox/firewall/logs/
            /tmp/gh-aw/threat-detection/sandbox/firewall/audit/
          if-no-files-found: ignore
      - name: Parse threat detection token usage for step summary
        id: parse_detection_token_usage
        if: always()
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_TOKEN_USAGE_SUMMARY_TITLE: Threat Detection Token Usage
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'parse_token_usage.cjs'));
            await main();
      - name: Conclude threat detection
        id: detection_conclusion
        if: always()
        continue-on-error: true
        env:
          RUN_DETECTION: ${{ steps.detection_guard.outputs.run_detection }}
          DETECTION_AGENTIC_EXECUTION_OUTCOME: ${{ steps.detection_agentic_execution.outcome }}
          GH_AW_DETECTION_CONTINUE_ON_ERROR: "true"
        run: |
          bash "${RUNNER_TEMP}/gh-aw/actions/conclude_threat_detection.sh" /tmp/gh-aw/threat-detection/detection_result.json

  pre_activation:
    runs-on: ubuntu-slim
    environment: central-agentic-ops
    permissions:
      actions: read
      contents: read
    env:
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
    outputs:
      activated: ${{ steps.check_membership.outputs.is_team_member == 'true' }}
      cao_authorized: ${{ steps.cao_admission.outputs.authorized == 'true' && steps.cao_precompute.outputs.authorized != 'false' }}
      cao_reason: ${{ steps.cao_precompute.outputs.reason || steps.cao_admission.outputs.reason }}
      matched_command: ''
      setup-parent-span-id: ${{ steps.setup.outputs.parent-span-id || steps.setup.outputs.span-id }}
      setup-span-id: ${{ steps.setup.outputs.span-id }}
      setup-trace-id: ${{ steps.setup.outputs.trace-id }}
    steps:
      - name: Setup Scripts
        id: setup
        uses: github/gh-aw-actions/setup@23e16337f3568b3c18bb04a976793f282a016755 # v0.88.4
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "AW Optimization / AGENTS.md"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/optimization-agents-md-curator.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "1.0.80"
          GH_AW_INFO_AWF_VERSION: "v0.28.13"
          GH_AW_INFO_ENGINE_ID: "copilot"
      - name: Generate CAO pre-activation GitHub App token
        id: cao_pre_activation_app_token
        if: ${{ env.CAO_GITHUB_APP_ID != '' && env.CAO_GITHUB_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        env:
          CAO_GITHUB_APP_ID: ${{ vars.GH_AW_GITHUB_READ_APP_ID }}
          CAO_GITHUB_APP_PRIVATE_KEY: ${{ secrets.GH_AW_GITHUB_READ_APP_PRIVATE_KEY }}
        with:
          client-id: ${{ vars.GH_AW_GITHUB_READ_APP_ID }}
          github-api-url: ${{ github.api_url }}
          owner: ${{ github.repository_owner }}
          permission-actions: read
          permission-contents: read
          private-key: ${{ secrets.GH_AW_GITHUB_READ_APP_PRIVATE_KEY }}
      - name: Checkout CAO control modules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1.0
          path: .cao
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/cao/src
          sparse-checkout-cone-mode: true
          token: ${{ steps.cao_pre_activation_app_token.outputs.token || secrets.GH_AW_GITHUB_TOKEN || github.token }}
      - name: Evaluate Central Agentic Ops admission
        id: cao_admission
        run: |
          set -uo pipefail
          cao_dir="${GITHUB_WORKSPACE:-.}/.cao/.github/cao/src"
          if node "$cao_dir/control.mjs" admit; then
            exit 0
          fi
          reason="cannot read or execute the CAO control modules at github.workflow_sha"
          echo "authorized=false" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "monthly_credit_budget=0" >> "$GITHUB_OUTPUT"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          <details>
          <summary><h3>Central Agentic Ops admission</h3></summary>

          Skipped: $reason

          - ❌ Runtime revision — The control and policy modules could not be read or executed from the exact \`github.workflow_sha\` commit.
          - Policy and authorization checks — The remaining admission checks could not run because the authoritative control modules were unavailable.

          </details>
          EOF
        env:
          CAO_API_TOKEN: ${{ steps.cao_pre_activation_app_token.outputs.token || secrets.GH_AW_GITHUB_TOKEN || github.token }}
          CAO_GITHUB_API_GATE: ${{ vars.CAO_GITHUB_API_GATE }}
          CAO_PACKAGE: optimization
          CAO_REQUESTED_MAX_REPOSITORIES: ${{ github.event.inputs.max_repos || '' }}
          CAO_REQUESTED_MODE: ${{ github.event.inputs.safe_output_mode || '' }}
          CAO_REQUESTED_ROLLOUT_PERCENT: ${{ github.event.inputs.rollout_percent || '' }}
          CAO_ROLE: worker
          CAO_TARGET_REPOSITORY: ${{ github.event.inputs.target_repo || '' }}
          CAO_WORKER: agents-md-curator
          GH_TOKEN: ${{ github.token }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
      - name: Ensure CAO admission record
        if: ${{ always() }}
        run: |
          set -euo pipefail
          record="${RUNNER_TEMP}/cao/admission.json"
          if [[ -f "$record" ]]; then
           exit 0
          fi
          mkdir -p "$(dirname "$record")"
          node - "$record" <<'EOF'
          const fs = require("node:fs");
          const checks = [
           "Runtime revision", "Policy document", "Control plane", "Workflow identity",
           "Package", "Worker", "Target input", "Mode input", "Run limits",
           "GitHub API capacity", "Runner disk capacity",
          ].map((check, index) => ({ check, status: index === 0 ? "failed" : "not-evaluated" }));
          fs.writeFileSync(process.argv[2], `${JSON.stringify({
           schema_version: 1,
           observed_at: new Date().toISOString(),
           repository: process.env.GITHUB_REPOSITORY || "",
           workflow: process.env.GITHUB_WORKFLOW || "",
           workflow_sha: process.env.GITHUB_WORKFLOW_SHA || "",
           run_id: process.env.GITHUB_RUN_ID || "",
           run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT || 1),
           package: process.env.CAO_PACKAGE || "",
           role: process.env.CAO_ROLE || "",
           worker: process.env.CAO_ROLE === "orchestrator" ? "" : process.env.CAO_WORKER || "",
           target_repository: "",
           authorized: process.env.CAO_ADMISSION_AUTHORIZED === "true",
           reason: process.env.CAO_ADMISSION_REASON || "cannot read or execute the CAO control modules at github.workflow_sha",
           failed_check: "Runtime revision",
           checks,
          }, null, 2)}\n`);
          EOF
        env:
          CAO_ADMISSION_AUTHORIZED: ${{ steps.cao_admission.outputs.authorized }}
          CAO_ADMISSION_REASON: ${{ steps.cao_admission.outputs.reason }}
          CAO_PACKAGE: optimization
          CAO_ROLE: worker
          CAO_WORKER: agents-md-curator
      - name: Upload CAO admission artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: cao-admission
          path: ${{ runner.temp }}/cao/admission.json
          retention-days: 8.0
      - name: Generate CAO admission gate writer token
        id: cao_admission_gate_writer_token
        if: ${{ steps.cao_admission.outputs.reason == 'github-api-capacity-insufficient' && steps.cao_admission.outputs.github_api_gate_active != 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_AW_GITHUB_WRITE_APP_ID }}
          github-api-url: ${{ github.api_url }}
          permission-actions-variables: write
          private-key: ${{ secrets.GH_AW_GITHUB_WRITE_APP_PRIVATE_KEY }}
        continue-on-error: true
      - name: Persist CAO admission GitHub API gate
        if: ${{ steps.cao_admission.outputs.reason == 'github-api-capacity-insufficient' && steps.cao_admission.outputs.github_api_gate_active != 'true' }}
        run: node "${GITHUB_WORKSPACE:-.}/.cao/.github/cao/src/control.mjs" persist-api-gate
        env:
          CAO_GATE_WRITE_TOKEN: ${{ steps.cao_admission_gate_writer_token.outputs.token || secrets.GH_AW_GITHUB_TOKEN }}
          CAO_GITHUB_API_LIMIT: ${{ steps.cao_admission.outputs.github_api_limit }}
          CAO_GITHUB_API_REMAINING: ${{ steps.cao_admission.outputs.github_api_remaining }}
          CAO_GITHUB_API_RESET_AT: ${{ steps.cao_admission.outputs.github_api_reset_at }}
        continue-on-error: true
      - name: "CAO admission blocked: GitHub API limited until ${{ steps.cao_admission.outputs.github_api_reset_at }}"
        if: ${{ steps.cao_admission.outputs.reason == 'github-api-capacity-insufficient' }}
        run: |
          echo "::error title=CAO admission blocked by GitHub API capacity::${CAO_API_REMAINING} of ${CAO_API_LIMIT} core requests remain; ${CAO_API_REQUIRED} required. Retry after ${CAO_API_RESET_AT}. See the admission summary for next steps."
          exit 1
        env:
          CAO_API_LIMIT: ${{ steps.cao_admission.outputs.github_api_limit }}
          CAO_API_REMAINING: ${{ steps.cao_admission.outputs.github_api_remaining }}
          CAO_API_REQUIRED: ${{ steps.cao_admission.outputs.github_api_required }}
          CAO_API_RESET_AT: ${{ steps.cao_admission.outputs.github_api_reset_at }}
      - name: "CAO admission blocked: GitHub API capacity unavailable"
        if: ${{ steps.cao_admission.outputs.reason == 'github-api-capacity-unavailable' }}
        run: |
          echo "::error title=CAO admission could not verify GitHub API capacity::Check authentication and GitHub API status. See the admission summary for next steps."
          exit 1
      - name: "CAO admission blocked: runner disk space too low"
        if: ${{ steps.cao_admission.outputs.reason == 'runner-disk-capacity-insufficient' }}
        run: |
          echo "::error title=CAO admission blocked by runner disk capacity::${CAO_DISK_AVAILABLE} MB free on ${CAO_DISK_PATH}; ${CAO_DISK_REQUIRED} MB required. See the admission summary for next steps."
          exit 1
        env:
          CAO_DISK_AVAILABLE: ${{ steps.cao_admission.outputs.runner_disk_available_mb }}
          CAO_DISK_PATH: ${{ steps.cao_admission.outputs.runner_disk_path }}
          CAO_DISK_REQUIRED: ${{ steps.cao_admission.outputs.runner_disk_required_mb }}
      - name: "CAO admission blocked: runner disk capacity unavailable"
        if: ${{ steps.cao_admission.outputs.reason == 'runner-disk-capacity-unavailable' }}
        run: |
          echo "::error title=CAO admission could not verify runner disk capacity::Free disk space could not be read for ${CAO_DISK_PATH}. See the admission summary for next steps."
          exit 1
        env:
          CAO_DISK_PATH: ${{ steps.cao_admission.outputs.runner_disk_path }}
      - name: Install gh-aw CLI when monthly budget is enabled
        if: ${{ steps.cao_admission.outputs.authorized == 'true' && steps.cao_admission.outputs.monthly_credit_budget != '0' }}
        uses: github/gh-aw-actions/setup-cli@23e16337f3568b3c18bb04a976793f282a016755 # v0.88.4
        with:
          version: v0.88.4
      - name: Run CAO control precompute
        id: cao_precompute
        if: ${{ steps.cao_admission.outputs.authorized == 'true' }}
        run: |
          set -euo pipefail
          node "${GITHUB_WORKSPACE:-.}/.cao/.github/cao/src/control.mjs" precompute
        env:
          CAO_CENTRAL_REPOSITORY: ${{ github.event.inputs.central_repo || '' }}
          CAO_CONTROL_PLANE_RUN_URL: ${{ github.event.inputs.control_plane_run_url || '' }}
          CAO_CORRELATION_ID: ${{ github.event.inputs.correlation_id || '' }}
          CAO_DISPATCH_MAX: "1"
          CAO_ORCHESTRATOR_CREDITS: "0"
          CAO_PACKAGE: optimization
          CAO_ROLE: worker
          CAO_SAFE_OUTPUT_REPOSITORY: ${{ (github.event.inputs.safe_output_mode || 'review') == 'review' && (github.event.inputs.safe_output_repo || github.repository) || github.event.inputs.target_repo || '' }}
          CAO_TARGET_REPOSITORY: ${{ github.event.inputs.target_repo || '' }}
          CAO_WORKER: agents-md-curator
          CAO_WORKER_CREDITS_PER_TARGET: "0"
          GH_TOKEN: ${{ steps.cao_pre_activation_app_token.outputs.token || secrets.GH_AW_GITHUB_TOKEN || github.token }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
      - name: Generate CAO precompute gate writer token
        id: cao_precompute_gate_writer_token
        if: ${{ steps.cao_precompute.outputs.reason == 'github-api-capacity-insufficient' && steps.cao_precompute.outputs.github_api_gate_active != 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_AW_GITHUB_WRITE_APP_ID }}
          github-api-url: ${{ github.api_url }}
          permission-actions-variables: write
          private-key: ${{ secrets.GH_AW_GITHUB_WRITE_APP_PRIVATE_KEY }}
        continue-on-error: true
      - name: Persist CAO precompute GitHub API gate
        if: ${{ steps.cao_precompute.outputs.reason == 'github-api-capacity-insufficient' && steps.cao_precompute.outputs.github_api_gate_active != 'true' }}
        run: node "${GITHUB_WORKSPACE:-.}/.cao/.github/cao/src/control.mjs" persist-api-gate
        env:
          CAO_GATE_WRITE_TOKEN: ${{ steps.cao_precompute_gate_writer_token.outputs.token || secrets.GH_AW_GITHUB_TOKEN }}
          CAO_GITHUB_API_LIMIT: ${{ steps.cao_precompute.outputs.github_api_limit }}
          CAO_GITHUB_API_REMAINING: ${{ steps.cao_precompute.outputs.github_api_remaining }}
          CAO_GITHUB_API_RESET_AT: ${{ steps.cao_precompute.outputs.github_api_reset_at }}
        continue-on-error: true
      - name: "CAO precompute blocked: GitHub API limited until ${{ steps.cao_precompute.outputs.github_api_reset_at }}"
        if: ${{ steps.cao_precompute.outputs.reason == 'github-api-capacity-insufficient' }}
        run: |
          echo "::warning title=CAO precompute blocked by GitHub API capacity::${CAO_API_REMAINING} of ${CAO_API_LIMIT} core requests remain; ${CAO_API_REQUIRED} required. Retry after ${CAO_API_RESET_AT}. See the admission summary for next steps."
        env:
          CAO_API_LIMIT: ${{ steps.cao_precompute.outputs.github_api_limit }}
          CAO_API_REMAINING: ${{ steps.cao_precompute.outputs.github_api_remaining }}
          CAO_API_REQUIRED: ${{ steps.cao_precompute.outputs.github_api_required }}
          CAO_API_RESET_AT: ${{ steps.cao_precompute.outputs.github_api_reset_at }}
      - name: "CAO precompute blocked: GitHub API capacity unavailable"
        if: ${{ steps.cao_precompute.outputs.reason == 'github-api-capacity-unavailable' }}
        run: |
          echo "::warning title=CAO precompute could not verify GitHub API capacity::Check authentication and GitHub API status. See the admission summary for next steps."
      - name: Validate CAO control precompute artifact
        if: ${{ steps.cao_admission.outputs.authorized == 'true' && steps.cao_precompute.outputs.authorized != 'false' }}
        run: |
          set -euo pipefail
          out=/tmp/gh-aw/agent/control-precompute.json
          expected_worker="$CAO_WORKER"
          [ "$CAO_ROLE" != "orchestrator" ] || expected_worker=""
          [ -f "$out" ]
          jq -e '.authorized == true' "$out" >/dev/null
          jq -e --arg package "$CAO_PACKAGE" '.package == $package and .bundle == $package' "$out" >/dev/null
          jq -e --arg role "$CAO_ROLE" '.control_role == $role' "$out" >/dev/null
          jq -e --arg worker "$expected_worker" '.worker == $worker' "$out" >/dev/null
          jq -e --arg repository "$CONTROL_REPOSITORY" --arg sha "$GITHUB_WORKFLOW_SHA" \
            '.policy_source == {repository:$repository,path:".github/workflows/cao.json",sha:$sha}' \
            "$out" >/dev/null
        env:
          CAO_PACKAGE: optimization
          CAO_ROLE: worker
          CAO_WORKER: agents-md-curator
          CONTROL_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
      - name: Upload CAO control precompute artifact
        if: ${{ steps.cao_admission.outputs.authorized == 'true' && steps.cao_precompute.outputs.authorized != 'false' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: cao-control-precompute
          path: /tmp/gh-aw/agent/control-precompute.json
          retention-days: 1.0
      - name: Check team membership for workflow
        id: check_membership
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_REQUIRED_ROLES: "admin,maintainer,write"
          GH_AW_ALLOWED_BOTS: "github-actions[bot],cao-githubnext-gh-aw-cao-write[bot]"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'check_membership.cjs'));
            await main();

  safe_outputs:
    needs:
      - activation
      - agent
      - detection
    if: (!cancelled()) && needs.agent.result != 'skipped' && needs.detection.result == 'success'
    runs-on: ubuntu-slim
    environment: central-agentic-ops
    permissions:
      issues: write
    timeout-minutes: 45
    env:
      GH_AW_AGENT_AIC: ${{ needs.agent.outputs.aic }}
      GH_AW_AIC: ${{ needs.agent.outputs.aic }}
      GH_AW_AMBIENT_CONTEXT: ${{ needs.agent.outputs.ambient_context }}
      GH_AW_CALLER_WORKFLOW_ID: "${{ github.repository }}/optimization-agents-md-curator"
      GH_AW_DETECTION_CONCLUSION: ${{ needs.detection.outputs.detection_conclusion }}
      GH_AW_DETECTION_REASON: ${{ needs.detection.outputs.detection_reason }}
      GH_AW_EFFECTIVE_TOKENS: ${{ needs.agent.outputs.effective_tokens }}
      GH_AW_ENGINE_ID: "copilot"
      GH_AW_ENGINE_MODEL: ${{ needs.agent.outputs.model }}
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
      GH_AW_THREAT_DETECTION_AIC: ${{ needs.detection.outputs.aic }}
      GH_AW_TRACKER_ID: "optimization-agents-md-curator"
      GH_AW_WORKFLOW_EMOJI: ":compass:"
      GH_AW_WORKFLOW_ID: "optimization-agents-md-curator"
      GH_AW_WORKFLOW_NAME: "AW Optimization / AGENTS.md"
      GH_AW_WORKFLOW_SOURCE_URL: "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/.github/workflows/optimization-agents-md-curator.md"
    outputs:
      app_token_minting_failed: ${{ steps.safe-outputs-app-token.outcome == 'failure' }}
      code_push_failure_count: ${{ steps.process_safe_outputs.outputs.code_push_failure_count }}
      code_push_failure_errors: ${{ steps.process_safe_outputs.outputs.code_push_failure_errors }}
      create_discussion_error_count: ${{ steps.process_safe_outputs.outputs.create_discussion_error_count }}
      create_discussion_errors: ${{ steps.process_safe_outputs.outputs.create_discussion_errors }}
      created_issue_number: ${{ steps.process_safe_outputs.outputs.created_issue_number }}
      created_issue_url: ${{ steps.process_safe_outputs.outputs.created_issue_url }}
      process_safe_outputs_items_applied: ${{ steps.process_safe_outputs.outputs.items_applied }}
      process_safe_outputs_items_cancelled: ${{ steps.process_safe_outputs.outputs.items_cancelled }}
      process_safe_outputs_items_deferred: ${{ steps.process_safe_outputs.outputs.items_deferred }}
      process_safe_outputs_items_failed: ${{ steps.process_safe_outputs.outputs.items_failed }}
      process_safe_outputs_items_skipped: ${{ steps.process_safe_outputs.outputs.items_skipped }}
      process_safe_outputs_items_succeeded: ${{ steps.process_safe_outputs.outputs.items_succeeded }}
      process_safe_outputs_items_warnings: ${{ steps.process_safe_outputs.outputs.items_warnings }}
      process_safe_outputs_processed_count: ${{ steps.process_safe_outputs.outputs.processed_count }}
      process_safe_outputs_status: ${{ steps.process_safe_outputs.outputs.status }}
      process_safe_outputs_temporary_id_map: ${{ steps.process_safe_outputs.outputs.temporary_id_map }}
    steps:
      - name: Setup Scripts
        id: setup
        uses: github/gh-aw-actions/setup@23e16337f3568b3c18bb04a976793f282a016755 # v0.88.4
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
          trace-id: ${{ needs.activation.outputs.setup-trace-id }}
          parent-span-id: ${{ needs.activation.outputs.setup-parent-span-id || needs.activation.outputs.setup-span-id }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "AW Optimization / AGENTS.md"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/optimization-agents-md-curator.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "1.0.80"
          GH_AW_INFO_AWF_VERSION: "v0.28.13"
          GH_AW_INFO_ENGINE_ID: "copilot"
      - name: Mask OTLP telemetry headers
        run: bash "${RUNNER_TEMP}/gh-aw/actions/mask_otlp_headers.sh"
      - name: Download agent output artifact
        id: download-agent-output
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{agent,agent-output-fallback}"
          merge-multiple: true
          path: /tmp/gh-aw/
      - name: Setup agent output environment variable
        id: setup-agent-output-env
        if: steps.download-agent-output.outcome == 'success'
        run: |
          mkdir -p /tmp/gh-aw/
          find "/tmp/gh-aw/" -type f -print
          if [ -f "/tmp/gh-aw/agent_output.json" ]; then
            echo "GH_AW_AGENT_OUTPUT=/tmp/gh-aw/agent_output.json" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate GitHub App token
        id: safe-outputs-app-token
        env:
          GH_AW_IGNORE_IF_MISSING_PRIVATE_KEY: ${{ secrets.GH_AW_GITHUB_WRITE_APP_PRIVATE_KEY }}
        if: ${{ vars.GH_AW_GITHUB_WRITE_APP_ID != '' && env.GH_AW_IGNORE_IF_MISSING_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_AW_GITHUB_WRITE_APP_ID }}
          private-key: ${{ secrets.GH_AW_GITHUB_WRITE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          github-api-url: ${{ github.api_url }}
          permission-issues: write
      - name: Configure GH_HOST for enterprise compatibility
        id: ghes-host-config
        shell: bash
        run: | # zizmor: ignore[github-env] - GITHUB_SERVER_URL is set by GitHub Actions, not user input.
          # Derive GH_HOST from GITHUB_SERVER_URL so the gh CLI targets the correct
          # GitHub instance (GHES/GHEC). On github.com this is a harmless no-op.
          GH_HOST="${GITHUB_SERVER_URL#https://}"
          GH_HOST="${GH_HOST#http://}"
          echo "GH_HOST=${GH_HOST}" >> "$GITHUB_ENV"
      - name: Process Safe Outputs
        id: process_safe_outputs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_AGENT_OUTPUT: ${{ steps.setup-agent-output-env.outputs.GH_AW_AGENT_OUTPUT }}
          GH_AW_COMMENT_ID: ${{ needs.activation.outputs.comment_id }}
          GH_AW_ALLOWED_DOMAINS: "*.githubusercontent.com,api.githubcopilot.com,api.snapcraft.io,archive.ubuntu.com,azure.archive.ubuntu.com,codeload.github.com,crl.geotrust.com,crl.globalsign.com,crl.identrust.com,crl.sectigo.com,crl.thawte.com,crl.usertrust.com,crl.verisign.com,crl3.digicert.com,crl4.digicert.com,crls.ssl.com,docs.github.com,github-cloud.githubusercontent.com,github-cloud.s3.amazonaws.com,github.blog,github.com,github.githubassets.com,json-schema.org,json.schemastore.org,keyserver.ubuntu.com,lfs.github.com,objects.githubusercontent.com,ocsp.digicert.com,ocsp.geotrust.com,ocsp.globalsign.com,ocsp.identrust.com,ocsp.sectigo.com,ocsp.ssl.com,ocsp.thawte.com,ocsp.usertrust.com,ocsp.verisign.com,packagecloud.io,packages.cloud.google.com,packages.microsoft.com,patch-diff.githubusercontent.com,patchdiff.githubusercontent.com,ppa.launchpad.net,raw.githubusercontent.com,s.symcb.com,s.symcd.com,security.ubuntu.com,ts-crl.ws.symantec.com,ts-ocsp.ws.symantec.com,www.googleapis.com"
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_API_URL: ${{ github.api_url }}
          GH_AW_SAFE_OUTPUTS_HANDLER_CONFIG: "{\"create_issue\":{\"close_older_issues\":true,\"expires\":720,\"labels\":[\"optimization\",\"optimization:agents-md-curator\"],\"max\":1,\"target-repo\":\"${{ (inputs.safe_output_mode || 'review') == 'review' && (inputs.safe_output_repo || github.repository) || inputs.target_repo }}\",\"title_prefix\":\"[optimization:agents-md-curator] \"},\"create_report_incomplete_issue\":{},\"missing_data\":{},\"missing_tool\":{},\"noop\":{\"max\":1,\"report-as-issue\":\"false\"},\"report_incomplete\":{}}"
        with:
          github-token: ${{ steps.safe-outputs-app-token.outputs.token || secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'process_safe_outputs.cjs'));
            await main();
      - name: Upload Safe Outputs Items
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: safe-outputs-items
          path: |
            /tmp/gh-aw/safe-output-items.jsonl
            /tmp/gh-aw/temporary-id-map.json
            /tmp/gh-aw/safe-output-errors.json
          if-no-files-found: ignore
