name: CAO Dashboard Build

run-name: CAO Dashboard Build / ${{ inputs.request-id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      site-path:
        description: Relative path at which the dashboard will be mounted in the artifact.
        required: false
        type: string
        default: cao
      request-id:
        description: Correlation identifier supplied by a dispatching workflow.
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Validate dashboard site path
        env:
          DASHBOARD_SITE_PATH: ${{ inputs.site-path }}
        run: |
          echo "Validating dashboard site path"
          if [[ "$DASHBOARD_SITE_PATH" != "." && ! "$DASHBOARD_SITE_PATH" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then
            echo "site-path must be '.' or a relative URL path" >&2
            exit 1
          fi
          if [[ "$DASHBOARD_SITE_PATH" == /* || "$DASHBOARD_SITE_PATH" == *..* || "$DASHBOARD_SITE_PATH" == */ || "$DASHBOARD_SITE_PATH" == *//* ]]; then
            echo "site-path must not be absolute, traverse directories, or end with '/'" >&2
            exit 1
          fi

      - name: Checkout trusted report source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Resolve dashboard source layout
        run: |
          echo "Resolving dashboard source layout"
          if [[ -f .github/aw/dashboard/report/dashboard-language-sources.mjs && -f .github/aw/dashboard/site/scripts/build.mjs ]]; then
            echo "DASHBOARD_LAYOUT=installed" >> "$GITHUB_ENV"
            echo "DASHBOARD_REPORT_ROOT=.github/aw/dashboard/report" >> "$GITHUB_ENV"
            echo "DASHBOARD_SITE_ROOT=.github/aw/dashboard/site" >> "$GITHUB_ENV"
          elif [[ -f dashboard/report/records.mjs && -f dashboard/site/scripts/build.mjs ]]; then
            echo "DASHBOARD_LAYOUT=source" >> "$GITHUB_ENV"
            echo "DASHBOARD_REPORT_ROOT=dashboard/report" >> "$GITHUB_ENV"
            echo "DASHBOARD_SITE_ROOT=dashboard/site" >> "$GITHUB_ENV"
          else
            echo "Dashboard package sources are unavailable" >&2
            exit 1
          fi

      - name: Install dashboard build dependencies
        run: npm ci --prefix "$DASHBOARD_SITE_ROOT" --ignore-scripts

      - name: Restore collected activity data
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cao-activity/gh-aw-logs.jsonl
            ${{ runner.temp }}/cao-activity/gh-aw-logs.sqlite
            ${{ runner.temp }}/cao-activity/control-settings.json
            ${{ runner.temp }}/cao-activity/inventory-sources.json
          key: cao-activity-v3-lookup-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cao-activity-v3-
          fail-on-cache-miss: true

      - name: Validate restored activity data
        env:
          ACTIVITY_DATABASE: ${{ runner.temp }}/cao-activity/gh-aw-logs.sqlite
          REPORT_GH_AW_LOGS: ${{ runner.temp }}/cao-activity/gh-aw-logs.jsonl
          REPORT_CONTROL_SETTINGS: ${{ runner.temp }}/cao-activity/control-settings.json
          REPORT_INVENTORY_SOURCES: ${{ runner.temp }}/cao-activity/inventory-sources.json
        run: |
          echo "Validating restored activity data"
          validation_failed=0
          for activity_file in \
            "$REPORT_GH_AW_LOGS" \
            "$ACTIVITY_DATABASE" \
            "$REPORT_CONTROL_SETTINGS" \
            "$REPORT_INVENTORY_SOURCES"; do
            if [[ ! -e "$activity_file" ]]; then
              echo "::error::Required activity data file is missing: $activity_file"
              validation_failed=1
            elif [[ ! -s "$activity_file" ]]; then
              echo "::error::Required activity data file is empty: $activity_file"
              validation_failed=1
            else
              echo "Validated $activity_file ($(stat -c %s -- "$activity_file") bytes)"
            fi
          done
          if [[ "$validation_failed" -ne 0 ]]; then
            echo "Restored activity cache directory contents:"
            find "$RUNNER_TEMP/cao-activity" -maxdepth 1 -type f -printf "  %f (%s bytes)\n" | sort
            exit 1
          fi

      - name: Assess activity database health
        env:
          ACTIVITY_DATABASE: ${{ runner.temp }}/cao-activity/gh-aw-logs.sqlite
        run: |
          echo "Resolving activity SQLite doctor"
          if [[ -f activity/cao.mjs ]]; then
            doctor_script=activity/cao.mjs
          elif [[ -f .github/aw/activity/cao.mjs ]]; then
            doctor_script=.github/aw/activity/cao.mjs
          else
            echo "Activity SQLite doctor is unavailable" >&2
            exit 1
          fi
          echo "Assessing activity database health"
          node "$doctor_script" doctor --database "$ACTIVITY_DATABASE"

      - name: Assemble Dashboard Language site
        env:
          REPORT_OUTPUT: ${{ runner.temp }}/central-agentic-ops-dashboard/${{ inputs.site-path }}
        run: |
          echo "Building dashboard site from $DASHBOARD_LAYOUT layout"
          npm --prefix "$DASHBOARD_SITE_ROOT" run build -- \
            "$REPORT_OUTPUT" \
            "$RUNNER_TEMP/cao-activity/control-settings.json"
          echo "Copying collected activity data"
          cp "$RUNNER_TEMP/cao-activity/inventory-sources.json" "$REPORT_OUTPUT/inventory-sources.json"
          cp "$RUNNER_TEMP/cao-activity/gh-aw-logs.jsonl" "$REPORT_OUTPUT/gh-aw-logs.jsonl"
          cp "$RUNNER_TEMP/cao-activity/gh-aw-logs.sqlite" "$REPORT_OUTPUT/gh-aw-logs.sqlite"

      - name: Cache dashboard artifact for the dispatching workflow
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/central-agentic-ops-dashboard
          key: cao-dashboard-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: central-agentic-ops-dashboard
          path: ${{ runner.temp }}/central-agentic-ops-dashboard
          if-no-files-found: error
          retention-days: 1