name: Hosted MCP integration

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/cao-mcp-remote.yml
      - server/coolify/compose.yml
      - server/cmd/cao-dashboard/**
      - server/internal/server/**
      - tests/e2e/cao-mcp-remote.mjs
      - tests/unit/cao-mcp-remote-contract.test.mjs
      - tests/unit/cao-mcp-remote.helpers.mjs

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read
  id-token: write

jobs:
  remote:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Verify deployed MCP
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --test tests/e2e/cao-mcp-remote.mjs
