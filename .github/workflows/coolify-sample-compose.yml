name: Generate sample Coolify Compose

on:
  workflow_dispatch:
    inputs:
      image:
        description: Immutable githubnext/gh-aw-cao dashboard image
        required: true
        type: string
      public_host:
        description: Public dashboard host name
        required: true
        type: string
      trusted_proxy_cidr:
        description: Exact private CIDR of the Coolify proxy network
        required: true
        type: string
      artifact_volume:
        description: Pre-populated Coolify artifact volume
        required: true
        default: cao-dashboard-artifact
        type: string

permissions:
  contents: read

jobs:
  generate:
    name: Generate sample bundle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate sample Compose file
        env:
          CAO_SAMPLE_IMAGE: ${{ inputs.image }}
          CAO_SAMPLE_PUBLIC_HOST: ${{ inputs.public_host }}
          CAO_SAMPLE_TRUSTED_PROXY_CIDR: ${{ inputs.trusted_proxy_cidr }}
          CAO_SAMPLE_ARTIFACT_VOLUME: ${{ inputs.artifact_volume }}
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/coolify-sample"
          mkdir -p "${output}"
          python3 - <<'PY'
          import ipaddress
          import os
          import pathlib
          import re

          image = os.environ["CAO_SAMPLE_IMAGE"]
          host = os.environ["CAO_SAMPLE_PUBLIC_HOST"]
          cidr_text = os.environ["CAO_SAMPLE_TRUSTED_PROXY_CIDR"]
          volume = os.environ["CAO_SAMPLE_ARTIFACT_VOLUME"]

          if not re.fullmatch(
              r"ghcr\.io/githubnext/gh-aw-cao/cao-dashboard@sha256:[0-9a-f]{64}",
              image,
          ):
              raise SystemExit("image must be an immutable githubnext/gh-aw-cao dashboard digest")
          if not re.fullmatch(
              r"(?=.{1,253}\Z)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+"
              r"[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?",
              host,
          ):
              raise SystemExit("public host must be a lowercase DNS host name")
          network = ipaddress.ip_network(cidr_text, strict=True)
          if not network.is_private or network.is_unspecified or network.prefixlen == 0:
              raise SystemExit("trusted proxy CIDR must be an exact private network")
          if not re.fullmatch(r"[a-zA-Z0-9][a-zA-Z0-9_.-]{0,127}", volume):
              raise SystemExit("artifact volume must be a valid Docker volume name")

          source = pathlib.Path("server/coolify/compose.yml").read_text()
          replacements = {
              "${CAO_IMAGE:?CAO_IMAGE must be an immutable GHCR image digest}": image,
              "${CAO_ARTIFACT_VOLUME:?Configure the pre-populated Coolify artifact volume}": volume,
              "${CAO_ALLOWED_HOSTS:?Configure the public dashboard host}": host,
              "${CAO_TRUSTED_PROXY_CIDRS:?Configure the exact Coolify proxy network CIDR}": cidr_text,
              "${CAO_GITHUB_REDIRECT_URL:?Configure the OAuth callback URL}": f"https://{host}/auth/callback",
              "../../.github/workflows/cao.json": "./cao.json",
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f"Compose template field changed or is ambiguous: {old}")
              source = source.replace(old, new)

          output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "coolify-sample"
          (output / "compose.yml").write_text(source)
          (output / "cao.json").write_text(pathlib.Path(".github/workflows/cao.json").read_text())
          (output / ".env.example").write_text(pathlib.Path("server/coolify/.env.example").read_text())
          PY

      - name: Upload sample bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coolify-sample-compose
          path: ${{ runner.temp }}/coolify-sample
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
