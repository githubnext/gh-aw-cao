name: Workflow contracts

on:
  pull_request:
    paths-ignore:
      - .github/workflows/cid.yml
      - dashboard/site/**
  push:
    branches: [main]
    paths-ignore:
      - .github/workflows/cid.yml
      - dashboard/site/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-plugin:
    name: Install agent plugin with Copilot CLI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Copilot CLI
        run: npm install -g @github/copilot --before="$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)"
      - name: Install agent plugin
        run: copilot plugin install .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install gh-aw
        uses: github/gh-aw-actions/setup-cli@690dd9f82e459785bc3cbf9c2fb9a6a54b4f2a42 # v0.89.4
        with:
          version: v0.89.4
      - name: Run contract suite
        run: npm run check
      - name: Check patch formatting
        run: git diff --check

  package-lifecycle-changes:
    name: Select package lifecycle tests
    runs-on: ubuntu-latest
    outputs:
      has-changes: ${{ steps.matrix.outputs.has-changes }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build package test matrix
        id: matrix
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "$BASE_SHA" =~ ^0+$ ]]; then
            matrix="$(node scripts/package-lifecycle-matrix.mjs --all)"
          else
            matrix="$(node scripts/package-lifecycle-matrix.mjs "$BASE_SHA" "$HEAD_SHA")"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [[ "$matrix" == '{"include":[]}' ]]; then
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          fi

  package-lifecycle:
    needs: package-lifecycle-changes
    if: needs.package-lifecycle-changes.outputs.has-changes == 'true'
    name: Package lifecycle (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.package-lifecycle-changes.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Check package API capacity
        id: package-api
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remaining="$(gh api rate_limit --jq '.resources.core.remaining')"
          echo "remaining=$remaining" >> "$GITHUB_OUTPUT"
          if (( remaining < 500 )); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Package lifecycle incomplete::The shared GitHub App installation has $remaining core API requests remaining; 500 are required for clean-room package tests."
            echo "Package lifecycle tests were skipped because the shared GitHub App installation API quota is exhausted." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install gh-aw
        if: steps.package-api.outputs.ready == 'true'
        uses: github/gh-aw-actions/setup-cli@690dd9f82e459785bc3cbf9c2fb9a6a54b4f2a42 # v0.89.4
        with:
          version: v0.89.4
      - name: Run package lifecycle integration
        if: steps.package-api.outputs.ready == 'true'
        env:
          CENTRAL_AGENTIC_OPS_PACKAGE_SOURCE: ${{ github.repository }}@${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          NODE_OPTIONS: '--test-name-pattern="${{ matrix.test-pattern }}"'
        run: |
          set +e
          output="$(npm run test:package-lifecycle 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if (( status == 0 )); then
            exit 0
          fi
          if grep -Fq "API rate limit exceeded for installation" <<< "$output"; then
            echo "::warning title=Package lifecycle incomplete::The shared GitHub App installation API quota was exhausted during clean-room package tests."
            echo "Package lifecycle tests became inconclusive because the shared GitHub App installation API quota was exhausted during the run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$status"
