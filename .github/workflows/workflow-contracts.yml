name: Workflow contracts

on:
  pull_request:
    paths-ignore:
      - .github/workflows/cid.yml
      - dashboard/site/**
  push:
    branches: [main]
    paths-ignore:
      - .github/workflows/cid.yml
      - dashboard/site/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-plugin:
    name: Install agent plugin with Copilot CLI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Copilot CLI
        run: npm_config_before="$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)" npm install -g @github/copilot # zizmor: ignore[adhoc-packages] - This compatibility test intentionally exercises the latest available Copilot CLI.
      - name: Install agent plugin
        run: copilot plugin install "$(pwd)"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install gh-aw
        uses: ./.github/actions/setup-gh-aw # zizmor: ignore[self-repository] - Local actions use the syntax accepted by GitHub Actions and actionlint.
      - name: Run contract suite
        run: npm run check
      - name: Check patch formatting
        run: git diff --check

  dependabot-operational-value:
    name: Dependabot operational value integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      vulnerability-alerts: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compute Dependabot operational value
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node activity/cao.mjs operational-value \
            --database "$RUNNER_TEMP/operational-value.sqlite" \
            --root . \
            --output "$RUNNER_TEMP/operational-values.jsonl" \
            --repository "$GITHUB_REPOSITORY" \
            --max-github-api-rate-limit -100
          jq -e -s '
            length == 1
            and .[0].kind == "operational_value"
            and .[0].operational_value.repository == env.GITHUB_REPOSITORY
            and .[0].operational_value.value_id == "dependabot-vulnerability-alerts"
            and (.[0].operational_value.value | type) == "number"
          ' "$RUNNER_TEMP/operational-values.jsonl"

  campaign-lifecycle-changes:
    name: Select campaign lifecycle tests
    runs-on: ubuntu-latest
    outputs:
      has-changes: ${{ steps.matrix.outputs.has-changes }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build campaign test matrix
        id: matrix
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "$BASE_SHA" =~ ^0+$ ]]; then
            matrix="$(node scripts/campaign-lifecycle-matrix.mjs --all)"
          else
            matrix="$(node scripts/campaign-lifecycle-matrix.mjs "$BASE_SHA" "$HEAD_SHA")"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [[ "$matrix" == '{"include":[]}' ]]; then
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          fi

  campaign-lifecycle:
    needs: campaign-lifecycle-changes
    if: needs.campaign-lifecycle-changes.outputs.has-changes == 'true'
    name: Campaign lifecycle (${{ matrix.name }})
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.campaign-lifecycle-changes.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Check campaign API capacity
        id: campaign-api
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remaining="$(gh api rate_limit --jq '.resources.core.remaining')"
          echo "remaining=$remaining" >> "$GITHUB_OUTPUT"
          if (( remaining < 500 )); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Campaign lifecycle incomplete::The shared GitHub App installation has $remaining core API requests remaining; 500 are required for clean-room campaign tests."
            echo "Campaign lifecycle tests were skipped because the shared GitHub App installation API quota is exhausted." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install gh-aw
        if: steps.campaign-api.outputs.ready == 'true'
        uses: ./.github/actions/setup-gh-aw # zizmor: ignore[self-repository] - Local actions use the syntax accepted by GitHub Actions and actionlint.
      - name: Run campaign lifecycle integration
        if: steps.campaign-api.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_OPTIONS: '--test-name-pattern="${{ matrix.test-pattern }}"'
        run: |
          # shellcheck disable=SC2155
          export CENTRAL_AGENTIC_OPS_CAMPAIGN_SOURCE="${GITHUB_REPOSITORY}@$(git rev-parse --short=12 "$GITHUB_SHA")"
          set +e
          output="$(npm run test:campaign-lifecycle 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if (( status == 0 )); then
            exit 0
          fi
          if grep -Fq "API rate limit exceeded for installation" <<< "$output"; then
            echo "::warning title=Campaign lifecycle incomplete::The shared GitHub App installation API quota was exhausted during clean-room campaign tests."
            echo "Campaign lifecycle tests became inconclusive because the shared GitHub App installation API quota was exhausted during the run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$status"
