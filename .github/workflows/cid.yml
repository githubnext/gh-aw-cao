name: Dashboard CI

on:
  pull_request:
    paths:
      - .github/workflows/cid.yml
      - dashboard/site/**
  push:
    branches: [main]
    paths:
      - .github/workflows/cid.yml
      - dashboard/site/**

permissions:
  contents: read

jobs:
  lint-unit:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard/site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test

  playwright-integration:
    name: Playwright integration tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    defaults:
      run:
        working-directory: dashboard/site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Cache Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('dashboard/site/package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}

  lighthouse-performance:
    name: Lighthouse performance scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard/site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Cache Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('dashboard/site/package-lock.json') }}-chromium
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run performance scenarios
        run: |
          status=0
          npm run test:performance || status=$?
          if [ "$status" -eq 42 ]; then
            echo "Lighthouse budget thresholds exceeded; continuing without blocking CI."
            exit 0
          fi
          exit "$status"
      - name: Upload performance traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-lighthouse-performance
          path: dashboard/site/test-results/lighthouse/
          if-no-files-found: warn
          retention-days: 14

  lighthouse-comment:
    name: Report Lighthouse degradation
    if: github.event_name == 'pull_request'
    needs: lighthouse-performance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
      pull-requests: read
    steps:
      - name: Download Lighthouse results
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dashboard-lighthouse-performance
          path: lighthouse-results
      - name: Comment on degraded performance
        if: steps.download.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs')
            const summaryPath = 'lighthouse-results/summary.json'
            if (!fs.existsSync(summaryPath)) {
              core.warning(`Lighthouse summary is unavailable at ${summaryPath}; skipping PR feedback.`)
              return
            }
            let summary
            try {
              summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'))
            } catch (error) {
              core.warning(`Could not read the Lighthouse summary; skipping PR feedback: ${error.message}`)
              return
            }
            const degraded = summary.results.filter((result) => result.failures.length > 0)

            const headOwner = context.payload.pull_request.head.repo.owner.login
            const headBranch = context.payload.pull_request.head.ref
            let pull = context.payload.pull_request
            try {
              const { data: pulls } = await github.rest.pulls.list({
                ...context.repo,
                state: 'open',
                head: `${headOwner}:${headBranch}`,
              })
              const branchPull = pulls.find(({ head }) =>
                head.ref === headBranch && head.repo?.owner.login === headOwner
              )
              if (branchPull) {
                pull = branchPull
              } else {
                core.warning(`No open pull request found for ${headOwner}:${headBranch}; using event pull request.`)
              }
            } catch (error) {
              core.warning(`Could not find the pull request by branch; using event pull request: ${error.message}`)
            }

            const marker = '<!-- dashboard-lighthouse-degradation -->'
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: pull.number,
              per_page: 100,
            })
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            )
            if (degraded.length === 0) {
              core.info('All Lighthouse scenarios meet their performance budgets.')
              if (existing) {
                await github.rest.issues.deleteComment({
                  ...context.repo,
                  comment_id: existing.id,
                })
              }
              return
            }

            const labels = {
              'cumulative-layout-shift': 'Cumulative Layout Shift',
              'first-contentful-paint': 'First Contentful Paint',
              'largest-contentful-paint': 'Largest Contentful Paint',
              'speed-index': 'Speed Index',
              'total-blocking-time': 'Total Blocking Time',
            }
            const formatMetric = (name, value) =>
              name === 'cumulative-layout-shift' ? value.toFixed(3) : `${Math.round(value)} ms`
            const sections = degraded.map((result) => {
              const details = []
              if (result.score < result.passingScore) {
                details.push(
                  `- 📊 Performance score: **${Math.round(result.score * 100)}** ` +
                  `(required: **${Math.round(result.passingScore * 100)}**)`
                )
              }
              for (const [name, budget] of Object.entries(result.budgets)) {
                const value = result.metrics[name]
                if (value > budget) {
                  details.push(
                    `- 📏 ${labels[name] || name}: **${formatMetric(name, value)}** ` +
                    `(budget: **${formatMetric(name, budget)}**)`
                  )
                }
              }
              return `#### 👤 ${result.persona} (\`${result.id}\`)\n\n${details.join('\n')}`
            })
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              marker,
              '### 📉 Dashboard Lighthouse performance degraded',
              '',
              '⚠️ The Lighthouse check is informational and does not block this pull request.',
              'The following scenario scores or metrics are outside their configured thresholds:',
              '',
              ...sections,
              '',
              `🔎 [View the workflow run and performance artifacts](${runUrl}).`,
            ].join('\n')

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: pull.number,
                body,
              })
            }
