name: CAO runtime package

on:
  push:
    branches: [main]
  release:
    types: [released]

permissions:
  contents: read

concurrency:
  group: cao-runtime-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'githubnext/gh-aw-cao' && !github.event.repository.fork
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate immutable source
        env:
          REVISION: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_DRAFT: ${{ github.event.release.draft }}
        run: |
          set -euo pipefail
          [[ "${REVISION}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "${REVISION}" ]]
          if [[ "${EVENT}" == release ]]; then
            [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            [[ "${RELEASE_PRERELEASE}" == false && "${RELEASE_DRAFT}" == false ]]
            git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
            git merge-base --is-ancestor "${REVISION}" refs/remotes/origin/main
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Validate packaging and installation
        run: |
          npm run lint
          npm run typecheck:cao
          node --test \
            tests/unit/cao-materialize.test.mjs \
            tests/unit/cao-runtime-artifact.test.mjs \
            tests/unit/install-script.test.mjs
          npm run test:runtime-install
      - name: Build and seal runtime
        env:
          REVISION: ${{ github.sha }}
        run: npm run runtime:pack -- "${RUNNER_TEMP}/runtime" "${REVISION}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cao-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/runtime/*
          if-no-files-found: error
          retention-days: 90

  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cao-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/runtime
      - name: Verify sealed archive
        working-directory: ${{ runner.temp }}/runtime
        env:
          REVISION: ${{ github.sha }}
        run: sha256sum --check "cao-runtime-${REVISION}.tgz.sha256"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/runtime/cao-runtime-${{ github.sha }}.tgz

  publish:
    if: github.event_name == 'release'
    needs: attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cao-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/runtime
      - name: Verify source and publish immutable release assets
        working-directory: ${{ runner.temp }}/runtime
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(gh release view "${RELEASE_TAG}" --json isDraft,isPrerelease --jq '(.isDraft == false) and (.isPrerelease == false)')" == true ]]
          object="$(gh api "repos/${GH_REPO}/git/ref/tags/${RELEASE_TAG}" --jq '.object | [.type, .sha] | @tsv')"
          for (( depth=0; depth<8; depth++ )); do
            read -r type sha <<< "${object}"
            [[ "${type}" == tag ]] || break
            object="$(gh api "repos/${GH_REPO}/git/tags/${sha}" --jq '.object | [.type, .sha] | @tsv')"
          done
          [[ "${type}" == commit && "${sha}" == "${REVISION}" ]]
          sha256sum --check "cao-runtime-${REVISION}.tgz.sha256"
          gh release upload "${RELEASE_TAG}" \
            "cao-runtime-${REVISION}.tgz" "cao-runtime-${REVISION}.tgz.sha256"
