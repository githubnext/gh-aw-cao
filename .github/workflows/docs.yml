name: Documentation Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CAO Dashboard
    types:
      - completed
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - .github/cao/**
      - .github/workflows/docs.yml
      - .github/workflows/activity.yml
      - .github/workflows/*.lock.yml
      - .github/workflows/*.md
      - "*/aw.yml"
      - astro.config.mjs
      - aw.yml
      - docs/**
      - package.json
      - package-lock.json
      - public/**

permissions:
  actions: read
  contents: read

concurrency:
  group: documentation-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node-24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Save node_modules
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ steps.node-modules-cache.outputs.cache-primary-key }}

      - name: Build documentation
        env:
          # Commit that triggered this run (push or scheduled tip of default branch).
          PUBLIC_PAGES_BUILD_COMMIT: ${{ github.sha }}
        run: npm run docs:build

      - name: Find latest CAO Dashboard run
        id: dashboard-run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          run_id="$(gh api \
            "repos/$REPOSITORY/actions/workflows/cao-dashboard.yml/runs?branch=$DEFAULT_BRANCH&status=success&per_page=20" \
            --jq '.workflow_runs[0].id // empty')"
          if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
            echo "No successful CAO Dashboard workflow run was found on $DEFAULT_BRANCH" >&2
            exit 1
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Mount latest CAO Dashboard artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: central-agentic-ops-dashboard
          path: dist/cao
          github-token: ${{ github.token }}
          run-id: ${{ steps.dashboard-run.outputs.run-id }}

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1