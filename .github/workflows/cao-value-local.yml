name: CAO Local Value

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] - Only successful default-branch Activity snapshots are read; code and policy come from the trusted workflow revision.
    workflows: [CAO Activity]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: central-agentic-ops-local-value
  cancel-in-progress: false

jobs:
  compute:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == github.event.repository.default_branch
      && github.event.workflow_run.head_repository.id == github.event.repository.id
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted Value source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Set up CAO activity runtime
        uses: ./.github/actions/setup-cao-runtime # zizmor: ignore[self-repository] - local action is checked out at github.workflow_sha.
        with:
          bundle: activity

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download the already-published Activity snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cao-activity-index
          path: ${{ runner.temp }}/cao-activity
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Restore retained local Value history
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cao-local-value/operational-values.jsonl
          key: cao-value-local-v1-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          restore-keys: cao-value-local-v1-

      - name: Compute bounded local values without target credentials
        timeout-minutes: 3
        env:
          ACTIVITY_SNAPSHOT: ${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          CAO_OPERATIONAL_VALUE_GH_TOKEN: ""
        run: |
          node activity/local-values.mjs compute \
            --root . --policy .github/workflows/cao.json \
            --snapshot "$RUNNER_TEMP/cao-activity" --snapshotKey "$ACTIVITY_SNAPSHOT" \
            --output "$RUNNER_TEMP/cao-local-value/operational-values.jsonl"

      - name: Cache completed values for a later Activity snapshot
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cao-local-value/operational-values.jsonl
          key: cao-value-local-v1-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
