name: Go Dashboard Server CI

on:
  pull_request:
    paths:
      - .github/workflows/cgo.yml
      - dashboard/site/**
      - server/**
      - package.json
      - package-lock.json
      - tests/e2e/dashboard-server.spec.mjs
      - tests/playwright/configs/dashboard-server.config.mjs
  push:
    branches: [main]
    paths:
      - .github/workflows/cgo.yml
      - dashboard/site/**
      - server/**
      - package.json
      - package-lock.json
      - tests/e2e/dashboard-server.spec.mjs
      - tests/playwright/configs/dashboard-server.config.mjs

permissions:
  contents: read

jobs:
  server-quality:
    name: Go format, lint, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: 1.27.1
          cache: false
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - name: Check formatting
        working-directory: server
        run: golangci-lint fmt --diff
      - name: Lint
        working-directory: server
        run: golangci-lint run ./...
      - name: Unit tests
        run: go -C server test ./...

  server-spec:
    name: TypeSpec API contract and generated artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/spec/package-lock.json
      - name: Install spec dependencies
        working-directory: server/spec
        run: npm ci
      - name: Compile and verify API contract
        working-directory: server/spec
        run: npm run check

  server-stress:
    name: Go rate-limit stress and profiles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      CAO_STRESS_REDIS_URL: redis://127.0.0.1:6379/0
      CAO_STRESS_REPORT_DIR: ${{ github.workspace }}/.tmp/go-stress
      CAO_STRESS_MAX_P95_MS: "250"
      CAO_STRESS_MIN_RPS: "200"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: 1.27.1
          cache: false
      - name: Run rate-limit stress harness with profiling
        working-directory: server
        run: |
          set -o pipefail
          mkdir -p "$CAO_STRESS_REPORT_DIR"
          go test ./internal/server \
            -run '^TestStress' -bench '^BenchmarkStress' -benchmem -benchtime=2000x \
            -count=1 -timeout=10m -v \
            -cpuprofile=cpu.pprof -memprofile=mem.pprof \
            -blockprofile=block.pprof -mutexprofile=mutex.pprof -trace=trace.out \
            -outputdir="$CAO_STRESS_REPORT_DIR" 2>&1 | tee "$CAO_STRESS_REPORT_DIR/go-test.txt"
      - name: Summarize profiles and thresholds
        if: always()
        working-directory: server
        run: |
          dir="$CAO_STRESS_REPORT_DIR"
          [ -f "$dir/go-test.txt" ] && grep -E '^(goos|goarch|pkg|cpu|Benchmark)' "$dir/go-test.txt" > "$dir/bench.txt" || true
          [ -f "$dir/cpu.pprof" ] && go tool pprof -top -nodecount=60 "$dir/cpu.pprof" > "$dir/cpu-top.txt" 2>&1 || true
          [ -f "$dir/mem.pprof" ] && go tool pprof -top -nodecount=60 -sample_index=alloc_space "$dir/mem.pprof" > "$dir/mem-alloc-top.txt" 2>&1 || true
          [ -f "$dir/block.pprof" ] && go tool pprof -top -nodecount=40 "$dir/block.pprof" > "$dir/block-top.txt" 2>&1 || true
          [ -f "$dir/mutex.pprof" ] && go tool pprof -top -nodecount=40 "$dir/mutex.pprof" > "$dir/mutex-top.txt" 2>&1 || true
          {
            echo "## Go server rate-limit stress"
            echo
            echo "| Scenario | Requests | req/s | p50 ms | p95 ms | p99 ms | Statuses | Upstream (requests/metered/rate-limited) |"
            echo "|---|---:|---:|---:|---:|---:|---|---|"
            for report in "$dir"/*.json; do
              [ -f "$report" ] || continue
              jq -r '"| \(.scenario) | \(.requests) | \(.requestsPerSecond | floor) | \(.latencyMs.p50) | \(.latencyMs.p95) | \(.latencyMs.p99) | \(.statuses | to_entries | map("\(.key): \(.value)") | join(", ")) | \(.upstream.requests)/\(.upstream.metered)/\(.upstream.rateLimited) |"' "$report"
            done
            echo
            echo "Thresholds: p95 <= ${CAO_STRESS_MAX_P95_MS} ms, throughput >= ${CAO_STRESS_MIN_RPS} req/s."
            if [ -s "$dir/bench.txt" ]; then
              echo
              echo '```'
              cat "$dir/bench.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload stress reports and profiles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-server-stress-profiles
          path: .tmp/go-stress/
          if-no-files-found: warn
          retention-days: 14

  redis-dashboard-integration:
    name: Redis dashboard integration
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      REDIS_URL: redis://127.0.0.1:6379/0
      CAO_SIMULATOR_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate dashboard access token
        run: |
          token=$(openssl rand -hex 16)
          echo "::add-mask::$token"
          echo "DASHBOARD_SERVER_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: 1.27.1
          cache: false
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix dashboard/site ci
      - name: Go tests with Redis
        run: go -C server test ./...
      - name: Build dashboard and server
        run: |
          npm run dashboard:server:build
          mkdir -p .tmp
          go -C server build -o ../.tmp/cao-dashboard ./cmd/cao-dashboard
      - name: Install Chromium
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps chromium
      - name: Verify deployed shards populate dashboard views
        env:
          DASHBOARD_SERVER_COMMAND: >-
            ${{ github.workspace }}/.tmp/cao-dashboard serve
            --source ${{ github.workspace }}/server/testdata/deployed-subset
            --access-token ${{ env.DASHBOARD_SERVER_ACCESS_TOKEN }}
            --site ${{ github.workspace }}/dashboard/site/dist
            --dashboard-queries ${{ github.workspace }}/dashboard/site/src/agent/queries.generated.json
            --database-queries ${{ github.workspace }}/dashboard/site/src/data/queries/database.json
        run: npm run test:e2e:dashboard-server
      - name: Upload integration traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-server-integration
          path: test-results/dashboard-server/
          if-no-files-found: warn
          retention-days: 14

  redis-dashboard-comment:
    name: Report Go Redis dashboard page results
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: redis-dashboard-integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download dashboard integration results
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dashboard-server-integration
          path: dashboard-server-results
      - name: Comment with Go Redis dashboard page results
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INTEGRATION_RESULT: ${{ needs.redis-dashboard-integration.result }}
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- go-redis-dashboard-page-results -->'
            const summaryPath = 'dashboard-server-results/summary.md'
            const passed = process.env.INTEGRATION_RESULT === 'success'
            const summary = fs.existsSync(summaryPath)
              ? fs.readFileSync(summaryPath, 'utf8').trim().slice(0, 55000)
              : 'No per-page report was produced; the integration job did not complete the page checks.'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              marker,
              `**Go Redis dashboard integration: ${passed ? 'PASSED' : 'FAILED'}**`,
              '',
              '<details><summary><b>Per-page results</b></summary>',
              '',
              summary,
              '',
              '</details>',
              '',
              `[View the workflow run and integration artifact](${runUrl}).`,
            ].join('\n')
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            )
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              })
            }
