name: CAO server package

on:
  push:
    branches: [main]
  release:
    types: [released]

permissions:
  contents: read

jobs:
  build:
    name: Build and seal trusted package source
    uses: ./.github/workflows/cao-package-build.yml # zizmor: ignore[self-repository] - Local reusable workflow syntax accepted by GitHub Actions and actionlint.
    with:
      event_name: ${{ github.event_name }}
      release_tag: ${{ github.event.release.tag_name || '' }}

  publish:
    name: Publish and attest sealed package
    needs: build
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: githubnext/gh-aw-cao/.github/workflows/cao-package-publish.yml@main # zizmor: ignore[unpinned-uses] protected default-branch publisher
    with:
      artifact_name: cao-server-${{ github.run_id }}-${{ github.run_attempt }}
      event_name: ${{ github.event_name }}
      identity: ${{ needs.build.outputs.identity }}
      revision: ${{ needs.build.outputs.revision }}
      source_branch: ""
      version: ${{ needs.build.outputs.version }}
