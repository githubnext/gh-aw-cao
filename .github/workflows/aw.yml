name: CAO control plane components
icon: ":workflow:"
description: Activity, dashboard, validation, and shared control-plane resources
min-version: v0.91.5
experimental: true
includes:
  - ../../activity/aw.yml
  - ../../dashboard/aw.yml
  - source: cao-validate.yml
    destination: .github/workflows/cao-validate.yml
resources:
  - source: shared/control.mjs
