name: Mobile dashboard integration

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/actions.yml
      - dashboard/**
      - playwright.mobile.config.mjs
      - tests/e2e/dashboard-mobile-live.spec.mjs
  pull_request:
    paths:
      - .github/workflows/actions.yml
      - dashboard/**
      - playwright.mobile.config.mjs
      - tests/e2e/dashboard-mobile-live.spec.mjs

permissions:
  contents: read

concurrency:
  group: mobile-dashboard-integration
  cancel-in-progress: true

jobs:
  mobile:
    name: ${{ matrix.device }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: webkit
            device: iPhone 15
          - browser: chromium
            device: Pixel 7
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install browser
        run: npx playwright install --with-deps "$MOBILE_BROWSER"
        env:
          MOBILE_BROWSER: ${{ matrix.browser }}
      - name: Test latest dashboard data on mobile
        run: npx playwright test --config=playwright.mobile.config.mjs
        env:
          DASHBOARD_DATA_URL: https://githubnext.github.io/gh-aw-cao/cao/sources.json
          MOBILE_BROWSER: ${{ matrix.browser }}
          MOBILE_DEVICE: ${{ matrix.device }}
      - name: Upload mobile analysis evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-dashboard-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
