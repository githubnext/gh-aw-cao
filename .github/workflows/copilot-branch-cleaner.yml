name: Copilot branch cleaner

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: List eligible branches without deleting them.
        required: true
        default: true
        type: boolean

permissions: {}

concurrency:
  group: copilot-branch-cleaner
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      candidates: ${{ steps.discover.outputs.result }}
      dry_run: ${{ steps.discover.outputs.dry_run }}
    env:
      DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run == true) || (github.event_name == 'schedule' && vars.COPILOT_BRANCH_CLEANER_DRY_RUN != 'false') }}
    steps:
      - name: Find Copilot branches
        id: discover
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const dryRun = process.env.DRY_RUN === 'true'
            const refPrefix = 'refs/heads/copilot/'
            const candidates = []
            let cursor
            let repositoryId

            do {
              const { repository } = await github.graphql(
                `query CopilotBranches(
                  $owner: String!
                  $repo: String!
                  $refPrefix: String!
                  $cursor: String
                ) {
                  repository(owner: $owner, name: $repo) {
                    id
                    refs(
                      refPrefix: $refPrefix
                      first: 100
                      after: $cursor
                      orderBy: { field: ALPHABETICAL, direction: ASC }
                    ) {
                      nodes {
                        name
                        prefix
                        target {
                          oid
                        }
                        terminal: associatedPullRequests(
                          first: 1
                          states: [MERGED, CLOSED]
                        ) {
                          totalCount
                        }
                        open: associatedPullRequests(first: 1, states: [OPEN]) {
                          totalCount
                        }
                      }
                      pageInfo {
                        endCursor
                        hasNextPage
                      }
                    }
                  }
                }`,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  refPrefix,
                  cursor,
                },
              )
              repositoryId = repository.id

              for (const ref of repository.refs.nodes) {
                if (ref.open.totalCount === 0 && ref.terminal.totalCount > 0) {
                  candidates.push({
                    name: ref.name,
                    qualifiedName: `${ref.prefix}${ref.name}`,
                    oid: ref.target.oid,
                  })
                }
              }

              cursor = repository.refs.pageInfo.hasNextPage
                ? repository.refs.pageInfo.endCursor
                : undefined
            } while (cursor)

            core.setOutput('dry_run', String(dryRun))
            if (dryRun) {
              await core.summary
                .addHeading('Branches eligible for deletion (dry run)')
                .addList(
                  candidates.length === 0
                    ? ['None']
                    : candidates.map(({ name }) => `\`${name}\``),
                )
                .write()
              for (const candidate of candidates) {
                core.info(`Would delete ${candidate.name}`)
              }
            }

            return { repositoryId, candidates }

  clean:
    needs: discover
    if: needs.discover.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Delete Copilot branches
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DISCOVERY: ${{ needs.discover.outputs.candidates }}
        with:
          script: |
            const { repositoryId, candidates } = JSON.parse(process.env.DISCOVERY)
            const zeroOid = '0000000000000000000000000000000000000000'

            for (let offset = 0; offset < candidates.length; offset += 100) {
              const batch = candidates.slice(offset, offset + 100)
              await github.graphql(
                `mutation DeleteCopilotBranches($input: UpdateRefsInput!) {
                  updateRefs(input: $input) {
                    clientMutationId
                  }
                }`,
                {
                  input: {
                    repositoryId,
                    refUpdates: batch.map(({ qualifiedName, oid }) => ({
                      name: qualifiedName,
                      beforeOid: oid,
                      afterOid: zeroOid,
                    })),
                  },
                },
              )

              for (const candidate of batch) {
                core.info(`Deleted ${candidate.name}`)
              }
            }

            await core.summary
              .addHeading('Deleted branches')
              .addList(
                candidates.length === 0
                  ? ['None']
                  : candidates.map(({ name }) => `\`${name}\``),
              )
              .write()
