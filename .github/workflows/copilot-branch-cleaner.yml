# Conventional repository maintenance workflow; not a CAO operation or gh-aw source.
name: Copilot branch cleaner

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: List eligible branches without deleting them.
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: copilot-branch-cleaner
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run == true) || (github.event_name == 'schedule' && vars.COPILOT_BRANCH_CLEANER_DRY_RUN != 'false') }}
    steps:
      - name: Find and clean Copilot branches
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const dryRun = process.env.DRY_RUN === 'true'
            const branchPrefix = 'copilot/'
            const zeroOid = '0000000000000000000000000000000000000000'
            const branches = []
            const candidates = []
            let cursor
            let repositoryId

            do {
              const { repository } = await github.graphql(
                `query CopilotBranches(
                  $owner: String!
                  $repo: String!
                  $branchPrefix: String!
                  $cursor: String
                ) {
                  repository(owner: $owner, name: $repo) {
                    id
                    refs(
                      refPrefix: "refs/heads/"
                      query: $branchPrefix
                      first: 100
                      after: $cursor
                      orderBy: { field: ALPHABETICAL, direction: ASC }
                    ) {
                      nodes {
                        name
                        target {
                          oid
                        }
                      }
                      pageInfo {
                        endCursor
                        hasNextPage
                      }
                    }
                  }
                }`,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  branchPrefix,
                  cursor,
                },
              )
              repositoryId = repository.id

              for (const ref of repository.refs.nodes) {
                if (ref.name.startsWith(branchPrefix) && ref.target) {
                  branches.push({
                    name: ref.name,
                    qualifiedName: `refs/heads/${ref.name}`,
                    oid: ref.target.oid,
                  })
                }
              }

              cursor = repository.refs.pageInfo.hasNextPage
                ? repository.refs.pageInfo.endCursor
                : undefined
            } while (cursor)

            core.info(`Found ${branches.length} \`${branchPrefix}\` branches`)

            // Pull request association on branch refs is unreliable, so pull
            // request state is resolved through `pullRequests(headRefName:)`
            // instead, batched with aliases to limit the number of requests and
            // restricted to pull requests opened from this repository.
            const nameWithOwner = `${context.repo.owner}/${context.repo.repo}`
            const lookupBatchSize = 25
            for (
              let offset = 0;
              offset < branches.length;
              offset += lookupBatchSize
            ) {
              const batch = branches.slice(offset, offset + lookupBatchSize)
              const definitions = batch
                .map((_, index) => `$head${index}: String!`)
                .join(', ')
              const selections = batch
                .map(
                  (_, index) => `
                      pullRequests${index}: pullRequests(
                        headRefName: $head${index}
                        first: 20
                        states: [OPEN, MERGED, CLOSED]
                        orderBy: { field: UPDATED_AT, direction: DESC }
                      ) {
                        nodes {
                          state
                          headRepository {
                            nameWithOwner
                          }
                        }
                      }`,
                )
                .join('')
              const variables = {
                owner: context.repo.owner,
                repo: context.repo.repo,
              }
              for (const [index, branch] of batch.entries()) {
                variables[`head${index}`] = branch.name
              }

              const { repository } = await github.graphql(
                `query CopilotBranchPullRequests(
                  $owner: String!
                  $repo: String!
                  ${definitions}
                ) {
                  repository(owner: $owner, name: $repo) {${selections}
                  }
                }`,
                variables,
              )

              for (const [index, branch] of batch.entries()) {
                const pullRequests = repository[
                  `pullRequests${index}`
                ].nodes.filter(
                  (pullRequest) =>
                    pullRequest.headRepository?.nameWithOwner === nameWithOwner,
                )
                const open = pullRequests.some(({ state }) => state === 'OPEN')
                const terminal = pullRequests.some(
                  ({ state }) => state === 'MERGED' || state === 'CLOSED',
                )
                if (!open && terminal) {
                  candidates.push(branch)
                }
              }
            }

            if (dryRun) {
              await core.summary
                .addHeading('Branches eligible for deletion (dry run)')
                .addList(
                  candidates.length === 0
                    ? ['None']
                    : candidates.map(({ name }) => `\`${name}\``),
                )
                .write()
              for (const candidate of candidates) {
                core.info(`Would delete ${candidate.name}`)
              }
              return
            }

            const deleted = []
            const failed = []
            for (let offset = 0; offset < candidates.length; offset += 100) {
              const batch = candidates.slice(offset, offset + 100)
              try {
                await github.graphql(
                  `mutation DeleteCopilotBranches($input: UpdateRefsInput!) {
                    updateRefs(input: $input) {
                      clientMutationId
                    }
                  }`,
                  {
                    input: {
                      repositoryId,
                      refUpdates: batch.map(({ qualifiedName, oid }) => ({
                        name: qualifiedName,
                        beforeOid: oid,
                        afterOid: zeroOid,
                      })),
                    },
                  },
                )

                for (const candidate of batch) {
                  deleted.push(candidate)
                  core.info(`Deleted ${candidate.name}`)
                }
              } catch {
                failed.push(...batch)
                core.warning(
                  `Skipped a batch of ${batch.length} branches because at least one branch changed or could not be deleted`,
                )
              }
            }

            await core.summary
              .addHeading('Deleted branches')
              .addList(
                deleted.length === 0
                  ? ['None']
                  : deleted.map(({ name }) => `\`${name}\``),
              )
            if (failed.length > 0) {
              core.summary
                .addHeading('Branches not deleted')
                .addList(failed.map(({ name }) => `\`${name}\``))
            }
            await core.summary.write()

            if (failed.length > 0) {
              core.setFailed(`${failed.length} eligible branches could not be deleted`)
            }
