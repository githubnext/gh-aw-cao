# Conventional repository maintenance workflow; not a CAO operation or gh-aw source.
name: Copilot branch cleaner

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: List eligible branches without deleting them.
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: copilot-branch-cleaner
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run == true) || (github.event_name == 'schedule' && vars.COPILOT_BRANCH_CLEANER_DRY_RUN != 'false') }}
    steps:
      - name: Find and clean Copilot branches
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const dryRun = process.env.DRY_RUN === 'true'
            // The GraphQL `refs` field only accepts a top-level ref prefix
            // such as `refs/heads/` or `refs/tags/`; sub-paths like
            // `refs/heads/copilot/` silently match nothing. Query the
            // top-level prefix with a server-side name filter instead.
            const refPrefix = 'refs/heads/'
            const branchNamePrefix = 'copilot/'
            const zeroOid = '0000000000000000000000000000000000000000'
            const deleteDelayMs = 1000
            const candidates = []
            let cursor
            let repositoryId

            do {
              const { repository } = await github.graphql(
                `query CopilotBranches(
                  $owner: String!
                  $repo: String!
                  $refPrefix: String!
                  $branchNamePrefix: String!
                  $cursor: String
                ) {
                  repository(owner: $owner, name: $repo) {
                    id
                    refs(
                      refPrefix: $refPrefix
                      query: $branchNamePrefix
                      first: 100
                      after: $cursor
                      orderBy: { field: ALPHABETICAL, direction: ASC }
                    ) {
                      nodes {
                        name
                        prefix
                        target {
                          oid
                        }
                        terminal: associatedPullRequests(
                          first: 1
                          states: [MERGED, CLOSED]
                        ) {
                          totalCount
                        }
                        open: associatedPullRequests(first: 1, states: [OPEN]) {
                          totalCount
                        }
                      }
                      pageInfo {
                        endCursor
                        hasNextPage
                      }
                    }
                  }
                }`,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  refPrefix,
                  branchNamePrefix,
                  cursor,
                },
              )
              repositoryId = repository.id

              for (const ref of repository.refs.nodes) {
                if (!ref.name.startsWith(branchNamePrefix)) {
                  continue
                }
                if (ref.open.totalCount === 0 && ref.terminal.totalCount > 0) {
                  candidates.push({
                    name: ref.name,
                    qualifiedName: `${ref.prefix}${ref.name}`,
                    oid: ref.target.oid,
                  })
                }
              }

              cursor = repository.refs.pageInfo.hasNextPage
                ? repository.refs.pageInfo.endCursor
                : undefined
            } while (cursor)

            if (dryRun) {
              core.info('Branches eligible for deletion (dry run)')
              if (candidates.length === 0) {
                core.info('None')
              }
              for (const candidate of candidates) {
                core.info(`Would delete ${candidate.name}`)
              }
              return
            }

            const deleted = []
            const failed = []
            for (const [index, candidate] of candidates.entries()) {
              try {
                await github.graphql(
                  `mutation DeleteCopilotBranches($input: UpdateRefsInput!) {
                    updateRefs(input: $input) {
                      clientMutationId
                    }
                  }`,
                  {
                    input: {
                      repositoryId,
                      refUpdates: [{
                        name: candidate.qualifiedName,
                        beforeOid: candidate.oid,
                        afterOid: zeroOid,
                      }],
                    },
                  },
                )
                deleted.push(candidate)
              } catch {
                failed.push(candidate)
                core.warning(
                  `Skipped ${candidate.name} because it changed or could not be deleted`,
                )
              }
              if (index < candidates.length - 1) {
                await new Promise(resolve => setTimeout(resolve, deleteDelayMs))
              }
            }

            core.info('Deleted branches')
            if (deleted.length === 0) {
              core.info('None')
            }
            for (const candidate of deleted) {
              core.info(`Deleted ${candidate.name}`)
            }
            if (failed.length > 0) {
              core.info('Branches not deleted')
              for (const candidate of failed) {
                core.info(`Not deleted ${candidate.name}`)
              }
              core.warning(
                `${failed.length} eligible branch${failed.length === 1 ? " was" : "es were"} not deleted because the ref changed or could not be deleted`,
              )
            }
