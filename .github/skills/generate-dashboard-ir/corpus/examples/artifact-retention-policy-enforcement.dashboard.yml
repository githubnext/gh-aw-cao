language-version: "0.1.0"
dashboard:
  id: artifact-retention-policy-enforcement
  title: Artifact Retention Policy Enforcement
  description: Activation, findings, accepted outcomes, and attainment for the artifact-retention-policy-enforcement workflow.
  pages:
    - id: operations
      kind: custom
      title: Operations
      views:
        - id: execution
          title: Retention review execution
          disclosure: essential
          data:
            source: runs
            filters:
              workflow: [artifact-retention-policy-enforcement]
          mark: table
          controls: interactive
          encoding:
            columns:
              - field: repository
                title: Repository
              - field: run-status
                title: Status
                display: status
              - field: run-conclusion
                title: Conclusion
                display: status
              - field: started-at
                type: temporal
                title: Started
            href:
              field: run-link
        - id: actionable-findings
          title: Repositories outside the approved retention range
          disclosure: supplemental
          data:
            source: findings
            filters:
              workflow: [artifact-retention-policy-enforcement]
              finding-status: [open]
          mark: table
          controls: interactive
          empty-message: No supported artifact-retention policy findings require action.
          encoding:
            columns:
              - field: repository
                title: Repository
              - field: finding-summary
                title: Configured retention, approved range, and variance
              - field: finding-status
                title: Decision status
                display: status
              - field: observed-at
                type: temporal
                title: Observed
            href:
              field: issue-link
        - id: accepted-evidence
          title: Accepted remediation or exception evidence
          disclosure: supplemental
          data:
            source: outcomes
            filters:
              workflow: [artifact-retention-policy-enforcement]
              outcome-state: [accepted]
          mark: table
          controls: interactive
          empty-message: No accepted remediation or exception evidence is available.
          encoding:
            columns:
              - field: repository
                title: Repository
              - field: outcome-summary
                title: Accepted settings remediation or exception
              - field: outcome-state
                title: Acceptance
                display: status
              - field: observed-at
                type: temporal
                title: Accepted at
            href:
              field: external-link
        - id: value-evidence
          title: Retention remediation attainment evidence
          disclosure: supplemental
          data:
            source: operational-values
            filters:
              workflow: [artifact-retention-policy-enforcement]
              operational-value-definition: [resolved-supported-artifact-retention-findings]
          mark: table
          empty-message: No mature operational-value evidence is available.
          encoding:
            columns:
              - field: operational-case
                title: Run opportunity
              - field: operational-value
                type: quantitative
                title: Attainment
              - field: maturity-status
                title: Maturity
              - field: evidence-cutoff
                type: temporal
                title: Evidence cutoff
              - field: diagnostics
                title: Evidence diagnostics
            href:
              field: evidence-link
