language-version: "0.1.0"
dashboard:
  id: dependency-review-bypass-remediation
  title: Dependency Review Bypass Remediation
  description: Activation, findings, accepted outcomes, and attainment for merged dependency changes that lacked required dependency review.
  pages:
    - id: operations
      kind: custom
      title: Operations
      views:
        - id: execution
          title: Dependency-review audit execution
          disclosure: essential
          data:
            source: runs
            filters:
              workflow: [dependency-review-bypass-remediation]
          mark: table
          controls: interactive
          encoding:
            columns:
              - field: run
                title: Run
              - field: run-status
                title: Status
                display: status
              - field: run-conclusion
                title: Conclusion
                display: status
              - field: started-at
                type: temporal
                title: Started
            href:
              field: run-link
        - id: actionable-findings
          title: Merged dependency changes lacking accepted review
          disclosure: supplemental
          data:
            source: findings
            filters:
              workflow: [dependency-review-bypass-remediation]
              finding-status: [open]
          mark: table
          controls: interactive
          empty-message: No supported dependency-review bypasses require action.
          encoding:
            columns:
              - field: finding-summary
                title: Pull request, dependency change, policy, and check evidence
              - field: finding-status
                title: Decision status
                display: status
              - field: observed-at
                type: temporal
                title: Observed
            href:
              field: pull-request-link
        - id: accepted-evidence
          title: Accepted follow-up review or dismissal evidence
          disclosure: supplemental
          data:
            source: outcomes
            filters:
              workflow: [dependency-review-bypass-remediation]
              outcome-state: [accepted]
          mark: table
          controls: interactive
          empty-message: No accepted remediation or dismissal evidence is available.
          encoding:
            columns:
              - field: outcome-title
                title: Dependency change
              - field: outcome-summary
                title: Accepted follow-up review or dismissal
              - field: outcome-state
                title: Acceptance
                display: status
              - field: observed-at
                type: temporal
                title: Accepted at
            href:
              field: pull-request-link
        - id: value-evidence
          title: Dependency-review remediation attainment evidence
          disclosure: supplemental
          data:
            source: operational-values
            filters:
              workflow: [dependency-review-bypass-remediation]
              operational-value-definition:
                - resolved-supported-dependency-review-bypass-findings
          mark: table
          empty-message: No mature operational-value evidence is available.
          encoding:
            columns:
              - field: operational-case
                title: Run opportunity
              - field: operational-value
                type: quantitative
                title: Attainment
              - field: maturity-status
                title: Maturity
              - field: evidence-cutoff
                type: temporal
                title: Evidence cutoff
              - field: diagnostics
                title: Evidence diagnostics
            href:
              field: evidence-link
