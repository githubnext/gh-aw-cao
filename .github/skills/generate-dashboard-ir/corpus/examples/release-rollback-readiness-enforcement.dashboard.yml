language-version: "0.1.0"
dashboard:
  id: release-rollback-readiness-enforcement
  title: Release Rollback Readiness Enforcement
  description: Execution health, actionable rollback-readiness blockers, accepted outcomes, and attainment for production release candidates.
  pages:
    - id: operations
      kind: custom
      title: Rollback readiness
      views:
        - id: execution
          title: Release-readiness review execution
          disclosure: essential
          data:
            source: runs
            filters:
              workflow: [release-rollback-readiness-enforcement]
          mark: table
          controls: interactive
          encoding:
            columns:
              - field: repository
                title: Repository
              - field: run-status
                title: Status
                display: status
              - field: run-conclusion
                title: Conclusion
                display: status
              - field: started-at
                type: temporal
                title: Approval-window review
            href:
              field: run-link
        - id: open-readiness-blockers
          title: Open rollback-readiness blockers
          disclosure: supplemental
          controls: interactive
          empty-message: No open rollback-readiness blockers.
          data:
            source: findings
            filters:
              workflow: [release-rollback-readiness-enforcement]
              finding-status: [open]
            limit: 25
          mark: table
          encoding:
            columns:
              - field: finding-summary
                type: nominal
                title: Candidate, revision, environment, failed control, and cutoff
              - field: finding-status
                title: Decision status
                display: status
              - field: observed-at
                type: temporal
                title: Observed
            href:
              field: issue-link
        - id: accepted-evidence
          title: Accepted readiness, withdrawal, or exception evidence
          disclosure: supplemental
          data:
            source: outcomes
            filters:
              workflow: [release-rollback-readiness-enforcement]
              outcome-state: [accepted]
          mark: table
          controls: interactive
          empty-message: No accepted rollback-readiness evidence is available.
          encoding:
            columns:
              - field: outcome-title
                title: Release candidate
              - field: outcome-summary
                title: Accepted readiness, safe withdrawal, or bounded exception
              - field: outcome-state
                title: Acceptance
                display: status
              - field: observed-at
                type: temporal
                title: Accepted before promotion
            href:
              field: external-link
        - id: value-evidence
          title: Rollback-readiness attainment evidence
          disclosure: supplemental
          data:
            source: operational-values
            filters:
              workflow: [release-rollback-readiness-enforcement]
              operational-value-definition: [rollback-ready-or-safely-withdrawn-release-candidates]
          mark: table
          empty-message: No mature operational-value evidence is available.
          encoding:
            columns:
              - field: operational-case
                title: Run opportunity
              - field: operational-value
                type: quantitative
                title: Attainment
              - field: maturity-status
                title: Maturity
              - field: evidence-cutoff
                type: temporal
                title: Evidence cutoff
              - field: diagnostics
                title: Evidence diagnostics
            href:
              field: evidence-link
