language-version: "0.1.0"
dashboard:
  id: codeowners-coverage-remediation
  title: CODEOWNERS Coverage Remediation
  description: Activation, actionable ownership gaps, accepted outcomes, and attainment for newly unowned sensitive paths.
  pages:
    - id: operations
      kind: custom
      title: Operations
      views:
        - id: execution
          title: CODEOWNERS review execution
          disclosure: essential
          data:
            source: runs
            filters:
              workflow: [codeowners-coverage-remediation]
          mark: table
          controls: interactive
          encoding:
            columns:
              - field: run
                title: Run
              - field: run-status
                title: Status
                display: status
              - field: run-conclusion
                title: Conclusion
                display: status
              - field: started-at
                type: temporal
                title: Started
            href:
              field: run-link
        - id: actionable-findings
          title: Sensitive-path ownership gaps
          disclosure: supplemental
          data:
            source: findings
            filters:
              workflow: [codeowners-coverage-remediation]
              finding-status: [open]
            limit: 25
          mark: table
          controls: interactive
          empty-message: No supported newly unowned sensitive paths.
          encoding:
            columns:
              - field: finding-summary
                type: nominal
                title: Path, change, CODEOWNERS resolution, and eligibility evidence
              - field: finding-status
                type: nominal
                title: Decision status
                display: status
              - field: observed-at
                type: temporal
                title: Observed
            href:
              field: pull-request-link
        - id: accepted-evidence
          title: Accepted ownership-restoration evidence
          disclosure: supplemental
          data:
            source: outcomes
            filters:
              workflow: [codeowners-coverage-remediation]
              outcome-state: [accepted]
          mark: table
          controls: interactive
          empty-message: No accepted ownership-restoration evidence is available.
          encoding:
            columns:
              - field: outcome-title
                title: Sensitive path
              - field: outcome-summary
                title: Accepted ownership restoration
              - field: outcome-state
                title: Acceptance
                display: status
              - field: observed-at
                type: temporal
                title: Accepted at
            href:
              field: pull-request-link
        - id: value-evidence
          title: Ownership remediation attainment evidence
          disclosure: supplemental
          data:
            source: operational-values
            filters:
              workflow: [codeowners-coverage-remediation]
              operational-value-definition: [accepted-sensitive-path-ownership-remediations]
          mark: table
          empty-message: No mature operational-value evidence is available.
          encoding:
            columns:
              - field: operational-case
                title: Run opportunity
              - field: operational-value
                type: quantitative
                title: Attainment
              - field: maturity-status
                title: Maturity
              - field: evidence-cutoff
                type: temporal
                title: Evidence cutoff
              - field: diagnostics
                title: Evidence diagnostics
            href:
              field: evidence-link
