language-version: "0.1.0"
dashboard:
  id: code-scanning-regression-remediation
  title: Code Scanning Regression Remediation
  description: Activation, bounded regression findings, accepted outcomes, and attainment for code-scanning-regression-remediation.
  pages:
    - id: operations
      kind: custom
      title: Operations
      views:
        - id: execution
          title: Code-scanning review execution
          disclosure: essential
          data:
            source: runs
            filters:
              workflow: [code-scanning-regression-remediation]
          mark: table
          controls: interactive
          encoding:
            columns:
              - field: run
                title: Run
              - field: run-status
                title: Status
                display: status
              - field: run-conclusion
                title: Conclusion
                display: status
              - field: started-at
                type: temporal
                title: Started
            href:
              field: run-link
        - id: actionable-findings
          title: Novel attributable code-scanning regressions
          disclosure: supplemental
          data:
            source: findings
            filters:
              workflow: [code-scanning-regression-remediation]
              finding-status: [open]
          mark: table
          controls: interactive
          empty-message: No supported novel code-scanning regressions require action.
          encoding:
            columns:
              - field: finding
                title: Alert finding
              - field: finding-summary
                title: Rule, changed location, and comparison evidence
              - field: finding-status
                title: Decision status
                display: status
              - field: observed-at
                type: temporal
                title: Observed
            href:
              field: issue-link
        - id: accepted-evidence
          title: Accepted remediation or dismissal evidence
          disclosure: supplemental
          data:
            source: outcomes
            filters:
              workflow: [code-scanning-regression-remediation]
              outcome-state: [accepted]
          mark: table
          controls: interactive
          empty-message: No accepted remediation or dismissal evidence is available.
          encoding:
            columns:
              - field: outcome-title
                title: Regression
              - field: outcome-summary
                title: Accepted remediation or dismissal evidence
              - field: outcome-state
                title: Acceptance
                display: status
              - field: observed-at
                type: temporal
                title: Accepted at
            href:
              field: external-link
        - id: value-evidence
          title: Regression remediation attainment evidence
          disclosure: supplemental
          data:
            source: operational-values
            filters:
              workflow: [code-scanning-regression-remediation]
              operational-value-definition: [resolved-supported-code-scanning-regression-findings]
          mark: table
          empty-message: No mature operational-value evidence is available.
          encoding:
            columns:
              - field: operational-case
                title: Run opportunity
              - field: operational-value
                type: quantitative
                title: Attainment
              - field: maturity-status
                title: Maturity
              - field: evidence-cutoff
                type: temporal
                title: Evidence cutoff
              - field: diagnostics
                title: Evidence diagnostics
            href:
              field: evidence-link
