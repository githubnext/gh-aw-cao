language-version: "0.1.0"
dashboard:
  id: runner-capacity-incident-remediation
  title: Runner Capacity Incident Remediation
  description: Run health, actionable capacity incidents, accepted outcomes, and attained recovery for sustained self-hosted runner queues.
  pages:
    - id: operations
      kind: custom
      title: Operations
      views:
        - id: execution
          title: Runner-capacity review execution
          disclosure: essential
          data:
            source: runs
            filters:
              workflow: [runner-capacity-incident-remediation]
          mark: table
          controls: interactive
          encoding:
            columns:
              - field: repository
                title: Control repository
              - field: run-status
                title: Status
                display: status
              - field: run-conclusion
                title: Conclusion
                display: status
              - field: started-at
                type: temporal
                title: Started
            href:
              field: run-link
        - id: actionable-incidents
          title: Actionable capacity incidents
          disclosure: supplemental
          data:
            source: findings
            filters:
              workflow: [runner-capacity-incident-remediation]
              finding-status: [open]
          mark: table
          controls: interactive
          empty-message: No supported sustained runner-capacity incidents require action.
          encoding:
            columns:
              - field: finding-summary
                title: Label set, queued jobs, threshold, observations, capacity, and exclusions
              - field: finding-severity
                title: Severity
                display: status
              - field: finding-status
                title: Decision status
                display: status
              - field: observed-at
                type: temporal
                title: Latest observation
            href:
              field: issue-link
        - id: accepted-evidence
          title: Accepted remediation, recovery, or dismissal evidence
          disclosure: supplemental
          data:
            source: outcomes
            filters:
              workflow: [runner-capacity-incident-remediation]
              outcome-state: [accepted]
          mark: table
          controls: interactive
          empty-message: No accepted capacity recovery evidence is available.
          encoding:
            columns:
              - field: outcome-title
                title: Capacity incident
              - field: outcome-summary
                title: Accepted remediation and three recovered observations
              - field: outcome-state
                title: Acceptance
                display: status
              - field: observed-at
                type: temporal
                title: Recovery observed
            href:
              field: issue-link
        - id: value-evidence
          title: Runner-capacity recovery attainment evidence
          disclosure: supplemental
          data:
            source: operational-values
            filters:
              workflow: [runner-capacity-incident-remediation]
              operational-value-definition: [recovered-supported-runner-capacity-incidents]
          mark: table
          empty-message: No mature operational-value evidence is available.
          encoding:
            columns:
              - field: operational-case
                title: Run opportunity
              - field: operational-value
                type: quantitative
                title: Attainment
              - field: maturity-status
                title: Maturity
              - field: evidence-cutoff
                type: temporal
                title: Evidence cutoff
              - field: diagnostics
                title: Evidence diagnostics
            href:
              field: evidence-link
