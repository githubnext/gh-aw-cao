language-version: "0.1.0"
dashboard:
  id: flaky-test-quarantine-review
  title: Flaky Test Quarantine Review
  description: Review activity, recurrent quarantine candidates, accepted outcomes, and operational-value attainment.
  pages:
    - id: operations
      kind: custom
      title: Operations
      views:
        - id: execution
          title: Flaky-test review execution
          disclosure: essential
          data:
            source: runs
            filters:
              workflow: [flaky-test-quarantine-review]
          mark: table
          controls: interactive
          encoding:
            columns:
              - field: run-status
                title: Status
                display: status
              - field: run-conclusion
                title: Conclusion
                display: status
              - field: started-at
                type: temporal
                title: Started
            href:
              field: run-link
        - id: quarantine-candidates
          title: Recurrent quarantine candidates
          disclosure: supplemental
          empty-message: No recurrent flaky-test quarantine candidates require review.
          data:
            source: findings
            filters:
              workflow: [flaky-test-quarantine-review]
              finding-status: [open]
            limit: 25
          mark: table
          encoding:
            columns:
              - field: finding-summary
                type: nominal
                title: Test identity, contradictory runs, recurrence, and duplicate check
              - field: finding-status
                type: nominal
                title: Decision status
              - field: observed-at
                type: temporal
                title: Observed
            href:
              field: issue-link
        - id: accepted-evidence
          title: Accepted quarantine, fix, or dismissal evidence
          disclosure: supplemental
          data:
            source: outcomes
            filters:
              workflow: [flaky-test-quarantine-review]
              outcome-state: [accepted]
          mark: table
          controls: interactive
          empty-message: No accepted flaky-test resolution evidence is available.
          encoding:
            columns:
              - field: outcome-title
                title: Test identity
              - field: outcome-summary
                title: Accepted bounded quarantine, verified fix, or dismissal
              - field: outcome-state
                title: Acceptance
                display: status
              - field: observed-at
                type: temporal
                title: Accepted at
            href:
              field: issue-link
        - id: value-evidence
          title: Flaky-test resolution attainment evidence
          disclosure: supplemental
          data:
            source: operational-values
            filters:
              workflow: [flaky-test-quarantine-review]
              operational-value-definition: [accepted-resolution-flaky-test-quarantine-candidates]
          mark: table
          empty-message: No mature operational-value evidence is available.
          encoding:
            columns:
              - field: operational-case
                title: Run opportunity
              - field: operational-value
                type: quantitative
                title: Attainment
              - field: maturity-status
                title: Maturity
              - field: evidence-cutoff
                type: temporal
                title: Evidence cutoff
              - field: diagnostics
                title: Evidence diagnostics
            href:
              field: evidence-link
