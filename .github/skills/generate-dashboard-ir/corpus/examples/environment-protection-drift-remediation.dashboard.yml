language-version: "0.1.0"
dashboard:
  id: environment-protection-drift-remediation
  title: Environment Protection Drift Remediation
  description: Run health, actionable production environment protection drift, outcomes, and attainment.
  pages:
    - id: operations
      kind: custom
      title: Operations
      views:
        - id: execution
          title: Environment-policy review execution
          disclosure: essential
          data:
            source: runs
            filters:
              workflow: [environment-protection-drift-remediation]
          mark: table
          controls: interactive
          encoding:
            columns:
              - field: repository
                title: Repository
              - field: run-status
                title: Status
                display: status
              - field: run-conclusion
                title: Conclusion
                display: status
              - field: started-at
                type: temporal
                title: Started
            href:
              field: run-link
        - id: actionable-findings
          title: Production environment protection drift
          disclosure: supplemental
          data:
            source: findings
            filters:
              workflow: [environment-protection-drift-remediation]
              finding-status: [open]
          mark: table
          controls: interactive
          empty-message: No supported production environment protection drift requires action.
          encoding:
            columns:
              - field: finding-summary
                title: Environment, setting, approved value, observed value, and exception
              - field: finding-status
                title: Decision status
                display: status
              - field: observed-at
                type: temporal
                title: Observed
            href:
              field: issue-link
        - id: accepted-evidence
          title: Accepted policy restoration or exception evidence
          disclosure: supplemental
          data:
            source: outcomes
            filters:
              workflow: [environment-protection-drift-remediation]
              outcome-state: [accepted]
          mark: table
          controls: interactive
          empty-message: No accepted restoration or exception evidence is available.
          encoding:
            columns:
              - field: outcome-title
                title: Drift finding
              - field: outcome-summary
                title: Accepted restoration or exception evidence
              - field: outcome-state
                title: Acceptance
                display: status
              - field: observed-at
                type: temporal
                title: Accepted at
            href:
              field: issue-link
        - id: value-evidence
          title: Environment-drift remediation attainment evidence
          disclosure: supplemental
          data:
            source: operational-values
            filters:
              workflow: [environment-protection-drift-remediation]
              operational-value-definition: [resolved-supported-environment-protection-drift-findings]
          mark: table
          empty-message: No mature operational-value evidence is available.
          encoding:
            columns:
              - field: operational-case
                title: Run opportunity
              - field: operational-value
                type: quantitative
                title: Attainment
              - field: maturity-status
                title: Maturity
              - field: evidence-cutoff
                type: temporal
                title: Evidence cutoff
              - field: diagnostics
                title: Evidence diagnostics
            href:
              field: evidence-link
