language-version: "0.1.0"
dashboard:
  id: secret-scanning-alert-remediation
  title: Secret Scanning Alert Remediation
  description: Run activity, redacted remediation queue, accepted outcomes, and attainment for novel secret-scanning alerts.
  pages:
    - id: operations
      kind: custom
      title: Operations
      views:
        - id: execution
          title: Secret-remediation review execution
          disclosure: essential
          data:
            source: runs
            filters:
              workflow: [secret-scanning-alert-remediation]
          mark: table
          controls: interactive
          encoding:
            columns:
              - field: repository
                title: Repository
              - field: run-status
                title: Status
                display: status
              - field: run-conclusion
                title: Conclusion
                display: status
              - field: started-at
                type: temporal
                title: Started
            href:
              field: run-link
        - id: open-remediation-queue
          title: Open remediation queue
          disclosure: supplemental
          controls: interactive
          empty-message: No supported novel secret-scanning alerts require remediation.
          data:
            source: findings
            filters:
              workflow: [secret-scanning-alert-remediation]
              finding-status: [open]
          mark: table
          encoding:
            columns:
              - field: finding
                title: Alert number
              - field: finding-kind
                title: Secret type
              - field: finding-severity
                title: Severity
                display: status
              - field: finding-summary
                title: Non-sensitive repository location, required invalidation, and removal evidence
              - field: observed-at
                type: temporal
                title: Detected at
            href:
              field: issue-link
        - id: accepted-evidence
          title: Accepted complete-remediation or false-positive evidence
          disclosure: supplemental
          data:
            source: outcomes
            filters:
              workflow: [secret-scanning-alert-remediation]
              outcome-state: [accepted]
          mark: table
          controls: interactive
          empty-message: No accepted complete-remediation evidence is available.
          encoding:
            columns:
              - field: outcome-title
                title: Alert
              - field: outcome-summary
                title: Redacted revocation, removal, or false-positive evidence
              - field: outcome-state
                title: Acceptance
                display: status
              - field: observed-at
                type: temporal
                title: Accepted at
            href:
              field: issue-link
        - id: value-evidence
          title: Verified secret-remediation attainment evidence
          disclosure: supplemental
          data:
            source: operational-values
            filters:
              workflow: [secret-scanning-alert-remediation]
              operational-value-definition: [verified-remediated-novel-secret-alerts]
          mark: table
          empty-message: No mature operational-value evidence is available.
          encoding:
            columns:
              - field: operational-case
                title: Run opportunity
              - field: operational-value
                type: quantitative
                title: Attainment
              - field: maturity-status
                title: Maturity
              - field: evidence-cutoff
                type: temporal
                title: Evidence cutoff
              - field: diagnostics
                title: Redacted evidence diagnostics
            href:
              field: evidence-link
