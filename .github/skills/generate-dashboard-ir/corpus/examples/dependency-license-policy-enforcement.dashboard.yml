language-version: "0.1.0"
dashboard:
  id: dependency-license-policy-enforcement
  title: Dependency License Policy Enforcement
  description: Run state, actionable license findings, accepted outcomes, and attainment for the dependency-license-policy-enforcement workflow.
  pages:
    - id: operations
      kind: custom
      title: Operations
      views:
        - id: execution
          title: Dependency-license review execution
          disclosure: essential
          data:
            source: runs
            filters:
              workflow: [dependency-license-policy-enforcement]
          mark: table
          controls: interactive
          encoding:
            columns:
              - field: repository
                title: Repository
              - field: run-status
                title: Status
                display: status
              - field: run-conclusion
                title: Conclusion
                display: status
              - field: started-at
                type: temporal
                title: Started
            href:
              field: run-link
        - id: actionable-findings
          title: Actionable license findings
          disclosure: supplemental
          data:
            source: findings
            filters:
              workflow: [dependency-license-policy-enforcement]
              finding-status: [open]
          mark: table
          controls: interactive
          empty-message: No open dependency-license findings in the selected context.
          encoding:
            columns:
              - field: finding-summary
                title: Dependency, SPDX evidence, policy rule, and manifest
              - field: finding-status
                title: Decision status
                display: status
              - field: observed-at
                type: temporal
                title: Observed
            href:
              field: issue-link
        - id: accepted-evidence
          title: Accepted license remediation or exception evidence
          disclosure: supplemental
          data:
            source: outcomes
            filters:
              workflow: [dependency-license-policy-enforcement]
              outcome-state: [accepted]
          mark: table
          controls: interactive
          empty-message: No accepted license remediation or exception evidence is available.
          encoding:
            columns:
              - field: outcome-title
                title: Dependency
              - field: outcome-summary
                title: Accepted remediation or exception
              - field: outcome-state
                title: Acceptance
                display: status
              - field: observed-at
                type: temporal
                title: Accepted at
            href:
              field: issue-link
        - id: value-evidence
          title: License-policy remediation attainment evidence
          disclosure: supplemental
          data:
            source: operational-values
            filters:
              workflow: [dependency-license-policy-enforcement]
              operational-value-definition: [resolved-supported-license-policy-findings]
          mark: table
          empty-message: No mature operational-value evidence is available.
          encoding:
            columns:
              - field: operational-case
                title: Run opportunity
              - field: operational-value
                type: quantitative
                title: Attainment
              - field: maturity-status
                title: Maturity
              - field: evidence-cutoff
                type: temporal
                title: Evidence cutoff
              - field: diagnostics
                title: Evidence diagnostics
            href:
              field: evidence-link
