name: Select CI scope
description: Evaluate complete PR merge changes without workflow-level path skips.
inputs:
  scope:
    description: contracts, dashboard, or server
    required: true
outputs:
  applicable:
    description: Whether the CI producers must run
    value: ${{ steps.scope.outputs.applicable }}
runs:
  using: composite
  steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        fetch-depth: 2
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 24
    - id: scope
      shell: bash
      env:
        CI_SCOPE: ${{ inputs.scope }}
      run: node scripts/ci-release-gates.mjs scope "$CI_SCOPE"
