name: Set up gh-aw
description: Install the gh-aw compiler version declared by the CAO project

runs:
  using: composite
  steps:
    - name: Resolve gh-aw compiler version
      id: compiler
      shell: bash
      run: |
        version="$(node .github/cao/src/control.mjs compiler-version .github/workflows/cao.json)"
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - name: Install gh-aw
      uses: github/gh-aw-actions/setup-cli@74929b772fd7d9dddf663dc49e01f470d8458310 # v0.89.9 tag resolves to this commit
      with:
        version: ${{ steps.compiler.outputs.version }}
