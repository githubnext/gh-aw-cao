name: Set up gh-aw
description: Install the gh-aw compiler version declared by the CAO project

runs:
  using: composite
  steps:
    - name: Resolve gh-aw compiler version
      id: compiler
      shell: bash
      run: |
        version="$(node .github/workflows/shared/control.mjs compiler-version .github/workflows/cao.json)"
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - name: Install gh-aw
      uses: github/gh-aw-actions/setup-cli@dc455073a216c68be9fe9a292c4371243c036d25 # v0.92.4
      with:
        version: ${{ steps.compiler.outputs.version }}
