name: Set up CAO runtime
description: Verify that CAO runtime files use their canonical catalog source paths

inputs:
  bundle:
    description: CAO runtime bundle to verify
    required: true

runs:
  using: composite
  steps:
    - name: Verify canonical CAO runtime layout
      shell: bash
      env:
        CAO_RUNTIME_BUNDLE: ${{ inputs.bundle }}
      run: node "$GITHUB_WORKSPACE/.github/workflows/shared/materialize-cao.mjs" verify "$CAO_RUNTIME_BUNDLE"
