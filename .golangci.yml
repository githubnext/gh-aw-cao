version: "2"

run:
  timeout: 5m
  tests: true
  build-tags:
    - authtests
  relative-path-mode: gomod

linters:
  default: standard
  exclusions:
    generated: strict

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/githubnext/gh-aw-cao
  exclusions:
    generated: strict
