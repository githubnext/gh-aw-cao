name: Central Agentic Ops
description: Central agentic workflow control plane for reusable packages at the organization level
min-version: v0.89.8
experimental: true
includes:
  - .github/workflows/aw.json
  - activity/aw.yml
  - aw-doctor/aw.yml
  - cao-evolution/aw.yml
  - dashboard/aw.yml
  - dependabot/aw.yml
  - optimization/aw.yml
resources:
  - source: .github/cao/cao.schema.json
    destination: .github/aw/cao/cao.schema.json
  - source: .github/cao/setup-github-apps.mjs
    destination: .github/aw/cao/setup-github-apps.mjs
  - source: .github/cao/src/control.mjs
    destination: .github/aw/cao/src/control.mjs
  - source: .github/cao/src/policy.mjs
    destination: .github/aw/cao/src/policy.mjs
  - source: .github/cao/upgrade.sh
    destination: .github/aw/cao/upgrade.sh
  - source: AGENTS.md
    destination: .github/aw/default-AGENTS.md
  - source: .github/aw/instructions.md
    destination: .github/aw/instructions.md
