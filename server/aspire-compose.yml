name: cao-local-aspire

services:
  aspire:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:18888
      DOTNET_DASHBOARD_OTLP_HTTP_ENDPOINT_URL: http://0.0.0.0:18890
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "127.0.0.1:18888:18888"
      - "127.0.0.1:18890:18890"
    restart: unless-stopped
