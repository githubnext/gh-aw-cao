services:
  dashboard:
    build:
      context: ../..
      dockerfile: server/Dockerfile
      args:
        CAO_PROFILE: cao.coolify.json
        VERSION: ${SOURCE_COMMIT:-dev}
        REVISION: ${SOURCE_COMMIT:-unknown}
    command:
      - serve-hosted
      - --listen
      - 0.0.0.0:8080
      - --mcp-enabled
      - --site
      - /app/site
      - --dashboard-queries
      - /app/dashboard.json
      - --database-queries
      - /app/queries/database.json
    environment:
      REDIS_URL: ${REDIS_URL:-}
      REDIS_NAMESPACE: ${REDIS_NAMESPACE:-coolify-dashboard}
      CAO_POLICY_PATH: /app/.github/workflows/cao.coolify.json
      CAO_MCP_REPOSITORY: githubnext/gh-aw-cao
      CAO_MCP_REPOSITORY_ID: "1302952722"
      CAO_ALLOWED_HOSTS: ${CAO_ALLOWED_HOSTS:?Configure the public dashboard host}
      CAO_TRUSTED_PROXY_CIDRS: ${CAO_TRUSTED_PROXY_CIDRS:?Configure the exact Coolify proxy network CIDR}
      CAO_GITHUB_CLIENT_ID: ${CAO_GITHUB_CLIENT_ID:?Configure the GitHub OAuth client ID}
      CAO_GITHUB_CLIENT_SECRET: ${CAO_GITHUB_CLIENT_SECRET:?Configure the GitHub OAuth client secret}
      CAO_GITHUB_REDIRECT_URL: ${CAO_GITHUB_REDIRECT_URL:?Configure the OAuth callback URL}
      CAO_SESSION_SECRET: ${CAO_SESSION_SECRET:?Configure the session secret}
      CAO_SESSION_SECRET_PREVIOUS: ${CAO_SESSION_SECRET_PREVIOUS:-}
      CAO_GITHUB_ALLOWED_ORGS: ${CAO_GITHUB_ALLOWED_ORGS:-}
      CAO_GITHUB_ALLOWED_TEAMS: ${CAO_GITHUB_ALLOWED_TEAMS:-}
      CAO_GITHUB_ADMIN_USERS: ${CAO_GITHUB_ADMIN_USERS:?Configure at least one administrator}
      CAO_GITHUB_WEBHOOK_SECRET: ${CAO_GITHUB_WEBHOOK_SECRET:?Configure the webhook secret}
      CAO_SOURCE_DIRECTORY: /app/source
      CAO_BUILD_VERSION: ${SOURCE_COMMIT:-unknown}
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          host="$${CAO_ALLOWED_HOSTS%%,*}";
          test -n "$${host}" &&
          wget -q -T 4 -O /dev/null
          --header="X-Forwarded-Host: $${host}"
          --header="X-Forwarded-Proto: https"
          http://127.0.0.1:8080/api/readiness
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    volumes:
      - cao-dashboard-artifact:/app/source:ro
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  cao-dashboard-artifact:
    external: true
    name: ${CAO_ARTIFACT_VOLUME:?Configure the pre-populated Coolify artifact volume}
