x-collector-build: &collector-build
  context: ../..
  dockerfile: server/Dockerfile
  target: collector-runtime
  args:
    CAO_PROFILE: cao.coolify.json
    VERSION: ${SOURCE_COMMIT:-dev}
    REVISION: ${SOURCE_COMMIT:-unknown}
    GH_AW_VERSION: v0.91.0

x-collector-environment: &collector-environment
  CAO_POSTGRES_URL: ${CAO_POSTGRES_URL:?Configure the PostgreSQL connection URL}
  REDIS_URL: ${REDIS_URL:-}
  REDIS_NAMESPACE: ${REDIS_NAMESPACE:-coolify-dashboard}
  CAO_REDIS_MAX_BYTES: ${CAO_REDIS_MAX_BYTES:-200000000}
  CAO_POLICY_PATH: /app/.github/workflows/cao.coolify.json
  CAO_COLLECT_APP_ID: ${CAO_COLLECT_APP_ID:?Configure the numeric GitHub App ID}
  CAO_COLLECT_PRIVATE_KEY_BASE64: ${CAO_COLLECT_PRIVATE_KEY_BASE64_ROTATED:?Configure the base64-encoded GitHub App private key as a Coolify secret}
  CAO_COLLECT_LAKE_DIRECTORY: /app/evidence
  CAO_COLLECT_CATALOG_ROOT: /app/catalog
  CAO_COLLECT_STATIC_INVENTORY: /app/catalog/control-plane-inventory.json
  CAO_COLLECT_CONTROL_REPOSITORY: ${CAO_COLLECT_CONTROL_REPOSITORY:?Configure the control repository as OWNER/REPO}
  CAO_COLLECT_WINDOW_DAYS: ${CAO_COLLECT_WINDOW_DAYS:-30}
  CAO_COLLECT_RUN_LIMIT: ${CAO_COLLECT_RUN_LIMIT:-10000}
  CAO_COLLECT_MAX_STORAGE_MB: ${CAO_COLLECT_MAX_STORAGE_MB:-1200}
  CAO_COLLECT_REQUEST_TIMEOUT_MINUTES: ${CAO_COLLECT_REQUEST_TIMEOUT_MINUTES:-10}
  CAO_COLLECT_RATE_LIMIT_FLOOR: ${CAO_COLLECT_RATE_LIMIT_FLOOR:-2000}
  CAO_COLLECT_QUEUE_MAX_LENGTH: ${CAO_COLLECT_QUEUE_MAX_LENGTH:-200000}
  CAO_COLLECT_INVENTORY_LIMIT: ${CAO_COLLECT_INVENTORY_LIMIT:?Set the maximum number of repositories installed for the collection App}
  CAO_COLLECT_PROJECTION_INTERVAL: ${CAO_COLLECT_PROJECTION_INTERVAL:-5m}
  CAO_COLLECT_TIMEOUT: ${CAO_COLLECT_TIMEOUT:-30m}
  CAO_BUILD_VERSION: ${SOURCE_COMMIT:-unknown}
  DEBUG: ${DEBUG:-cao:server*,cao:collect*,cao:query,cao:ingest,cao:telemetry}
  CAO_OTEL_LOGS_ENABLED: ${CAO_OTEL_LOGS_ENABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS_ROTATED:-}
  OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${OTEL_EXPORTER_OTLP_TRACES_HEADERS_ROTATED:-}
  OTEL_EXPORTER_OTLP_METRICS_HEADERS: ${OTEL_EXPORTER_OTLP_METRICS_HEADERS_ROTATED:-}
  OTEL_EXPORTER_OTLP_LOGS_HEADERS: ${OTEL_EXPORTER_OTLP_LOGS_HEADERS_ROTATED:-}
  OTEL_SERVICE_NAME: ${CAO_COLLECT_OTEL_SERVICE_NAME:-cao-collector}
  OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment.name=production}
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}

services:
  dashboard:
    build:
      context: ../..
      dockerfile: server/Dockerfile
      target: dashboard-runtime
      args:
        CAO_PROFILE: cao.coolify.json
        VERSION: ${SOURCE_COMMIT:-dev}
        REVISION: ${SOURCE_COMMIT:-unknown}
    command:
      - serve-hosted
      - --listen
      - 0.0.0.0:8080
      - --site
      - /app/site
      - --dashboard-queries
      - /app/agent/queries.json
      - --database-queries
      - /app/queries/database.json
      - --mcp-enabled
      - --agent-catalog
      - /app/agent/catalog.json
      - --mcp-contract
      - /app/agent/mcp-contract.json
    environment:
      CAO_POSTGRES_URL: ${CAO_POSTGRES_URL:?Configure the PostgreSQL connection URL}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_NAMESPACE: ${REDIS_NAMESPACE:-coolify-dashboard}
      CAO_REDIS_MAX_BYTES: ${CAO_REDIS_MAX_BYTES:-200000000}
      CAO_POLICY_PATH: /app/.github/workflows/cao.coolify.json
      CAO_ALLOWED_HOSTS: ${CAO_ALLOWED_HOSTS:?Configure the public dashboard host}
      CAO_TRUSTED_PROXY_CIDRS: ${CAO_TRUSTED_PROXY_CIDRS:?Configure the exact Coolify proxy network CIDR}
      CAO_GITHUB_CLIENT_ID: ${CAO_GITHUB_CLIENT_ID:?Configure the GitHub OAuth client ID}
      CAO_GITHUB_CLIENT_SECRET: ${CAO_GITHUB_CLIENT_SECRET_ROTATED:-}
      CAO_GITHUB_REDIRECT_URL: ${CAO_GITHUB_REDIRECT_URL:?Configure the OAuth callback URL}
      CAO_SESSION_SECRET: ${CAO_SESSION_SECRET_ROTATED:-}
      CAO_SESSION_SECRET_PREVIOUS: ${CAO_SESSION_SECRET_PREVIOUS:-}
      CAO_GITHUB_ALLOWED_ORGS: ${CAO_GITHUB_ALLOWED_ORGS:-}
      CAO_GITHUB_ALLOWED_TEAMS: ${CAO_GITHUB_ALLOWED_TEAMS:-}
      CAO_GITHUB_ADMIN_USERS: ${CAO_GITHUB_ADMIN_USERS:?Configure at least one administrator}
      CAO_GITHUB_WEBHOOK_SECRET: ${CAO_GITHUB_WEBHOOK_SECRET_ROTATED:-}
      CAO_MCP_ACTIONS_REPOSITORY: ${CAO_MCP_ACTIONS_REPOSITORY:?Configure the GitHub repository selected as this Coolify resource's source}
      CAO_COLLECT_APP_ID: ${CAO_COLLECT_APP_ID:?Configure the numeric GitHub App ID}
      CAO_COLLECT_ADMIT_ONLY: "true"
      CAO_COLLECT_QUEUE_MAX_LENGTH: ${CAO_COLLECT_QUEUE_MAX_LENGTH:-200000}
      CAO_BUILD_VERSION: ${SOURCE_COMMIT:-unknown}
      DEBUG: ${DEBUG:-cao:server*,cao:collect*,cao:query,cao:ingest,cao:telemetry}
      CAO_SERVER_LOGS_ENABLED: ${CAO_SERVER_LOGS_ENABLED:-true}
      CAO_OTEL_LOGS_ENABLED: ${CAO_OTEL_LOGS_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS_ROTATED:-}
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${OTEL_EXPORTER_OTLP_TRACES_HEADERS_ROTATED:-}
      OTEL_EXPORTER_OTLP_METRICS_HEADERS: ${OTEL_EXPORTER_OTLP_METRICS_HEADERS_ROTATED:-}
      OTEL_EXPORTER_OTLP_LOGS_HEADERS: ${OTEL_EXPORTER_OTLP_LOGS_HEADERS_ROTATED:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-cao-dashboard}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment.name=production}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          host="$${CAO_ALLOWED_HOSTS%%,*}";
          test -n "$${host}" &&
          wget -q -T 4 -O /dev/null
          --header="X-Forwarded-Host: $${host}"
          --header="X-Forwarded-Proto: https"
          http://127.0.0.1:8080/api/readiness
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    volumes:
      - cao-dashboard-artifact:/app/source:ro
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  collector:
    build: *collector-build
    command:
      - collect
      - --database-queries
      - /app/queries/database.json
    environment: *collector-environment
    volumes:
      - cao-collector-evidence:/app/evidence
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  backfill:
    build: *collector-build
    command:
      - backfill
      - --database-queries
      - /app/queries/database.json
    environment: *collector-environment
    volumes:
      - cao-collector-evidence:/app/evidence
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

volumes:
  cao-dashboard-artifact:
    external: true
    name: ${CAO_ARTIFACT_VOLUME:?Configure the pre-populated Coolify artifact volume}
  cao-collector-evidence:
    name: ${CAO_COLLECT_EVIDENCE_VOLUME:-cao-collector-evidence}
