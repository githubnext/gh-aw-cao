services:
  redis:
    image: redis:8.2-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_locks_per_transaction=256"]
    environment:
      POSTGRES_DB: cao_dashboard
      POSTGRES_USER: cao_dashboard
      POSTGRES_PASSWORD: ${CAO_LOCAL_POSTGRES_PASSWORD:-}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data-v29:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cao_dashboard -d cao_dashboard"]
      interval: 2s
      timeout: 2s
      retries: 20
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data-v29:
