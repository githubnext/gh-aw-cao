name: CAO Activity
description: Maintain a shared, bounded snapshot of GitHub Agentic Workflow activity.
min-version: v0.89.10
experimental: true
includes:
  - .github/workflows/activity.yml
  - .github/workflows/cao-maintenance.yml
resources:
  - source: cao.mjs
    destination: .github/aw/activity/cao.mjs
  - source: actions-context.mjs
    destination: .github/aw/activity/actions-context.mjs
  - source: actions-log.mjs
    destination: .github/aw/activity/actions-log.mjs
  - source: control-settings.mjs
    destination: .github/aw/activity/control-settings.mjs
  - source: gh-aw-logs.mjs
    destination: .github/aw/activity/gh-aw-logs.mjs
  - source: inventory.mjs
    destination: .github/aw/activity/inventory.mjs
  - source: inventory-sources.mjs
    destination: .github/aw/activity/inventory-sources.mjs
