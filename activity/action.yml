name: CAO Activity Local Runner
description: Run an activity entrypoint with GitHub Actions Toolkit APIs.
inputs:
  script:
    description: Activity entrypoint path relative to the repository root.
    required: true
  arguments:
    description: JSON array of arguments passed to the entrypoint.
    required: false
    default: "[]"
  github-token:
    description: Optional GitHub token for the local Octokit client.
    required: false
runs:
  using: node24
  main: local-runner.mjs
