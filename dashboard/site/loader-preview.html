<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agentic loader preview</title>
  </head>
  <body>
    <main id="preview" class="factory-floor"></main>
    <script type="module">
      import { renderAgenticLoader } from './src/components/agentic-loader.js?v=40';
      import { h } from './src/dom.js?v=40';
      import { octicon } from './src/octicons.js?v=40';
      import { getPrimerStyles } from './src/styles.js?v=40';

      document.head.append(Object.assign(document.createElement('style'), { textContent: getPrimerStyles() }));
      const stations = [
        ['repo', 'Repositories registered'],
        ['play', 'Successful runs'],
        ['workflow', 'Successful dispatches'],
        ['trophy', 'Value gains']
      ];
      document.querySelector('#preview').append(
        h(
          'ul',
          { className: 'factory-stations', 'aria-hidden': 'true' },
          ...stations.map(([icon, label]) => h(
            'li',
            { className: 'factory-station factory-station-pending' },
            h('span', { className: 'factory-station-icon' }, octicon(icon)),
            h('span', {}, label),
            h('strong', {}),
            h('small', {}, 'Loading')
          ))
        ),
        renderAgenticLoader({ className: 'agentic-loader-factory-overlay' })
      );
    </script>
  </body>
</html>
