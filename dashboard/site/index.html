<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <!-- Paint the system-theme canvas before the JavaScript-owned stylesheet loads. -->
    <style>
      :root { color-scheme: dark; --canvas: #0d1117; --fg: #f0f6fc; }
      @media (prefers-color-scheme: light) {
        :root { color-scheme: light; --canvas: #ffffff; --fg: #1f2328; }
      }
      html, body { background: var(--canvas); color: var(--fg); }
      body { margin: 0; }
    </style>
    <link rel="icon" href="./favicon.svg">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <link rel="manifest" href="./manifest.webmanifest" crossorigin="use-credentials">
    <link rel="alternate" type="text/plain" href="./llms.txt" title="CAO dashboard agent guide">
    <meta name="application-name" content="Central Agentic Ops Dashboard">
    <meta name="dashboard-version" content="development">
    <meta name="cao-version" content="">
    <meta name="gh-aw-version" content="">
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Agentic Ops">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Central Agentic Ops Dashboard</title>
    <meta
      name="description"
      content="Monitor and operate GitHub Agentic Workflows from a unified dashboard."
    >
  </head>
  <body>
    <noscript>
      <p role="alert">JavaScript is required to use the Central Agentic Ops Dashboard. Enable JavaScript in your browser and reload this page.</p>
      <p><a href="./llms.txt">Agent access guide</a></p>
    </noscript>
    <div id="root"></div>
    <!-- Answer before main.js loads so installed apps can bootstrap from the worker's offline cache. -->
    <script>
      navigator.serviceWorker?.addEventListener('message', (event) => {
        if (event.data?.type !== 'REQUEST_DASHBOARD_APP_MODE') return;
        event.ports[0]?.postMessage({
          type: 'DASHBOARD_APP_MODE',
          appMode: matchMedia('(display-mode: standalone), (display-mode: minimal-ui)').matches
            || navigator.standalone === true
        });
      });
    </script>
    <!-- Keep recovery inline in the cached HTML: a broken service worker or dashboard module may prevent external scripts from loading.
         While online, open this dashboard with ?force-update=1 to check the worker script, unregister this site's worker,
         clear cached app files (not downloaded data), and reload with ?online=1. Normal startup loads main.js only otherwise. -->
    <script>
      if (new URL(location.href).searchParams.get('force-update') === '1') {
        (async () => {
          if (!navigator.onLine) throw new Error('A network connection is required to update the app.');
          const scope = new URL('./', document.baseURI).href;
          const workerUrl = new URL('./service-worker.js', scope);
          workerUrl.searchParams.set('recovery', String(Date.now()));
          const response = await fetch(workerUrl, { cache: 'no-store', credentials: 'same-origin' });
          if (!response.ok) throw new Error('The updated app is not available yet.');
          const registration = await navigator.serviceWorker?.getRegistration(scope);
          if (registration?.scope === scope) await registration.unregister();
          const keys = await caches.keys();
          await Promise.all(keys.filter((key) => key.startsWith('central-agentic-ops-dashboard-app-'))
            .map((key) => caches.delete(key)));
          const url = new URL(location.href);
          url.searchParams.delete('force-update');
          url.searchParams.set('online', '1');
          url.searchParams.set('recovered', String(Date.now()));
          location.replace(url.href);
        })().catch((error) => {
          const root = document.getElementById('root');
          root.setAttribute('role', 'alert');
          root.textContent = error.message + ' Remove ?force-update=1 to return to the cached app.';
        });
      } else {
        const script = document.createElement('script');
        script.type = 'module';
        script.src = './src/main.js';
        document.body.append(script);
      }
    </script>
  </body>
</html>
