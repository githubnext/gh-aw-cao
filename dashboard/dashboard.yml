name: CAO Dashboard

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: central-agentic-ops-dashboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      run-id: ${{ steps.dispatch.outputs.run-id }}
      skipped: ${{ steps.dispatch.outputs.skipped }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout trusted dashboard source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Dispatch dashboard build
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_WORKFLOW: dashboard-build.yml
          DISPATCH_REF: ${{ github.ref_name }}
          DISPATCH_RUN_NAME: CAO Dashboard Build / dashboard-${{ github.run_id }}-${{ github.run_attempt }}
          DISPATCH_INPUTS: '{"site-path":".","request-id":"dashboard-${{ github.run_id }}-${{ github.run_attempt }}"}'
        run: node .github/aw/dashboard/dispatch-workflow.mjs

  pages:
    needs: build
    if: needs.build.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false

      - name: Download dashboard artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: central-agentic-ops-dashboard
          path: _site
          github-token: ${{ github.token }}
          run-id: ${{ needs.build.outputs.run-id }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1