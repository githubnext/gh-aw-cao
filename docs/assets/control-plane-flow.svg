<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title description">
  <title id="title">Central Agentic Ops execution topology</title>
  <desc id="description">A canonical aw.yml campaign is installed into one or more scoped control repositories. Each installation records campaign provenance and dispatches directly to enrolled target repositories within its allowlist and credential scope. Deployment profiles change runtime ownership and reach, not this execution path. Each live target and campaign pair has one assigned control repository.</desc>

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#30363d" stroke-width="1" opacity="0.35"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#010409" flood-opacity="0.55"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#3fb950"/>
    </marker>
  </defs>

  <style>
    .campaign-flow { stroke-dasharray: 8 12; animation: campaign-flow 4s linear infinite; }
    .dispatch-flow { stroke-dasharray: 6 14; animation: dispatch-flow 3.2s linear infinite; }
    .manifest { opacity: 0.72; animation: manifest-ready 4.8s ease-in-out infinite; }
    .manifest-b { animation-delay: 0.8s; }
    .target-dot { animation: target-pulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .target-dot-b { animation-delay: 0.6s; }
    @keyframes campaign-flow { to { stroke-dashoffset: -36; } }
    @keyframes dispatch-flow { to { stroke-dashoffset: -36; } }
    @keyframes manifest-ready { 0%, 20%, 100% { opacity: 0.72; } 45%, 75% { opacity: 1; } }
    @keyframes target-pulse { 0%, 100% { transform: scale(0.92); opacity: 0.72; } 50% { transform: scale(1.08); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .campaign-flow, .dispatch-flow, .manifest, .target-dot { animation: none; }
      .manifest, .target-dot { opacity: 1; }
    }
  </style>

  <rect x="8" y="8" width="944" height="454" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="8" y="8" width="944" height="454" rx="8" fill="url(#grid)"/>

  <text x="56" y="50" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">CANONICAL SOURCE</text>
  <text x="356" y="50" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">SCOPED CONTROL</text>
  <text x="756" y="50" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">ENROLLED TARGETS</text>

  <g filter="url(#shadow)">
    <path d="M62 104H218L258 144V278H62Z" fill="#161b22" stroke="#58a6ff" stroke-width="3"/>
    <path d="M218 104V144H258" fill="#21262d" stroke="#58a6ff" stroke-width="3"/>
    <circle cx="92" cy="143" r="8" fill="#3fb950"/>
    <text x="112" y="150" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="800">aw.yml</text>
    <text x="92" y="190" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">name</text>
    <text x="92" y="218" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">min-version</text>
    <text x="92" y="246" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">includes</text>
  </g>
  <text x="160" y="314" fill="#58a6ff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">SHARED PINNED CAMPAIGN</text>

  <path class="campaign-flow" d="M276 188H320V126H352" fill="none" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path class="campaign-flow" d="M276 188H320V294H352" fill="none" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="296" y="168" fill="#79c0ff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700">INSTALL</text>

  <g filter="url(#shadow)">
    <rect x="354" y="78" width="314" height="108" rx="8" fill="#161b22" stroke="#d29922" stroke-width="2"/>
    <circle cx="382" cy="108" r="7" fill="#d29922"/>
    <text x="400" y="114" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="800">CONTROL REPOSITORY</text>
    <g class="manifest">
      <path d="M382 133H400L410 143V166H382Z" fill="#21262d" stroke="#8b949e"/>
      <path d="M400 133V143H410" fill="none" stroke="#8b949e"/>
      <text x="422" y="154" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">.github/aw/campaigns/*</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="354" y="246" width="314" height="108" rx="8" fill="#161b22" stroke="#39c5cf" stroke-width="2"/>
    <circle cx="382" cy="276" r="7" fill="#39c5cf"/>
    <text x="400" y="282" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="800">ADDITIONAL CONTROL</text>
    <text x="642" y="282" fill="#8b949e" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">OPTIONAL</text>
    <g class="manifest manifest-b">
      <path d="M382 301H400L410 311V334H382Z" fill="#21262d" stroke="#8b949e"/>
      <path d="M400 301V311H410" fill="none" stroke="#8b949e"/>
      <text x="422" y="322" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">independent runtime</text>
    </g>
  </g>

  <path class="dispatch-flow" d="M670 132H748" fill="none" stroke="#3fb950" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path class="dispatch-flow" d="M670 300H748" fill="none" stroke="#3fb950" stroke-width="3" marker-end="url(#arrow-green)"/>

  <g filter="url(#shadow)">
    <rect x="758" y="88" width="150" height="88" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <circle class="target-dot" cx="786" cy="118" r="8" fill="#3fb950"/>
    <text x="806" y="124" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="800">TARGET SET</text>
    <text x="786" y="152" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">direct dispatch</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="758" y="256" width="150" height="88" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <circle class="target-dot target-dot-b" cx="786" cy="286" r="8" fill="#3fb950"/>
    <text x="806" y="292" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="800">TARGET SET</text>
    <text x="786" y="320" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">direct dispatch</text>
  </g>

  <text x="480" y="390" fill="#79c0ff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">SAME EXECUTION — OWNERSHIP AND REACH VARY BY PROFILE</text>
  <line x1="56" y1="412" x2="904" y2="412" stroke="#30363d"/>
  <text x="480" y="438" fill="#c9d1d9" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">pinned campaign → scoped runtime → enrolled target → one live authority</text>
</svg>
