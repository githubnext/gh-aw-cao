<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">How Central Agentic Ops executes work</title>
  <desc id="description">The private central control repository contains rollout policy and operation campaigns. Orchestrators and workers run inside that central boundary. A central worker inspects one remote target at a time and emits only declared safe outputs. Control-plane workflows are not installed in or run from target repositories. Results remain correlated with the originating central run.</desc>
  <defs>
    <style>
      :root{--bg:#fff;--surface:#f6f8fa;--surface-strong:#fff;--text:#1f2328;--muted:#59636e;--border:#d0d7de;--accent:#8250df;--success:#1f883d;--danger:#cf222e;--attention:#9a6700}
      @media(prefers-color-scheme:dark){:root{--bg:#0d1117;--surface:#161b22;--surface-strong:#21262d;--text:#f0f6fc;--muted:#8b949e;--border:#30363d;--accent:#a371f7;--success:#3fb950;--danger:#f85149;--attention:#d29922}}
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:0}.eyebrow{fill:var(--muted);font-size:13px;font-weight:700}.heading{fill:var(--text);font-size:24px;font-weight:700}.copy{fill:var(--muted);font-size:14px}.label{fill:var(--text);font-size:15px;font-weight:650}.small{fill:var(--muted);font-size:12px}.surface{fill:var(--surface);stroke:var(--border)}.node{fill:var(--surface-strong);stroke:var(--border)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="var(--muted)"/></marker>
  </defs>

  <rect width="1200" height="560" rx="8" fill="var(--bg)"/>

  <rect x="24" y="62" width="520" height="414" rx="12" fill="var(--accent)" fill-opacity=".05" stroke="var(--accent)" stroke-width="2"/>
  <text x="46" y="42" class="eyebrow">CENTRAL EXECUTION BOUNDARY · PRIVATE CONTROL REPOSITORY</text>

  <rect x="50" y="96" width="220" height="338" rx="8" class="surface"/>
  <circle cx="78" cy="126" r="7" fill="var(--accent)"/>
  <text x="96" y="132" class="eyebrow">GOVERN</text>
  <text x="74" y="176" class="heading">Control plane</text>
  <text x="74" y="205" class="copy">Policy, limits, credentials,</text>
  <text x="74" y="226" class="copy">and rollout mode stay here.</text>
  <text x="74" y="273" class="eyebrow">ROLLOUT MODE</text>
  <rect x="74" y="292" width="83" height="32" rx="5" fill="var(--accent)" fill-opacity=".12" stroke="var(--accent)"/><text x="115.5" y="313" text-anchor="middle" class="small">Review</text>
  <rect x="161" y="292" width="83" height="32" rx="5" class="node"/><text x="202.5" y="313" text-anchor="middle" class="small">Live</text>
  <circle cx="82" cy="359" r="9" fill="var(--accent)"/><path d="m78 359 3 3 6-7" fill="none" stroke="var(--bg)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="100" y="364" class="label">Human approval</text>
  <text x="74" y="392" class="small">required before live operation</text>

  <rect x="296" y="96" width="220" height="338" rx="8" class="surface"/>
  <circle cx="324" cy="126" r="7" fill="var(--accent)"/>
  <text x="342" y="132" class="eyebrow">RUN CENTRALLY</text>
  <text x="320" y="176" class="heading">Operation campaigns</text>
  <text x="320" y="205" class="copy">Orchestrators and workers</text>
  <text x="320" y="226" class="copy">execute in this repository.</text>
  <rect x="320" y="258" width="172" height="54" rx="6" class="node"/>
  <text x="338" y="281" class="label">Dependabot</text><text x="338" y="300" class="small">orchestrator + worker</text>
  <circle cx="406" cy="326" r="2.5" fill="var(--muted)"/><circle cx="406" cy="337" r="2.5" fill="var(--muted)"/><circle cx="406" cy="348" r="2.5" fill="var(--muted)"/>
  <rect x="320" y="362" width="172" height="54" rx="6" class="node"/>
  <text x="338" y="385" class="label">AW Optimization</text><text x="338" y="404" class="small">orchestrator + workers</text>

  <line x1="580" y1="76" x2="580" y2="476" stroke="var(--border)" stroke-width="2" stroke-dasharray="5 7"/>
  <text x="620" y="92" class="eyebrow" transform="rotate(90 620 92)">REPOSITORY BOUNDARY</text>
  <path d="M516 260h120" fill="none" stroke="var(--muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="540" y="244" text-anchor="middle" class="small">inspect + declared safe outputs</text>

  <rect x="650" y="96" width="236" height="338" rx="8" class="surface"/>
  <circle cx="678" cy="126" r="7" fill="var(--success)"/>
  <text x="696" y="132" class="eyebrow">REMOTE TARGETS</text>
  <text x="674" y="176" class="heading">Repositories</text>
  <text x="674" y="205" class="copy">One bounded target per</text>
  <text x="674" y="226" class="copy">central worker run.</text>
  <rect x="674" y="254" width="188" height="42" rx="5" class="node"/><text x="690" y="280" class="label">Repository 1</text><circle cx="842" cy="275" r="6" fill="var(--success)"/>
  <rect x="674" y="306" width="188" height="42" rx="5" class="node"/><text x="690" y="332" class="label">Repository 2</text><circle cx="842" cy="327" r="6" fill="var(--danger)"/>
  <circle cx="768" cy="360" r="2.5" fill="var(--muted)"/><circle cx="768" cy="371" r="2.5" fill="var(--muted)"/><circle cx="768" cy="382" r="2.5" fill="var(--muted)"/>
  <rect x="674" y="394" width="188" height="42" rx="5" fill="var(--accent)" fill-opacity=".08" stroke="var(--accent)"/>
  <text x="768" y="420" text-anchor="middle" class="small">No control-plane workflows</text>

  <path d="M886 260h62" fill="none" stroke="var(--muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="917" y="244" text-anchor="middle" class="small">correlated</text>

  <rect x="962" y="96" width="214" height="338" rx="8" class="surface"/>
  <circle cx="990" cy="126" r="7" fill="var(--success)"/>
  <text x="1008" y="132" class="eyebrow">VERIFY</text>
  <text x="986" y="176" class="heading">Outcomes</text>
  <text x="986" y="205" class="copy">Every result links back</text>
  <text x="986" y="226" class="copy">to the central run.</text>
  <g transform="rotate(-90 1069 305)" fill="none" stroke-width="13">
    <circle cx="1069" cy="305" r="54" stroke="var(--border)"/>
    <circle cx="1069" cy="305" r="54" stroke="var(--success)" pathLength="100" stroke-dasharray="83.33 16.67"/>
    <circle cx="1069" cy="305" r="54" stroke="var(--danger)" pathLength="100" stroke-dasharray="16.67 83.33" stroke-dashoffset="-83.33"/>
  </g>
  <text x="1069" y="303" text-anchor="middle" class="heading">12</text>
  <text x="1069" y="324" text-anchor="middle" class="small">results</text>
  <circle cx="1008" cy="390" r="5" fill="var(--success)"/><text x="1022" y="395" class="label">10 passed</text>
  <circle cx="1102" cy="390" r="5" fill="var(--danger)"/><text x="1116" y="395" class="label">2 failed</text>

  <text x="600" y="520" text-anchor="middle" class="label">Control-plane workflows stay central. Target repositories remain target-owned.</text>
</svg>