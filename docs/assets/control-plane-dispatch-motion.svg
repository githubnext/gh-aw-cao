<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" aria-hidden="true" focusable="false">
  <style>
    :root {
      --surface: #fff;
      --foreground: #1f2328;
      --muted: #656d76;
      --border: #d0d7de;
      --success: #1f883d;
      --attention: #bf8700;
      --accent: #8250df;
      --info: #0969da;
    }

    .sparkle {
      offset-path: var(--path);
      offset-anchor: 0 0;
      offset-rotate: 0deg;
      opacity: 0;
      fill: var(--accent);
      animation: dispatch 5s linear var(--delay) infinite;
    }

    .campaign-status {
      fill: var(--attention);
      stroke: var(--surface);
      stroke-width: 3;
      opacity: 0;
      animation: campaign-status 5s steps(1, end) infinite;
    }

    .report-update {
      display: none;
    }

    @keyframes dispatch {
      0% { offset-distance: 0%; opacity: 0; }
      0.5%, 7.5% { opacity: 1; }
      8%, 100% { offset-distance: 100%; opacity: 0; }
    }

    @keyframes campaign-status {
      0%, 3% { fill: var(--attention); opacity: 0; }
      4%, 11% { opacity: 1; }
      12%, 19% { opacity: 0; }
      20%, 27% { opacity: 1; }
      28%, 35% { opacity: 0; }
      36%, 43% { opacity: 1; }
      44%, 51% { opacity: 0; }
      52%, 59% { opacity: 1; }
      60%, 67% { opacity: 0; }
      68%, 75% { opacity: 1; }
      76%, 100% { fill: var(--success); opacity: 1; }
    }

    @keyframes report-update {
      0%, 76% { opacity: 0; }
      82%, 100% { opacity: 1; }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #161b22;
        --foreground: #f0f6fc;
        --muted: #8b949e;
        --border: #30363d;
        --success: #3fb950;
        --attention: #d29922;
        --accent: #a371f7;
        --info: #58a6ff;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .sparkle,
      .campaign-status,
      .report-update {
        display: none;
        animation: none;
      }
    }
  </style>

