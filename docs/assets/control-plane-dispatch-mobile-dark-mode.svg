<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 886" role="img" aria-labelledby="title description">
  <title id="title">Central control plane pipeline</title>
  <desc id="description">A central control plane dispatches Supply chain, Compliance, Security, and Governance operation campaigns downward through every organization to every repo, then correlates the outcomes into an operational report excerpt.</desc>
  <defs>
    <style>
      :root { --surface:#161b22; --foreground:#f0f6fc; --muted:#8b949e; --border:#30363d; --connector:#484f58; --success:#3fb950; --danger:#f85149; --attention:#d29922; --accent:#a371f7; --info:#58a6ff; --shadow:#010409; }
      [fill="#ffffff"]{fill:var(--surface)} [fill="#1f2328"]{fill:var(--foreground)} [fill="#656d76"]{fill:var(--muted)}
      [fill="#1f883d"]{fill:var(--success)} [fill="#cf222e"]{fill:var(--danger)} [fill="#bf8700"]{fill:var(--attention)} [fill="#8250df"]{fill:var(--accent)} [fill="#0969da"]{fill:var(--info)}
      [stroke="#ffffff"]{stroke:var(--surface)} [stroke="#d0d7de"]{stroke:var(--border)} [stroke="#afb8c1"]{stroke:var(--connector)} [stroke="#8250df"]{stroke:var(--accent)}
      [stroke="#1f883d"]{stroke:var(--success)} [stroke="#cf222e"]{stroke:var(--danger)} [stroke="#bf8700"]{stroke:var(--attention)} [stroke="#0969da"]{stroke:var(--info)}
    </style>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#d0d7de" stroke-width=".6"/></pattern>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="var(--shadow)" flood-opacity=".16"/></filter>
  </defs>

  <rect width="390" height="886" fill="url(#grid)" opacity=".14"/>

  <g fill="none" stroke="#d0d7de" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity=".16">
    <path d="M57 128V180M147 128V180M237 128V180M327 128V180M57 180H327M75 180V216M195 180V216M315 180V216"/>
    <path d="M75 272V320M195 272V320M315 272V320M55 320H335M130 320V376M260 320V376M55 320V476H80M335 320V476H310"/>
    <path d="M80 404H40V530H195M310 404H350V530H195M130 504V554H195M260 504V554H195M195 530V590"/>
  </g>
  <g fill="none" stroke="#afb8c1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M57 128V180M147 128V180M237 128V180M327 128V180M57 180H327M75 180V216M195 180V216M315 180V216"/>
    <path d="M75 272V320M195 272V320M315 272V320M55 320H335M130 320V376M260 320V376M55 320V476H80M335 320V476H310"/>
    <path d="M80 404H40V530H195M310 404H350V530H195M130 504V554H195M260 504V554H195M195 530V590"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="11" y="16" width="368" height="112" rx="8" fill="none" stroke="#afb8c1" stroke-width="2"/>
    <rect x="15" y="32" width="84" height="64" rx="6" fill="#0969da" fill-opacity=".12" stroke="#d0d7de"/>
    <text x="57" y="60" fill="var(--foreground)" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" font-weight="600"><tspan x="57">Supply</tspan><tspan x="57" dy="15">chain</tspan></text>
    <rect x="105" y="32" width="84" height="64" rx="6" fill="#1f883d" fill-opacity=".12" stroke="#d0d7de"/>
    <text x="147" y="68" fill="var(--foreground)" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" font-weight="600">Compliance</text>
    <rect x="195" y="32" width="84" height="64" rx="6" fill="#8250df" fill-opacity=".12" stroke="#d0d7de"/>
    <text x="237" y="68" fill="var(--foreground)" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" font-weight="600">Security</text>
    <rect x="285" y="32" width="84" height="64" rx="6" fill="#bf8700" fill-opacity=".12" stroke="#d0d7de"/>
    <text x="327" y="68" fill="var(--foreground)" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" font-weight="600">Governance</text>

    <rect x="25" y="216" width="100" height="56" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="75" y="249" fill="#1f2328" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="600">Org A</text>
    <rect x="145" y="216" width="100" height="56" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="195" y="249" fill="#1f2328" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="600">Org B</text>
    <rect x="265" y="216" width="100" height="56" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="315" y="249" fill="#1f2328" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="600">Org C</text>
    <g fill="#656d76"><circle cx="187" cy="296" r="2"/><circle cx="195" cy="296" r="2"/><circle cx="203" cy="296" r="2"/></g>

    <g fill="#ffffff" stroke="#d0d7de"><rect x="80" y="376" width="100" height="56" rx="6"/><rect x="210" y="376" width="100" height="56" rx="6"/><rect x="80" y="448" width="100" height="56" rx="6"/><rect x="210" y="448" width="100" height="56" rx="6"/></g>
    <g fill="#1f2328" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="600"><text x="130" y="409">Repo 1</text><text x="260" y="409">Repo 2</text><text x="130" y="481">Repo 3</text><text x="260" y="481">Repo 4</text></g>
    <g fill="#656d76"><circle cx="187" cy="526" r="2"/><circle cx="195" cy="526" r="2"/><circle cx="203" cy="526" r="2"/></g>

    <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
      <rect x="58" y="590" width="274" height="272" rx="6" fill="#ffffff" stroke="#d0d7de"/>
      <text x="74" y="622" fill="#656d76" font-size="8" font-weight="700">REPORT EXCERPT</text>
      <text x="316" y="622" fill="#656d76" text-anchor="end" font-size="8" font-weight="700">2026-08-27 07:02:56 UTC</text>
      <text x="74" y="644" fill="#1f2328" font-size="13" font-weight="600">Execution health</text>
      <path d="M74 653H316" fill="none" stroke="#d0d7de"/>

      <text x="74" y="671" fill="#656d76" font-size="8" font-weight="700">RUNS · 24H</text>
      <text x="74" y="690" fill="#1f2328" font-size="15" font-weight="700">732</text>
      <text x="204" y="671" fill="#656d76" font-size="8" font-weight="700">FAILURE RATE</text>
      <text x="204" y="690" fill="#cf222e" font-size="15" font-weight="700">34.2%</text>

      <rect x="74" y="702" width="242" height="7" rx="3.5" fill="#d0d7de"/>
      <path d="M77.5 705.5H225" fill="none" stroke="#1f883d" stroke-width="7" stroke-linecap="round"/>
      <path d="M225 705.5H292" fill="none" stroke="#cf222e" stroke-width="7"/>
      <path d="M292 705.5H306" fill="none" stroke="#bf8700" stroke-width="7"/>

      <text x="74" y="732" fill="#656d76" font-size="8" font-weight="700">VALUE OVER TIME</text>
      <g fill="none" stroke="#d0d7de" stroke-width=".7" opacity=".7">
        <path d="M74 756H316M74 780H316M74 804H316M74 828H316"/>
        <path d="M134 748V834M195 748V834M256 748V834"/>
      </g>
      <path d="M122 748V834" fill="none" stroke="#8250df" stroke-width="1.5" stroke-dasharray="3 2"/>
      <text x="126" y="755" fill="#8250df" font-size="8" font-weight="700">ADOPTED</text>
      <path d="M74 820L94 814L114 817L134 794L155 799L175 783L195 789L215 765L236 783L256 761L276 769L296 764L316 771" fill="none" stroke="#1f883d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M74 773L94 774L114 796L134 801L155 815L175 830L195 811L215 790L236 827L256 806L276 822L296 800L316 816" fill="none" stroke="#0969da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g fill="#ffffff" stroke="#656d76" stroke-width="2">
      <circle cx="57" cy="128" r="7"/>
      <circle cx="147" cy="128" r="7"/>
      <circle cx="237" cy="128" r="7"/>
      <circle cx="327" cy="128" r="7"/>
    </g>
  </g>
</svg>